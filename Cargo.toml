# The TBD Reforger workspace: the website applications (API, single-page app, offline service
# worker), the library crates under `crates/` (the mission domain, the Mission Creator's editing
# layer, the map streaming and rendering crates and the GPU crates among them), the fleet host
# agent, the ticketboard and the repository tooling.
[workspace]
resolver = "3"
members = [
    "apps/fleet_host_agent",
    "apps/ticketboard",
    "apps/api",
    "apps/frontend",
    "apps/offline_service_worker",
    # The library crates, one glob per category (`crates/<category>/<name>`, and
    # `crates/frontend/<layer>/<name>` for the single-page app's crates): every manifest under
    # these folders is a member. A new category adds its own glob here; the crate-tier law fails
    # on a manifest under `crates/` that no glob reaches.
    "crates/api/*",
    "crates/ballistics/*",
    "crates/contracts/*",
    "crates/foundation/*",
    "crates/frontend/*/*",
    "crates/geometry/*",
    "crates/graphics/*",
    "crates/line_of_sight/*",
    "crates/map_overlay/*",
    "crates/map_rendering/*",
    "crates/mission/*",
    "crates/mission_editing/*",
    "crates/paper_doll/*",
    "crates/streaming/*",
    "crates/terrain/*",
    "crates/world_formats/*",
    "crates/world_objects/*",
    # The tooling foundation crates (`tools/foundation/<name>`): every manifest under it is a
    # member.
    "tools/foundation/*",
    # The tool crates, one folder per category (`tools/<category>/<name>`): every manifest under
    # these folders is a member.
    "tools/tickets/*",
    "tools/commands/*",
    "tools/checks/*",
    "tools/enfusion/*",
    "tools/browser_testing/*",
    "tools/staging/*",
    "tools/map_assets/*",
    "tools/xtask",
    "tools/developer_tools",
]

# Package fields a member inherits with `<field>.workspace = true`. Every member, the frontend
# included, inherits `edition` and `rust-version` from this table.
[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

# The library crates under `crates/`, by path, and every external dependency a member declares;
# no member carries its own version requirement. An external entry carries the version and, where
# they are off, the default features; each member names its own features and `optional` beside
# `workspace = true`, so a feature stays the choice of the member that needs it.
[workspace.dependencies]
aho-corasick = "1"
ammonia = "4.1.3"
anyhow = "1"
