# Website applications, headless mission domain, graphics engine, and repository tooling.
# The frontend links the mission and graphics crates into the same WebAssembly module.
[workspace]
resolver = "3"
members = [
    "apps/ticketboard",
    "apps/website/api",
    "apps/website/frontend",
    "apps/website/mission-core",
    "apps/website/map-engine",
    "apps/website/graphics-engine",
    # T-853: the four-outcome gate library — the Rust successor to scripts/mod/lib/gate-grep.sh.
    # Deliberately dependency-light; linked by both `xtask` and `tools/tbd-tools`.
    "crates/tbd-gate",
    "crates/tbd-tickets",
    "xtask",
    "tools/tbd-tools",
]
