name: ci

# Primary full-repo gate (CODING_STANDARDS.md §0.3 CI-2 + TEST-1/2/3 + FMT-1/2/3).
# Required on every push + PR to `main` — NO `paths:` filter. This is what distinguishes
# it from contracts.yml / schema.yml, which stay as path-scoped supplements (do NOT merge
# them here in this slice).
# The website-api/map-engine/website-frontend jobs are all cargo gates (fmt + clippy -D + build +
# test); contracts.yml stays the path-filtered citations/codegen supplement.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- backend: Rust 1.95 + Postgres 18 — the sole backend.
  # fmt (FMT-1) + clippy (GO-2..8 analog) + build + integration tests (TEST-1). ---
  website-api:
    name: website-api (Rust 1.95 + Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The service database is `rust_it`, NOT `tbd_reforger`. Read before renaming it.
    #
    # Each test binary gets its own database, derived from whatever `TEST_DATABASE_URL` names
    # (`<base>_<suite>_it`), and the guard in
    # `apps/website/api_v2/tests/common/database.rs is_safe_test_database_name` hard-REFUSES the
    # literal name `tbd_reforger` before anything can connect, create or drop. That guard is
    # correct and deliberate: it is the only thing standing between an exported
    # `TEST_DATABASE_URL=…/tbd_reforger` and a wiped live dev database. It is not to be widened.
    #
    # `rust_it` is the allow-list's first entry (`name == "rust_it"`) and is exactly what
    # `cargo xtask db test-it` uses, so CI and the local replay name the same base.
    #
    # This name has to exist as a REAL database, not just a URL: `resolve_and_provision` connects
    # to the base URL to issue `CREATE DATABASE <base>_<suite>_it`. Hence POSTGRES_DB and the
    # health probe move with it — a URL pointing at a database the service never created would
    # trade a guard panic for a connection error.
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tbd
          POSTGRES_PASSWORD: tbd
          POSTGRES_DB: rust_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbd -d rust_it"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/website/api_v2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # workspace --all (matches `cargo xtask mk rust-fmt`). Job default cwd is
      # apps/website/api_v2 — override so tools_v2 drift cannot slip past CI.
      - name: fmt (FMT-1 analog — workspace --all)
        working-directory: .
        run: cargo xtask mk rust-fmt
      - name: clippy (GO-2..8 analog)
        env:
          SQLX_OFFLINE: "true"
        run: cargo xtask mk rust-clippy
      - name: build
        env:
          SQLX_OFFLINE: "true"
        run: cargo xtask mk rust-build
      # The developer-tools library suite. The mod gate scopes itself to
      # `--lib enfusion_tooling::` and the wave gate's `test xtask+developer-tools` step is
      # local-only, so this is the only push-triggered check of the density grid and the world
      # export unit tests.
      # `working-directory: .` for the same reason as the fmt step: the job default is
      # apps/website/api_v2, and `cargo xtask` resolves the repository root from its own cwd.
      # AHEAD of the DB-backed `test` step deliberately. Steps stop at the first failure, so behind
      # it a Postgres-service red would decide whether the density invariant was checked at all.
      # This lane needs no database, no LFS and no wasm target; nothing about it should wait on one
      # that does.
      # Quoted like the verify-ci-shell step below: `density:: ` is a colon-space, which YAML
      # reads as a mapping value inside a plain scalar; `verify ci-shell` fails on unparseable
      # YAML rather than returning an empty result.
      - name: "developer-tools lib tests (density:: + world::)"
        working-directory: .
        run: cargo xtask ci developer-tools-test
      # `rust_it`, matching the `services.db` POSTGRES_DB above and the `rust-test-it` task.
      - name: test (TEST-1 analog)
        env:
          TEST_DATABASE_URL: postgres://tbd:tbd@localhost:5432/rust_it?sslmode=disable
          SQLX_OFFLINE: "true"
        run: cargo xtask ci website-api-test

  # --- map-engine: the engine crate gates (fmt + clippy native/wasm32 + native tests) ---
  # The crate's tests read the Everon DEM (LFS, 72 MB) — pull ONLY that object (a full
  # `lfs: true` checkout would drag the 206 MB satellite bundle every run).
  map-engine:
    name: map-engine (wasm-ci)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: fetch LFS test fixture (Everon DEM only)
        run: git lfs pull --include assets_v2/terrains/everon/dem/everon-dem-16bit.png
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # pinned; matches root rust-toolchain.toml / gate-env.json
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask mk wasm-ci

  # --- website-frontend: the Rust/Leptos SPA ---
  # fmt + clippy(wasm32) + native tests + trunk release build. The editor S/V/R/T smokes + the
  # frozen V-suite (`xtask mk leptos-gates`) need a full chrome build + Postgres + map-assets LFS;
  # they run in the dedicated **editor-gates.yml** workflow (nightly + on-demand + gate/editor-path
  # PRs). `gate doctor` fails those fast if the env drifts.
  website-frontend:
    name: website-frontend (Leptos SPA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # pinned; matches root rust-toolchain.toml / gate-env.json
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: fmt + clippy(wasm32) + test + trunk (ci-local-leptos)
        run: cargo xtask mk ci-local-leptos

  # --- schema: the full schema-validate set + citations ---
  # Class-R parity: this job MUST match `xtask ci schema-validate` + `xtask ci verify-citations`
  # (i.e. `xtask ci ci-local-schema`). Sub-gate SET = the schema-validate step of
  # `cargo xtask platform wave gate`, same order as the task row:
  #   validate map-object-golden map-glyphs height-labels map-object-enums
  #   type-inventory specification-consistency n6 n10  (+ citations)
  # `schema validate` + `citations` alone is a hole: map-object-enums goes RED while validate
  # stays GREEN. Do not narrow back to validate-only.
  # `cargo xtask verify ci-schema-parity` asserts this job's `run:` stays
  # `cargo xtask ci ci-local-schema`, and is itself wired into both wave gate drivers.
  # All steps are Rust (xtask) — no Node in this job.
  # height-labels needs the Everon DEM (LFS, ~72 MB); pull ONLY that object (same pattern
  # as the map-engine job — a full `lfs: true` checkout would drag the 206 MB sat bundle).
  schema:
    name: schema + citations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: fetch LFS fixture for height-labels (Everon DEM only)
        run: git lfs pull --include assets_v2/terrains/everon/dem/everon-dem-16bit.png
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # pinned; matches root rust-toolchain.toml / gate-env.json
      - uses: Swatinem/rust-cache@v2
      - name: schema-validate + citations (cargo xtask ci ci-local-schema)
        run: cargo xtask ci ci-local-schema

  # --- editorconfig: FMT-2 whitespace gate across the whole repo (root .editorconfig) ---
  # Dedicated job (mirrors `xtask ci verify-editorconfig`). No setup-go — xtask installs the
  # pinned checker if needed and runs it from the repo root. Excludes live in
  # .editorconfig-checker.json.
  editorconfig:
    name: editorconfig (FMT-2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: editorconfig-checker (repo root)
        run: cargo xtask ci verify-editorconfig

  # --- language gates: which language new tooling may be written in ---
  #
  # THE POINT OF THIS JOB IS THAT IT EXISTS. A language gate wired only into the local replay that
  # nothing runs by default blocks no push at all, and can sit red for waves while the wave gate
  # reports a clean sweep over it. A rule nobody is stopped by is not a rule, so all of them run
  # here, on every push and PR, unfiltered.
  #
  #   verify-no-python  Alias of the TrackedLanguageBan table (hard zero). Fail-closed: a missing
  #                     tool is a FAIL, never an "OK (none)".
  #   verify-no-node    Zero tracked .mjs/.cjs; node only as the enfusion-mcp floor.
  #   verify-no-shell   Same table as no-python: any tracked shell/Make/Python/Node-script path
  #                     fails. New tooling goes in xtask (LANG-1).
  #
  # Needs cargo (two of the three are xtask) but no database, no LFS and no wasm target, so it is a
  # cheap job that fails fast and early rather than riding on the back of the 25-minute API job.
  language-gates:
    name: language gates (no-python / no-node / no-shell / ci-shell / engine-layers / file-length)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 IS needed: `ticket check` derives wave.lock's wave_base from the
      # close-marker ledger in git history, and a shallow clone is a loud refusal (never a silent
      # base-0), so depth-1 here is a guaranteed red.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: verify-no-python (language ban alias)
        run: cargo xtask verify no-python
      - name: verify-no-node
        run: cargo xtask verify no-node
      - name: verify-file-length (SIZE-3)
        run: cargo xtask verify file-length
      - name: verify-no-shell (language ban)
        run: cargo xtask verify no-shell
      - name: "verify-ci-shell (GitHub Actions run: blocks)"
        run: cargo xtask verify ci-shell
      # ENGINE_SPLIT_PROGRAM §5 rules 1 and 2 (phase 1F), 3b (2B), 3a (2C), 4 and 7 (2D). The split gave
      # apps/website/graphics-engine a one-way dependency arrow (map-engine -> graphics-engine)
      # and NOTHING in the compiler enforces it: a dep line pointing back would still build, and
      # the 50k lines of map domain that phase 1 moved out would start seeping back a type at a
      # time. §5 is blunt about why this needs a gate rather than a convention — "one 99k crate
      # rots without enforcement". It runs here, not on the 25-minute API job, for the same reason
      # the language gates do: it reads the working tree, needs no DB/LFS/wasm target, and takes
      # seconds. Rules 5 and 6 police a tree phase 3 has not built yet.
      - name: verify-engine-layers (ENGINE_SPLIT_PROGRAM §5 rules 1, 2, 3a, 3b, 4, 7)
        run: cargo xtask verify engine-layers
      # The ticket registry is the source of truth for the whole ticket pipeline, so a malformed
      # or duplicate-id registry that reaches main surfaces only when the next agent tries to read
      # it. Lives in this job because it is the same shape as the language gates — seconds long,
      # reads the working tree, fails fast instead of riding a 25-minute job.
      - name: ticket registry check (schema + duplicate ids)
        run: cargo xtask ticket check --strict

  # --- mod gates, HOSTED PORTION ---
  # `cargo xtask mod compile` and `cargo xtask mod world-boot` are the mod's only regression
  # instruments over 33k lines of Enfusion. Both need the Arma Reforger DEDICATED SERVER
  # present on the machine,
  # which a GitHub-hosted runner does not have and cannot practicably install (a ~10 GB Steam
  # depot behind a login), so the gates that need the engine run in **mod-gates.yml** on a
  # self-hosted runner. Everything that genuinely runs WITHOUT the engine runs here instead, in
  # the required unfiltered per-push gate, because that is where it belongs:
  #
  #   * `cargo xtask mod world-boot --selftest` — replays the fail-closed triage against 10
  #     committed log fixtures (2 must pass, 8 must fail). Text only; 0.12 s measured, no engine,
  #     no network. This is the part that actually regresses: each failing fixture is an escape a
  #     narrower triage lets through, including one that differs only in the case of
  #     `Scripts/Game/`. Whoever next widens a match in that function has a machine telling them
  #     what they broke.
  #
  # DELIBERATELY NOT HERE: the compile self-test. It launches the engine. There is no honest way
  # to run it hosted, and a stubbed version would be a green check for doing nothing — the single
  # most expensive thing a CI job can be. It runs in mod-gates.yml, where a real server exists.
  mod-gates-hosted:
    name: mod gates (hosted portion — no game binary)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: world-boot verdict logic (cargo xtask mod world-boot --selftest)
        run: cargo xtask mod world-boot --selftest
      # Class-R siblings of the wave gate's verify steps — the same tasks ci-local runs.
      - name: staging compose path (cargo xtask verify staging-compose-paths)
        run: cargo xtask verify staging-compose-paths
      - name: mission REST size limits (cargo xtask verify mission-rest-size-limits)
        run: cargo xtask verify mission-rest-size-limits
      # Invoke DIRECTLY, never through a dispatch row named after this gate — a hollowed
      # indirection must not green CI, and the self-pin only runs when the gate does.
      - name: CI schema parity + hollow recipe tripwire (direct cargo)
        run: cargo xtask verify ci-schema-parity
