name: ci

# Primary full-repo gate, required on every push and PR to `main` with no `paths:` filter.
# The api, wasm-ci and frontend jobs are the cargo gates: api and frontend each run a fmt check,
# clippy and tests, wasm-ci the wasm32 lint, and the comment above each job lists its exact
# commands. Every job passes `-D warnings` to clippy, so a warning fails the job.
# The workspace-members job tests every other workspace member in one cargo run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- api: the sole backend (Rust 1.95 + Postgres 18) ---
  # fmt (FMT-1): `cargo fmt --check` on api_server, then `cargo fmt --all --check` on every
  # workspace member. clippy (GO-2..8 analog): `cargo clippy --all-targets -- -D warnings` on
  # api_server and every other crates/api package (host target, default features; one `-p` each,
  # derived from the workspace), so any warning fails the job. tests: their `cargo test` (unit +
  # integration, TEST-1) against the Postgres service below.
  api:
    name: api (Rust 1.95 + Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The service database is `rust_it`, NOT `tbd_reforger`. Read before renaming it.
    #
    # Each test binary gets its own database, derived from whatever `TEST_DATABASE_URL` names
    # (`<base>_<suite>_it`), and the guard in
    # `crates/api/api_server/tests/common/database.rs is_safe_test_database_name` hard-REFUSES the
    # literal name `tbd_reforger` before anything can connect, create or drop. That guard is
    # correct and deliberate: it is the only thing standing between an exported
    # `TEST_DATABASE_URL=…/tbd_reforger` and a wiped live dev database. It is not to be widened.
    #
    # `rust_it` is the allow-list's first entry (`name == "rust_it"`) and is exactly what
    # `cargo xtask db test-it` uses, so CI and the local replay name the same base.
    #
    # This name has to exist as a REAL database, not just a URL: `resolve_and_provision` connects
    # to the base URL to issue `CREATE DATABASE <base>_<suite>_it`. Hence POSTGRES_DB and the
    # health probe move with it — a URL pointing at a database the service never created would
    # trade a guard panic for a connection error.
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tbd
          POSTGRES_PASSWORD: tbd
          POSTGRES_DB: rust_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbd -d rust_it"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: crates/api/api_server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # workspace --all (matches `cargo xtask mk rust-fmt`). Job default cwd is
      # crates/api/api_server — override so formatting drift under tools/ cannot slip past CI.
      - name: fmt (FMT-1 analog — workspace --all)
        working-directory: .
        run: cargo xtask mk rust-fmt
      - name: clippy (GO-2..8 analog)
        run: cargo xtask mk rust-clippy
      # `rust_it`, matching the `services.db` POSTGRES_DB above and the `rust-test-it` task.
      - name: test (TEST-1 analog)
        env:
          TEST_DATABASE_URL: postgres://tbd:tbd@localhost:5432/rust_it?sslmode=disable
        run: cargo xtask ci api-test

  # --- wasm-ci: the wasm32 lint outside the frontend family (`cargo xtask mk wasm-ci`) ---
  # clippy `--target wasm32-unknown-unknown -- -D warnings` (default features, without
  # `--all-targets`) over every package the wasm32 lint derives from the workspace: each member
  # declaring `targets = "wasm32"` outside crates/frontend. The frontend family, the offline
  # service worker under crates/frontend/shell among it, is formatted, linted and tested once, by
  # the frontend job. No fmt, test or build step, no trunk.
  wasm-ci:
    name: wasm-ci (wasm32 lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # pinned; matches root rust-toolchain.toml / gate-env.json
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask mk wasm-ci

  # --- frontend: the Rust/Leptos SPA and its crates (`cargo xtask mk ci-local-leptos`) ---
  # Every cargo line names the frontend family, derived from the workspace: one `-p` per member
  # under crates/frontend, the app `frontend_application` and the offline service worker among
  # them (`ci_task_catalog::frontend_package_lane`), so a frontend crate is gated from its first
  # commit. fmt: `cargo fmt -p frontend_application -p … --check`. clippy, twice with
  # `-D warnings`: `cargo clippy -p frontend_application -p … --target wasm32-unknown-unknown
  # --all-targets -- -D warnings` (the browser build) and `cargo clippy -p frontend_application
  # -p … --all-targets --locked -- -D warnings` (the native test build). tests: `cargo test
  # -p frontend_application -p …`, host target. build: `trunk build --release` in
  # crates/frontend/shell/frontend_application. The editor smokes (`xtask mk leptos-gates`) need a
  # full chrome build, Postgres and the map-assets LFS objects; they run nightly in the dedicated
  # editor-gates.yml workflow.
  frontend:
    name: frontend (Leptos SPA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # pinned; matches root rust-toolchain.toml / gate-env.json
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: fmt + clippy -D warnings (wasm32, native) + test over the frontend family + trunk (ci-local-leptos)
        run: cargo xtask mk ci-local-leptos

  # --- workspace-members: every member the jobs above do not test ---
  # `cargo xtask ci workspace-member-tests` runs one `cargo test --workspace`, excluding the
  # members a dedicated job tests (every crates/api package, api_server among them, and every
  # crates/frontend package, frontend_application and the offline service worker among them), so a
  # member the workspace gains is tested here from the moment the manifest names it.
  # The world-export and map-asset tests read the committed Everon objects, chunks and BLAS
  # library (LFS), and the place-name peaks test reads the Everon DEM. Pull the Everon tree without
  # the satellite bundle, which no test of this job reads.
  workspace-members:
    name: workspace members (one cargo test --workspace run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: fetch LFS test inputs (Everon objects, chunks, BLAS and DEM; no satellite)
        run: git lfs pull --include "assets/terrains/everon/**" --exclude "assets/terrains/everon/satellite/**"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # pinned; matches root rust-toolchain.toml / gate-env.json
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace without the API and frontend families (workspace-member-tests)
        run: cargo xtask ci workspace-member-tests

  # --- schema: generated-code freshness and the schema-validate set ---
  # The same set as `cargo xtask ci ci-local-schema`: `verify-codegen-fresh`, then
  # `schema-validate` (validate, map-object-enums, type-inventory). The map goldens that need the
  # LFS DEM run on demand: `cargo xtask ci schema-map-goldens`.
  schema:
    name: schema (codegen freshness + schema-validate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # pinned; matches root rust-toolchain.toml / gate-env.json
      - uses: Swatinem/rust-cache@v2
      - name: codegen freshness + schema-validate (cargo xtask ci ci-local-schema)
        run: cargo xtask ci ci-local-schema

  # --- editorconfig: FMT-2 whitespace gate across the whole repo (root .editorconfig) ---
  # Dedicated job (mirrors `xtask ci verify-editorconfig`). No setup-go — xtask installs the
  # pinned checker if needed and runs it from the repo root. Excludes live in
  # .editorconfig-checker.json.
  editorconfig:
    name: editorconfig (FMT-2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: editorconfig-checker (repo root)
        run: cargo xtask ci verify-editorconfig

  # --- language gates: the enforced workspace laws, the language bans and the file-length advice ---
  # Seconds-long reads of the working tree that need no database, LFS or wasm target: the crate
  # tiers (no member depends on an application; the external-crate firewalls), the crate anatomy,
  # the Tailwind sources, one step for the three language bans (`verify-language-bans`: no-python,
  # no-node, no-shell), and `verify file-length`, which warns about long production files and never
  # fails on one.
  language-gates:
    name: language gates (workspace laws / language bans / file-length advice)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: verify-crate-tiers (no dependency on an application; external-crate firewalls)
        run: cargo xtask verify crate-tiers
      - name: verify-crate-anatomy (library crate shape)
        run: cargo xtask verify crate-anatomy
      - name: verify-tailwind-sources (an @source line per leptos crate)
        run: cargo xtask verify tailwind-sources
      - name: language bans (no-python, no-node, no-shell)
        run: cargo xtask ci verify-language-bans
      - name: file-length advice (warns, never fails)
        run: cargo xtask verify file-length
