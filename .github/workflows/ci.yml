name: ci

# Primary full-repo gate (documentation/standards/coding_standards/README.md §0.3
# CI-2 + TEST-1/2/3 + FMT-1/2/3).
# Required on every push + PR to `main` — NO `paths:` filter. This is what distinguishes
# it from contracts.yml / schema.yml, which stay as path-scoped supplements (do NOT merge
# them here in this slice).
# The api, wasm-ci and frontend jobs are the cargo gates: each runs a fmt
# check, clippy and tests, and the comment above each job lists its exact commands. Every
# job passes `-D warnings` to clippy, so a warning fails the job.
# The workspace-members job tests every other workspace member.
# contracts.yml is the path-filtered citations/codegen supplement.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- api: the sole backend (Rust 1.95 + Postgres 18) ---
  # fmt (FMT-1): `cargo fmt --check` on api, then `cargo fmt --all --check` on every
  # workspace member. clippy (GO-2..8 analog): `cargo clippy --all-targets -- -D warnings` on
  # api and every crates/api package (host target, default features; one `-p` each, derived from
  # the workspace), so any warning fails the job. build: `cargo build --all-targets` on the same
  # packages. tests: their `cargo test` (unit + integration, TEST-1) against the Postgres service
  # below.
  api:
    name: api (Rust 1.95 + Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The service database is `rust_it`, NOT `tbd_reforger`. Read before renaming it.
    #
    # Each test binary gets its own database, derived from whatever `TEST_DATABASE_URL` names
    # (`<base>_<suite>_it`), and the guard in
    # `apps/api/tests/common/database.rs is_safe_test_database_name` hard-REFUSES the
    # literal name `tbd_reforger` before anything can connect, create or drop. That guard is
    # correct and deliberate: it is the only thing standing between an exported
    # `TEST_DATABASE_URL=…/tbd_reforger` and a wiped live dev database. It is not to be widened.
    #
    # `rust_it` is the allow-list's first entry (`name == "rust_it"`) and is exactly what
    # `cargo xtask db test-it` uses, so CI and the local replay name the same base.
    #
    # This name has to exist as a REAL database, not just a URL: `resolve_and_provision` connects
    # to the base URL to issue `CREATE DATABASE <base>_<suite>_it`. Hence POSTGRES_DB and the
    # health probe move with it — a URL pointing at a database the service never created would
    # trade a guard panic for a connection error.
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tbd
          POSTGRES_PASSWORD: tbd
          POSTGRES_DB: rust_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbd -d rust_it"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # workspace --all (matches `cargo xtask mk rust-fmt`). Job default cwd is
      # apps/api — override so formatting drift under tools/ cannot slip past CI.
      - name: fmt (FMT-1 analog — workspace --all)
        working-directory: .
        run: cargo xtask mk rust-fmt
      - name: clippy (GO-2..8 analog)
        run: cargo xtask mk rust-clippy
      - name: build
        run: cargo xtask mk rust-build
      # `rust_it`, matching the `services.db` POSTGRES_DB above and the `rust-test-it` task.
      - name: test (TEST-1 analog)
        env:
          TEST_DATABASE_URL: postgres://tbd:tbd@localhost:5432/rust_it?sslmode=disable
        run: cargo xtask ci api-test

  # --- wasm-ci: the offline service worker and the wasm32 lint (`cargo xtask mk wasm-ci`) ---
  # fmt: `cargo fmt --check -p offline_service_worker`. clippy, two passes, each with `-D warnings`
  # so any warning fails the job: host target with `--all-targets --all-features` over the offline
  # service worker, then `--target wasm32-unknown-unknown` (default features, without
  # `--all-targets`) over every package the wasm32 lint derives from the workspace: each member
  # declaring `targets = "wasm32"` and the offline service worker (the frontend family's wasm32
  # lint is the frontend job's). tests: `cargo test --all-features -p offline_service_worker`, host
  # target. No separate build step, no trunk.
  wasm-ci:
    name: wasm-ci (offline service worker, wasm32 lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # pinned; matches root rust-toolchain.toml / gate-env.json
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask mk wasm-ci

  # --- frontend: the Rust/Leptos SPA and its crates (`cargo xtask mk ci-local-leptos`) ---
  # Every cargo line names the frontend family, derived from the workspace: `-p frontend` plus one
  # `-p` per member under crates/frontend (`ci_task_catalog::frontend_package_lane`), so a frontend
  # crate is gated from its first commit. fmt: `cargo fmt -p frontend -p … --check`. clippy, twice
  # with `-D warnings`: `cargo clippy -p frontend -p … --target wasm32-unknown-unknown
  # --all-targets -- -D warnings` (the browser build) and `cargo clippy -p frontend -p …
  # --all-targets --locked -- -D warnings` (the native test build). tests: `cargo test -p frontend
  # -p …`, host target. build: `trunk build --release` in apps/frontend. The editor S/V/R/T
  # smokes + the frozen V-suite (`xtask mk leptos-gates`) need a full chrome build + Postgres + map-assets LFS;
  # they run in the dedicated **editor-gates.yml** workflow (nightly + on-demand + gate/editor-path
  # PRs). `gate doctor` fails those fast if the env drifts.
  frontend:
    name: frontend (Leptos SPA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # pinned; matches root rust-toolchain.toml / gate-env.json
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: fmt + clippy -D warnings (wasm32, native) + test over the frontend family + trunk (ci-local-leptos)
        run: cargo xtask mk ci-local-leptos

  # --- workspace-members: every member the jobs above do not test ---
  # `cargo xtask ci workspace-member-tests` derives its package list from the root Cargo.toml
  # workspace minus the members a dedicated job tests (api with every crates/api package,
  # frontend with every crates/frontend package, and the offline service worker of wasm-ci), and runs `cargo test -p <package>` once per package, so features never
  # unify across packages. A member the workspace gains is tested here from the moment the
  # manifest names it; `ci_local_tests_every_workspace_member` and
  # `the_ci_workflow_tests_every_workspace_member` (ci_task_catalog) keep every member in a job.
  # The terrain, world-object and streaming crates' tests read the Everon DEM (LFS, 72 MB) — pull
  # ONLY that object (a full `lfs: true` checkout would drag the 206 MB satellite bundle every run).
  workspace-members:
    name: workspace members (cargo test per member)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: fetch LFS test fixture (Everon DEM only)
        run: git lfs pull --include assets/terrains/everon/dem/everon-dem-16bit.png
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # pinned; matches root rust-toolchain.toml / gate-env.json
      - uses: Swatinem/rust-cache@v2
      - name: cargo test per member without a dedicated job (workspace-member-tests)
        run: cargo xtask ci workspace-member-tests

  # --- schema: the full schema-validate set + citations ---
  # Class-R parity: this job MUST match `xtask ci ci-local-schema`, which runs
  # `xtask ci verify-codegen-fresh`, then `xtask ci schema-validate`, then
  # `xtask ci verify-citations`. The schema-validate sub-gate SET = the schema-validate step of
  # `cargo xtask platform wave gate`, same order as the task row:
  #   validate map-object-golden map-glyphs height-labels map-object-enums
  #   type-inventory  (+ citations)
  # `schema validate` + `citations` alone is a hole: map-object-enums goes RED while validate
  # stays GREEN. Do not narrow back to validate-only.
  # `cargo xtask verify ci-schema-parity` asserts this job's `run:` stays
  # `cargo xtask ci ci-local-schema`, and is itself wired into both wave gate drivers.
  # All steps are Rust (xtask) — no Node in this job.
  # height-labels needs the Everon DEM (LFS, ~72 MB); pull ONLY that object (same pattern
  # as the workspace-members job — a full `lfs: true` checkout would drag the 206 MB sat bundle).
  schema:
    name: schema + citations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: fetch LFS fixture for height-labels (Everon DEM only)
        run: git lfs pull --include assets/terrains/everon/dem/everon-dem-16bit.png
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # pinned; matches root rust-toolchain.toml / gate-env.json
      - uses: Swatinem/rust-cache@v2
      - name: schema-validate + citations (cargo xtask ci ci-local-schema)
        run: cargo xtask ci ci-local-schema

  # --- editorconfig: FMT-2 whitespace gate across the whole repo (root .editorconfig) ---
  # Dedicated job (mirrors `xtask ci verify-editorconfig`). No setup-go — xtask installs the
  # pinned checker if needed and runs it from the repo root. Excludes live in
  # .editorconfig-checker.json.
  editorconfig:
    name: editorconfig (FMT-2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: editorconfig-checker (repo root)
        run: cargo xtask ci verify-editorconfig

  # --- language gates: which language new tooling may be written in ---
  #
  # THE POINT OF THIS JOB IS THAT IT EXISTS. A language gate wired only into the local replay that
  # nothing runs by default blocks no push at all, and can sit red for waves while the wave gate
  # reports a clean sweep over it. A rule nobody is stopped by is not a rule, so all of them run
  # here, on every push and PR, unfiltered.
  #
  #   verify-no-python  Alias of the TrackedLanguageBan table (hard zero). Fail-closed: a missing
  #                     tool is a FAIL, never an "OK (none)".
  #   verify-no-node    Zero tracked .mjs/.cjs; node only as the enfusion-mcp floor.
  #   verify-no-shell   Same table as no-python: any tracked shell/Make/Python/Node-script path
  #                     fails. New tooling goes in xtask (LANG-1).
  #
  # Every step is `cargo xtask`: `verify` no-python, no-node, file-length, enfusion-comments,
  # no-shell and ci-shell, then the workspace laws, then `ticket check --strict`, then the documentation
  # gates `verify` readme-coverage, link-check and markdown-placement. It needs cargo but no database, no LFS and
  # no wasm target, so it is a cheap job that fails fast and early rather than riding on the back
  # of the 25-minute API job.
  language-gates:
    name: language gates (no-python / no-node / no-shell / ci-shell / workspace laws / file-length / enfusion-comments / documentation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 IS needed: `ticket check` derives wave.lock's wave_base from the
      # close-marker ledger in git history, and a shallow clone is a loud refusal (never a silent
      # base-0), so depth-1 here is a guaranteed red.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: verify-no-python (language ban alias)
        run: cargo xtask verify no-python
      - name: verify-no-node
        run: cargo xtask verify no-node
      - name: verify-file-length (SIZE-3)
        run: cargo xtask verify file-length
      - name: verify-enfusion-comments (mod comment card over the pinned Scripts roots)
        run: cargo xtask verify enfusion-comments
      - name: verify-no-shell (language ban)
        run: cargo xtask verify no-shell
      - name: "verify-ci-shell (GitHub Actions run: blocks)"
        run: cargo xtask verify ci-shell
      # The workspace laws of documentation/restructure/laws_and_gates.md, judged by
      # tools/foundation/repository_laws/src/workspace_laws/ over the members the root
      # manifest names; seconds-long reads of the working tree that need no DB, LFS or wasm target,
      # like the language gates.
      - name: verify-crate-tiers (workspace membership, layout, tiers, category matrix, firewalls)
        run: cargo xtask verify crate-tiers
      - name: verify-crate-anatomy (library crate shape)
        run: cargo xtask verify crate-anatomy
      - name: verify-strangler (no new crate depends on legacy; no shim)
        run: cargo xtask verify strangler
      - name: verify-frontend-layering (layer and foundation sub-area order, hard at zero)
        run: cargo xtask verify frontend-layering
      - name: verify-tailwind-sources (an @source line per leptos crate)
        run: cargo xtask verify tailwind-sources
      # The ticket registry is the source of truth for the whole ticket pipeline, so a malformed
      # or duplicate-id registry that reaches main surfaces only when the next agent tries to read
      # it. Lives in this job because it is the same shape as the language gates — seconds long,
      # reads the working tree, fails fast instead of riding a 25-minute job.
      - name: ticket registry check (schema + duplicate ids)
        run: cargo xtask ticket check --strict
      # The documentation gates judge the committed tree, the view this checkout holds; the same
      # three run in process as `cargo xtask ci verify-documentation`, a ci-local step. link-check
      # resolves sha permalinks against local history, which the full-depth checkout above gives.
      - name: verify-readme-coverage (every folder's README.md and its Contents block)
        run: cargo xtask verify readme-coverage
      - name: verify-link-check (links, backticked paths and cited xtask commands)
        run: cargo xtask verify link-check
      - name: verify-markdown-placement (Markdown placement and the live-document size limit)
        run: cargo xtask verify markdown-placement

  # --- mod gates, HOSTED PORTION ---
  # `cargo xtask mod compile` and `cargo xtask mod world-boot` are the mod's only regression
  # instruments over 33k lines of Enfusion. Both need the Arma Reforger DEDICATED SERVER
  # present on the machine,
  # which a GitHub-hosted runner does not have and cannot practicably install (a ~10 GB Steam
  # depot behind a login), so the gates that need the engine run in **mod-gates.yml** on a
  # self-hosted runner. Everything that genuinely runs WITHOUT the engine runs here instead, in
  # the required unfiltered per-push gate, because that is where it belongs:
  #
  #   * `cargo xtask mod world-boot --selftest` — replays the fail-closed triage against 10
  #     committed log fixtures (2 must pass, 8 must fail). Text only; 0.12 s measured, no engine,
  #     no network. This is the part that actually regresses: each failing fixture is an escape a
  #     narrower triage lets through, including one that differs only in the case of
  #     `Scripts/Game/`. Whoever next widens a match in that function has a machine telling them
  #     what they broke.
  #
  # DELIBERATELY NOT HERE: the compile self-test. It launches the engine. There is no honest way
  # to run it hosted, and a stubbed version would be a green check for doing nothing — the single
  # most expensive thing a CI job can be. It runs in mod-gates.yml, where a real server exists.
  mod-gates-hosted:
    name: mod gates (hosted portion — no game binary)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: world-boot verdict logic (cargo xtask mod world-boot --selftest)
        run: cargo xtask mod world-boot --selftest
      # Class-R siblings of the wave gate's verify steps — the same tasks ci-local runs.
      - name: staging compose path (cargo xtask verify staging-compose-paths)
        run: cargo xtask verify staging-compose-paths
      - name: mission REST size limits (cargo xtask verify mission-rest-size-limits)
        run: cargo xtask verify mission-rest-size-limits
      # Invoke DIRECTLY, never through a dispatch row named after this gate — a hollowed
      # indirection must not green CI, and the self-pin only runs when the gate does.
      - name: CI schema parity + hollow recipe tripwire (direct cargo)
        run: cargo xtask verify ci-schema-parity
