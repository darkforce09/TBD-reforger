name: ci

# Primary full-repo gate (CODING_STANDARDS.md §0.3 CI-2 + TEST-1/2/3 + FMT-1/2/3).
# Required on every push + PR to `main` — NO `paths:` filter. This is what distinguishes
# it from contracts.yml / schema.yml, which stay as path-scoped supplements (do NOT merge
# them here in this slice).
# The website-api/map-engine/website-frontend jobs are all cargo gates (fmt + clippy -D + build +
# test) since the T-145 Go→Rust and T-159 React→Leptos cutovers; contracts.yml stays the
# path-filtered citations/codegen supplement.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- backend: Rust 1.95 + Postgres 18 — the sole backend after the T-145 Go->Rust
  # cutover. fmt (FMT-1) + clippy (GO-2..8 analog) + build + integration tests (TEST-1). ---
  website-api:
    name: website-api (Rust 1.95 + Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # T-597: the service database is `rust_it`, NOT `tbd_reforger`. Read before renaming it.
    #
    # T-534 gives each test binary its own database, derived from whatever `TEST_DATABASE_URL`
    # names (`<base>_<suite>_it`), and T-381's guard —
    # `apps/website/api/tests/common/mod.rs:87 is_safe_test_database_name` — hard-REFUSES the
    # literal name `tbd_reforger` before anything can connect, create or drop. That guard is
    # correct and deliberate: it is the only thing standing between an exported
    # `TEST_DATABASE_URL=…/tbd_reforger` and a wiped live dev database. It is not to be widened.
    #
    # So CI, which had shipped `tbd_reforger` in both the service env and TEST_DATABASE_URL since
    # T-145 (`9cc7a161`, 2026-07-06 — this note said T-534, which is three weeks and two tickets
    # off; `git log -S tbd_reforger -- .github/workflows/ci.yml` puts the name on the Rust job the
    # day that job was created, T-534 only derived the per-binary `<base>_<suite>_it` names on top
    # of it, and T-381 on 07-27 is what turned a working name into a refused one), was the side
    # that was wrong: every DB-backed website-api test panicked at
    # `assert_test_database_url`, and the `test` step below has been RED on every push since T-381.
    # `rust_it` is the allow-list's first entry (`name == "rust_it"`) and is exactly what
    # `make test-it` uses (Makefile:207), so CI and the local replay now name the same base.
    #
    # This name has to exist as a REAL database, not just a URL: `resolve_and_provision` connects
    # to the base URL to issue `CREATE DATABASE <base>_<suite>_it`. Hence POSTGRES_DB and the
    # health probe move with it — a URL pointing at a database the service never created would
    # trade a guard panic for a connection error.
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tbd
          POSTGRES_PASSWORD: tbd
          POSTGRES_DB: rust_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbd -d rust_it"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/website/api
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # T-453: workspace --all (matches `make rust-fmt` / T-297). Job default cwd is
      # apps/website/api — override so xtask/tbd-tools drift cannot slip past CI.
      - name: fmt (FMT-1 analog — workspace --all)
        working-directory: .
        run: cargo fmt --all --check
      - name: clippy (GO-2..8 analog)
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --all-targets
      # T-597: `rust_it`, matching the `services.db` POSTGRES_DB above and Makefile:207.
      # The old `tbd_reforger` here is what T-381's guard refused — see the services block.
      - name: test (TEST-1 analog)
        env:
          TEST_DATABASE_URL: postgres://tbd:tbd@localhost:5432/rust_it?sslmode=disable
          SQLX_OFFLINE: "true"
        run: cargo test

  # --- map-engine: the T-151 crate gates (fmt + clippy native/wasm32 + native tests) ---
  # T-151.11.4 (audit F-09): these gates previously ran only locally (`make wasm-ci`).
  # T-164: core tests read the Everon DEM (LFS, 72 MB) — pull ONLY that object (a full
  # `lfs: true` checkout would drag the 206 MB satellite bundle every run).
  map-engine:
    name: map-engine (wasm-ci)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: fetch LFS test fixture (Everon DEM only)
        run: git lfs pull --include packages/map-assets/everon/dem/everon-dem-16bit.png
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # T-177 — pin (matches root rust-toolchain.toml / gate-env.json)
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: make wasm-ci

  # --- website-frontend: the Rust/Leptos SPA — THE frontend after the T-159.29.3 React deletion ---
  # fmt + clippy(wasm32) + native tests + trunk release build. The editor S/V/R/T smokes + the
  # frozen V-suite (make leptos-gates) need a full chrome build + Postgres + map-assets LFS; they run
  # in the dedicated **editor-gates.yml** workflow (nightly + on-demand + gate/editor-path PRs) — T-177
  # closed the old "run locally per stream" gap. `gate doctor` fails those fast if the env drifts.
  website-frontend:
    name: website-frontend (Leptos SPA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # T-177 — pin (matches root rust-toolchain.toml / gate-env.json)
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: fmt
        run: cargo fmt -p website-frontend --check
      - name: clippy (wasm32)
        run: cargo clippy -p website-frontend --target wasm32-unknown-unknown
      - name: cargo test (native shell)
        run: cargo test -p website-frontend
      - name: trunk build --release
        working-directory: apps/website/frontend
        run: trunk build --release

  # --- schema: full make schema-validate set + citations (T-434) ---
  # Class-R parity: this job MUST match `make schema-validate` + `make verify-citations`
  # (i.e. `make ci-local-schema`). Sub-gate SET = GATE_SCHEMA_VALIDATE_GATES in
  # scripts/platform/wave.sh, same order as the Makefile recipe:
  #   validate map-object-golden map-glyphs height-labels map-object-enums
  #   type-inventory t090-specs n6 n10  (+ citations)
  # Pre-T-434 hole: only `schema validate` + `citations` — would not have caught T-244
  # (map-object-enums RED while validate stayed GREEN). Do not narrow back to validate-only.
  # T-468 tripwire: scripts/mod/verify-t468-ci-schema-parity.sh asserts this job's `run:`
  # stays `make ci-local-schema` (wired into wave.sh gate_slice + cmd_gate).
  # T-165.2: all steps are Rust (xtask) — no Node in this job.
  # height-labels needs the Everon DEM (LFS, ~72 MB); pull ONLY that object (same pattern
  # as the map-engine job — a full `lfs: true` checkout would drag the 206 MB sat bundle).
  schema:
    name: schema + citations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: fetch LFS fixture for height-labels (Everon DEM only)
        run: git lfs pull --include packages/map-assets/everon/dem/everon-dem-16bit.png
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # T-177 — pin (matches root rust-toolchain.toml / gate-env.json)
      - uses: Swatinem/rust-cache@v2
      - name: schema-validate + citations (make ci-local-schema)
        run: make ci-local-schema

  # --- editorconfig: FMT-2 whitespace gate across the whole repo (root .editorconfig) ---
  # Dedicated job (mirrors `make verify-editorconfig`): the checker is a Go binary and runs
  # from the repo root, so it does not belong in the Node-only frontend job. Excludes live in
  # .editorconfig-checker.json. setup-go puts $(go env GOPATH)/bin on PATH for the installed binary.
  editorconfig:
    name: editorconfig (FMT-2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: install editorconfig-checker
        run: go install github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker@latest
      - name: editorconfig-checker (repo root)
        run: editorconfig-checker

  # --- mod gates, HOSTED PORTION (T-209) ---
  # `scripts/mod/compile.sh` and `scripts/mod/world-boot.sh` are the mod's only regression
  # instruments, and until T-209 neither ran in CI at all — 33k lines of Enfusion with nothing
  # checking them on push. Both need the Arma Reforger DEDICATED SERVER present on the machine,
  # which a GitHub-hosted runner does not have and cannot practicably install (a ~10 GB Steam
  # depot behind a login), so the gates that need the engine run in **mod-gates.yml** on a
  # self-hosted runner. Everything that genuinely runs WITHOUT the engine runs here instead, in
  # the required unfiltered per-push gate, because that is where it belongs:
  #
  #   * `world-boot.sh --selftest` — replays the fail-closed triage against 10 committed log
  #     fixtures (2 must pass, 8 must fail). Pure bash over text; 0.12 s measured, no engine, no
  #     network. This is the part that actually regresses: every one of those 8 fixtures is an
  #     escape the wave-4 verifier got PAST an earlier revision of the triage, including one that
  #     differed only in the case of `Scripts/Game/`. Whoever next widens a grep in that function
  #     now has a machine telling them what they broke.
  #   * `bash -n` on both scripts — 1100 lines of load-bearing bash whose syntax nothing checked.
  #     Weak on purpose (it is not shellcheck, which is not installed anywhere in this program and
  #     would be red on arrival unverified), but it is the difference between finding a typo here
  #     and finding it when the nightly mod gate cannot start.
  #
  # DELIBERATELY NOT HERE: `compile.sh --selftest`. It launches the engine. There is no honest way
  # to run it hosted, and a stubbed version would be a green check for doing nothing — the single
  # most expensive thing a CI job can be. It runs in mod-gates.yml, where a real server exists.
  mod-gates-hosted:
    name: mod gates (hosted portion — no game binary)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: bash syntax — compile.sh + world-boot.sh
        run: |
          bash -n scripts/mod/compile.sh
          bash -n scripts/mod/world-boot.sh
      - name: world-boot verdict logic (make mod-world-boot-selftest)
        run: make mod-world-boot-selftest
      # T-467: Class-R siblings for wave.sh-wired verifies (same make targets as ci-local).
      - name: T-438 deploy-staging compose path (make verify-t438)
        run: make verify-t438
      - name: T-456 mission REST size gate (make verify-t456)
        run: make verify-t456
      # T-485: T-468 tripwire (hollow verify-t438/t456 recipes + ci-local-schema pin).
      # T-489: invoke script via direct bash — hollow `make verify-t468` (`@true`)
      # must not green CI (self-pin only runs when the script itself executes).
      - name: T-468 CI schema parity + hollow recipe tripwire (direct bash, T-489)
        run: bash scripts/mod/verify-t468-ci-schema-parity.sh
