# The API's background workers: the interval tasks the API binary arms at boot, each calling a
# service of the domain that owns the data it keeps current.
# Names the five domains whose services the passes call: administration, identity and access,
# missions, operations and server infrastructure.
[package]
name = "api_background_workers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The API's background workers: the interval tasks the API binary arms at boot."

[package.metadata.layout]
category = "crates/api"
tier = 10
targets = "any"

[dependencies]
# `publish_audit_batch`, the audit publication pass.
api_administration = { workspace = true }
# `EquipmentDatasets` and the generation imports of the equipment export watcher.
api_equipment_datasets = { workspace = true }
# `ApiError` and the error-cause rendering of a failed import.
api_foundation = { workspace = true }
# The realtime hub the status publisher republishes onto and the durable rate limiter it prunes.
api_http_layer = { workspace = true }
api_identifiers = { workspace = true }
# The role resync, the Discord membership reconciliation and the refresh token purge.
api_identity_and_access = { workspace = true }
# The leaderboard view refresh and the re-evaluation queue leases.
api_member_activity = { workspace = true }
# The mission deployment settlement.
api_missions = { workspace = true }
# The event lifecycle sweep and the event reservation re-evaluation.
api_operations = { workspace = true }
# The fleet command reconciliation, the runtime session expiry and the status broadcast.
api_server_infrastructure = { workspace = true }
# `AppState`, the state the binary arms the workers against.
api_state = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
# `connect_lazy`, the pool the schedule tests hand a worker without reaching a server.
api_database = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
