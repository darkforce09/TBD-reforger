# The API's runtime configuration, read from the environment at boot, and the process-wide
# shutdown signal the server raises when it is asked to stop.
[package]
name = "api_configuration"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The API's environment configuration, trusted proxy networks and process shutdown signal."

[package.metadata.layout]
category = "crates/api"
tier = 2
targets = "any"

[dependencies]
api_identifiers = { workspace = true }
dotenvy = { workspace = true }
# The checkout-root walk the development defaults of the directory settings are joined onto.
repository_root = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
