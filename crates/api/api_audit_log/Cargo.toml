# The write side of the API's audit log: the severity every audit line carries and the two ways a
# domain appends a line to `audit_logs`, best-effort or inside its own business transaction.
[package]
name = "api_audit_log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The API's audit severity and the best-effort and transactional audit line appends."

[package.metadata.layout]
category = "crates/api"
tier = 2
targets = "any"

[dependencies]
api_identifiers = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["postgres", "macros"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
