# The API server: the top crate of the API family, which assembles the API crates into the Axum
# REST API and SSE realtime hub. One library crate holds the router and the composition root;
# binaries: api-server (the server) and import-item-registry (item registry envelope ingest).
[package]
name = "api_server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "TBD Reforger platform backend: Axum REST API and SSE realtime hub."
license.workspace = true
publish.workspace = true

[package.metadata.layout]
category = "crates/api"
tier = 11
targets = "any"

[lib]
name = "api_server"
path = "src/lib.rs"

[[bin]]
name = "api-server"
path = "src/bin/api_server.rs"

[[bin]]
name = "import-item-registry"
path = "src/bin/import_item_registry.rs"

[dependencies]
# The modpack id the `import-item-registry` tool imports under.
api_identifiers = { workspace = true }
# The runtime configuration read at boot and the process shutdown signal.
api_configuration = { workspace = true }
# The Postgres pool and the embedded migrations the binaries open and apply.
api_database = { workspace = true }
# The middleware chain, the metrics and health surfaces and the observability bearer the router
# mounts.
api_http_layer = { workspace = true }
# The Discord OAuth2 and announcement webhook clients the composition root builds.
api_discord = { workspace = true }
# The equipment datasets the composition root builds.
api_equipment_datasets = { workspace = true }
# The database session authority the composition root builds.
api_caller_identity = { workspace = true }
# The application state the composition root builds and the router carries.
api_state = { workspace = true }
# The identity and access domain: Discord sign-in, session tokens, the caller's profile and the
# Arma link handshake, whose route table the router merges.
api_identity_and_access = { workspace = true }
# The community content domain: announcements, the wiki, the vehicle database, modpacks, uploads
# and the equipment data viewer reads, whose route table the router merges.
api_community_content = { workspace = true }
# The administration domain: the member roster and its moderation, the Discord role resync, the
# membership grace extension and the audit log console, whose route table the router merges.
api_administration = { workspace = true }
# The server infrastructure domain: the server registry, the live status feed, the machine
# credentials, the fleet command ledger and the runtime sessions, whose route table the router
# merges.
api_server_infrastructure = { workspace = true }
# The match telemetry domain: the session-fenced heartbeat, the match registration, the results
# revisions and the detailed event batches, whose route table the router merges.
api_match_telemetry = { workspace = true }
# The missions domain: the mission library, versions, artifacts, reviews, deployments, armory,
# factions and registries, whose route table the router merges and whose registry import the
# `import-item-registry` tool runs.
api_missions = { workspace = true }
# The operations domain: the event calendar and its access control, ORBAT slotting and the
# reservations, the service records, leave requests, fire missions and ballistics catalogs, whose
# route table the router merges.
api_operations = { workspace = true }
# The command center domain: the members' dashboard with its fleet overview, the community
# leaderboards and the per-player statistics card, whose route table the router merges.
api_command_center = { workspace = true }
# The interval tasks the `api-server` binary arms at boot (`spawn_all`), whose single passes the
# integration suites also run.
api_background_workers = { workspace = true }
axum = { workspace = true, features = ["macros", "multipart"] }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors", "catch-panic", "fs", "trace", "limit", "timeout", "set-header"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The `Error` the `api-server` and `import-item-registry` binaries stop with.
thiserror = { workspace = true }

[dev-dependencies]
# The handler error, the audit lines, the mission vocabulary enums and the member activity
# aggregates the integration suites assert against.
api_foundation = { workspace = true }
api_audit_log = { workspace = true }
api_mission_vocabulary = { workspace = true }
api_member_activity = { workspace = true }
# The ballistics catalog and the fire-mission assembler the fire-mission suites build their
# requests and expected solutions from.
ballistics_model = { workspace = true }
fire_mission_planning = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
# `sha256_hex`, the digests the artifact and ballistics catalog suites recompute.
content_digest = { workspace = true }
# The serde types generated from the contract schemas, which the contract parity and route
# acceptance suites decode answers into.
contract_schema_types = { workspace = true }
# The fleet-command wire shapes and `ExecutorKind` the fleet suites send and read back.
fleet_wire_contract = { workspace = true }
futures = { workspace = true }
# Core draft 2020-12 validation of the contract schemas the suites check answers against; the
# workspace entry turns the HTTP `$ref` resolver off.
jsonschema = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# float_roundtrip parses every number bit-exactly, so a fire solution re-solved from a client or
# catalog document starts from the same f64 inputs the wasm client used.
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
# The checkout-root walk the tests that read the repository (the database crate's migrations,
# the contracts and the committed catalogs) anchor on.
repository_root = { workspace = true }

[lints]
workspace = true
