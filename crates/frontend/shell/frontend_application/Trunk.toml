[build]
target = "index.html"
dist = "dist"

# aegis.css is Tailwind v4 syntax (@import/@source/@theme). Trunk downloads its own default (a 3.x
# release) when no version is pinned, which fails on that syntax, so the version is pinned.
[tools]
tailwindcss = "4.3.2"

# Trunk's default watch set is the whole crate directory, which includes the paths trunk and the
# Tailwind v4 pass write into: the build's own output then triggers further builds with nothing
# changed. Every rebuild pushes a browser reload, which aborts the 152 MB `everon-sat.tbd-sat`
# fetch mid-flight and leaves the Mission Creator showing a heightmap with no satellite layer and
# an empty Asset Browser.
#
# `watch` replaces that default set with one folder, `crates/frontend` (two levels up from this
# file): every frontend crate, this app and the offline service worker beside it in `shell/`.
# Trunk watches a listed folder recursively and drops every change under an `ignore` entry or its
# own dist folder before it rebuilds, so the app's output stays unwatched inside the wider folder.
# `ignore` entries are relative to this file. Trunk refuses to start `serve` or `watch` when a
# listed folder does not exist.
[watch]
watch = ["../.."]
ignore = ["dist", "style/aegis.css"]

[serve]
address = "127.0.0.1"
port = 3000
# Cross-origin isolation: crossOriginIsolated === true, so the SharedArrayBuffer and wasm GPU path
# is available to the Mission Creator. The gate harness serves the built dist through `gate serve`
# (tools/browser_testing/browser_gate_suites), which sets the same two headers.
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "credentialless" }

# The development API proxy: relative `/api/v1/*` calls from the app reach the backend on :8080
# under `trunk serve`; the gate harness stubs them through the DevTools protocol instead. Trunk has
# no proxy timeout setting; the large mission-version POST passes through this proxy as it is.
[[proxy]]
backend = "http://127.0.0.1:8080/api"
# Pass 302s through (dev-login / Discord → FRONTEND_URL/auth/callback#…). Following them here
# strips the fragment and leaves the browser on /api/v1/auth/dev-login → SPA 404.
no_redirect = true

# The map-asset passthrough: the app fetches same-origin absolute `/map-assets/*` paths, and the
# backend serves them.
[[proxy]]
backend = "http://127.0.0.1:8080/map-assets"
