# The single-page app's design-system primitives and small shared helpers: the icon, the page
# header, the status pill, the form controls and their state classes, the split pane, the toasts,
# the dialog and the sheet with the overlay stack they share; the byte, date and countdown
# formatting, the UTC instants, the content URL policy, the avatar sanitiser and the clipboard
# write.
[package]
name = "frontend_ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Design-system primitives (icon, page header, form controls, split pane, toasts, dialog, sheet, overlay stack) and the formatting, URL policy and clipboard helpers of the single-page app."

[package.metadata.layout]
category = "crates/frontend/foundation"
tier = 1
targets = "any"

[dependencies]
# The wall clock the countdown measures against.
time_source = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
# `is_http_url`, the scheme guard the avatar sanitiser applies to a stored address.
http_url_guard = { workspace = true }

# The browser halves: the overlay stack's window key listeners and polling timer, the browser's
# date object behind the date formatting and the countdown, and the clipboard write.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "EventTarget",
    "KeyboardEvent",
    "Navigator",
    "Clipboard",
] }

[lints]
workspace = true
