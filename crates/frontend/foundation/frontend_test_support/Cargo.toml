# The helpers the frontend crates' tests share: the repository files read from the root that
# `repository_root` finds, the captured API responses behind `golden!` and the API route tables.
# Every frontend crate names it under `[dev-dependencies]` only.
[package]
name = "frontend_test_support"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Test-only helpers of the frontend crates: repository-root file reads, captured API responses and the API route tables."

[package.metadata.layout]
category = "crates/frontend/foundation"
tier = 1
targets = "any"

[dependencies]
# The workspace's one checkout-root finder the repository file reads walk up with.
repository_root = { workspace = true }

[lints]
workspace = true
