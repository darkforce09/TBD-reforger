# Browser console logging and same-origin HTTP GETs for wasm32 code: the `console_log!`,
# `console_warn!` and `console_error!` macros and the whole-body, streamed and Range fetch helpers.
[package]
name = "browser_platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Browser console macros and same-origin HTTP GET helpers (whole body, streamed with byte progress, Range) for wasm32."

[package.metadata.layout]
category = "crates/foundation"
tier = 0
targets = "wasm32"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["console", "ReadableStream", "ReadableStreamDefaultReader"] }

[lints]
workspace = true
