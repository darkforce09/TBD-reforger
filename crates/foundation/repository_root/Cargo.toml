# The one walk that finds the checkout root: up from a folder to the nearest one holding the
# `.ai/tickets/ROOT` marker file. The tools, the API's tests and the frontend crates' tests all find
# the root through it. `thiserror` carries the error of a walk that finds no marker.
[package]
name = "repository_root"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The checkout-root finder: the walk up to the nearest folder holding the .ai/tickets/ROOT marker file."

[package.metadata.layout]
category = "crates/foundation"
tier = 0
targets = "any"

[dependencies]
thiserror = { workspace = true }

[lints]
workspace = true
