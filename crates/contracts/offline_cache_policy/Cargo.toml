# The offline cache policy the service worker applies and the single-page app shares: cache names,
# request classes and their strategies, the saved-copy fallback and the terrain offline pack, as
# pure functions with no browser type.
[package]
name = "offline_cache_policy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Offline cache policy shared by the service worker and the page: cache names, request classes, saved-copy fallback, terrain pack."

[package.metadata.layout]
category = "crates/contracts"
tier = 0
targets = "any"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
