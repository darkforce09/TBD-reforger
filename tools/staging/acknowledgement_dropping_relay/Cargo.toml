# The loopback relay between one game server host agent and the API that, once armed over its
# control socket, withholds one fleet executor answer past the agent's request timeout and then
# closes the connection: the lost-acknowledgement fault of the staging fleet receipt, and the
# `acknowledgement-dropping-relay` executable's command line. axum serves the agent, reqwest
# forwards upstream and tokio runs both. `thiserror` carries its errors.
[package]
name = "acknowledgement_dropping_relay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The loopback relay that withholds one fleet executor answer, and its executable's command line"

[package.metadata.layout]
category = "tools/staging"
tier = 1
targets = "any"

[dependencies]
axum = { workspace = true }
clap = { workspace = true, features = ["derive"] }
newtype_ids = { workspace = true }
reqwest = { workspace = true, features = ["json", "charset"] }
# The ring crypto provider installed before every client, so a build that unifies `reqwest`
# with a TLS backend still builds clients.
rustls = { workspace = true, features = ["ring", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
time_source = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
# The checkout root, where the test reads the relay's systemd unit.
repository_root = { workspace = true }

[lints]
workspace = true
