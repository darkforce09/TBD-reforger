# The Enfusion script oracle behind the `enf` binary: the symbol scanner and its TSV indexes,
# lookups, the `@idx` citation gate, the capability join, the vanilla source extraction, carve and
# reconstruction, and the vanilla page mirrors behind `cargo xtask fetch`. `clap` parses `enf`;
# `regex` matches the source index's links; `content_digest` hashes indexed files and carved
# blobs; `process_runner` runs curl; `enfusion_pak` reads the game's archives.
[package]
name = "enfusion_script_index"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Enfusion script oracle: symbol indexes, lookups, citation and capability gates, vanilla extraction and page mirrors"

[package.metadata.layout]
category = "tools/enfusion"
tier = 2
targets = "any"

[dependencies]
clap = { workspace = true, features = ["derive"] }
content_digest = { workspace = true }
enfusion_pak = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
repository_layout = { workspace = true }
thiserror = { workspace = true }
verification_core = { workspace = true }

[dev-dependencies]
# The environment lock the curl-override test holds while it changes a variable.
tool_test_support = { workspace = true }

[lints]
workspace = true
