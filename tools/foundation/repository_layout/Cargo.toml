# The repository locations more than one tool names, spelled once each, and the one walk that
# finds a checkout root. `thiserror` carries the error of that walk.
[package]
name = "repository_layout"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The checkout-root finder and the repository locations the tools share"

[package.metadata.layout]
category = "tools/foundation"
tier = 0
targets = "any"

[dependencies]
thiserror = { workspace = true }

[lints]
workspace = true
