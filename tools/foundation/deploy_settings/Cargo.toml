# The one reader of `deploy/deploy.env`: its grammar, the precedence of the file over the process
# environment, the deploy host it names, the remote folders that default under that host's user,
# and the ssh transport the settings choose. `thiserror` carries its errors.
[package]
name = "deploy_settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The deploy.env reader: settings, the deploy host, its remote folders and the ssh transport"

[package.metadata.layout]
category = "tools/foundation"
tier = 2
targets = "any"

[dependencies]
process_runner = { workspace = true }
repository_layout = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
