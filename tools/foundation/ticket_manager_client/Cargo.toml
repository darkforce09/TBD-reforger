# The one client of the central ticket manager: runs the `ttm` command line with `--json`, parses
# its versioned JSON documents into typed values and turns a refusal into a typed error. The tools
# read and change tickets, receipts and waves only through it. `thiserror` carries its errors.
[package]
name = "ticket_manager_client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The typed client of the central ticket manager's ttm command line and its JSON contract"

[package.metadata.layout]
category = "tools/foundation"
tier = 2
targets = "any"

[dependencies]
# The serde-transparent ticket slug, legacy number and receipt name.
newtype_ids = { workspace = true }
# The `ttm` child process and the reason a run did not complete.
process_runner = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
verification_core = { workspace = true }

[lints]
workspace = true
