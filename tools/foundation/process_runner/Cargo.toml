# Running child processes without losing the reason they stopped, the container-to-host bridge and
# the ssh transport. `libc` carries the two calls std does not offer: a new session for the child,
# so a timeout can kill its whole process group, and `killpg` to do it.
[package]
name = "process_runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Child processes in their own process group with deadlines and honest statuses, the container-to-host bridge and the ssh transport"

[package.metadata.layout]
category = "tools/foundation"
tier = 1
targets = "any"

[dependencies]
libc = { workspace = true }
thiserror = { workspace = true }
verification_core = { workspace = true }

[lints]
workspace = true
