# Fail-closed verdicts, pattern scans, the run report and the repository verification lock: the
# vocabulary every repository check is written in. `xtask` links it for every gate and the `api`
# engineering-law tests link it as a dev-dependency, so anything added here is paid for by both.
# `regex` puts the matcher inside the gate binary, so no gate depends on an external search tool.
[package]
name = "verification_core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Fail-closed verdicts, pattern scans, the run report and the repository verification lock"

[package.metadata.layout]
category = "tools/foundation"
tier = 0
targets = "any"

[dependencies]
regex = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
