# `cargo xtask deploy website` and `cargo xtask deploy staging`: the rsync and remote build of the
# website, the staging fleet's config, units, payloads and boot verdicts, the paths no deploy
# ships, and the `verify staging-compose-paths` check; `deploy db` is the `database_operations`
# crate's. `thiserror` carries its errors.
[package]
name = "deployment"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The website and staging deploy drivers and the staging compose-path check"

[package.metadata.layout]
category = "tools/commands"
tier = 5
targets = "any"

[dependencies]
clap = { workspace = true, features = ["derive"] }
# The `deploy db` verbs the `deploy` group carries.
database_operations = { workspace = true }
deploy_settings = { workspace = true }
newtype_ids = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
repository_layout = { workspace = true }
repository_root = { workspace = true }
# Key order of the rendered server config follows the template, as the xtask binary builds it.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
verification_core = { workspace = true }

[dev-dependencies]
# The test checkout root.
tool_test_support = { workspace = true }

[lints]
workspace = true
