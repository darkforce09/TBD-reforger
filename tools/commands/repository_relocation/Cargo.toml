# Manifest-driven relocation of tracked paths: the parser of the relocation manifests, the plan of
# moves and reference rewrites, the `git mv` application that undoes itself on failure, and the
# verification that no live file spells a retired path. `cargo xtask refactor relocate` calls it.
[package]
name = "repository_relocation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Manifest-driven relocation of tracked paths and every reference to them, with the retired-spelling verification"

[package.metadata.layout]
category = "tools/commands"
tier = 3
targets = "any"

[dependencies]
aho-corasick = { workspace = true }
process_runner = { workspace = true }
repository_layout = { workspace = true }
ticket_model = { workspace = true }
verification_core = { workspace = true }

[lints]
workspace = true
