# The `cargo xtask verify api-readiness` judge: the acceptance register, the evidence receipts and
# their logs, the source and configuration fingerprints, the staging recorder and the
# property-test seed. `thiserror` carries its errors.
[package]
name = "api_readiness_checks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The API readiness judge: acceptance register, evidence receipts, fingerprints and the staging recorder"

[package.metadata.layout]
category = "tools/commands"
tier = 3
targets = "any"

[dependencies]
content_digest = { workspace = true }
deploy_settings = { workspace = true }
libc = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
repository_layout = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The wall clock the receipts' timestamps read.
time_source = { workspace = true }
verification_core = { workspace = true }

[lints]
workspace = true
