# The Enfusion MCP client side of `cargo xtask mcp`: the command line, the daemon control, the
# tool calls, the offline selftest, the raw Workbench NET API call, the Workbench log verdict and
# the resolution of the server command. Synchronous only (no tokio): xtask links it, and the
# broker that streams the server's stdio is the separate `enfusion_mcp_broker` crate. `libc`
# carries `getuid` (the socket name).
[package]
name = "enfusion_mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Enfusion MCP client: daemon control, tool calls, the offline selftest, Workbench NET API calls and log verdicts"

[package.metadata.layout]
category = "tools/commands"
tier = 2
targets = "any"

[dependencies]
clap = { workspace = true, features = ["derive"] }
libc = { workspace = true }
process_runner = { workspace = true }
repository_layout = { workspace = true }
repository_root = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
verification_core = { workspace = true }

[lints]
workspace = true
