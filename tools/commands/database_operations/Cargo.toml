# The database side of `cargo xtask db` and `cargo xtask deploy db`: the local Postgres container
# lane (compose, seeds, integration runs, selftest, migration checksum repair), the verified backup,
# the guarded restore, the restore drill, the shared container layer, and the database source
# checks (`verify wiki-seeds`, `faction-library-seeds`, `no-select-star`). `thiserror` carries its
# errors.
[package]
name = "database_operations"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The local database lane, verified backups, the guarded restore, the restore drill and the database source checks"

[package.metadata.layout]
category = "tools/commands"
tier = 4
targets = "any"

[dependencies]
# The property-test seed an integration run passes to the API suite.
api_readiness_checks = { workspace = true }
clap = { workspace = true, features = ["derive"] }
content_digest = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
# The workspace members the API test lane derives its packages from.
repository_laws = { workspace = true }
# The wave gate's seed sources the faction-library check reads.
repository_checks = { workspace = true }
repository_layout = { workspace = true }
repository_root = { workspace = true }
thiserror = { workspace = true }
verification_core = { workspace = true }

[dev-dependencies]
# The test checkout root and the process environment lock.
tool_test_support = { workspace = true }

[lints]
workspace = true
