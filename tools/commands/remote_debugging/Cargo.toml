# The `cargo xtask debug` commands and the `mod remote-logs` verdict: the server-join probes of the
# staging host, the direct-join report and the remote console log verdict. `thiserror` carries its
# errors.
[package]
name = "remote_debugging"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Remote debugging: staging server-join probes and the remote log verdict"

[package.metadata.layout]
category = "tools/commands"
tier = 6
targets = "any"

[dependencies]
clap = { workspace = true, features = ["derive"] }
deploy_settings = { workspace = true }
# The staging fleet's instances, ports, folders and unit names (`staging::fleet_instances`).
deployment = { workspace = true }
# The typed run and hypothesis ids of the NDJSON debug rows.
newtype_ids = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
# The machine-local logs folder the direct-join report is written to.
repository_layout = { workspace = true }
repository_root = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The wall clock of the NDJSON rows' `timestamp`.
time_source = { workspace = true }
verification_core = { workspace = true }

[lints]
workspace = true
