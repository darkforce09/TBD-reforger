# `cargo xtask ci`, `cargo xtask help` and `cargo xtask mk`: the CI task table and its runner, the
# build lane's recipes, the shared cargo target pin and its checks, the workflow and CI schema
# parity checks, and the map asset checks the schema and terrain tasks run. `thiserror` carries
# its errors. The map asset checks call the `developer_tools` library until its map verification
# becomes a crate of its own.
[package]
name = "ci_task_catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The CI task table and runner, the build lane recipes, the cargo target pin and the CI workflow checks"

[package.metadata.layout]
category = "tools/commands"
tier = 6
targets = "any"

[dependencies]
# The binary hands the runner its command tree for the in-process link check.
clap = { workspace = true }
# The database lane's integration suite, its lane commands and the `no-select-star` check.
database_operations = { workspace = true }
# The `verify-staging-compose-paths` task.
deployment = { workspace = true }
# The map asset checks (map-object goldens, terrain manifest, labels, BLAS manifest).
developer_tools = { workspace = true }
# The three documentation gates of `verify-documentation`.
documentation_checks = { workspace = true }
# The glibc version the target-directory stamp records.
libc = { workspace = true }
# The Enfusion comment card and the mission REST size check.
mod_script_checks = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
# The language bans, the workspace laws, the route tags, the engine layers and the wave gate sources.
repository_checks = { workspace = true }
# The workspace member list the member test lane derives.
repository_laws = { workspace = true }
repository_layout = { workspace = true }
# The contract codegen and the schema gates.
schema_tooling = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The GitHub Actions workflows the `verify ci-shell` gate parses.
serde_norway = { workspace = true }
thiserror = { workspace = true }
verification_core = { workspace = true }

[dev-dependencies]
# The test checkout root.
tool_test_support = { workspace = true }

[lints]
workspace = true
