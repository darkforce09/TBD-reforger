# `cargo xtask ci`, `cargo xtask help` and `cargo xtask mk`: the CI task table and its runner, the
# build lane's recipes, the shared cargo target pin, and the map asset checks the schema and terrain
# tasks run. `thiserror` carries its errors.
[package]
name = "ci_task_catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The CI task table and runner, the build lane recipes and the cargo target pin"

[package.metadata.layout]
category = "tools/commands"
tier = 8
targets = "any"

[dependencies]
# The database lane's integration suite and the API package list.
database_operations = { workspace = true }
# The glibc version the target-directory stamp records.
libc = { workspace = true }
# The map asset checks (map-object goldens, terrain manifest, labels).
map_asset_verification = { workspace = true }
process_runner = { workspace = true }
# The language bans and the workspace laws.
repository_checks = { workspace = true }
# The workspace member list the member test lane derives.
repository_laws = { workspace = true }
repository_layout = { workspace = true }
repository_root = { workspace = true }
# The contract codegen and the schema gates.
schema_tooling = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
verification_core = { workspace = true }

[lints]
workspace = true
