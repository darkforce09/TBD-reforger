# `cargo xtask mod`: the game mod's operations. The headless compile check, the world boot, the
# playtest server, the equipment and vehicle export validation and publication, the website API
# client the mod commands drive. `thiserror` carries its errors.
[package]
name = "mod_operations"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The game mod's operations: compile check, world boot, playtest server, equipment export publication and website API client"

[package.metadata.layout]
category = "tools/commands"
tier = 10
targets = "any"

[dependencies]
clap = { workspace = true, features = ["derive"] }
content_digest = { workspace = true }
# The MCP daemon the development bootstrap starts.
enfusion_mcp = { workspace = true }
flate2 = { workspace = true }
# The machine credential prefix the mission test recognises in a backend config.
fleet_wire_contract = { workspace = true }
heck = { workspace = true }
jsonschema = { workspace = true }
# The compile check's and the playtest server's signal handlers and the probe group's liveness test.
libc = { workspace = true }
# The `mod spawn-determinism` and `mod spawn-verify` runs.
mod_script_checks = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
# The `mod remote-logs` verdict.
remote_debugging = { workspace = true }
repository_layout = { workspace = true }
repository_root = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
tar = { workspace = true }
thiserror = { workspace = true }
verification_core = { workspace = true }
walkdir = { workspace = true }
# The staging host check of `mod bootstrap-staging` and the MCP game root.
workstation_setup = { workspace = true }

[dev-dependencies]
# The environment and working-directory locks and the test checkout root.
tool_test_support = { workspace = true }

[lints]
workspace = true
