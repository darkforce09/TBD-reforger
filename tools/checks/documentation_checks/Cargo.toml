# The documentation link check as a library, with its backticked-path and command-citation rules.
# It lists the checkout through git, judges it and prints its verdicts; the xtask binary's verify
# verb runs it and hands it xtask's command vocabulary as data.
[package]
name = "documentation_checks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The documentation link check"

[package.metadata.layout]
category = "tools/checks"
tier = 2
targets = "any"

[dependencies]
clap = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
repository_layout = { workspace = true }
verification_core = { workspace = true }

[lints]
workspace = true
