# The Enfusion mod script checks as libraries: the comment card over the pinned script roots, the
# identity-comment, destroy-target and mission REST size gates, the UI layout checks, and the
# Workbench-driven spawn determinism and spawn verification runs. The xtask binary and its task
# table run each check and print its verdict.
[package]
name = "mod_script_checks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Enfusion mod script checks: comment card, identity comments, layouts, spawn runs"

[package.metadata.layout]
category = "tools/checks"
tier = 2
targets = "any"

[dependencies]
content_digest = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
repository_layout = { workspace = true }
thiserror = { workspace = true }
verification_core = { workspace = true }

[dev-dependencies]
# The test checkout root and the environment lock.
tool_test_support = { workspace = true }

[lints]
workspace = true
