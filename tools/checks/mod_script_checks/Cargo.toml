# The Enfusion mod script checks as libraries: the UI layout checks and the Workbench-driven spawn
# determinism and spawn verification runs. The xtask binary runs each check and prints its verdict.
[package]
name = "mod_script_checks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Enfusion mod script checks: UI layouts and Workbench spawn runs"

[package.metadata.layout]
category = "tools/checks"
tier = 2
targets = "any"

[dependencies]
content_digest = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
repository_layout = { workspace = true }
repository_root = { workspace = true }
thiserror = { workspace = true }
verification_core = { workspace = true }

[lints]
workspace = true
