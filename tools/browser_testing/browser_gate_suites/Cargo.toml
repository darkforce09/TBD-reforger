# The headless browser gates of the single-page app: the static server with the gates' isolation
# headers, the DOM oracle and route drift checks, the Mission Creator smokes, the data viewer
# gate, the screen capture harness and the gate doctor. axum serves the built app, tokio runs
# every gate, `image` crops captured screenshots and `regex` scans page text and route sources.
[package]
name = "browser_gate_suites"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The browser gates of the single-page app: static server, DOM oracle, route drift, editor smokes, data viewer gate, screen capture, doctor"

[package.metadata.layout]
category = "tools/browser_testing"
tier = 2
targets = "any"

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrome_devtools_protocol = { workspace = true }
content_digest = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true, features = ["png"] }
libc = { workspace = true }
newtype_ids = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
repository_layout = { workspace = true }
reqwest = { workspace = true, features = ["json", "charset"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
url = { workspace = true }

[lints]
workspace = true
