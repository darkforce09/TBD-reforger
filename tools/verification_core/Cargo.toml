# Dependency-light on purpose. `xtask` links this crate for every gate and the `website-api`
# engineering-law tests link it as a dev-dependency, so anything added here is paid for by both.
# `regex` puts the matcher inside the gate binary, so no gate depends on an external search tool,
# and `libc` carries the two primitives the crate cannot do without: killing a timed-out process
# GROUP rather than only its leader, and `flock` on the shared verification lock.
[package]
name = "verification_core"
description = "Fail-closed verdicts, pattern scans, process isolation and the repository verification lock"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regex = { workspace = true }
libc = { workspace = true }
