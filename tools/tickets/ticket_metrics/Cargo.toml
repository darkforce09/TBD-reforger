# The run receipts under `.ai/tickets/metrics/`, their schema check and summary, and the token
# estimates mined from git history. `jsonschema` validates receipts and estimates against the
# committed schemas; `time` parses their RFC 3339 stamps for elapsed time.
[package]
name = "ticket_metrics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Run receipts, their check and summary, and the token estimates of the ticket registry"

[package.metadata.layout]
category = "tools/tickets"
tier = 3
targets = "any"

[dependencies]
jsonschema = { workspace = true }
process_runner = { workspace = true }
repository_layout = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
ticket_model = { workspace = true }
time = { workspace = true, features = ["parsing"] }
time_source = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
repository_root = { workspace = true }

[lints]
workspace = true
