# The ticketboard's headless half: the corpus load, the board, tree, filter and facet projections,
# the recorded wave lanes, the measured run receipts and historical estimates, the document reads,
# the ticket-command queue and guards, the strict-check and git-status models, the file watch, the
# streamed subprocesses and the egui-free application state. No egui or eframe: the desktop
# application in apps/ticketboard paints these models. `notify` arms the registry watch (inotify on
# Linux; no async runtime); `process_runner` runs the streamed and the detached children and
# `verification_core` names why one did not run; `serde`, `serde_json` and `toml` read the wave
# lock, the receipts and the estimates; `time` parses their RFC 3339 stamps; `thiserror` derives
# the crate error.
[package]
name = "ticketboard_model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The ticketboard's headless models, services and application state over the ticket registry"

[package.metadata.layout]
category = "tools/tickets"
tier = 4
targets = "any"

[dependencies]
notify = { workspace = true }
process_runner = { workspace = true }
repository_layout = { workspace = true }
repository_root = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
ticket_metrics = { workspace = true }
ticket_model = { workspace = true }
ticket_wave_lock = { workspace = true }
time = { workspace = true, features = ["parsing"] }
time_source = { workspace = true }
toml = { workspace = true }
verification_core = { workspace = true }

[features]
# The shared test fixtures (scratch folders, ticket and corpus builders, source inspection) for
# the ticketboard application's tests; enabled only from `[dev-dependencies]`.
test_fixtures = []

[lints]
workspace = true
