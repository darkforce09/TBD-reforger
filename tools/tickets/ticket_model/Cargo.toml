# The typed ticket and its canonical TOML encoding, the corpus store over `.ai/tickets/`, the scope
# vocabulary, the repository paths only the ticket domain names, and the commit-subject miner.
# `toml` carries `preserve_order` so the vocabulary keeps document order; `time` parses the commit
# dates the miner normalises.
[package]
name = "ticket_model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The typed ticket, its canonical TOML encoding, the corpus store, the scope vocabulary and the commit-subject miner"

[package.metadata.layout]
category = "tools/tickets"
tier = 2
targets = "any"

[dependencies]
newtype_ids = { workspace = true }
process_runner = { workspace = true }
regex = { workspace = true }
repository_layout = { workspace = true }
repository_root = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["parsing"] }
time_source = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
