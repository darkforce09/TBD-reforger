# The developer tool binaries: eight one-line `main`s, each calling one tool crate's entry. The
# package has no library; every dependency is the crate one binary calls.
[package]
name = "developer_tools"
description = "The developer tool binaries: enf, gate, mcpd, world, map, capture, the staging relay and the staging load"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The script oracle the `enf` binary runs.
enfusion_script_index = { workspace = true }
# The browser gate suites whose command lines the `gate` and `capture` binaries run.
browser_gate_suites = { workspace = true }
# The broker the `mcpd` binary runs.
enfusion_mcp_broker = { workspace = true }
# The world-export pipeline the `world` binary runs.
world_export_pipeline = { workspace = true }
# The map raster pipeline the `map` binary runs.
map_raster_pipeline = { workspace = true }
# The relay the `acknowledgement-dropping-relay` binary runs.
acknowledgement_dropping_relay = { workspace = true }
# The load generator the `staging-load` binary runs.
staging_load_generator = { workspace = true }

[[bin]]
name = "enf"
path = "src/bin/enf.rs"

[[bin]]
name = "gate"
path = "src/bin/gate.rs"

[[bin]]
name = "mcpd"
path = "src/bin/mcpd.rs"

[[bin]]
name = "world"
path = "src/bin/world.rs"

[[bin]]
name = "map"
path = "src/bin/map.rs"

[[bin]]
name = "capture"
path = "src/bin/capture.rs"

[[bin]]
name = "acknowledgement-dropping-relay"
path = "src/bin/acknowledgement_dropping_relay.rs"

[[bin]]
name = "staging-load"
path = "src/bin/staging_load.rs"
