[package]
name = "developer_tools"
description = "Browser automation, Enfusion assets, blueprint compilation, and map verification"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bcdec_rs = "0.2"
clap = { workspace = true, features = ["derive"] }
flate2 = { workspace = true }
jsonschema = { workspace = true }
libc = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "tga"] }
image-webp = "0.2"
png = { workspace = true }
resvg = { version = "0.45", default-features = false }
webp = "0.3"
website-map-engine = { path = "../../apps/website/map-engine", default-features = false, features = [
    "world",
    "streaming",
    "io",
    "bvh",
    "scenario",
] }
futures-util = "0.3"
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "charset"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = "0.30"

[[bin]]
name = "enf"
path = "src/bin/enf.rs"

[[bin]]
name = "gate"
path = "src/bin/gate.rs"

[[bin]]
name = "mcpd"
path = "src/bin/mcpd.rs"

[[bin]]
name = "world"
path = "src/bin/world.rs"

[[bin]]
name = "map"
path = "src/bin/map.rs"

[[bin]]
name = "capture"
path = "src/bin/capture.rs"

[[bin]]
name = "acknowledgement-dropping-relay"
path = "src/bin/acknowledgement_dropping_relay.rs"

[lib]
name = "developer_tools"
path = "src/lib.rs"
