# The offline service worker: the `offline_service_worker` binary that Trunk builds as a
# `no-modules` worker next to the app bundle. It applies the `offline_cache_policy` crate inside the
# browser and slices `Range` requests out of cached bodies.
[package]
name = "offline_service_worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Offline service worker: applies the offline cache policy in the browser and answers byte ranges from cached bodies."

# The native build of the binary is an empty `main`, so workspace builds and host clippy compile
# it; the worker itself exists only on `wasm32`.
[dependencies]
offline_cache_policy = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "Cache",
    "CacheStorage",
    "Clients",
    "ExtendableEvent",
    "FetchEvent",
    "Headers",
    "Request",
    "RequestMode",
    "Response",
    "ResponseInit",
    "ResponseType",
    "ServiceWorkerGlobalScope",
    "WorkerGlobalScope",
    "WorkerLocation",
] }
