# Fleet host agent: runs on each game host beside the Arma Reforger dedicated server.
#
# It polls the platform API outbound over HTTPS for fleet commands addressed to its server,
# performs fixed process-control actions through `systemctl --user` and BattlEye RCon commands
# over UDP, and reports each step to the command ledger. README.md documents the configuration,
# the safety model and the systemd user service.
[package]
name = "fleet_host_agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Game-host agent that performs fleet commands from the TBD platform command ledger."
license.workspace = true
publish.workspace = true

[dependencies]
crc32fast = { workspace = true }
# The executor route shapes and the machine credential format, shared with the platform API.
fleet_wire_contract = { workspace = true }
rand = { workspace = true }
# rustls-no-provider plus the ring provider installed before the client is built: HTTPS without
# the aws-lc-rs C build, the same arrangement as the API crate.
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
# The stand-in platform API of the ledger tests.
axum = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
