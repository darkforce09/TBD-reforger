# T-159 — Leptos (Rust/wasm) website SPA; THE frontend since the T-159.29.3 React deletion
# (dev: `cargo xtask mk leptos`; prod: SPA_DIST_DIR serve). CSR-only for now (L1); links the existing
# map-engine crates directly from T-159.15 (the wasm-boundary collapse).
[package]
name = "website-frontend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
console_error_panic_hook = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# T-180.7 — `format_slot_line` on native + wasm. T-243 — the mission compiler is on the NATIVE
# build too, not just wasm32: `MissionDetail::compiled_meta` is the row half of the editor's
# server-truth Export, and a projection that only exists in the wasm build is a projection
# `cargo test` cannot check; `compiled_meta_is_the_row_the_server_compiles_from` runs it against
# the real captured `GET /missions/:id` golden.
# T-0xx Phase 2A: this line absorbed `website-mission-core`, which was a separate unconditional
# dependency with `features = ["doc"]`. `doc` was `compiler` + yrs, and it is now `store`
# (= `scenario` + yrs). It is named HERE, in the shared block, and not in the wasm32 block below,
# because the map-engine edges are target-split while the old mission-core edge was not — putting
# `store` on wasm32 alone would take `compiled_meta` off the native build and kill that test
# silently. `terrain` -> `world` and `formats` -> `io` are the same phase's renames. There is no
# `blueprint` feature and there never was — `architecture/blueprint` (building structs + the LOS
# raycaster behind `/debug/building-viewer`) rides `io`, which is why this line takes it.
# `streaming` is deliberately absent: the native build wants the world/io pair without the
# loader/scheduler stack (flate2), which the wasm32 block below adds.
website-map-engine = { path = "../map-engine", default-features = false, features = ["world", "io", "store", "editing"] }
gloo-net = "0.6"
js-sys = "0.3"
# T-405 — the `<a href>` scheme guard (`url_guard.rs`). Costs the bundle NOTHING: `url` is already
# linked twice over via `leptos_router` and `leptos → leptos_server → server_fn`, and the workspace
# lockfile pins the same 2.5.8 `website-api` builds against — which is the point. Both copies of
# `is_http_url` call the SAME compiled `Url::parse`, so they agree by construction rather than by
# discipline. Naming it here just makes the direct use honest. See `src/url_guard.rs` for why the
# predicate is a port and not a shared crate.
url = "2.5"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Storage",
    # T-159.17 yrs IDB persist: `window.document()` + `document.hidden()` (Page Visibility) and the
    # `visibilitychange` flush-on-hide listener. sessionStorage/localStorage stay under `Storage`;
    # set_timeout/clear_timeout_with_handle live under the existing `Window`.
    "Document",
    "RequestCredentials",
    "HtmlCanvasElement",
    # T-159.15.1 Mission Creator render loop: container div, its bounding rect, wheel-zoom, and the
    # capture/passive wheel + window resize listeners.
    "HtmlDivElement",
    "Element",
    "DomRect",
    "WheelEvent",
    # T-159.15.2 Mission Creator pan: MMB/RMB drag (PointerEvent) + contextmenu (MouseEvent).
    # `PointerEvent = ["Event","MouseEvent","UiEvent"]` transitively enables the inherited
    # button()/client_x()/prevent_default() accessors; MouseEvent is listed for the standalone
    # contextmenu handler type. set/has/release_pointer_capture live under the existing `Element`.
    "PointerEvent",
    "MouseEvent",
    # T-159.21 undo/redo shortcuts: the window `keydown` listener (Ctrl/Cmd+Z, Ctrl+Y). Brings the
    # inherited code()/ctrl_key()/meta_key()/shift_key()/alt_key() accessors via UiEvent/Event.
    # The focus guard's `active_element` / `is_content_editable` are already covered by the
    # existing `Document` / `Element` / `HtmlElement`.
    "KeyboardEvent",
    "EventTarget",
    "AddEventListenerOptions",
    # T-159.20 Save/Export: the semver <input> (HtmlInputElement) + the Export download dance
    # (Blob/BlobPropertyBag → Url.createObjectURL → <a download> click → revokeObjectURL). `click()`
    # lives on HtmlElement; the anchor is created via `document.create_element("a")` → HtmlAnchorElement.
    "HtmlInputElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlElement",
    # T-446 — CMS Content hero upload: `<input type=file>` → FormData field `"file"` →
    # POST /api/v1/cms/uploads. `File` extends `Blob` (already listed); `FileList` is required for
    # `HtmlInputElement::files()` (HtmlInputElement's feature deps do not pull it).
    "FormData",
    "File",
    "FileList",
    # T-159.25 SSE consumer (sse.rs): Bearer fetch + ReadableStream reader — the useServerTelemetry
    # transport (EventSource can't carry the Authorization header).
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    # T-287 — abort the SSE fetch on SPA route-leave (AbortController parked in thread_local;
    # on_cleanup calls the Send zero-capture abort_server_status_stream).
    "AbortController",
    "AbortSignal",
    # T-159.25 Server Intel copy-address (navigator.clipboard.writeText).
    "Navigator",
    "Clipboard",
    # Building-viewer debug bench — `?prefab=` override parse.
    "UrlSearchParams",
    # T-166 — TBDS/WebP decode → ImageBitmap (WebGPU) or OffscreenCanvas→RGBA (WebGL2 gates).
    "ImageBitmap",
    "ImageBitmapOptions",
    "ColorSpaceConversion",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "ImageData",
] }

# Rendering and browser asset I/O share the frontend's WebAssembly module.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
# `default-features = false` is explicit since T-0xx Phase 2A flipped the crate default to
# `scenario`. This line was the only one riding the old default; `render` reaches
# streaming -> io -> world -> bvh transitively, so the resulting feature set is unchanged.
website-map-engine = { path = "../map-engine", default-features = false, features = ["render", "streaming"] }
# T-159.17 yrs IDB persist — the React `yrsPersist.ts` parity (DB `tbd-mission-yrs` / store
# `doc-state` / whole `encode_state()` blob). `idb` is a wasm-first IndexedDB wrapper; its default
# features pull `tokio` with ONLY `features=["sync"]` (oneshot), which compiles on
# wasm32-unknown-unknown — so keep default features (dropping them strips the async API).
idb = "0.6"
# T-159.25 SSE consumer — awaiting fetch/reader promises in sse.rs. Already in the tree via leptos
# (spawn_local); listing it just makes the direct use explicit.
wasm-bindgen-futures = "0.4"

# [profile.*] lives in the workspace root Cargo.toml (member profiles are ignored). trunk applies
# wasm-opt via the index.html data-wasm-opt attribute.

# Native UI tests call the graphics crate's satellite selection and archive arithmetic.
[dev-dependencies]
website-map-engine = { path = "../map-engine", default-features = false, features = [
    "streaming",
] }
