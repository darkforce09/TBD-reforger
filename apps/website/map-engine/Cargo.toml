[package]
name = "website-map-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Map graphics, spatial computation, terrain formats, and asset streaming."

[lib]
crate-type = ["rlib"]

# Feature tiers, lowest first. `scenario` is the headless mission domain (`data/scenario`) and the
# crate default, so `website-api` links the mission compiler and nothing else; `store` adds the
# yrs CRDT document. `world` adds terrain and buildings, `io` the on-disk formats over those types
# (the format code depends on the terrain types, never the reverse), `streaming` the served-data
# loaders and scheduler on top of `io`, and `render` the GPU frame builder. `streaming` is its own
# tier above `io`, so the on-disk formats compile without the loaders, the scheduler and flate2.
[features]
default = ["scenario"]
scenario = ["dep:serde", "dep:serde_json", "dep:thiserror", "dep:libm"]
store = ["scenario", "dep:yrs"]
bvh = []
# `dep:website-graphics-engine` sits on `world`, the first tier above `scenario`, because code
# from `world` upward speaks the renderer's vocabulary: `world::mesh` re-exports
# `website_graphics_engine::draw::triangulate`, which the frontend's native building viewer calls,
# and `overlay::lod` re-exports `text::scale::REF_ZOOM` for the label glyph math the streaming
# belts reach. `scenario` is the one tier without it, so `cargo tree -p website-api` carries no
# graphics crate, no png, no rkyv and no flate2.
world = ["bvh", "dep:png", "dep:website-graphics-engine"]
io = ["world", "scenario", "serde_json/float_roundtrip", "dep:rkyv"]
streaming = ["io", "dep:flate2"]
render = ["streaming", "dep:website-graphics-engine"]
# The editing tier drives the STREAMED world, not just the static one: the line-of-sight tool's
# object layer washes a viewshed by testing cells against the world occluder, whose frame convention
# and traversal live under `spatial/los/world` — which is `streaming`'s. So the honest edge for
# authored-document editing is "the document plus everything the operator can see", and `streaming`
# is the tier that names the second half.
editing = ["store", "world", "streaming"]

[dependencies]
# The pure renderer. The arrow points one way: the map engine speaks the renderer's frame
# vocabulary; the renderer never learns a map noun.
website-graphics-engine = { path = "../graphics-engine", optional = true }
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }
png = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true, features = ["preserve_order"] }
thiserror = { version = "2", optional = true }
# Pure-Rust transcendentals for the shell flight model: the same bits on native and wasm32.
libm = { version = "0.2", optional = true }
# The CRDT layer behind `store`.
yrs = { version = "0.27", optional = true }
flate2 = { workspace = true, optional = true }
# Validation and endian settings are part of the shared on-disk format.
rkyv = { version = "0.8.18", optional = true, default-features = false, features = ["std", "bytecheck", "little_endian"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "HtmlCanvasElement", "Window", "ImageBitmap", "Performance", "console",
    "ImageBitmapOptions", "ColorSpaceConversion", "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d", "ImageData", "Blob", "BlobPropertyBag",
    "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader",
    "Location", "UrlSearchParams",
] }
console_error_panic_hook = { workspace = true }
futures = { workspace = true }
gloo-net = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
# The editing layer hands a host-supplied async read to `editing::persist::merge_policy`, so a
# native test of that ordering needs an executor to drive the future to completion.
futures = { workspace = true }
# The catalog tests validate their sample against `contracts/definitions/ballistics-catalog.schema.json`
# with the same validator the xtask schema checks use.
jsonschema = { workspace = true }
