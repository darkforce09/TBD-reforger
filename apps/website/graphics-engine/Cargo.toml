[package]
name = "website-graphics-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false
description = "Pure GPU renderer: device, pipelines, shaders, draw and text batching. Knows no map nouns."

[lib]
crate-type = ["rlib"]

[features]
default = []
# Mirrors `website-map-engine`'s `render`: gates the wasm-only wgpu surface so a native
# build compiles the geometry and packing halves with no GPU crate at all.
render = []

[dependencies]
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
earcutr = "0.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement", "Window", "Performance", "console",
] }
