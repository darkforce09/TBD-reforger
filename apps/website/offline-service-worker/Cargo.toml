# The offline service worker: a pure policy library (cache names, request classes, byte ranges,
# the terrain pack list) that the single-page app also links, and the `offline_service_worker`
# binary that Trunk builds as a `no-modules` worker next to the app bundle.
[package]
name = "website-offline-service-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Offline service worker: cache policy, byte-range slicing and the terrain pack list, plus the wasm32 worker binary."

[lib]
path = "src/lib.rs"

# The native build of the binary is an empty `main`, so workspace builds and host clippy compile
# it; the worker itself exists only on `wasm32`.
[[bin]]
name = "offline_service_worker"
path = "src/bin/offline_service_worker/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "Cache",
    "CacheStorage",
    "Clients",
    "ExtendableEvent",
    "FetchEvent",
    "Headers",
    "Request",
    "RequestMode",
    "Response",
    "ResponseInit",
    "ResponseType",
    "ServiceWorkerGlobalScope",
    "WorkerGlobalScope",
    "WorkerLocation",
] }
