# Ticketboard — native egui projection of the ticket registry.
#
# Parses every .ai/tickets/T-*.toml via `ticket-engine` and renders a status board +
# detail panel; every mutation shells a `cargo xtask ticket <verb>` subprocess —
# the app itself writes NO ticket bytes anywhere under the repo; the only direct
# file write is the preference store (eframe Storage in the user config dir,
# "persistence").
#
# egui/eframe (with winit/wgpu) is this workspace's only window-and-GPU dependency
# family outside the browser engines, so it is a deliberate supply-chain and
# build-time cost. Keep this tree lean on purpose: no tokio.
[package]
name = "ticketboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native egui viewer for the .ai/tickets registry."
license = "UNLICENSED"
publish = false

[dependencies]
# wgpu is eframe 0.36's default backend. "persistence" enables
# eframe Storage (ron + serde + directories) — the picked-repo-path memory.
eframe = { version = "0.36.1", features = ["persistence"] }
# In-app Markdown rendering. Version 0.25 matches egui 0.36, so
# it resolves onto the one egui already in the lock — never a second egui.
# default-features = false drops `load-images` (egui_extras image/file loaders —
# the mime_guess2/image tree this manifest already refuses below); the viewer is
# read-only text, so markdown images render as their alt text and nothing fetches.
# `pulldown_cmark` selects the one supported parser backend.
egui_commonmark = { version = "0.25.0", default-features = false, features = [
    "pulldown_cmark",
] }
# Detail-panel field table. default-features = false drops mime_guess2 (image-loader
# support the app does not use).
egui_extras = { version = "0.36.1", default-features = false }
# File watch on .ai/tickets + the sync targets. The
# default feature set only selects the macOS backend flavor (fsevent) — on Linux this
# is inotify with no extra runtime: no crossbeam, no mio, no tokio.
notify = "8"
# Native folder picker for the no-repo refusal screen (xdg-portal + pollster on Linux;
# no async runtime).
rfd = "0.17.2"
# wave.lock mirror parse — the same serde derive + toml 0.8 lines xtask and
# ticket-engine already use, so the verbatim lock render can never disagree with the
# writer on TOML dialect. Both crates were already in the workspace graph.
serde = { version = "1", features = ["derive"] }
# The metrics dashboard's run-receipt JSON parse. Workspace-resolved, and the same parser
# `ticket check` reads the receipts with, so the two can never disagree on JSON dialect.
serde_json = "1"
ticket-engine = { path = "../../tools_v2/ticket-engine" }
# Elapsed derivation (finished − started at query time): the same RFC 3339 parser
# tools_v2/ticket-engine/src/metrics/ uses (workspace-resolved), so elapsed can never
# disagree with the checker.
time = { version = "0.3", features = ["parsing"] }
toml = "0.8"

[features]
# Driver-quirk fallback: `--features glow` builds the glow backend
# in and the app then selects it; the default build stays pure wgpu.
glow = ["eframe/glow"]
