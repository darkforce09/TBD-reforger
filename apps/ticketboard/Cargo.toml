# Ticketboard — native egui projection of the ticket registry.
#
# Paints the models of `ticketboard_model` (corpus, board, waves, metrics, documents, ticket
# commands) as a status board + detail panel; every mutation shells a `cargo xtask ticket <verb>`
# subprocess — the app itself writes NO ticket bytes anywhere under the repo; the only direct
# file write is the preference store (eframe Storage in the user config dir,
# "persistence").
#
# egui/eframe (with winit/wgpu) is this workspace's only window-and-GPU dependency
# family outside the browser engines, so it is a deliberate supply-chain and
# build-time cost. Keep this tree lean on purpose: no tokio.
[package]
name = "ticketboard"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Native egui viewer for the .ai/tickets registry."
license.workspace = true
publish.workspace = true

[dependencies]
# wgpu is eframe 0.36's default backend. "persistence" enables
# eframe Storage (ron + serde + directories) — the picked-repo-path memory.
eframe = { workspace = true, features = ["persistence"] }
# In-app Markdown rendering. Version 0.25 matches egui 0.36, so
# it resolves onto the one egui already in the lock — never a second egui.
# The workspace entry turns default features off, which drops `load-images` (egui_extras
# image/file loaders — the mime_guess2/image tree this manifest already refuses below); the
# viewer is read-only text, so markdown images render as their alt text and nothing fetches.
# `pulldown_cmark` selects the one supported parser backend.
egui_commonmark = { workspace = true, features = ["pulldown_cmark"] }
# Detail-panel field table. The workspace entry turns default features off, which drops
# mime_guess2 (image-loader support the app does not use).
egui_extras = { workspace = true }
# Native folder picker for the no-repo refusal screen (xdg-portal + pollster on Linux;
# no async runtime).
rfd = { workspace = true }
# The `.ai/tickets` folder name the no-repository and loading screens name.
repository_layout = { workspace = true }
# The ticket and status vocabulary the board, lanes, menus and set-status dropdown render.
ticket_model = { workspace = true }
# The packer's ownership-collision rule, the verdict of the two-ticket comparison.
ticket_wave_lock = { workspace = true }
# Every model, service and the application state the views paint and the actions change.
ticketboard_model = { workspace = true }

[dev-dependencies]
# The scratch folders, ticket and corpus builders and source inspection the rendering and
# architecture tests share with the model crate's own tests.
ticketboard_model = { workspace = true, features = ["test_fixtures"] }

[features]
# Driver-quirk fallback: `--features glow` builds the glow backend
# in and the app then selects it; the default build stays pure wgpu.
glow = ["eframe/glow"]

[lints]
workspace = true
