# Ticketboard — native egui projection of the ticket registry (T-915).
#
# Parses every .ai/tickets/T-*.toml via `tbd-tickets` and renders a status board +
# detail panel; T-915.4 mutations shell `cargo xtask ticket <verb>` subprocesses —
# the app itself writes NO ticket bytes anywhere under the repo; the only direct
# file write is the preference store (eframe Storage in the user config dir,
# "persistence").
#
# egui/eframe (with winit/wgpu) is a first-time dependency family for this workspace —
# a named supply-chain and build-time event (docs/platform/t915_ticketboard_design.md
# §Framework). Keep this tree lean on purpose: no tokio.
[package]
name = "ticketboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native egui viewer for the .ai/tickets registry (T-915)."
license = "UNLICENSED"
publish = false

[dependencies]
# wgpu is eframe 0.36's default backend (design §Framework). "persistence" enables
# eframe Storage (ron + serde + directories) — the picked-repo-path memory.
eframe = { version = "0.36.1", features = ["persistence"] }
# Detail-panel field table. default-features = false drops mime_guess2 (image-loader
# support the app does not use).
egui_extras = { version = "0.36.1", default-features = false }
# File watch on .ai/tickets + the sync targets (T-915.3 §Read architecture). The
# default feature set only selects the macOS backend flavor (fsevent) — on Linux this
# is inotify with no extra runtime: no crossbeam, no mio, no tokio.
notify = "8"
# Native folder picker for the no-repo refusal screen (xdg-portal + pollster on Linux;
# no async runtime).
rfd = "0.17.2"
# wave.lock mirror parse (T-915.2) — the same serde derive + toml 0.8 lines xtask and
# tbd-tickets already use, so the verbatim lock render can never disagree with the
# writer on TOML dialect. Both crates were already in the workspace graph.
serde = { version = "1", features = ["derive"] }
tbd-tickets = { path = "../../crates/tbd-tickets" }
toml = "0.8"

[features]
# Driver-quirk fallback (design §Framework): `--features glow` builds the glow backend
# in and the app then selects it; the default build stays pure wgpu.
glow = ["eframe/glow"]
