[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "TBD Reforger platform backend: Axum REST API and SSE realtime hub."
license.workspace = true
publish.workspace = true

# One library crate holds every module; binaries: api (server), import-registry (envelope ingest)
# and staging-fixtures (the staging host tool).
[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "import-registry"
path = "src/bin/import_registry.rs"

[[bin]]
name = "staging-fixtures"
path = "src/bin/staging_fixtures/main.rs"

[dependencies]
ammonia = "4.1.3"
anyhow = "1.0.103"
async-stream = "0.3.6"
axum = { workspace = true, features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie"] }
chrono = { workspace = true, features = ["serde"] }
# The serde types generated from the contract schemas: the registry import decodes registry
# envelopes into them, and the equipment data viewer and media upload answers are their types.
contract_schema_types = { workspace = true }
csv = "1.4.0"
dotenvy = "0.15.7"
# The fleet-command wire shapes, `ExecutorKind` and the machine credential format the ledger,
# the machine credentials and the staging fixtures tool share with the fleet host agent.
fleet_wire_contract = { workspace = true }
futures = "0.3.32"
governor = "0.10.4"
hex = "0.4.3"
# `is_http_url`, the scheme guard every writer of a URL column calls before it stores the value.
http_url_guard = { workspace = true }
# Core draft 2020-12 validation of local and embedded schemas; the workspace entry turns the
# HTTP `$ref` resolver off.
jsonschema = { workspace = true }
# rust_crypto = pure-Rust HMAC/SHA backend for HS256 (no aws-lc-rs C dependency).
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
# The control-character and cargo capacity scans every mission save and compile runs.
mission_wire_safety = { workspace = true }
# The game-document compiler's identity, error and compiled document the artifact store records.
mission_compiler = { workspace = true }
# The compiled slot row the compile service re-exports, and the ORBAT template parse and faction
# join-key check behind event mission attachment.
mission_model = { workspace = true }
# The editor payload compiler and the kit alias table the mission contract loads.
mission_payload = { workspace = true }
# The validation findings the compile service re-exports as its diagnostics.
mission_validation = { workspace = true }
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json", "charset", "http2", "form", "rustls-no-provider"] }
rust_decimal = { version = "1.42.1", features = ["db-postgres"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.228", features = ["derive"] }
# float_roundtrip parses every number bit-exactly, so a fire solution re-solved from a client or
# catalog document starts from the same f64 inputs the wasm client used.
serde_json = { version = "1.0.150", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite-bundled", "uuid", "chrono", "json", "macros", "migrate", "rust_decimal"] }
subtle = "2.6.1"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "catch-panic", "fs", "trace", "limit", "timeout", "set-header"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = "2.5.8"
uuid = { workspace = true, features = ["v4", "serde"] }
# The ballistics crates behind the fire-mission routes and the catalog uploads: the catalog, the
# solver's charge rows, the fire-mission assembler and comparison, and the catalog calibration.
ballistics_model = { workspace = true }
ballistics_solver = { workspace = true }
fire_mission_planning = { workspace = true }
ballistics_calibration = { workspace = true }

# `failpoints` compiles the fault-injection registry of `src/core/failpoints/` in. Only the self
# dev-dependency below enables it: every test build of this crate carries it, and the deploy
# build (`cargo build --release -p api --bin api`) compiles it out. Never add it to
# `default` or pass it on a deploy build.
[features]
failpoints = []

[dev-dependencies]
# The guard's case table (`http_url_guard::cases`), which the AAR replay backfill suite runs
# through the guard and the database's approximation.
http_url_guard = { workspace = true, features = ["test_fixtures"] }
proptest = { workspace = true }
# The ECMA-262 engine the content URL policy tests compile the schemas' URL patterns with, the
# engine the generated contract types check them with.
regress = { workspace = true }
# The repository laws and the pattern scanners the `engineering_laws` suite runs.
repository_laws = { workspace = true }
verification_core = { workspace = true }
# The crate itself with `failpoints` on, for the lib unit tests and every `tests/*.rs` binary.
api = { path = ".", features = ["failpoints"] }
