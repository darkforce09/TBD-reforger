[toolchain]
# The one toolchain of the whole workspace: every cargo call from the repository root or a member
# folder (the gate harness in `tools/developer_tools`, the Trunk wasm build of
# `crates/frontend/shell/frontend_application`) resolves this file, so no build falls back to the
# floating rustup default. Keep the channel in lockstep with the `rustc` entry of
# `tools/browser_testing/browser_gate_suites/gate-env.json`. Install Rust through rustup, which
# resolves this file per checkout, never through dnf or rpm-ostree on Bazzite.
channel = "1.95.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
