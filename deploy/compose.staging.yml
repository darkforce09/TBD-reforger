# The website's stack on the home server: Postgres and the Caddy web server, plus the API as an
# optional container under the `api` profile.
#
# `cargo xtask deploy website` starts `postgres` before it builds on the host and `caddy` after the
# app build, then reloads Caddy's configuration; the API itself runs as the systemd user unit
# deploy/systemd/tbd-website-api.service (documentation/runbooks/website_deployment.md
# Phase D). `restart: unless-stopped` brings both services back when the container runtime starts
# at boot.
#
# The project name is set below rather than taken from the folder that holds this file, so the
# named volumes exist on the host as `website_<volume>` and the containers keep the project they
# were created in wherever the file sits; another project name would start from empty volumes and
# collide with the running containers' fixed names. Relative paths below resolve against this
# file's folder, deploy/.
#
# From the repository root:
#   docker compose -f deploy/compose.staging.yml up -d postgres caddy
#   docker compose -f deploy/compose.staging.yml --profile api up -d --build
#   docker compose -f deploy/compose.staging.yml config   # validate
#
# Host Postgres port: TBD_POSTGRES_HOST_PORT (default 5432), which `deploy website` exports from
# deploy/deploy.env. The development stack is deploy/compose.dev.yml
# on host port 5434.

name: website

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: tbd_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: tbd_reforger
    ports:
      # Bind loopback only — Cloudflare/Caddy sit in front; do not publish LAN-wide.
      - "127.0.0.1:${TBD_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images store data under a major-version subdir; mount the
      # parent (docker-library/postgres#1259), same as local compose.
      - tbd_staging_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbd -d tbd_reforger"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The web server: serves the built app on :3080 and proxies the API paths to the API on
  # 127.0.0.1:8080, as deploy/caddy/Caddyfile says.
  caddy:
    image: docker.io/library/caddy:2
    container_name: tbd_staging_caddy
    restart: unless-stopped
    # Host networking: Caddy listens on the host's :3080 and reaches the API, which runs on the
    # host rather than in this stack, at 127.0.0.1:8080. The API therefore sees every proxied
    # request arrive from 127.0.0.1, the one peer TRUSTED_PROXIES (127.0.0.1/32) trusts for
    # X-Forwarded-For. Caddy's admin endpoint listens on the host's localhost:2019.
    network_mode: host
    command: ["caddy", "run", "--config", "/etc/tbd-caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      # Folders, never single files and never the build output itself: the rsync replaces a file
      # by writing a new one and renaming it over the old, and Trunk may remove and recreate
      # `dist`, and a bind mount keeps the object it was started with. A missing source folder
      # would also be created by the container runtime as root, which the deploy user's build
      # could then not write. Both folders always exist in the checkout. The configuration
      # folder is deploy/caddy, which holds only the Caddyfile and its README, never deploy
      # itself, so the host's deploy/deploy.env stays outside the container.
      - ./caddy:/etc/tbd-caddy:ro
      - ../apps/frontend:/srv/tbd-frontend:ro
      # Caddy's own state: /data is its storage, /config the last configuration it loaded.
      - tbd_staging_caddy_data:/data
      - tbd_staging_caddy_config:/config

  # Optional — enable with `--profile api`. The deploy runs the API as the host's systemd unit
  # (documentation/runbooks/website_deployment.md Phase D); this profile is the containerized
  # alternative and binds the same 127.0.0.1:8080, so run one or the other.
  api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tbd-website-api:local
    container_name: tbd_staging_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://tbd:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/tbd_reforger?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-set-a-real-secret}
      FRONTEND_URL: ${FRONTEND_URL:-https://tbd.icanteam.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://tbd.icanteam.com}
      OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URL: ${DISCORD_REDIRECT_URL:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
      # The image contains the binary and nothing else, and the runtime stage sets no WORKDIR, so
      # the API's CWD-relative asset fallback resolves to a path that does not exist inside the
      # container. Both directories are therefore bind-mounted below and named absolutely here.
      MAP_ASSETS_DIR: /srv/assets/terrains
      GLYPH_ASSETS_DIR: /srv/assets/glyphs
      # What the API writes (CMS uploads served at /uploads) goes to a named volume; outside
      # development the API refuses to boot unless UPLOAD_DIR is absolute. The image creates
      # /srv/state owned by the API's uid, and the volume takes that ownership on first use.
      UPLOAD_DIR: /srv/state/uploads
    volumes:
      # Read-only: the API serves these, it never writes them. The terrain tree is the server's own
      # copy (the deploy rsync excludes it); the glyph atlas arrives with the rsync.
      - ../assets/terrains:/srv/assets/terrains:ro
      - ../assets/glyphs:/srv/assets/glyphs:ro
      - tbd_staging_api_state:/srv/state

volumes:
  tbd_staging_pgdata:
  tbd_staging_caddy_data:
  tbd_staging_caddy_config:
  tbd_staging_api_state:
