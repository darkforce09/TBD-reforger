<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBD Reforger - Markers Panel (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#0b1120',
            'surface-dim': '#0d1322',
            'surface-bright': '#33394a',
            'surface-container-lowest': '#080e1d',
            'surface-container-low': '#151b2b',
            'surface-container': '#1a2234',
            'surface-container-high': '#222b40',
            'surface-container-highest': '#2c3750',
            primary: '#3b82f6',
            'primary-dark': '#1d4ed8',
            'on-surface': '#f8fafc',
            'on-surface-variant': '#94a3b8',
            'border-subtle': 'rgba(255, 255, 255, 0.08)',
            'border-accent': 'rgba(59, 130, 246, 0.35)'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: transparent;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
    }
    .tactical-glass {
      background: rgba(13, 19, 34, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    }
    .custom-select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.75rem center;
      background-size: 1.25rem;
    }
  </style>
</head>
<body class="min-h-screen p-8 flex items-start justify-start bg-slate-950/40">

  <!-- Standalone Markers Panel -->
  <div class="tactical-glass rounded-xl w-80 overflow-hidden flex flex-col transition-all duration-200">
    
    <!-- Top Header / Bar -->
    

    <!-- Main Content Form Area -->
    <div class="p-4 flex flex-col gap-3.5">
      
      <!-- Plan Selector Dropdown Group -->
      <div class="flex flex-col gap-1.5">
        <label for="tactical-plan-select" class="text-[11px] font-medium text-slate-400 uppercase tracking-wider flex items-center justify-between">
          <span class="">Tactical Plan</span>
          <span class="text-[10px] text-slate-500 font-mono">4 Available</span>
        </label>

        <div class="relative">
          <select id="tactical-plan-select" class="custom-select w-full bg-slate-900/90 hover:bg-slate-900 text-slate-100 text-xs rounded-lg px-3 py-2.5 pr-9 border border-white/10 focus:border-blue-500/70 focus:ring-1 focus:ring-blue-500/50 focus:outline-none transition cursor-pointer font-medium">
            <option value="plan_alpha" selected="">Plan Alpha — Main Axis of Advance</option>
            <option value="plan_bravo">Plan Bravo — Flank &amp; Cutoff</option>
            <option value="plan_charlie">Plan Charlie — Defense in Depth</option>
            <option value="plan_recon">Plan Recon — Screen &amp; Observation</option>
          </select>
        </div>
      </div>

      <!-- Action Button -->
      <button type="button" class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-medium text-xs py-2.5 px-4 rounded-lg shadow-sm hover:shadow-blue-500/20 transition-all border border-blue-400/30 group">
        <span class="material-symbols-outlined text-base group-hover:scale-110 transition-transform">download</span>
        <span class="">Load Plan</span>
      </button>

    </div>

  </div>





</body></html>
