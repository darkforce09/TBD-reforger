<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBD Reforger - Global Navigation Panel (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: '#0b1120',
            'surface-dim': '#0d1322',
            'surface-bright': '#33394a',
            'surface-container-lowest': '#080e1d',
            'surface-container-low': '#151b2b',
            'surface-container': '#1a2234',
            'surface-container-high': '#222c42',
            'surface-container-highest': '#2c3750',
            primary: '#3b82f6',
            'on-surface': '#f1f5f9',
            'on-surface-variant': '#94a3b8',
            'outline-subtle': 'rgba(255, 255, 255, 0.08)',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    .glass-panel {
      background: rgba(13, 19, 34, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.15) inset;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-[#060a12] text-on-surface font-sans antialiased min-h-screen flex items-center justify-center p-6 select-none">

  <!-- Standalone Primary Navigation Panel (Tier 1) -->
  <aside class="glass-panel w-72 rounded-2xl p-3 flex flex-col gap-1.5 shadow-2xl relative">
    
    <!-- Navigation Options -->
    <nav class="flex flex-col gap-1 w-full" aria-label="Primary Navigation">
      
      <!-- 1. MAP -->
      <button type="button" class="group flex items-center justify-between px-3.5 py-3 rounded-xl transition-all duration-150 text-slate-400 hover:text-white hover:bg-white/[0.05] active:scale-[0.98] w-full text-left"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-white/[0.04] border border-white/[0.06] flex items-center justify-center text-slate-400 group-hover:text-primary group-hover:border-primary/30 group-hover:bg-primary/10 transition-colors"><span class="material-symbols-outlined text-[20px]">map</span></div><span class="text-sm font-semibold tracking-wide text-slate-200 group-hover:text-white transition-colors">Map</span></div></button>

      <!-- 2. BRIEFING (Active State) -->
      <button type="button" class="flex items-center justify-between px-3.5 py-3 rounded-xl bg-primary text-white shadow-lg shadow-primary/25 border border-blue-400/30 w-full text-left relative overflow-hidden transition-all duration-150 active:scale-[0.98]"><div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-blue-500 opacity-90"></div><div class="absolute right-0 top-0 bottom-0 w-1 bg-white/60"></div><div class="flex items-center gap-3 relative z-10"><div class="w-8 h-8 rounded-lg bg-white/20 border border-white/25 flex items-center justify-center text-white"><span class="material-symbols-outlined text-[20px] fill-1">description</span></div><div class="flex items-center gap-2"><span class="text-sm font-semibold tracking-wide text-white">Briefing</span></div></div></button>

      <!-- 3. PLAYERS -->
      <button type="button" class="group flex items-center justify-between px-3.5 py-3 rounded-xl transition-all duration-150 text-slate-400 hover:text-white hover:bg-white/[0.05] active:scale-[0.98] w-full text-left"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-white/[0.04] border border-white/[0.06] flex items-center justify-center text-slate-400 group-hover:text-primary group-hover:border-primary/30 group-hover:bg-primary/10 transition-colors"><span class="material-symbols-outlined text-[20px]">groups</span></div><span class="text-sm font-semibold tracking-wide text-slate-200 group-hover:text-white transition-colors">Players</span></div><div class="flex items-center gap-1 font-mono text-[11px] font-medium"><span class="px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">36</span><span class="px-1.5 py-0.5 rounded bg-red-500/10 text-red-400 border border-red-500/20">48</span></div></button>

      <!-- 4. MARKERS -->
      <button type="button" class="group flex items-center justify-between px-3.5 py-3 rounded-xl transition-all duration-150 text-slate-400 hover:text-white hover:bg-white/[0.05] active:scale-[0.98] w-full text-left"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-white/[0.04] border border-white/[0.06] flex items-center justify-center text-slate-400 group-hover:text-primary group-hover:border-primary/30 group-hover:bg-primary/10 transition-colors"><span class="material-symbols-outlined text-[20px]">edit_location_alt</span></div><span class="text-sm font-semibold tracking-wide text-slate-200 group-hover:text-white transition-colors">Markers</span></div></button>

    </nav>

  </aside>







</body></html>
