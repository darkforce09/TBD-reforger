<!DOCTYPE html><html lang="en" class="dark" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBD Reforger - Lobby Bottom Bar (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: '#0b1120',
            'surface-container-lowest': '#080e1d',
            'surface-container-low': '#151b2b',
            'surface-container': '#1f293d',
            'surface-container-high': '#28334a',
            'primary': '#3b82f6',
            'primary-hover': '#2563eb',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 p-6 flex flex-col justify-end">

  <!-- Standalone Bottom Action Bar -->
  <div class="w-full max-w-7xl mx-auto">
    <footer class="h-16 px-6 bg-slate-900/90 backdrop-blur-md border border-slate-800/80 rounded-xl shadow-2xl flex items-center justify-end">
      <!-- Left Action -->
      

      <!-- Right Action Cluster -->
      <div class="flex items-center gap-3">
        <!-- Lock Lobby Action -->
        

        <!-- Ready & Continue Action -->
        <button id="readyBtn" class="flex items-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg shadow-lg shadow-blue-600/25 border border-blue-400/40 transition-all active:scale-[0.98]"><span id="readyBtnText" class="">Select Scenario</span></button>
      </div>
    </footer>
  </div>

  <script>
    // Interactive toggles for showcase
    const lockBtn = document.getElementById('lockLobbyBtn');
    const lockBtnText = document.getElementById('lockBtnText');
    const lockIcon = document.getElementById('lockIcon');
    let isLocked = false;

    lockBtn.addEventListener('click', () => {
      isLocked = !isLocked;
      if (isLocked) {
        lockBtnText.textContent = 'Unlock Lobby';
        lockBtn.classList.add('bg-amber-950/60', 'border-amber-700/60', 'text-amber-300');
        lockBtn.classList.remove('bg-slate-800/80', 'border-slate-700/60', 'text-slate-300');
        lockIcon.classList.add('text-amber-400');
        lockIcon.classList.remove('text-slate-400');
      } else {
        lockBtnText.textContent = 'Lock Lobby';
        lockBtn.classList.remove('bg-amber-950/60', 'border-amber-700/60', 'text-amber-300');
        lockBtn.classList.add('bg-slate-800/80', 'border-slate-700/60', 'text-slate-300');
        lockIcon.classList.remove('text-amber-400');
        lockIcon.classList.add('text-slate-400');
      }
    });

    const readyBtn = document.getElementById('readyBtn');
    const readyBtnText = document.getElementById('readyBtnText');
    let isReady = false;

    readyBtn.addEventListener('click', () => {
      isReady = !isReady;
      if (isReady) {
        readyBtnText.textContent = 'Ready (Waiting for Admin)';
        readyBtn.classList.remove('bg-blue-600', 'hover:bg-blue-500', 'border-blue-400/40');
        readyBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500', 'border-emerald-400/40', 'shadow-emerald-600/25');
      } else {
        readyBtnText.textContent = 'Ready & Continue';
        readyBtn.classList.add('bg-blue-600', 'hover:bg-blue-500', 'border-blue-400/40');
        readyBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500', 'border-emerald-400/40', 'shadow-emerald-600/25');
      }
    });
  </script>







</body></html>
