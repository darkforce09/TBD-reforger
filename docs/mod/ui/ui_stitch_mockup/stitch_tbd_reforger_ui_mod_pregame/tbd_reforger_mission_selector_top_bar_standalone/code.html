<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>TBD Reforger - Mission Selector Top Bar (Standalone)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tactical: {
              surface: '#0b1120',
              card: '#0d1322',
              cardHighlight: '#151b2b',
              border: '#1e293b',
              borderLight: '#334155',
              accent: '#3b82f6',
              accentHover: '#2563eb',
              textMuted: '#94a3b8',
              textDim: '#64748b'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #060913;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      font-size: 18px;
    }
  </style>
</head>
<body class="bg-[#060913]">
<!-- Standalone Top Bar Panel Container -->
<div class="w-full max-w-7xl">
<header class="w-full h-14 bg-[#0d1322]/95 backdrop-blur-md border border-[#1e293b] rounded-xl px-5 flex items-center justify-between shadow-2xl relative">
<!-- Left: Scenario Selection / Mission Title -->
<div class="flex items-center gap-3 min-w-[280px]">
<span class="text-sm font-bold tracking-wider text-slate-100 select-none font-mono" id="topbar-title">wog_187_chollima_on_the_wing_10</span>
</div>
<!-- Center: Navigation Segmented Control -->
<nav class="flex items-center gap-1 bg-slate-950/70 border border-slate-800/80 p-1 rounded-lg select-none">
<button class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-xs font-medium tracking-wide transition-all border text-slate-400 hover:text-slate-200 hover:bg-slate-800/40 border-transparent" id="nav-browser" onclick="switchTab('browser')" type="button">
<span class="material-symbols-outlined !text-[15px]">grid_view</span>
<span class="">Scenario Browser</span>
</button>
<button class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-md border text-xs font-medium tracking-wide transition-all bg-slate-700/80 border-slate-600/60 text-slate-100 shadow-sm" id="nav-lobby" onclick="switchTab('lobby')" type="button">
<span class="material-symbols-outlined !text-[15px]">meeting_room</span>
<span class="">Lobby</span>
</button>
<button class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-slate-400 hover:text-slate-200 hover:bg-slate-800/40 text-xs font-medium tracking-wide transition-all border border-transparent" id="nav-briefing" onclick="switchTab('briefing')" type="button">
<span class="material-symbols-outlined !text-[15px]">description</span>
<span class="">Briefing</span>
</button>
</nav>
<!-- Right: User Identity & Connected Count -->
<div class="flex items-center gap-3">
<!-- Admin Identity Badge -->
<div class="flex items-center gap-2 bg-[#151b2b] border border-[#1e293b] px-3 py-1.5 rounded-lg">
<span class="text-xs font-semibold text-slate-200">Mission Maker</span>
<span class="bg-amber-500/20 border border-amber-500/40 text-amber-400 text-[10px] font-bold px-1.5 py-0.5 rounded tracking-wide">ADMIN</span>
</div>
<!-- Connected Players Count Pill -->
<div class="flex items-center gap-1.5 bg-[#151b2b] border border-[#1e293b] px-3 py-1.5 rounded-lg text-slate-300 font-mono text-xs select-none">
<span class="material-symbols-outlined text-slate-400 !text-[16px]">group</span>
<span class="text-slate-100 font-semibold" id="player-current">1</span>


</div>
</div>
</header>
</div>
<script>
    const tabConfigs = {
      browser: {
        title: 'SCENARIO BROWSER',
        fontMono: false,
        maxPlayers: '48'
      },
      lobby: {
        title: 'wog_187_chollima_on_the_wing_10',
        fontMono: true,
        maxPlayers: '187'
      },
      briefing: {
        title: 'wog_187_chollima_on_the_wing_10',
        fontMono: true,
        maxPlayers: '187'
      }
    };

    const activeClasses = ['bg-slate-700/80', 'border-slate-600/60', 'text-slate-100', 'shadow-sm'];
    const inactiveClasses = ['text-slate-400', 'hover:text-slate-200', 'hover:bg-slate-800/40', 'border-transparent'];

    function switchTab(tabKey) {
      const config = tabConfigs[tabKey];
      if (!config) return;

      // Update active nav button styling
      ['browser', 'lobby', 'briefing'].forEach(key => {
        const btn = document.getElementById(`nav-${key}`);
        if (!btn) return;
        if (key === tabKey) {
          btn.classList.remove(...inactiveClasses);
          btn.classList.add(...activeClasses);
        } else {
          btn.classList.remove(...activeClasses);
          btn.classList.add(...inactiveClasses);
        }
      });

      // Update title text and typography
      const titleEl = document.getElementById('topbar-title');
      if (titleEl) {
        titleEl.textContent = config.title;
        if (config.fontMono) {
          titleEl.classList.add('font-mono');
          titleEl.classList.remove('uppercase');
        } else {
          titleEl.classList.remove('font-mono');
          titleEl.classList.add('uppercase');
        }
      }

      // Update max players count
      const maxEl = document.getElementById('player-max');
      if (maxEl) {
        maxEl.textContent = config.maxPlayers;
      }
    }
  </script>


</body></html>
