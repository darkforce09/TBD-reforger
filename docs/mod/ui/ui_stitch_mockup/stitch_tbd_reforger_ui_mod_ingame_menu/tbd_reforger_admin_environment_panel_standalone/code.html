    <button class="speed-btn py-1.5 text-label-sm font-label-sm font-mono rounded bg-surface-container text-secondary hover:text-on-surface hover:bg-surface-container-high transition-all" onclick="setTimeSpeed(this, '2x')">2x</button>
    <button class="speed-btn py-1.5 text-label-sm font-label-sm font-mono rounded bg-surface-container text-secondary hover:text-on-surface hover:bg-surface-container-high transition-all" onclick="setTimeSpeed(this, '4x')">4x</button>
    <button class="speed-btn py-1.5 text-label-sm font-label-sm font-mono rounded bg-surface-container text-secondary hover:text-on-surface hover:bg-surface-container-high transition-all" onclick="setTimeSpeed(this, '8x')">8x</button>
    <button class="speed-btn py-1.5 text-label-sm font-label-sm font-mono rounded bg-surface-container text-secondary hover:text-on-surface hover:bg-surface-container-high transition-all" onclick="setTimeSpeed(this, '12x')">12x</button>

<!-- Quick Presets Grid -->

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">

      <span class="material-symbols-outlined text-tertiary group-hover:scale-110 transition-transform">wb_twilight</span>

    <!-- Noon (Active) -->
    <button class="preset-card group p-2.5 rounded-lg bg-surface-container-high flex flex-col items-center justify-center gap-1.5 transition-all text-center shadow-md" onclick="setPreset('12:00')">
      <span class="material-symbols-outlined text-card-border group-hover:scale-110 transition-transform">wb_sunny</span>

      <span class="material-symbols-outlined text-tertiary group-hover:scale-110 transition-transform">bedtime</span>

    <!-- Midnight -->

      <span class="material-symbols-outlined text-primary-fixed group-hover:scale-110 transition-transform">nightlight</span>
      <span class="text-label-md font-label-md font-semibold text-on-surface leading-none">00:30</span>
      <span class="text-label-sm font-label-sm text-primary-fixed">Midnight</span>

<!-- 24-Hour Time Scrubber & Stepper Adjustment -->
<div class="flex flex-col gap-2 pt-1">
  <div class="flex items-center justify-between">
    <span class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider font-mono">24-Hour Time Scrubber</span>
    <!-- Direct Stepper Controls -->
    <div class="flex items-center gap-1 bg-surface-container-lowest px-1 py-0.5 rounded">
      <button class="w-6 h-6 rounded flex items-center justify-center bg-surface-container hover:bg-surface-container-high text-on-surface text-label-sm font-mono" onclick="stepMinutes(-15)">-</button>
      <input class="w-14 bg-transparent text-center font-mono text-label-md font-label-md font-semibold text-primary outline-none focus:text-card-border" id="timeStepperInput" type="text" value="11:30">
      <button class="w-6 h-6 rounded flex items-center justify-center bg-surface-container hover:bg-surface-container-high text-on-surface text-label-sm font-mono" onclick="stepMinutes(15)">+</button>
    </div>
  </div>
  <!-- Time Scrubber Bar -->

    <input class="w-full h-2 bg-surface-container-highest/60 rounded-lg appearance-none cursor-pointer accent-card-border" id="timeScrubber" max="1439" min="0" oninput="handleSliderChange(this.value)" type="range" value="690">
    <div class="flex justify-between text-label-sm font-mono text-outline px-0.5">
      <span class="">00:00</span>
      <span class="">06:00</span>
      <span class="">12:00</span>

  </div>

<!-- Force Sync Primary Action CTA -->
<button class="px-space-lg py-2 rounded bg-primary-container hover:bg-[#3b82f6] text-white text-label-md font-label-md font-semibold tracking-wide flex items-center gap-2 shadow-lg transition-all active:scale-[0.98]" onclick="triggerRpcBroadcast(this)">
<span class="material-symbols-outlined text-lg">bolt</span>
          Force Instant Weather Sync (RPC Broadcast)
        </button>
</div>

<!-- FOOTER STATUS LINE -->

<!-- CLIENT-SIDE INTERACTIVITY SCRIPT -->
<script>
    function setTimeSpeed(btn, speed) {
      document.querySelectorAll('.speed-btn').forEach(b => {
        b.className = "speed-btn py-1.5 text-label-sm font-label-sm font-mono rounded bg-surface-container text-secondary hover:text-on-surface hover:bg-surface-container-high transition-all";
      });
      btn.className = "speed-btn py-1.5 text-label-sm font-label-sm font-mono rounded bg-primary-container text-on-primary font-semibold transition-all";
      document.getElementById('timeSpeedLabel').innerText = speed + (speed === '1x' ? ' (Realtime)' : ' Acceleration');
    }

    function setPreset(timeStr) {
      const parts = timeStr.split(':');
      const minutes = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
      document.getElementById('timeScrubber').value = minutes;
      updateTimeDisplay(minutes);
    }

    function stepMinutes(delta) {
      const slider = document.getElementById('timeScrubber');
      let val = (parseInt(slider.value, 10) + delta) % 1440;
      if (val < 0) val += 1440;
      slider.value = val;
      updateTimeDisplay(val);
    }

    function handleSliderChange(val) {
      updateTimeDisplay(parseInt(val, 10));
    }

    function updateTimeDisplay(totalMinutes) {
      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      const formatted = String(hours).padStart(2, '0') + ':' + String(mins).padStart(2, '0');
      document.getElementById('timeStepperInput').value = formatted;
      document.getElementById('digitalClock').innerText = formatted + ':42';
      document.getElementById('headerTime').innerText = formatted;
    }

    function updateVal(targetId, value, suffix) {
      document.getElementById(targetId).innerText = value + suffix;
    }

    function adjustSlider(sliderId, targetId, delta) {
      const slider = document.getElementById(sliderId);
      let val = Math.min(100, Math.max(0, parseInt(slider.value, 10) + delta));
      slider.value = val;
      document.getElementById(targetId).innerText = val + '%';
    }

    function updateRain(val) {
      const v = parseInt(val, 10);
      const text = v === 0 ? '0% (Dry)' : v + '%';
      document.getElementById('rainVal').innerText = text;
    }

    function adjustRain(delta) {
      const slider = document.getElementById('rainRange');
      let val = Math.min(100, Math.max(0, parseInt(slider.value, 10) + delta));
      slider.value = val;
      updateRain(val);
    }

    function updateLightning(val) {
      const v = parseInt(val, 10);
      const text = v === 0 ? '0% (None)' : v + '%';
      document.getElementById('lightningVal').innerText = text;
    }

    function adjustLightning(delta) {
      const slider = document.getElementById('lightningRange');
      let val = Math.min(100, Math.max(0, parseInt(slider.value, 10) + delta));
      slider.value = val;
      updateLightning(val);
    }

    function applyWeatherPreset(scenario) {
      const overcast = document.getElementById('overcastRange');
      const rain = document.getElementById('rainRange');
      const lightning = document.getElementById('lightningRange');

      if (scenario === 'clear') {
        overcast.value = 5;
        rain.value = 0;
        lightning.value = 0;
      } else if (scenario === 'scattered') {
        overcast.value = 25;
        rain.value = 0;
        lightning.value = 0;
      } else if (scenario === 'overcast') {
        overcast.value = 85;
        rain.value = 15;
        lightning.value = 0;
      } else if (scenario === 'rain') {
        overcast.value = 95;
        rain.value = 85;
        lightning.value = 60;
      } else if (scenario === 'dense_fog') {
        overcast.value = 70;
        rain.value = 10;
        lightning.value = 0;
      }
      document.getElementById('overcastVal').innerText = overcast.value + '%';
      updateRain(rain.value);
      updateLightning(lightning.value);
    }

    function triggerRpcBroadcast(btn) {
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-outlined text-lg animate-spin">sync</span> Broadcasting RPC...';
      btn.classList.add('opacity-90');
      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined text-lg text-emerald-300">check_circle</span> Broadcast Committed!';
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('opacity-90');
        }, 1500);
      }, 700);
    }

    function resetAllSliders() {
      applyWeatherPreset('scattered');
      setPreset('11:30');
      document.getElementById('fogDensityVal').innerText = '12%';
      document.getElementById('fogBaseVal').innerText = '45m';
      document.getElementById('fogCeilVal').innerText = '180m';
      document.getElementById('nightBrightnessLabel').innerText = '25%';
    }
  </script>
