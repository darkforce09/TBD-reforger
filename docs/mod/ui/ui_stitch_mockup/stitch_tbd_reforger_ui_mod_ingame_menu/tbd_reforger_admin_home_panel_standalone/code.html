<!-- Standalone Tactical Master Console -->
<div class="w-full max-w-3xl bg-surface-container-low rounded-xl shadow-2xl overflow-hidden">
<!-- Top Status Bar & Console Header -->
<div class="bg-surface-container-high px-space-md py-space-sm flex flex-wrap items-center justify-between gap-space-sm">
<div class="flex items-center gap-space-sm">

<div class="flex items-center gap-space-xs">
<span class="font-headline-sm text-headline-sm uppercase tracking-wider text-on-surface font-mono">MISSION CONTROL</span>
<span class="px-space-xs py-0.5 rounded bg-tertiary-container text-on-tertiary font-label-sm text-label-sm font-bold tracking-widest uppercase">ADMIN</span>
</div>
</div>
<!-- Real-time server telemetry pill -->
<div class="flex items-center gap-space-xs bg-surface-container-lowest px-space-sm py-1 rounded font-mono text-label-sm">
<div class="flex items-center gap-1 text-primary">

<span class="text-on-surface-variant">SERVER FPS:</span>
<span class="font-bold text-on-surface">120</span>
</div>
<span class="text-outline mx-1">•</span>
<div class="flex items-center gap-1">
<span class="text-on-surface-variant">TIME:</span>
<span class="font-bold text-tertiary" id="mission-clock">11:30</span>
</div>
</div>
</div>
<!-- Main Module Stacks -->
<div class="p-space-md flex flex-col gap-space-md">
<!-- 1. BROADCAST ANNOUNCEMENT MODULE -->
<div class="bg-surface-container rounded-lg p-space-sm flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-2xs text-secondary font-label-sm text-label-sm uppercase font-mono tracking-wider">

<span class="">BROADCAST ANNOUNCEMENT</span>
</div>

</div>
<div class="flex flex-col sm:flex-row gap-space-xs">
<div class="relative flex-1">
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline text-body-sm font-body-sm px-space-sm py-2 rounded focus:outline-none focus:ring-1 focus:ring-primary-container" id="broadcast-input" placeholder="Type administrative announcement to broadcast to all players..." type="text">
</div>
<button class="bg-secondary-container hover:bg-primary-container hover:text-on-primary-container text-on-surface font-mono font-bold px-space-md py-2 rounded text-label-sm uppercase tracking-wider transition-colors flex items-center justify-center gap-1 shrink-0" id="broadcast-btn" type="button">
<span class="material-symbols-outlined text-[16px]">send</span>
<span class="">MAKE ANNOUNCEMENT</span>
</button>
</div>
</div>
<!-- 2. MISSION PHASE & TIMERS -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-space-sm">
<!-- Left: Hold Fire / SafeStart (HFT) -->
<div class="bg-surface-container rounded-lg p-space-sm flex flex-col justify-between gap-space-xs">
<div class="flex items-center justify-between"><div class="flex items-center gap-1 font-mono text-label-sm text-tertiary uppercase font-bold tracking-wider"><span class="">SAFE START</span></div></div>
<div class="flex items-baseline justify-between py-space-2xs">
<span class="font-mono text-headline-lg font-bold text-tertiary tracking-widest" id="hft-display">01:29</span>

</div>
<!-- Adjust Buttons -->
<div class="grid grid-cols-4 gap-1">
<button class="bg-surface-container-high hover:bg-surface-variant text-on-surface font-mono text-label-sm py-1 rounded transition-colors" onclick="adjustHft(-300)" type="button">-5m</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-surface font-mono text-label-sm py-1 rounded transition-colors" onclick="adjustHft(-60)" type="button">-1m</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-surface font-mono text-label-sm py-1 rounded transition-colors" onclick="adjustHft(60)" type="button">+1m</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-surface font-mono text-label-sm py-1 rounded transition-colors" onclick="adjustHft(300)" type="button">+5m</button>
</div>
</div>
<!-- Right: Total Round Limit -->
<div class="bg-surface-container rounded-lg p-space-sm flex flex-col justify-between gap-space-xs">
<div class="flex items-center justify-between">
<div class="flex items-center gap-1 font-mono text-label-sm text-primary uppercase font-bold tracking-wider">

<span class="">MISSION TIME</span>
</div>
<!-- Admin quick view toggles -->
<div class="flex items-center gap-1">


</div>
</div>
<div class="flex items-baseline justify-between py-space-2xs">
<span class="font-mono text-headline-lg font-bold text-primary tracking-widest" id="limit-display">120:00</span>

</div>
<!-- Adjust Buttons -->
<div class="grid grid-cols-4 gap-1">
<button class="bg-surface-container-high hover:bg-surface-variant text-on-surface font-mono text-label-sm py-1 rounded transition-colors" onclick="adjustLimit(-300)" type="button">-5m</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-surface font-mono text-label-sm py-1 rounded transition-colors" onclick="adjustLimit(-60)" type="button">-1m</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-surface font-mono text-label-sm py-1 rounded transition-colors" onclick="adjustLimit(60)" type="button">+1m</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-surface font-mono text-label-sm py-1 rounded transition-colors" onclick="adjustLimit(300)" type="button">+5m</button>
</div>
</div>
</div>
<!-- 3. FACTION HEADCOUNTS & DECISIVE WIN MATRIX -->
<div class="bg-surface-container rounded-lg p-space-sm flex flex-col gap-space-sm">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-space-2xs text-secondary font-label-sm text-label-sm uppercase font-mono tracking-wider">
      
      <span class="">END MISSION</span>
    </div>
    <span class="font-mono text-label-sm text-error">IRREVERSIBLE ACTION</span>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-space-xs">
    <div class="bg-surface-container-low px-space-sm py-space-xs rounded flex items-center justify-between">
      <span class="font-mono text-label-sm font-bold text-error">Opfor</span>
      <span class="px-space-xs py-0.5 rounded bg-error-container text-on-error-container font-mono text-label-sm font-bold">0 ALIVE</span>
    </div>
    <div class="bg-surface-container-low px-space-sm py-space-xs rounded flex items-center justify-between">
      <span class="font-mono text-label-sm font-bold text-primary">Blufor</span>
      <span class="px-space-xs py-0.5 rounded bg-primary-container text-on-primary-container font-mono text-label-sm font-bold">1 ALIVE</span>
    </div>
    <div class="bg-surface-container-low px-space-sm py-space-xs rounded flex items-center justify-between">
      <span class="font-mono text-label-sm font-bold text-tertiary">Indfor</span>
      <span class="px-space-xs py-0.5 rounded bg-surface-container-highest text-tertiary font-mono text-label-sm font-bold">0 ALIVE</span>
    </div>
    <div class="bg-surface-container-low px-space-sm py-space-xs rounded flex items-center justify-between">
      <span class="font-mono text-label-sm font-bold text-secondary">Civ</span>
      <span class="px-space-xs py-0.5 rounded bg-surface-container-high text-outline font-mono text-label-sm font-bold">0 ALIVE</span>
    </div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-space-xs items-center">
    <div class="relative sm:col-span-1">
      <select class="w-full bg-surface-container-lowest text-on-surface font-mono text-body-sm px-space-sm py-2 rounded focus:outline-none focus:ring-1 focus:ring-primary-container" id="outcome-select" onchange="if(this.value) document.getElementById('rationale-input').value = this.value;">
        <option value="">Select Winning Outcome...</option>
        <option value="Opfor Victory declared by Command (0 alive)">Opfor Victory (0 alive)</option>
        <option value="Blufor Victory declared by Command (1 alive)" selected="">Blufor Victory (1 alive)</option>
        <option value="Indfor Victory declared by Command (0 alive)">Indfor Victory (0 alive)</option>
        <option value="Match ended in Draw / Stalemate">Draw / Stalemate</option>
        <option value="Administrative Mission Termination">Administrative Termination</option>
      </select>
    </div>
    <div class="relative sm:col-span-2">
      <input class="w-full bg-surface-container-lowest text-on-surface font-body-sm text-body-sm px-space-sm py-2 rounded focus:outline-none focus:ring-1 focus:ring-error" id="rationale-input" type="text" value="Objective territory secured by friendly forces">
    </div>
  </div>
  <div class="flex justify-end pt-space-2xs">
    <button class="bg-error hover:bg-on-error-container text-on-error hover:text-error-container font-mono font-bold px-space-lg py-2.5 rounded text-label-sm tracking-widest uppercase flex items-center justify-center gap-space-2xs transition-all shadow-md shrink-0" id="terminate-btn" type="button">
      <span class="material-symbols-outlined text-[18px]">gavel</span>
      <span class="">END MISSION NOW</span>
    </button>
  </div>
</div><div class="bg-surface-container rounded-lg p-space-sm flex flex-col gap-space-xs"><div class="flex items-center justify-between"><div class="flex items-center gap-space-2xs text-secondary font-label-sm text-label-sm uppercase font-mono tracking-wider"><span class="">MISSION FLOW CONTROL</span></div></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-space-xs"><button class="bg-tertiary-container hover:bg-surface-variant text-on-tertiary font-mono font-bold px-space-md py-2.5 rounded text-label-sm tracking-wider uppercase transition-colors flex items-center justify-center gap-space-2xs" type="button" id="pause-btn"><span class="material-symbols-outlined text-[18px]">pause_circle</span><span class="">PAUSE MISSION</span></button><button class="bg-primary-container hover:bg-surface-variant text-on-primary-container font-mono font-bold px-space-md py-2.5 rounded text-label-sm tracking-wider uppercase transition-colors flex items-center justify-center gap-space-2xs" type="button" id="unpause-btn"><span class="material-symbols-outlined text-[18px]">play_circle</span><span class="">UNPAUSE MISSION</span></button></div></div>
<!-- 4. TERMINATION RATIONALE & EXECUTION -->

</div>
<!-- Console Terminal Footer -->

</div>
</div>
<script>
  let hftSeconds = 89;
  let roundLimitSeconds = 7200;
  let hftActive = true;

  function formatTime(totalSecs) {
    const mins = Math.floor(Math.max(0, totalSecs) / 60);
    const secs = Math.max(0, totalSecs) % 60;
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

  function renderTimers() {
    document.getElementById('hft-display').textContent = formatTime(hftSeconds);
    document.getElementById('limit-display').textContent = formatTime(roundLimitSeconds);
  }

  window.adjustHft = function(delta) {
    hftSeconds = Math.max(0, hftSeconds + delta);
    renderTimers();
    notifyStatus(`HFT adjusted by ${delta > 0 ? '+' : ''}${delta / 60}m`);
  };

  window.adjustLimit = function(delta) {
    roundLimitSeconds = Math.max(0, roundLimitSeconds + delta);
    renderTimers();
    notifyStatus(`Round limit adjusted by ${delta > 0 ? '+' : ''}${delta / 60}m`);
  };

  window.setVictory = function(faction) {
    const rationaleInput = document.getElementById('rationale-input');
    rationaleInput.value = `Victory declared for: ${faction} by Game Master`;
    notifyStatus(`DECLARED WINNER: ${faction}`);
  };

  function notifyStatus(msg) {
    const toast = document.getElementById('status-toast');
    toast.textContent = msg;
    toast.classList.remove('text-secondary');
    toast.classList.add('text-tertiary');
    setTimeout(() => {
      toast.classList.remove('text-tertiary');
      toast.classList.add('text-secondary');
    }, 2500);
  }

  // Toggle HFT Mode
  const hftOnBtn = document.getElementById('hft-on');
  const hftOffBtn = document.getElementById('hft-off');

  hftOnBtn.addEventListener('click', () => {
    hftActive = true;
    hftOnBtn.className = "px-space-xs py-0.5 rounded bg-tertiary-container text-on-tertiary font-bold transition-all";
    hftOffBtn.className = "px-space-xs py-0.5 rounded text-outline hover:text-on-surface transition-all";
    notifyStatus("HFT STATUS: ACTIVE");
  });

  hftOffBtn.addEventListener('click', () => {
    hftActive = false;
    hftOffBtn.className = "px-space-xs py-0.5 rounded bg-secondary-container text-on-surface font-bold transition-all";
    hftOnBtn.className = "px-space-xs py-0.5 rounded text-outline hover:text-on-surface transition-all";
    notifyStatus("HFT STATUS: DISABLED");
  });

  // Broadcast Trigger
  document.getElementById('broadcast-btn').addEventListener('click', () => {
    const input = document.getElementById('broadcast-input');
    if (input.value.trim().length > 0) {
      notifyStatus(`DISPATCHED: "${input.value.trim().substring(0, 20)}..."`);
      input.value = '';
    } else {
      notifyStatus("ERROR: BROADCAST PAYLOAD EMPTY");
    }
  });

  // Terminate Button
  document.getElementById('terminate-btn').addEventListener('click', () => {
    const rationale = document.getElementById('rationale-input').value;
    if (confirm(`INITIATE IMMEDIATE MISSION TERMINATION?\nRationale: "${rationale}"`)) {
      notifyStatus("MISSION ABORTED BY COMMAND CONSOLE");
    }
  });
</script></main>

</body></html>
