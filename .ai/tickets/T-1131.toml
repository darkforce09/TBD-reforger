notes = "Paths under tools/commands/api_readiness_checks/src. fingerprint.rs:13-20 (INPUT_ROOTS: mod/, crates/, tools/, contracts/, the API readiness evidence prefix, .cargo/, .github/) and :21-26 (SOURCE_EXTENSIONS, including md, mdc, txt, csv) select the files whose bytes form the source fingerprint (:114-131); evidence.rs:46 then rejects a receipt with 'stale source fingerprint'. Every README the documentation program writes under apps/ and tools/ therefore changes the fingerprint and stales all recorded API evidence, although no Markdown is compiled into the API. Reading 1 (intended): evidence binds to the whole tree, docs included, so a reviewer re-runs after any change. Reading 2: exclude Markdown (and other non-build text) or narrow the roots to what the API build reads. The operator's plan has one --execute run at the end of the program (writing brief, 'Verification evidence' decision), which the first reading makes mandatory. Source: README writer R18.1. 2026-09-28 (milestone V): the fingerprint roots (fingerprint.rs:35-42) hold no repository-root file, so CLAUDE.md is not an input and an instruction edit never stales recorded evidence, while a README edit under apps/ does. Decide both together (operator)."
