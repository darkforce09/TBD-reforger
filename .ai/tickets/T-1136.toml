id = "T-1136"
kind = "work"
title = "Make capture zoomsweep configurable and fail on blank canvas frames"
summary = "capture zoomsweep hard-codes http://localhost:8080 and :3000 (tools/browser_testing/browser_gate_suites/src/screen_capture/eval_js.rs:345, :351) and writes every canvas PNG without the CANVAS_MIN_BYTES floor that capture_canvas applies (:180), exiting 0 when any frame is written, so black frames pass."
class = "feature"
status = "idea"
notes = "tools/browser_testing/browser_gate_suites/src/screen_capture/eval_js.rs:316-418 (zoomsweep, cargo run capture zoomsweep <out-prefix> <mission-id> <zooms>, tools/browser_testing/browser_gate_suites/src/command_lines/capture.rs:5, :113-131) logs in through http://localhost:8080/api/v1/auth/dev-login (:345) and opens http://localhost:3000/missions/<id>/edit (:351); no flag or environment variable moves either. Per zoom it writes the toDataURL PNG whatever its size (:398-407) and returns u8::from(!wrote_any) (:417), while capture_canvas (:162-195) treats a PNG under CANVAS_MIN_BYTES (tools/browser_testing/browser_gate_suites/src/screen_capture.rs:53, 20 000 bytes) as a blank frame; the doc above zoomsweep records a ~44 KB black rectangle as the known headless failure, so apply a floor sized for that case and fail the sweep on a blank frame. The lost per-zoom console-error tap is T-709 (deferred). Source: README writer R19 (R19r)."
created_at = "2026-09-25T09:01:56Z"

