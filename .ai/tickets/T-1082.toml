id = "T-1082"
kind = "work"
title = "Record end reason and winner for extraction, VIP, trigger endings"
summary = "TBD_WinConditionEvaluator.c:515-532 and TBD_TriggerRuntime.c:2017 call SetStage(END) without a pending reason or winner, so TBD_FrameworkManager.c:814-838 labels the banner admin; TBD_ObjectivesComponent.c:752-767 banners a false round-will-not-end alarm."
class = "bug"
status = "idea"
created_at = "2026-09-25T04:20:12Z"
notes = "Paths under apps/mod/tbd-framework/Scripts/Game/TBD. Win rules: Gamemode/Stages/TBD_WinConditionEvaluator.c:209 (EndRound(\"extraction\", winner)) and :217 (vip_down / vip_extracted from EvaluateVip :450, :470) reach EndRound :515-532, which logs the reason and winner and calls fm.SetStage(END) without setting TBD_FrameworkManager's m_sPendingEndReason / m_sPendingEndWinner (Gamemode/Orchestrator/TBD_FrameworkManager.c:325-326; only the manager's own paths set them, :1445 time_limit, :1529-1530 objective trigger, :1570-1571 faction_eliminated). Trigger effect end_mission: Systems/Zones/TBD_TriggerRuntime.c:2005-2017 prints the authored winner then calls SetStage(END) the same way; its header :2002-2004 says 'Nothing in this build persists a winner', but the END banner does (m_sEndWinner). SnapshotEndBanner :796-810 then runs InferEndBanner :814-838, which re-evaluates objective triggers and the survivor count and otherwise writes reason 'admin' with the survivor-derived winner, so extraction, VIP and trigger endings replicate the wrong reason and possibly the wrong winner to the END and DEBRIEF screens and OnEnterEnd :771-785. False alarm: Gamemode/Objectives/TBD_ObjectivesComponent.c:752-767 (header :740-751) banners 'OBJECTIVE END CONDITION MET but nothing acted on it ... The round will NOT end on its own' once an objective end trigger is met, but TBD_FrameworkManager.TickWinConditions calls TBD_ObjectiveRegistry.EvaluateEndTriggers at :1527 and ends the round; the objectives tick runs every 1000 ms (:55, :225) and TickWinConditions every 2000 ms (:1329), so the banner can print before the correct end. Source: README writer R14.2."

[scope]
domain = "mod"
layer = "scripts"
