--- HEAD migration_legacy (verbatim) ---

OPERATOR DECISION 2026-08-08, closing the T-694 player-cap question that has been open since wave 113. THE RULING: in the EDITOR the figure an author sees is HOW MANY SLOTS ARE PLACED DOWN — the derived count, not an author-typed cap. In the MISSION LIBRARY a mission should show how many slots there are PER SIDE and the TOTAL. CURRENT STATE, verified by the orchestrator: two numbers exist and nothing reconciles them. `max_players` (dto.rs ~:851) is AUTHOR-DECLARED — typed once into the create dialog — and is copied into the compiled mission by `compiled_meta`, so it is not dead. `MissionDocCore::slot_count` is the number of seats the document actually contains. The editor currently shows BOTH side by side and deliberately does not resolve the disagreement; the rationale lives at `eden_settings::PLAYER_COUNT_DISAGREE_NOTE`. This ruling resolves it: slot_count is the truth for the editor's player figure. This is consistent with the operator's wave-113 decision (derived slot count, no min_players). EDITOR HALF (do now): make the derived slot count the figure the author sees, and retire the disagree-note in favour of the decided answer rather than leaving a note explaining an unresolved argument. Do NOT delete `max_players` — it reaches the compiled mission. ONE SUB-QUESTION LEFT FOR THE OPERATOR, do not invent it: should `max_players` remain author-typed at all, or be DERIVED from slot_count so the compiled mission cannot disagree with the document? The ruling settles what is displayed; it does not settle what is compiled. LIBRARY HALF (design deferred by the operator): show slots per side plus the total on the mission library view. The operator explicitly said the exact presentation is to be worked out later — bring a proposal, do not guess at layout. Note the per-side breakdown does not exist as a derived value yet; check whether flatten or the doc can produce it without a new wire field before assuming a schema change.

