id = "T-1077"
kind = "work"
title = "Check hosted commands running the post-change tail on no-op edits"
summary = "editing/hosted_commands/mod.rs:7-8 says a command that changed nothing runs no tail, but commit_document_edit (document_edit.rs:14-19) and edit_composition (composition_library.rs:74-80) run it whenever a document is hosted; the frontend tail marks the mission dirty and schedules a draft save."
class = "audit"
status = "idea"
notes = "Paths under apps/website/map-engine/src/editing unless stated. Contract: hosted_commands/mod.rs:7-8 ('A command that changed nothing runs no tail') and history/drive.rs:4-6 (a step that changed nothing runs no tail). Behaviour: hosted_commands/document_edit.rs:14-19 commit_document_edit takes FnOnce(&MissionDocCore) with no result, so it runs history::after_local_edit (history/drive.rs:26-28) whenever with_doc finds a document, and composition_library.rs:74-80 edit_composition does the same for set_composition_author and delete_composition (:61-71) even when the id names no row. About 30 callers go through commit_document_edit: editor_layers.rs:20,25,98,104,110; map_comments.rs:52,57,62,81,86; orbat_roster.rs:78,93,98,190; placed_vehicles.rs:84,89,94,99; zone_authoring.rs:42,47,52,63,68; apps/website/frontend/src/v2/apps/editor/bridge/host_state/armed_placement/zone_draw.rs:168,177,218,225. The installed tail is apps/website/frontend/src/v2/apps/editor/bridge/document_host/history.rs:80 (after_local_edit) -> :271-317 after_doc_change: it rebinds every symbology lane, bumps doc_ver, sets dirty = true (:308) and schedules a draft persist (:311-316). Guarded siblings for comparison: map_markers.rs:66-76 and :83-100 return false before the tail when the row is missing. Decide whether mutators report whether they changed anything (and the tail is skipped otherwise) or whether mod.rs:7-8 should be rewritten. Source: README writer R10.3. A user-visible case (Phase 5 doc writer F05): deleting the only Outliner folder is refused inside the document (apps/website/map-engine/src/data/store/rows/layers.rs:28) but goes through commit_document_edit (editing/hosted_commands/editor_layers.rs:97-99), so the mission is marked unsaved and a draft save is scheduled for a no-op; T-1154 owns the folder fix."
created_at = "2026-09-25T03:42:47Z"

