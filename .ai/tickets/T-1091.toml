id = "T-1091"
kind = "work"
title = "Fix xtask mod texts saying tbd-export loads the framework"
summary = "tbd-export/addon.gproj:5-8 depends on vanilla and TBD_EMCP only, yet development_bootstrap.rs:4-5,72-73,130-131, compile_help.txt:46, compile/execution.rs:384 and report_compile_errors.rs:158 say it loads tbd-framework; server_profile.rs:91,114-117 and mission_test.rs:103 are stale too."
class = "docs"
status = "idea"
notes = "Paths under tools_v2/xtask/src/commands. apps/mod/tbd-export/addon.gproj:5-8 lists dependencies 58D0FB3206B6F859 (vanilla) and D4E5F6A7B8C90123 (TBD_EMCP) only; commit 4f311079f removed the framework dependency. Wrong texts: mod_ops/development_bootstrap.rs:4-5 (module doc: -gproj tbd-export 'loads tbd-framework and tbd-emcp through the dependency'), :72-73 ('tbd-export depends on tbd-framework AND tbd-emcp, so opening it loads all three'), :130-131 (launch comment); the launch itself (:132-137, steam -applaunch 1874910 -gproj tbd-export) therefore opens a Workbench session without tbd-framework, so decide which gproj dev-bootstrap opens. mod_ops/compile_help.txt:46 ('thin addons that depend on tbd-framework'); mod_ops/compile/execution.rs:384 ('tbd-export depends on both'); mod_ops/compile/report_compile_errors.rs:158 tells the operator to fix a stale apps/mod/tbd-framework/resourceDatabase.rdb by opening tbd-export in Workbench because 'it loads tbd-framework as a dependency and regenerates the rdb', which no longer happens. Registry wording: setup/server_profile.rs:91 ('Optional registry override') and mod_ops/mission_test.rs:103 ('The registry override is optional') call the copied $profile:TBD_Registry.json an override, but apps/mod/tbd-framework/Scripts/Game/TBD/Core/TBD_Registry.c:31-33 reads it only when the mod's Data/registry.json is missing. Checklist: setup/server_profile.rs:114-117 prints 'Open tbd-framework/addon.gproj', 'Load mission Missions/TBD_Dev_POC.conf' and 'Add TBD_FrameworkManager + TBD_RegistryPocComponent to GameMode entity', but apps/mod/tbd-framework/Prefabs/Systems/TBD_GameMode.et already carries the game-mode components and no prefab attaches TBD_RegistryPocComponent (T-1089); the prefab carries TBD_FrameworkManager at :4. Source: README writer R14.1."
created_at = "2026-09-25T04:26:28Z"

