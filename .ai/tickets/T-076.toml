summary = """PROMOTED AND SPLIT. T-076 absorbs six interaction ids — `RIGHT-CREW-001`, `CREW-PANEL-001`, `CREW-BOARD-001`, `CREW-UNBOARD-001`, `CREW-SEAT-001`, `ACTION-SEAT-001` — but the sweep also requires it to carry the T-216 vehicle-roster compile drop, and THAT half is cross-boundary: flatten.rs:2631 states the delta as "document root + a new $def", key `vehicles`, and :2634-2640 proves the declared `entities[]` cannot carry it ($defs/alias is ^(kit|comp|veh|preset|layer|prop|item):[a-z0-9_]+$ and the mod alias registry holds exactly one veh: row). The compile half is therefore split out as a workbench ticket and THIS ticket is the crew authoring UI only. Surfaces: `placed_vehicles_panel` (post-split eden_vehicles_panel.rs, from eden_chrome.rs:1985 wasm / :2213 native) already renders VehicleRow + VehicleCargoRow per placed vehicle — a seat list joins it. editor_ops.rs has NINE vehicle functions and no crew concept (`begin_place_vehicle` :1044, `orbat_add_vehicle` :1616, `vehicle_rows` :1751, `set_vehicle_cargo` :1811, `vehicle_points` :1833, `set_vehicle_heading` :1841, `move_vehicles` :1877, `is_vehicle_id` :1902, `remove_vehicle` :1908); board / unboard / seat-assign are new. Core side is the same (store.rs `add_vehicle` :747 ... `set_vehicle_position` :1118; note `attach_vehicle` :835 is vehicle->squad, not crew->vehicle) so a crew map is new doc state. `RIGHT-CREW-001`'s with/without-crew placement toggle sits beside the Vehicles search input in the right dock. CREW-SEAT-001 wants the context menu (T-664)."""
