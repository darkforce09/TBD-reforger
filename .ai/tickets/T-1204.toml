title = "Run route-tags, no-select-star and doc-layout in CI"
summary = "verify-coding-standards bundles route-tags, no-select-star and doc-layout for ci-local, but no GitHub workflow runs them, so the @route, SELECT-* and doc layout rules block nothing on push."
class = "chore"
status = "idea"
notes = "The task verify-coding-standards (tools_v2/xtask/src/commands/ci/task_definitions.rs:107-122) runs verify-doc-layout, file-length, no-select-star and route-tags, and 'cargo xtask ci ci-local' includes it (:48), but no GitHub workflow runs route-tags, no-select-star or doc-layout: .github/workflows/ci.yml's language-gates job runs no-python, no-node, file-length, no-shell, ci-shell and engine-layers (:243-262) and the other workflows run none of the three. The platform wave gate runs route-tags only (tools_v2/xtask/src/commands/platform/wave_execution/gate.rs:67). So the @route tag rule (law 8), the no-SELECT-* rule and the doc layout rule block nothing on push. Add the three to the language-gates job, or run 'cargo xtask ci verify-coding-standards' there and drop the duplicate file-length step. Source: doc writer F17a."
