title = "Run route-tags, no-select-star and doc-layout in CI"
summary = "verify-coding-standards bundles route-tags, no-select-star and doc-layout for ci-local, but no GitHub workflow runs them, so the @route, SELECT-* and doc layout rules block nothing on push."
class = "chore"
status = "idea"
notes = "The doc-layout part is resolved: the verify-doc-layout task is removed, and cargo xtask verify markdown-placement supersedes it (it refuses any Markdown but README.md in a code tree) and runs in ci.yml's language-gates job and in ci-local through cargo xtask ci verify-documentation. The route-tags and no-select-star gap remains: the task verify-coding-standards (tools_v2/xtask/src/commands/ci/task_definitions.rs) runs file-length, no-select-star and route-tags, and 'cargo xtask ci ci-local' includes it, but no GitHub workflow runs route-tags or no-select-star: .github/workflows/ci.yml's language-gates job runs no-python, no-node, file-length, no-shell, ci-shell, engine-layers and the three documentation gates, and the other workflows run neither. The platform wave gate runs route-tags only (tools_v2/xtask/src/commands/platform/wave_execution/gate.rs:67). So the @route tag rule (law 8) and the no-SELECT-* rule block nothing on push. Add the two to the language-gates job, or run 'cargo xtask ci verify-coding-standards' there and drop the duplicate file-length step. Source: doc writer F17a."
