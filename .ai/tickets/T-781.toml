id = "T-781"
kind = "work"
title = "Comments still cannot be composed — PLACE-COMMENT-001's last undelivered clause"
summary = "RESIDUE of T-748 (wave 141) and, before it, T-651 (wave 114). The spec row PLACE-COMMENT-001 asks for comments that are 'Draggable, copy/paste, layerable, COMPOSABLE' plus a 'Comment icon at position'. T-748 (wave 141) delivered the map glyph, so the icon clause is closed. THE COMPOSABLE CLAUSE IS NOT: compositions capture from the SELECTION, and comments sit in no selection lane, so a comment can never be part of a composition. T-748's own diagnosis called this out — 'composable was a silent drop, which is what the HARD GATE bars' — and it is scope accounting rather than broken code: nothing misbehaves, the feature simply does not exist. THE INTERESTING QUESTION IS WHERE TO PUT COMMENTS. They are deliberately absent from the compiled mission (the same property that keeps them out of the render SoA before T-748 gave them a glyph), so a composition containing a comment must carry it as authoring metadata and must NOT emit it into the compiled output. Check how `place_composition` (crates/map-engine-core/src/doc/store.rs) captures and replays, and whether the comment can ride the same rows without reaching flatten. WATCH THE Z RULE: `place_composition` creates at z = 0.0 (see T-777) and that is on the operator's reserved decision surface with T-743 — do not change paste/composition landing semantics as part of this ticket; carry whatever the operator decides. ACCEPTANCE: select a comment together with entities, make a composition, place it, and confirm the comment comes back at the right offset, survives undo/redo/restore, and does NOT appear in the compiled mission."
status = "shipped"
order = 4657
executor = "claude-code"
notes = "WIDENED 2026-08-08 by the operator's paste ruling. In addition to the composable clause, this ticket now owns the COMPOSITION Z: place_composition hard-codes `position_any(wx, wy, 0.0, rot)` in ALL THREE arms (slot, vehicle, object) in crates/map-engine-core/src/doc/store.rs. T-777 deferred it here explicitly because store.rs was a sibling's file that wave. The operator ruled (T-743/T-777) that the JS byte-parity was a migration safety net, not a contract, and that a pasted entity keeps its authored elevation — the same reasoning applies to a placed composition. Nothing re-samples terrain afterwards (terrainZ died with the React deletion), so a 0.0 written here is final. Wave-127 rules bind: reuse slot_z, read exact f64 rows and NOT the f32 SoA (which omits hidden-layer slots per T-665), and if you build a zs vector prove zs[i] matches ids[i] structurally."
owns = [
    "crates/map-engine-core/src/doc/store.rs",
    "apps/website/frontend/src/eden_dock_right.rs",
]

