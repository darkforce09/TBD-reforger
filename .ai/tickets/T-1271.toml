id = "T-1271"
kind = "work"
title = "Share one executable-stub helper across tests that run scripts"
summary = "Tests that write and run a script guard the Text file busy race three ways: platform_execution tests/slice_execution/tests.rs:55-74 (wait_until_executable), fleet_host_agent tests/test_support/fake_systemctl.rs:8-10 (a lock), and deployment staging tests/legacy_single_instance_migration/tests.rs:126-134 (no guard)."
class = "chore"
status = "idea"
notes = "A file this thread has just written can refuse to execute (ETXTBSY, 'Text file busy') while another test thread's forked child still holds its write descriptor. tools/commands/platform_execution/src/tests/slice_execution/tests.rs:49 and :55-74 (wait_until_executable, retries one harmless run) fixed the original flake; apps/fleet_host_agent/tests/test_support/fake_systemctl.rs:8-10 serialises its tests with a lock instead; tools/commands/deployment/src/staging/tests/legacy_single_instance_migration/tests.rs:126-134 writes a systemctl stub, sets mode 755 and runs it with neither guard. One helper in a dev-only test-support crate (write an executable stub and wait until it runs) serves all three. Source: restructure finding F-027 (program progress record)."
created_at = "2026-10-04T02:36:07Z"

