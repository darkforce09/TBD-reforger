acks and must not lose: `neutralizeSeconds`, `onEmpty` + `decayRate`, `pauseOnEnemy` vs `resetOnEnemy`, `requireHolderPresent`. EXECUTOR IS `workbench` DELIBERATELY: `$defs/zoneRules` is `additionalProperties: false` and its own description states why — Enfusion's `JsonLoadContext` maps JSON keys onto named class fields, so a key the class does not declare is INVISIBLE rather than rejected, which makes the schema the only place a misspelled rule key can be caught. Every new key therefore needs a field in `TBD_MissionLoader` / `TBD_ObjectiveRules.c` and a resolve branch in `TBD_ObjectiveRegistry.c` alongside the schema property. The editor half (three numeric fields and a side picker in the zone inspector) is small and follows the shape, not the other way round.""",
