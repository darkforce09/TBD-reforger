summary = """Closes `PLACE-COMMENT-001` and the three fields `ATTR-FIELD-CMT-TITLE` / `-TOOLTIP` / `-POSITION` (filed separately in the attributes sweep as a new slice; it is the same ticket, derived once here). Editor-only virtual entities that appear in the outliner, support drag/copy/layers, and NEVER COMPILE into the mission — that constraint is what keeps the ticket small AND what keeps it factory-safe (it never reaches mission.schema.json), so keep it explicit. Placed via RMB empty -> Place Comment, which is why it depends on T-664. Corpus evidence, weighted honestly: FNF v3 ships 28 in-map Comment objects including a seven-paragraph tutorial (mission.sqm:4093) and per-object instructions; FNF v4 deleted the 219-line configGuide.txt and the whole 421-file template, and what survived as onboarding is literally TWO Comment entities. Against that, WOG and OFCRA have no comment equivalent — this is one community across two eras, not a four-way convergence, and must not be presented as one. ADD ONE SCOPE LINE the draft lacks: the NEW-MISSION TEMPLATE SHOULD SEED COMMENTS, the way v4's mission.sqm seeds its two reminders — that is the half of the mechanism that survived a total rewrite and it costs nothing. Code: a new editor-only entity map in store.rs (6,574 lines; `add_slot` :526 and the markersById :355 precedent are the shapes; "never compiles" is enforced by NOT declaring a root key in `flatten_to_mod_document`, a pattern store.rs:2007-2018 already documents); mutators in editor_ops.rs (none exist for any annotation type); `NodeKind` :62 / `OutlinerNode` :75 / `build_outliner` :105 in outliner.rs for "appears in the outliner"; the place gesture in mission_editor.rs; and the menu item in context_menu.rs, T-664's new module."""
