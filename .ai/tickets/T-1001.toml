notes = "Consequence for landing (TF15, doc writer F15b): 'cargo xtask mod wave land' merges every complete slice, then runs this gate before reaping, so with the make steps always red it stopped at 'Gate FAILED after merge' and never reaped worktrees or pushed. What was wrong: the gate ran four make targets (schema-validate, enf citations, enf capability, no-crf-leak) through distrobox-host-exec, and no Makefile is tracked. Where it was fixed: the restructure's M1 commit ac4101cd3 replaced them with the cargo commands; today tools/commands/mod_operations/src/wave_execution/execution.rs:284-390 (GATE_STEPS) runs cargo xtask ci schema-validate (:336), cargo run -p developer_tools --bin enf -- capability (:341) and -- citations (:355), and cargo xtask verify no-crf-leak (:369), and the land path calls the gate at tools/commands/mod_operations/src/wave_execution/land.rs:65. tools/commands/mod_operations/src/tests/wave_execution.rs:139-150 (the_gate_names_no_make_step) pins that no step runs make. An xtask wrapper for the two enf steps is T-1273. Shipped by restructure S12 (finding F-S11-08)."
main_goal = "The mod wave gate runs only commands that exist, so a green slice can land."
