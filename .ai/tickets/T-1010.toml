notes = "Rechecked at HEAD by README writers R16, R17.1 and R17.2 (TF11 batch). Paths under tools_v2/xtask. The literal LAN address still sits in deploy/deploy.env.example:18 (TBD_SSH_HOST), :63 and :64 (commented TBD_BIND_IP and TBD_PUBLIC_ADDRESS), src/commands/deploy/staging/config.rs:237 (the TBD_BIND_IP default) and its comments :356 and src/commands/deploy/staging/render.rs:392, src/commands/deploy/website/help_text.rs:22, and three more places the summary misses: src/commands/debug/cli.rs:8 (the a2s-probe --host default), src/commands/debug/direct_join.rs:29 (PING_HOST) and src/commands/debug/probes.rs:138, plus src/commands/setup/client_addons.rs:95 ('Direct Join → <address> port 2001'). Personal home paths: deploy/deploy.env.example:2, :22-26; deploy/Caddyfile.website:9 and :32; deploy/systemd/tbd-website-backup.service:11 and tbd-website-backup-drill.service:13; src/commands/deploy/website.rs:13, :425, :441, :446-449 (the remote-dir guard); src/commands/deploy/website/help_text.rs:23; src/commands/deploy/staging/config.rs:261; src/commands/setup/staging_server.rs:11 and :37-39; and, beyond the summary, src/commands/debug/direct_join.rs:36 (the remote probe script's profile log path), src/commands/deploy/staging/boot/read_addon_guid.rs:320 (an example command) and src/commands/mod_ops/development_bootstrap.rs:282 (the fallback when HOME is unset). Test fixtures under src/commands/deploy/staging/tests/ and src/commands/deploy/tests/website/tests.rs repeat the same address and paths; decide whether fixtures switch to neutral values too."

