notes = "Rechecked at HEAD by README writers R16, R17.1 and R17.2 (TF11 batch). Paths under tools_v2/xtask. The literal LAN address still sits in deploy/deploy.env.example:18 (TBD_SSH_HOST), :63 and :64 (commented TBD_BIND_IP and TBD_PUBLIC_ADDRESS), src/commands/deploy/staging/config.rs:237 (the TBD_BIND_IP default) and its comments :356 and src/commands/deploy/staging/render.rs:392, src/commands/deploy/website/help_text.rs:22, and three more places the summary misses: src/commands/debug/cli.rs:8 (the a2s-probe --host default), src/commands/debug/direct_join.rs:29 (PING_HOST) and src/commands/debug/probes.rs:138, plus src/commands/setup/client_addons.rs:95 ('Direct Join → <address> port 2001'). Personal home paths: deploy/deploy.env.example:2, :22-26; deploy/Caddyfile.website:9 and :32; deploy/systemd/tbd-website-backup.service:11 and tbd-website-backup-drill.service:13; src/commands/deploy/website.rs:13, :425, :441, :446-449 (the remote-dir guard); src/commands/deploy/website/help_text.rs:23; src/commands/deploy/staging/config.rs:261; src/commands/setup/staging_server.rs:11 and :37-39; and, beyond the summary, src/commands/debug/direct_join.rs:36 (the remote probe script's profile log path), src/commands/deploy/staging/boot/read_addon_guid.rs:320 (an example command) and src/commands/mod_ops/development_bootstrap.rs:282 (the fallback when HOME is unset). Test fixtures under src/commands/deploy/staging/tests/ and src/commands/deploy/tests/website/tests.rs repeat the same address and paths; decide whether fixtures switch to neutral values too. More personal home paths (README writer R18.2, TF12 batch): tools_v2/xtask/src/commands/setup/mcp_game_root.rs:25 (DEFAULT_GAME, the Steam Arma Reforger install under a personal home directory) and :37 (the fallback home directory when HOME is unset). R18.2 also rechecked the src/commands/setup/client_addons.rs:95 LAN address listed above. One more literal (TF15, doc writer F15a): tools_v2/xtask/src/commands/mod_ops/playtest_server.rs:27 quotes a boot log line with the LAN address of the machine it was measured on ('Server registered with address: <address>:2001'); the same header (:31-32, :35-40) also narrates what an older runbook said, which T-1004's history-word sweep can take. 2026-09-28: delivered. The host is named only by TBD_SSH_HOST in the gitignored deploy.env (the example carries sam@dooley.local). tools_v2/xtask/src/core/deploy_environment/deploy_host_folders.rs defaults TBD_REMOTE_DIR, TBD_PROFILE_DIR, TBD_ADDONS_STAGING and TBD_SERVER_DIR under /home/<user> of TBD_SSH_HOST; deploy website guards --delete with /home/<user>/tbd; deploy staging derives publicAddress from TBD_SSH_HOST (TBD_BIND_IP is gone); debug a2s-probe, debug direct-join and setup client-addons resolve the host instead of a fixed address; mcp-game-root and dev-bootstrap default under $HOME and fall back to nothing. Test fixtures use 192.0.2.10, 198.51.100.7 and /home/deploy. The Caddyfile root is left to the Caddy compose move. Evidence: tools_v2/xtask/src/tests/tooling_prose_rules.rs no_production_tooling_file_names_a_private_network_address."
