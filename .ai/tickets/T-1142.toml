id = "T-1142"
kind = "work"
title = "Decide whether the ticketboard imports the ticket-engine logic it copies"
summary = "The ticketboard loads tickets without Corpus::load's vocabulary and id-to-file checks (corpus_loading.rs:53) and hand-copies engine logic: wave-lock types, dispatchable, scope vocabulary parsing, run and estimate records and estimate validation (without the TOKENS_PER_LOC factor rule)."
class = "audit"
status = "idea"
notes = "Ticketboard paths under apps/ticketboard/src; engine paths under tools_v2/ticket-engine/src. Load: ticket_registry/services/corpus_loading.rs:53 calls parse_ticket_toml per file, while Corpus::load (store.rs:98-111) also resolves scope legality against scope-vocab.toml and refuses an id-to-filename mismatch; encoding.rs:361-365 says every real path goes through Corpus::load or ticket check. The board also runs cargo xtask ticket check --strict as a process, so its status chip still reports these errors. Copies: wave_plan/services/lock_file.rs:13-97 (LockWave, the missing_lock_error text, collides; engine wave_lock/model.rs:15 and wave_lock collides), wave_plan/ui/lane_view.rs:50 (the missing-lock text again), wave_plan/models/wave_projection.rs:56-62 dispatchable (engine wave_lock/model.rs:84 TicketView::dispatchable), ticket_browser/services/scope_facets.rs:25-73 VocabTree::parse (engine vocab.rs:48 ScopeVocab::parse), execution_metrics/measured/models.rs:4, :18 and services.rs:54 (engine metrics/model.rs:14, :49, :72: TokensConsumed, RunRecord, validate_record), execution_metrics/estimated/models.rs:4, :18 and validation.rs:37-41 (engine metrics/estimates/model.rs:36, :55: EstimateRecord, validate_estimate), which leaves out the factor == TOKENS_PER_LOC rule on purpose. The 'Mirror of xtask X' comments name xtask, but every original lives in ticket-engine. Decide per item: import from ticket-engine (apps/ticketboard/Cargo.toml:51 already depends on it) or keep the copy with a parity test. Orchestrator decision 2026-09-25 (R21.2/R21.3/R15a questions): a code decision for a ticket. Source: README writers R21.2, R21.3 and R21.4."
created_at = "2026-09-25T10:37:08Z"

