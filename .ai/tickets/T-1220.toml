id = "T-1220"
kind = "work"
title = "Play-area vehicle axis finds the occupant by exact float XZ"
summary = "Systems/Zones/PlayArea/TBD_PlayAreaVehicleAxis.c:217-238 FindOccupantAt matches a player body by origin[0] != px / origin[2] != pz exact float equality; OccupantConfinedByZone (:170) confines on a miss."
class = "bug"
status = "idea"
notes = "Paths under apps/mod/tbd-framework/Scripts/Game/TBD. TBD_ZoneRegistry.c:204 and :229 pass only the sampled px/pz to TBD_PlayAreaVehicleAxis.OccupantConfinedByZone, which re-finds the body through FindOccupantAt (:217-238) by exact float equality on origin X and Z over every player's controlled entity. Two bodies sharing the XZ (crew of one vehicle, or any sampled position not taken from GetOrigin) resolve to the first match or to none, and a miss confines, so the vehicleClasses exemption silently fails. Pass the sampled entity (or player id) through instead of re-deriving it from a position. Reported by an earlier T-1092 slice, confirmed and filed by T-1092 slice P3-C2; not booted here."
