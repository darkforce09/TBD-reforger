summary = "AUTHORED_KEYS (map-engine editing/persist/local_versus_server.rs:42) compares only editor, loadouts, objectives, vehicles and markers, so a local draft differing only in objects, zones, triggers, comments, connections or title boots as MatchesServer and is marked clean."
