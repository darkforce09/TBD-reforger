id = "T-1005"
kind = "work"
title = "Refactor frontend so core and pages stop importing crates/frontend/workspaces/mission_creator_workspace/src"
summary = "`crates/frontend/shell/frontend_application/src/foundation` imports `apps::editor` (`crates/frontend/foundation/frontend_session/src/store.rs:259`, `crates/frontend/foundation/frontend_ui/src/search_box.rs:18`, `crates/frontend/foundation/frontend_ui/src/select.rs:15`, `crates/frontend/foundation/frontend_ui/src/slider.rs:19`) and pages reach in (`crates/frontend/workspaces/mission_creator_workspace/src/review_workspace/page.rs:17-18`, `crates/frontend/pages/mission_hub_pages/src/library/dossier_upload.rs:35`, `crates/frontend/pages/mission_hub_pages/src/library/dossier_upload_panel.rs:311`), contradicting `crates/frontend/workspaces/mission_creator_workspace/src/lib.rs:8`. Move shared pieces into core or a shared module so core never depends on apps."
class = "chore"
status = "idea"
notes = "The fix also rewrites the claims that core never imports an app (`core/mod.rs:8`, `v2/mod.rs:11`) and that no page reaches into the editor (`crates/frontend/workspaces/mission_creator_workspace/src/lib.rs:8-9`); the 'scenario creator' wording beside them (`crates/frontend/workspaces/mission_creator_workspace/src/lib.rs:1,3`, `crates/frontend/workspaces/mission_creator_workspace/src/mission_editor.rs:1`, `apps/mod.rs:4,17`, `v2/mod.rs:4-5`, `src/router.rs:107`) belongs to T-1000. The editor also claims a graphics-engine dependency it lacks: crates/frontend/workspaces/mission_creator_workspace/src/lib.rs:7-8 says the editor consumes 'the map and graphics engines', but crates/frontend/shell/frontend_application/Cargo.toml declares no graphics_engine dependency and nothing under src/ imports graphics_engine; Cargo.toml:138 calls the map-engine dev-dependency 'the graphics crate'. Paths with no successor (checked 2026-10-04, restructure S12): apps/mod.rs: removed in the restructure (commit 8ef0f0f97), no successor; core/mod.rs: removed in commit 4f67010bd, no successor; v2/mod.rs: removed in the restructure (commit 90cfa9aba), no successor."
created_at = "2026-09-24T02:04:11Z"

