summary = "verify-phase runs the density D and F gates only for P2_trees (verify_phase.rs:11, :316), so later phases never recheck density; validate-exports' E2c literal terrain-id scan reads seven module roots (artifact_integrity.rs:345-353) and none of their submodule files."
