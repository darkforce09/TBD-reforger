title = "Decide whether machine credential ids accept upper-case hex"
summary = "secret_credential_id (crates/api/api_caller_identity/src/machine_caller.rs:65-77) checks the random part for lowercase hex but parses the id part with Uuid::try_parse, which accepts upper case, unlike the contract's format (fleet_wire_contract error.rs:13-14)."
class = "audit"
status = "idea"
notes = "crates/api/api_caller_identity/src/machine_caller.rs:65-77 secret_credential_id checks the length of both parts and that the random part is lowercase hex, then parses the id part with Uuid::try_parse, which also accepts upper-case hex. The contract format is tbdm_<32 lowercase hex digits>_<64 lowercase hex digits> (crates/contracts/fleet_wire_contract/src/error.rs:13-14, machine_credential_format.rs). No test pins either behaviour. Decide whether the API refuses an upper-case id like the contract check, then pin it. Source: restructure findings F-S4-09 and F-S9-01 (S4 and S9 stage logs)."
