--- HEAD migration_legacy (verbatim) ---

Four NITs from the wave-119 verifier, grouped because each is a few lines and three are the same class — a guard that reads stronger than it asserts. Every underlying behaviour was independently verified correct; these are gaps in the guarantees. (1) eden_help.rs:953-961: `every_shared_channel_claimant_reads_live_state` is a per-listener SUBSTRING check, so an unrelated `get_untracked()` anywhere in the closure satisfies it. All ten current claimants genuinely gate their Escape path (the verifier read each), so this is latent — but the exemption it guards is the one that keeps a nine-claimant Escape channel legal, which is the last place a weak guard should sit. (2) eden_help.rs:1084-1094: `there_is_exactly_one_extractor` scans only the six declared surface files plus eden_help, so a fifth copy elsewhere in the crate would pass. A repo-wide grep confirms none exists today (sole definition at eden_help.rs:829), and this is the pin enforcing T-738's banked instruction, so it should scan the crate. (3) eden_help.rs:684-686: a keydown closure that reads NEITHER `ev.key()` NOR `ev.code()`, or whose event parameter is not named `ev`, is silently DROPPED from discovery rather than flagged. Partially mitigated by the declared per-file counts and the empty-bindings check, but 'silently dropped' is the shape the whole census exists to eliminate. (4) eden_dock_left.rs:1527-1537 and :547-550 (T-697): a plain hit that matched on FACTION reports `field` as the entity's first text attribute, so the row title claims `matched name "..."` when the faction is what matched. Cosmetic and never wrong about WHICH entity matched, only about why. Diagnosis: editor_verify/wave119.md NIT-1..4.

