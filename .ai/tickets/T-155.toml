kind = "work"
title = "Cross-tab refresh-token mutex (single-use rotation double-spend)"
summary = "Found 2026-07-13 via api access log during the T-154.1 pause: two editor tabs share the single-use refresh token; tab A rotates it, tab B later POSTs the stale one -> /auth/refresh 401 -> the whole browser session dies (log: 12:13 local, registry+compat 401 -> refresh 401 -> all subsequent 401). The single-flight helper (apps/website/frontend/src/api/refresh.ts) serializes refreshes WITHIN a tab only. Fix: cross-tab mutex around refresh (Web Locks API, BroadcastChannel fallback) + adopt the rotated pair from the winning tab (storage event), so N tabs spend one rotation. Repro: open the editor in two tabs, wait out the access TTL, act in the stale tab."
status = "shipped"
order = 3712
