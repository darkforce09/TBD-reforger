migration_legacy = ["FOUND by T-218's #[serde(default)] sweep, same shape as T-185 and T-218 on a different table. handlers/missions.rs:683 — SetArmoryInput.items carries #[serde(default)], and the handler runs an UNCONDITIONAL `DELETE FROM mission_armories WHERE mission_id = $1` before inserting. A request body of `{}` (or a malformed one, if the extractor is also lenient) therefore deletes every armory row for the mission and inserts nothing — silent, total, unrecoverable data loss on a 200 OK. Highest severity of the 10 instances the sweep turned up. Fix: make `items` required (drop the default) so `{}` is a decode error, and reject with 400 rather than defaulting. Verify by seeding rows, POSTing `{}`, and asserting the rows survive."]
