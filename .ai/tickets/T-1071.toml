id = "T-1071"
kind = "work"
title = "Decide whether ignored map engine inputs are intended"
summary = "crates/terrain/terrain_relief/src/hillshade.rs:39 measures slope in samples, not metres; satellite_quadtree/retry.rs:44-48 logs a 429 Retry-After but waits fixed backoff; building_interiors/src/blueprint/archive.rs:112,155 drop door state and furniture size; location_labels/loader.rs:123-124 ignore archived height labels; crates/terrain/terrain_elevation/src/png.rs:49-55 accepts RGB against NotGray16 (:36)."
class = "audit"
status = "idea"
notes = "Hillshade: crates/terrain/terrain_relief/src/hillshade.rs:35-39 (cell_meters = src_w / w is the downsample factor in source samples; the DEM's metres per sample never enters, so slopes shade steeper or flatter than the terrain whenever a sample is not 1 m). Satellite retry: crates/streaming/map_asset_loading/src/terrain/satellite_quadtree/retry.rs:44-48 (RateLimited logs retry_after_s) and :61 (waits RANGE_BACKOFF_MS, :16, 100/250/600/1200 ms, regardless). Archived blueprints: crates/world_objects/building_interiors/src/blueprint/archive.rs:112 (default_state empty) and :155 (size2_d zero) because the archive rows lack them (crates/world_formats/world_file_formats/src/archives/blueprints.rs:108-129 DoorRec, :192-216 FurnitureRec), so crates/world_objects/building_interiors/src/blueprint/level_annotations.rs:69 (open doors) and :85-90 (furniture) never fire on an archived blueprint; BuildingBlueprint::from_archived (archive.rs:26) has no production caller today. Labels: crates/streaming/map_asset_loading/src/environment/location_labels/loader.rs:113-127 (init_from_archive) keeps towns and road names from map_labels.rkyv (:123-124) but not its height_labels field (MapLabels, crates/world_objects/place_names/src/towns.rs:170-178, the field at :174-175), and recomputes peaks from the DEM at :96-109. DEM PNG: crates/terrain/terrain_elevation/src/png.rs:49-55 accepts 16-bit RGB and RGBA and reads channel 0, while NotGray16 (:36) and its Display (:35, 'PNG is not 16-bit grayscale') say grayscale only. For each: keep with a comment stating why, or change the code."
created_at = "2026-09-24T19:16:09Z"

