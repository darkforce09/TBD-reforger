notes = "What was wrong: the mod wave gate's 'enf unit tests' step ran cargo test -q -p developer_tools --lib enf:: through distrobox-host-exec; a libtest filter is a substring of the test path and no developer_tools module path contained enf::, so the step ran zero tests and always reported green. Where it was fixed: the restructure's S11a commit ffb5fe74d moved the Enfusion script index into its own crate and the step now runs the whole library suite with no filter: tools/commands/mod_operations/src/wave_execution/execution.rs:378-389 runs cargo test -q -p enfusion_script_index --lib (38 tests), and tools/commands/mod_operations/src/wave_execution/README.md:42 documents it. The platform preflight's stale 'make clean-targets first' hint this ticket also named is split into T-1279. Shipped by restructure S12 (finding F-S11-08)."
