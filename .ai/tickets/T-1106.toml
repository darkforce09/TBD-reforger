id = "T-1106"
kind = "work"
title = "Fix mod wave gate enf test filter matching no tests"
summary = "mod wave gate runs cargo test -p developer-tools --lib enf:: (wave_execution/execution.rs:375-385), but no developer-tools module path contains enf:: (the module is enfusion_tooling), so the step passes with zero tests."
class = "bug"
status = "idea"
created_at = "2026-09-25T08:15:40Z"
notes = "Paths under tools_v2. xtask/src/commands/mod_ops/wave_execution/execution.rs:374-385 runs 'cargo test -q -p developer-tools --lib enf::' through distrobox-host-exec as the gate's 'enf unit tests' step. A libtest filter is a substring of the test path, and developer-tools/src/lib.rs:5-15 declares no module whose path contains 'enf::' (the Enfusion modules are enfusion_pak and enfusion_tooling; git grep finds no 'mod ...enf' in developer-tools/src), so the step runs zero tests and always reports green. Point the filter at the intended modules (enfusion_tooling::, enfusion_pak::) and fail the step when it runs zero tests. Same family, platform lane: xtask/src/commands/platform/preflight/execution.rs:42 tells the operator 'make clean-targets first' when disk is tight, but no Makefile is tracked and no clean-targets recipe exists (cargo xtask mk lists reclaim-target-ci); name an existing command. The gate's four make steps are T-1001. Source: README writer R16."

