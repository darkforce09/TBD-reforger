title = "Classname / mod prefix search in the asset browser"
summary = 'PROMOTED — the cheapest ratio in the interactions sweep: four ids against one function. `RIGHT-SEARCH-002/003/004/005` are all pattern parsing in front of `pub fn filter_catalog(nodes, query)` at `apps/website/frontend/src/asset_catalog.rs`:396, read in full (:390-414): it lowercases the query and does a LABEL SUBSTRING match with a self-match/descendant-match rule, and there is NO PREFIX PARSING OF ANY KIND. Add the grammar in front of it. The three call sites are all inside DockRight (post-split eden_dock_right.rs): :3163 Objects, :3218 Factions, :3306 Vehicles; the two `type="search"` inputs are :3112 (shared Factions/Objects, signals `search` :2990 / `object_search` :3012) and :3253 (`vehicle_search` :3009) — placeholder and hint copy change there. COORDINATE WITH T-646, which lands earlier and also touches filter_catalog for `class:` search and the submode chips: T-646 owns the submode/crew work, this row owns the prefix/pattern grammar, and whichever runs second builds on the other. `Ctrl+F`-focuses-search was considered for this ticket and deliberately routed elsewhere — folding it in here would have cost a full wave (see T-662).'
