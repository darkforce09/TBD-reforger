notes = "Paths under tools/xtask/src. The shared implementation is tools/foundation/process_runner/src/host_execution.rs (in_container :123-126, two clauses, and the Host bridge type), whose doc (:115-122) says widening the rule is a behaviour change needing its own ticket. Copies: tools/commands/mod_operations/src/compile_host.rs:13-50 (in_container with a third 'container' env clause, host_bridge trying distrobox-host-exec then host-spawn, require_host, hostrun); tools/commands/mod_operations/src/world_boot/boot_environment.rs:27-60 (two-clause in_container, the same host_bridge, require_host, host_command); tools/commands/platform_execution/src/preflight/ok.rs:17-50 (three-clause in_container, distrobox-host-exec only, use_host_bridge, hostrun). tools/commands/platform_execution/src/wave_execution/host.rs:79-84 already wraps the core function and adds the env clause. So the lanes disagree about what a container is and which bridges count. Decide the one rule, move it into process_runner::host_execution, and call it from all four. Test placement: tools/commands/platform_execution/src/slice_worktree.rs:72-73 declares mod tests from tools/commands/platform_execution/src/slice_worktree/tests.rs (369 lines), not from a tests/ folder as CLAUDE.md law 7 requires; move it to commands/platform/slice_worktree/tests/ (or commands/platform/tests/slice_worktree/, like its siblings) and fix its header (:3-5), which narrates the split. Source: README writer R16."
