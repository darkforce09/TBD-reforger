summary = "MAJOR (scope gap) from the wave-116 verifier. T-069 ships marker AUTHORING — place, list, retype, recaption, reposition, delete — and all four ATTR-FIELD-MRK-* rows close honestly. But a placed marker renders NOTHING: there is no marker lane in map-engine-render, and `mission_history.rs:364 after_doc_change` rebinds slots, squad links and vehicles only. RIGHT-MODE-006 is titled 'markers on the map'. THE SLICE'S REFUSAL TO ADD THE LANE WAS CORRECT AND SHOULD NOT BE SECOND-GUESSED: the sole rebind tail after undo/redo/restore is `after_doc_change`, which was outside its owns, and a lane fed only from owned call sites would show a marker the document no longer has — worse than no lane. It also verified the SoA route fails, because `slots_bind_soa` is the PICK BRIDGE (markers riding it would be hit-testable as slots, draggable in a marquee, counted against the 500-slot cluster threshold, and listed as slots in the outliner). NOTE THE ASYMMETRY THIS TICKET EXISTS TO CORRECT: wave 114's T-651 shipped editor comments with the identical no-glyph property and that gap got T-748 filed against it; markers had no equivalent, so the gap lived only in a verifier report. RECIPE, left by the T-069 agent so it is one sitting: add `LaneRole::MissionMarkers` between MissionZones and SquadLinks (above zone rings, below squad links and slots, so a marker never occludes a unit); add `markers_bind(&[f32], &[u8])` beside `vehicles_bind` reusing `upload_slot_role_lane` + `pack_icon_instance` (no new pipeline, no new atlas); add it to `clear_slot_lanes`; and ONE line each in `after_doc_change` and `rebind_engine_from_doc`. SCHEDULE WITH OR AFTER T-672 (wave 117) to share the draw_order.rs edit. Diagnosis: editor_verify/wave116.md finding 2."
