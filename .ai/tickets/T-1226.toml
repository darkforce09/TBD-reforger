notes = "Paths under mod/tbd-framework/Scripts/Game/TBD/Session. MissionSelector/SCR_PlayerController.c TBD_RpcAsk_MissionList (:125-138) and TBD_RpcAsk_SelectMission (:166-180) gate on SCR_PlayerListedAdminManagerComponent.IsPlayerOnAdminList directly (no playerId <= 0 guard) and refuse with a plain Print WARNING, so neither the refusal nor an accepted deployment request lands in the admin audit ring (Admin/TBD_AdminAudit.c Record / RecordUnauthorised) that '#tbd audit' reads, and they skip TBD_AdminService's per-(player, surface) refusal throttling. Route both through TBD_AdminService.IsAdmin (Admin/TBD_AdminService.c:29) and the audit trail like the other admin surfaces. Reported by an earlier T-1092 slice, confirmed and filed by T-1092 slice P3-C2; not booted here."
