migration_legacy = ["MINOR from the wave-127 focused re-verifier. THIS IS THE ONE WAVE-127 FINDING THAT WAS NOT FIXED, AND IT IS DELIBERATE: it sits on T-743's reserved decision surface. Wave 127 closed a four-instance family where an x/y write with z=None made `update_slot_position` store `pz = 0.0` (store.rs:2779-2783) with nothing re-sampling terrain afterwards — fixed at `attrs_update_position`/`_multi` (F-2), `commit_positions` (F-5, reached by Align/Distribute/place-pattern) and the marquee drag (F-6). The re-verifier then proved that family CLOSED (zero `move_entities` frontend callers; exactly one `move_entities_and_vehicles`; five `update_slot_position` sites, three z-resolved and two rotation-only which cannot trip the mutator's `x.is_some() || y.is_some()` arm). WHAT REMAINS IS A DIFFERENT CLASS — a CREATE path, not a missed caller: `editor_ops.rs:642` (`paste_at_cursor`) pushes `zs.push(0.0)` for every pasted slot and explicitly drops `position.z` from the copied extras, and `place_composition` (store.rs:2394/2409) does the same, symmetric for vehicles. Ctrl+V a rooftop entity and the copy lands on the deck. NO AUTHORED WORK IS DESTROYED — there is no cut, the source is untouched, so this is a wrong-landing-position defect rather than the silent corruption the rest of the wave fixed. WHY IT WAS NOT FIXED AUTONOMOUSLY: the `zs.push(0.0)` carries the in-code rationale 'DEM not ready — byte-parity with the flat-map case', which is the SAME byte-parity-with-the-JS-oracle argument that makes T-743 (`PASTE_NUDGE` = 20 m, store.rs:4998-4999) an operator decision rather than a slice-sized fix. Both are 'where does a pasted entity land', both are pinned to the JS oracle, and changing z unilaterally could pre-empt whichever of T-743's three paths the operator picks. DECIDE THE TWO TOGETHER. The z axis is arguably independent of the x/y nudge — preserving the source z is compatible with all three T-743 paths — but that is the operator's call to make, not the factory's. Diagnosis: editor_verify/wave127.md, focused re-verification section."]
