workbench program (program 2) - NOT factory-dispatchable; no owns, no wave row. Ranked 16 of 16 by framework_synthesis.md C.5; filed as `idea` deliberately. Filed 2026-08-01 by the framework_synthesis coverage audit (parity/coverage_audit.md)

--- HEAD migration_legacy (verbatim) ---

STATUS 2026-08-02: promoted idea->queued during the final verification pass — same inconsistency as T-654. Was idea because the synthesis rated B9 "weakest evidence in the set"; FNF-DTAS nonetheless proved parameter-schema drift bites (2 of 17 lobby params shipped broken), and the fail-on-demand validation pattern covers the risk.

The B9 item from framework_synthesis.md C.3, and C.5 RANKS IT LAST OF 16 — "Low for this genre", "Weakest evidence in the set", "may be a not now". FILED AS `idea` SO THE RESEARCH IS NOT LOST, NOT AS WORK QUEUED. The idea (fnf_tooling.md 2.5 #2, 3.4): a mission carries named parameters — name, i18n-key title, value list, display list, default, consuming symbol — chosen at LAUNCH rather than baked at authoring time. Evidence FOR: OFCRA runs one artefact as training server, briefing room, mod-check sandbox and match off 29 `class Params` entries of which 25 are real knobs in four lobby bands (ofcra_omtk.md 10.1), and DTAS ships 17 active params (fnf_tooling.md 2.4). Evidence AGAINST, and it is why this ranks 16th: that is TWO ARTEFACTS FROM ONE COMMUNITY (OFCRA authored `omtk`; DTAS is 2013 third-party code FNF adopted), while FNF v4 is down to exactly ONE parameter (`PerformanceTweaks`), FNF v3 has 4 chosen by the admin not the maker, and WOG's `class Params` is one of only three surviving uses of `description.ext`. TBD's genre is FNF/WOG's one-shot round, not OFCRA's multi-mode artefact (framework_synthesis.md A.10). The half worth keeping in view is "one artefact, many run modes, selected at launch" for a training/rehearsal mode later. NOTE WHERE THE PARAMETER EVIDENCE ACTUALLY POINTS — it is self-defeating for this ticket and useful for another: two of DTAS's shipped bugs live in the parameter arrays. `description.ext:235` is missing a comma between `14` and `15`, so `values[]` has 25 entries against `texts[]`'s 26 and the displayed capture radius stops matching the applied one from that index on; `AFKKillTime`'s 5th label reads "60" where the value is 70 (`description.ext:171-172`); and 29 call sites read `phx_loadout_*` params that `class params` never declares, so long-range radios and nav gear silently resolve to absent (fnf_tooling.md 2.4, :708-727). Those argue for THE EDITOR OWNING VALUE/LABEL PAIRING WHEREVER A VALUE LIST EXISTS — a rule for T-656's engine — rather than for a parameters feature. EXECUTOR IS `workbench`: parameters would be a document-shape change against a schema carrying 25 `additionalProperties: false` plus a mod-side reader that selects at launch. Same shape and same reason as T-654.

EXECUTOR CORRECTED 2026-08-02: was filed `workbench` on the mistaken reading that any .c file needs the Arma Workbench GUI. It does not — scripts/mod/compile.sh compiles tbd-framework against the native Linux dedicated server headlessly, verified: "OK: compiled clean, 5707 files, 11182 classes, 832 ms, no Workbench". Schema edits are plain JSON. This is factory work. Per the model-routing rule, the .c portion routes to Fable 5 even though the executor is claude-code.

SCHEMA HALF SPLIT OUT to T-706 (one widening pass for the whole program). This ticket is the Enfusion reader plus any editor UI; it does not touch packages/tbd-schema.

missing=0
