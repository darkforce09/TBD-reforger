id = "T-1221"
kind = "work"
title = "Mission validator warns that the applied environment block is unconsumed"
summary = "Systems/Mission/Loaders/Validation/TBD_MissionUnconsumedKeyCheck.c:38-43 warns on any authored environment block, though TBD_EnvironmentReader.Apply (Ingestion/TBD_EnvironmentReader.c:38) applies fog, wind, wind direction and view distance."
class = "bug"
status = "idea"
notes = "Paths under apps/mod/tbd-framework/Scripts/Game/TBD. TBD_MissionUnconsumedKeyCheck.CheckUnconsumedKeys (:38-43) warns 'TBD_MissionDocumentStruct does not model it -- weather and time of day are not applied at load' whenever the environment key is present, but TBD_MissionDocumentStruct.environment (Systems/Mission/Data/Document/TBD_MissionDocumentStruct.c:52) binds it and TBD_MissionLoader.c:319 calls TBD_EnvironmentReader.Apply, which applies fog, wind, windDirDeg and viewDistance; only dateTime and weatherPreset are bound but not applied. The warning should name only the unapplied axes (and the header invariant at :12 and the schema-validate UNCONSUMED-WARN marker follow). Related: T-1189 (world-boot goldens fail the warning ratchet partly on this warning). Reported by an earlier T-1092 slice, confirmed and filed by T-1092 slice P3-C2; not booted here."
