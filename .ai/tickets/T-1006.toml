id = "T-1006"
kind = "work"
title = "Fix staging deploy compose step that never starts the API"
summary = "`cargo xtask deploy staging` prints `(API + Postgres)` at `tools_v2/xtask/src/commands/deploy/staging/remote/ssh_argv.rs:214`, but its compose command (:217 dry-run, :223) lacks `--profile api`; the `api` service is profile-gated (`apps/website/docker-compose.staging.yml:44`), so only Postgres starts."
class = "bug"
status = "idea"
notes = """Rechecked at HEAD by README writer R17.2 (TF11 batch): the compose step still lacks --profile api; at HEAD the lines are tools_v2/xtask/src/commands/deploy/staging/remote/ssh_argv.rs:213 (the '(API + Postgres)' banner), :216 (dry-run) and :222 (the real command); the working tree reads one line later because of another session's uncommitted rsync exclude in the same file. apps/website/docker-compose.staging.yml:43-44 still gates api behind profiles ["api"]. The fix is in xtask code, so the scope's layer (docs) does not match; that is a correction for the operator. Second gap in the same step (TF15, doc writer F14a): the staging compose command (tools_v2/xtask/src/commands/deploy/staging/remote/ssh_argv.rs:216-223) exports no TBD_POSTGRES_HOST_PORT, while 'deploy website' exports it from deploy.env before its compose (tools_v2/xtask/src/commands/deploy/website/remote_steps.rs:29-35, website.rs:89-93), so on a host where 5432 is taken the staging Postgres fails to bind (apps/website/docker-compose.staging.yml:29 defaults to 5432). Pass the deploy.env value in the same fix."""
created_at = "2026-09-24T02:04:26Z"

[scope]
domain = "repo"
layer = "docs"
