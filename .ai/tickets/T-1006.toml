    "cargo xtask verify staging-compose-paths pins the compose lines of tools_v2/xtask/src/commands/deploy/website/remote_steps.rs and bans compose in the staging pipeline; the staging rsync excludes apps/website/frontend/dist/.",
]
approach = [
