migration_legacy = ["Four NITs from the wave-114 verifier, grouped because each is a few lines. (1) ui.rs Select: a disabled select dims but its sibling chevron does not (no `peer-disabled` variant), so a disabled control is half-lit. No caller passes `disabled` yet, so it is latent. (2) eden_dock_right.rs:745-751: T-695 deliberately kept `arm_favourite_place` textually distinct from `palette_rows` so T-215's source-inspection needle (`editor_ops::begin_place_vehicle(payload.clone())`) keeps constraining the palette path specifically — a genuinely good call — but that distinctness is enforced only by the favourites arm MOVING its payload rather than cloning. Nothing PINS it clone-free, so a future tidy-up could silently let the favourites path satisfy the palette's pin. Pin the distinctness. (3) store.rs:11639-11641: the comment undo test asserts the ROW is restored after a delete, but not that the LAYER FILING is restored. Same transaction and same undo scope make it near-certain, and the verifier confirmed the behaviour, but the assertion does not cover it. (4) compile.rs:37-38: the header says to keep the twin editor-payload key lists 'in lockstep', which is now actively misleading — `zones`, `compositions`, `triggers` and now `comments` diverge DELIBERATELY and permanently. The reason is documented on the store.rs side only; the compile.rs header should say the lists are intentionally different and point at that note, or someone will 'fix' the divergence and either drop every comment on save or compile annotations into missions. Diagnosis: editor_verify/wave114.md NIT-1..4."]
