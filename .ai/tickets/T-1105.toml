title = "Fix milestone announcement body date disagreeing with its title"
summary = "db/milestone_announcement.rs:42 titles the seeded announcement 'Saturday 22 August 2026', but the body at :43 says 'Saturday 21 August 2026'; 21 August 2026 is a Friday."
class = "bug"
