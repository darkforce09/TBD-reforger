id = "T-1223"
kind = "work"
title = "Lobby faction panel misplaces pooled rows, trusts a null catalog"
summary = "Session/Lobby/UI/TBD_LobbyFactionPanel.c:189-201 AcquireRow returns a pooled row whatever its container (Content vs SpectatorDock); GetFirstKey (:132-139) dereferences m_Catalog, which Build (:32) accepts as null."
class = "bug"
status = "idea"
notes = "Paths under apps/mod/tbd-framework/Scripts/Game/TBD/Session/Lobby/UI. (1) TBD_LobbyFactionPanel.Refresh (:76-106) picks m_wContent or m_wSpectatorDock per faction, but AcquireRow (:189-201) only uses the container when it creates a row; an existing pooled row at that index is returned in whichever container first created it, so a catalog whose faction order or spectator entry changes between refreshes draws a spectator row among the factions (or the reverse). (2) GetFirstKey (:132-139) calls m_Catalog.GetFactions() with no null check, while Build documents a null catalog as legal; TBD_LobbyScreen.c:65 calls it on open. Reported by an earlier T-1092 slice, confirmed and filed by T-1092 slice P3-C2; not booted here."
created_at = "2026-09-26T15:53:47Z"

