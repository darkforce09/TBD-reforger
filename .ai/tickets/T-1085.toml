id = "T-1085"
kind = "work"
title = "Feed the pre-game screens live catalogs instead of mocks"
summary = "No script calls TBD_LobbyCatalog.Set (TBD_LobbyCatalog.c:259), TBD_MissionCatalog.Set, TBD_BriefingCatalog.Set or TBD_PlayersCatalog.Set, so each Get() builds its UI/Mock catalog; nothing calls TBD_LobbyClient.Request/Claim/Release/Deploy (TBD_LobbyClient.c:146-189)."
class = "feature"
status = "idea"
notes = "Paths under apps/mod/tbd-framework/Scripts/Game/TBD. Catalog setters with no caller anywhere in apps/mod: Session/Lobby/TBD_LobbyCatalog.c:259 (Get :249-255 falls back to TBD_LobbyMock.Build()), Session/MissionSelector/TBD_MissionSelectorData.c:256 (TBD_MissionCatalog.Set; Get :245), Session/Briefing/TBD_BriefingCatalog.c:320 (Get :310), Session/Players/TBD_PlayersCatalog.c:55 (Get :47); the mocks are UI/Mock/TBD_LobbyMock.c, TBD_MissionSelectorMock.c, TBD_BriefingMock.c and TBD_PlayersMock.c, so the Lobby, Mission Selector, Briefing and Players screens always render mock data. TBD_MissionSelectorData.c:7 describes a TBD_MissionSelectorClient that would hand TBD_MissionCatalog.Set() a real catalog; no such class exists. Session/Lobby/TBD_LobbyClient.c:146 Request, :157 Claim, :172 Release and :189 Deploy have no caller; the server replies reach TBD_LobbyClient.Accept from Session/Lobby/TBD_LobbyController.c:42,58,78,120,159, and the roster panel claims against the mock (Session/Lobby/UI/TBD_LobbyRosterPanel.c:608 m_Catalog.Release()). Related: T-946.58 (kit preview empty on a dedicated server because clients hold no mission document). Orchestrator decision 2026-09-25 (R13 question): a limitation, not a known bug. Source: README writers R13 and R14.2. Blocks two end-to-end tickets (TF15, doc writer F15a): T-181.16 (two-client dedicated-server event loop, queued) and T-068.14 (Phase 2 editor-to-player gate, queued) need a player to claim a slot and deploy from real lobby and briefing data, which cannot happen while the screens render mocks and no UI claim reaches ClaimSlot (documentation_v2/runbooks/two_client_playtest/). Record this ticket as their dependency when either is planned."
created_at = "2026-09-25T04:22:36Z"

