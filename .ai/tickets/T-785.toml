UX-REVIEW BATCH (source: .ai/artifacts/editor_hostile_ux_review.md, commit 5d30c651; operator pass 2026-08-09). F-01/F-02/F-26-root — THE BATCH UNBLOCKER. REPRODUCED TWICE: click Attributes>Identity ROLE, type 'AT Rifleman' -> field holds 'A', activeElement=BODY, and the tail keystrokes ran as chords (R collapsed the right dock, 'e' the left, Space jumped the camera, G flipped snap). ALL FOUR Identity text fields affected (probe typed 'qqq' -> q/Aq/q/q, tagged DOM node GONE after keystroke 1 = element remounts). Layer rename worse: field NEVER receives focus — with it open, 'g' flipped 'GRID off'->'GRID move' (eden_dock_left.rs rename input). MECHANISM: attributes.rs ~:746 text_field commits on:input -> store round-trip -> Leptos re-creates the input each keystroke. THE SAFE PATTERN IS ALREADY IN THE SAME FILE: ~:609 number_field keeps a focused/draft/exact split and commits on blur/Enter — typing '135' into ROTATION survives with focus retained (verified). FIX: (a) text_field adopts the number_field focused/draft pattern (commit on blur/Enter/debounce, never remount mid-focus); (b) layer-rename input focuses+selects on mount; (c) harden mission_history.rs ~:545 in_editable_field to check document.activeElement tag/contenteditable directly so lost focus can never convert typing into chords. ⚠️ TRAPS: number_field must NOT regress (it is correct today); marker caption, mission title, mission search, ORBAT inspector and composition-name fields are all HEALTHY today (probed) — do not 'unify' them onto a new widget; multi-edit 'Multiple values' locked-state must stay locked until apply-to-all ticked. ACCEPTANCE: scripted probe (CDP or wasm test): for each of ROLE / ROLE DESCRIPTION / TAG / Asset id / layer rename — click, type an 11-char string with spaces -> value === typed string, activeElement === the input, dock states and GRID readout unchanged; plus regression: ROTATION digit entry still works.

