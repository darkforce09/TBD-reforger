notes = "Truth-in-comments + audit-ring hardening. 8 of 11 items FIXED, 2 reported (out of lane), 1 verified as already-handled. HIGHEST-LEVERAGE: the GetInstance() asymmetry, and the agent produced evidence rather than confidence — not 32 call sites in 16 files as filed but 40 in 19 (11 framework, 29 spawn), enumerated with enclosing functions, and ZERO are constructors or OnPostInit (earliest is TickLoading, itself a CallLater from OnPostInit). Runtime proof is PrintComponentRollCall, which runs strictly earlier, already resolves these classes via FindComponent, and is asserted by world-boot. Both statics DELETED, not left unread. EnsureConnectEpoch fixed: it minted a non-zero epoch for any id so IsSameConnection answered TRUE for a departed player — the exact opposite of the invariant stated three lines above it; now mints only when a controller exists, which is fail-closed at all 6 call sites and closes the leak. Duplicate-audit swallow fixed with m_mAuditedKey having exactly one writer. HasHost was KEPT — the finding was half right (TBD_SpawnManager never calls it, but Reconcile does), so the comment was corrected instead of deleting live code. Also found the TBD_SpectatorHost damage-manager refusal tests DamageManagerComponent while safestart only touches SCR_CharacterDamageManagerComponent, so the safestart framing never matched the guard at all. BONUS, from the full notes rather than the summary: NoteDeniedAccess de-duped per (player,surface), which bounds one client but not the population — ~6 surfaces x ~10 clients evicts the whole 60-entry ring, and s_mDeniedSeen's comment claimed an entry meant 'already took a ring slot', which stopped being true once the ring rolled it off, so refusals silently stopped reaching the trail on long-running servers. Now a hard 12-entry budget leaving 48 guaranteed for real actions. VERIFIED RATHER THAN ASSUMED on the coordinator's SelfCheckWire request: added the line, compiled, got 'Undefined function' cascading 12 errors because T-181.26 was unmerged at the time, reverted, and reported it as a dependency-ordering problem."
