notes = "Paths under apps/api (line numbers at HEAD; .env.example and configuration/mod.rs carry uncommitted edits in the working tree). .env.example:121-124 says a blank DISCORD_GUILD_ID emits tracing::error! and writes an auth.role_sync_skipped WARN audit row; git grep finds no writer of that action, and crates/api/api_identity_and_access/src/handlers/discord_oauth.rs:173-180 only returns RoleSnapshot::Unavailable. crates/api/api_server_infrastructure/src/handlers/server_registry.rs:136-139 calls the modpack race unreachable because '/modpacks and /modpacks/current are registered GET only', but crates/api/api_community_content/src/routes.rs:40-57 registers POST /modpacks, PUT and DELETE /modpacks/{id} and POST /modpacks/{id}/set-current, so the dangling-pointer race it describes is reachable. crates/api/api_configuration/src/configuration/mod.rs:298-299 (the test Config literal) ends with an RCON comment and no field after it; delete it or restore the field it described. Source: Phase 5 doc writers F03 and F09a."
