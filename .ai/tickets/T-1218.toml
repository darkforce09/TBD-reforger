title = "Rename equipment export legacy_archive module to superseded-generation archive"
summary = "The equipment vehicle export's legacy_archive.rs, its legacy/ folder, .legacy-archive.json journal, messages and tests spell the history word legacy, failing the tooling prose rule nothing_narrates_its_own_history; rename them to a superseded-generation archive."
