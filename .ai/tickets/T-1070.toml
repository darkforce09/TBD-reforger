_forest_density_pipeline is create_density_pipeline, create_map_shader is create_render_shader (crates/graphics/gpu_frame/src/pipeline/mod.rs:39); the pool's buffer label is pooled-lane (crates/graphics/gpu_device/src/buffers/pool.rs:126) and crates/graphics/render_primitives/src/text/layout.rs no longer names height or town labels. Restructure finding F-S8-09."
