title = "Loadout templates with inheritance: a default block, per-role deep merge, and an explicit remove verb"
summary = """
OPERATOR DECISION 2026-08-02: rejected. "I don't really agree with the OFCRA loadout inheritance, I don't think that's so great." The synthesis ranked it highly on OFCRA's evidence (57 factions x 28 roles stayed maintainable), but that is their problem shape, not necessarily ours. Not filed as deferred — filed as rejected, so nobody revives it from the synthesis ranking without re-asking.

The U3 item from framework_synthesis.md C.2, ranked 12 of 16, and the synthesis says take OFCRA's model ALMOST WHOLESALE. The model, verbatim from ofcra_omtk.md:490-520: a flat map of role-name -> gear map with ONE RESERVED KEY `default`; each role is DEEP-MERGED onto `default` (nested maps recurse, arrays concatenate and are then coalesced, duplicate quantities summed and re-emitted sorted); a single regex `^((?<quantity>[0-9]+)x )?((?<rounds>[0-9]+)#)?(?<item>.*)$` gives the whole value grammar, so `"8x 30#rhs_30Rnd_545x39_7N10_plum_AK"` is 8 magazines each loaded with 30 rounds and a bare classname is quantity 1; and AN EMPTY VALUE IS MEANINGFUL — `optics:` with nothing after it parses as nil and SUPPRESSES the inherited default. ofcra_omtk.md:1374 states the principle: "explicit null is itself a setting". It is used 579 times to strip the inherited rucksack (:506, :733). ofcra_omtk.md:1802-1806 is the verdict: that little language "made 57 faction kits x 28 roles maintainable, and it made balance policy legible as data: you can grep the corpus and prove 'no infantry NVGs anywhere', 'binoculars to eight roles', 'one launcher and three mixed warheads', 'twelve magazines West, eight East, five to seven insurgent'" — and it compiles INTO `mission.sqm` with zero runtime footprint. WHERE TBD IS: "Apply Template" POPULATES a slot and then each slot owns its copy (`apply_faction_library`, crates/map-engine-core/src/doc/apply_faction.rs:211; editor_ops.rs:1548-1585), which is copy-then-diverge — the exact drift DTAS demonstrates (18 files differ, only 4 intentionally, fnf_tooling.md 2.1). THE REMOVE VERB IS ALREADY REPRESENTABLE AND NOBODY HAS USED IT: `packages/tbd-schema/schema/faction-library.schema.json`:42 declares `"slot": { "type": ["string", "null"] }`, so every `wear` / `equipment` entry and every weapon `optic` / `magazine` can already carry an explicit null distinct from absent. THE COST, STATED HONESTLY: inheritance is also where OFCRA's bugs live — ofcra_omtk.md 5.9 lists six keys mis-indented to column 0 and silently ignored, five `medic` blocks missing the `primary:` level so the intended rifle is dropped, and five `sniper` blocks nesting `headgear` under `backpack:` (discarding the hat AND accidentally un-clearing the rucksack); ~11 silent data bugs (14.1). Every one is a SCHEMA error a typed editor makes unrepresentable, which is the argument for doing inheritance in the editor rather than in YAML, not against inheritance. EXECUTOR IS `workbench`, AND THE OPERATOR SHOULD KNOW IT IS A PRODUCT CALL, NOT A LAW: `faction-library.schema.json` is `additionalProperties: false` at the root (:7, required side/name/roles/vehicles) and on `$defs/role` (:46), so a `default` block and a per-role template reference are a `packages/tbd-schema/` widening plus a `make schema-codegen` regeneration into `apps/website/api/src/contract/generated/faction_library.rs`, and framework_synthesis.md D.5 puts U3 in the mission-content program for that reason. IF instead the templates live in the editor payload — `mission-editor-payload.schema.json` carries ZERO `additionalProperties: false`, verified — and the merge is RESOLVED AT COMPILE into the existing flat `slot.loadout` (mission.schema.json, `additionalProperties: false`), then nothing under `packages/` changes, no mod work is needed at all, and this becomes `claude-code` owning `arsenal_rules.rs` + the faction library UI. That is exactly OFCRA's own architecture (compiled artefact, zero runtime footprint), so it is the better-evidenced option; it is filed `workbench` because that is the executor that cannot mis-dispatch, and the row should be re-opened the moment the call is made."""
