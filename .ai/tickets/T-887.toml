T-853 shell->xtask slice. Port scripts/deploy/backup-drill.sh to `cargo xtask deploy db drill` and delete the script(s), their scripts/shell-inventory.txt line(s), any scripts/python-inventory.txt line(s), and repoint every caller. 286 lines. Restores the newest backup into a throwaway DB to prove recoverability. Its whole value is that it actually restores, so a port that skips the restore is vacuous. ACCEPTANCE IS BYTE-FOR-BYTE: capture bash stdout+stderr+rc first, then diff on a clean tree AND on >=2 deliberately broken trees; the harness must assert the BASH side went red before believing a diff. A green run alone is not evidence (T-556). Build on crates/tbd-gate. Spec: docs/platform/t853_shell_to_xtask_waves.md

