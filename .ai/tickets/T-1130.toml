notes = "Paths under tools/xtask/src. (1) tools/commands/ci_task_catalog/src/workflow_checks/schema_parity/source_audit.rs:114-124 fails the schema job when no run step is the full gate (has_good); the narrow check at :126-139 only fires when !has_good, so it adds a second FAIL line to a run that has already failed and can never fail a run on its own. Fold its hint into the has_good message or drop it. (2) tools/foundation/repository_layout/src/documentation_locations.rs states it spells each checkout location once, but verifications spell their own: tools/commands/database_operations/src/database_checks/sql_deserialization.rs:45 (crates/api/api_server, inside verify_no_select_star at :44), tools/checks/repository_checks/src/architecture/route_tags.rs:101 and :104 (api_v2 crates/api/api_server/src/router.rs and src), verifications/architecture/engine_layer_rules.rs:9, :17, :75, :78, :101, :103, :105 (graphics-engine, map-engine, editing, frontend, data, world, data/scenario) and tools/checks/repository_checks/src/architecture/editor_orbat_coherency.rs:153-155 (orbat_manager.rs, eden_chrome.rs, crates/map_overlay/unit_symbology/src/classification.rs). Move them into repository_layout. (3) tools/commands/platform_execution/src/wave_execution/gate.rs:59-70 VERIFY_STEPS lists ten verifications; engine-layers is not among them, so the wave gate never runs it (only the ci.yml language-gates job does). Add the row or record why it stays CI-only. Source: README writer R18.1. Paths with no successor (checked 2026-10-04, restructure S12): verifications/architecture/engine_layer_rules.rs: removed in the restructure (commit 0a0121776), no successor."
