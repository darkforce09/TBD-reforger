title = "Fix db seed exiting 0 when a seed statement fails"
summary = "seed() at tools_v2/xtask/src/commands/db/operations.rs:408 runs psql without -v ON_ERROR_STOP=1, so the command exits 0 after failed statements; seeding before the API boot migrations create the tables reports success. Stop at the first error; document migrate-then-seed."
class = "bug"
status = "idea"
notes = "2026-09-28 (milestone V): delivered. tools_v2/xtask/src/commands/db/operations.rs:415 seed_psql_arguments runs every seed with psql -v ON_ERROR_STOP=1, and the recipe and selftest renderings use the same builder; evidence commands/db/tests/operations/tests.rs:29 seed_psql_arguments_stop_at_the_first_failed_statement."
main_goal = "cargo xtask db seed fails when any seed statement fails."
context = ["The seed psql command carried no -v ON_ERROR_STOP=1, so psql carried on past a failed statement and the command exited 0."]
requirement = ["Every psql run of db seed stops at the first failed statement and the command exits non-zero."]
