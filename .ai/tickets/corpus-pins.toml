# Facts about this repository's ticket corpus that no ticket file states.
#
# `cargo xtask ticket check` and `cargo xtask ticket sync` both read this file and refuse when
# it is missing or malformed, so a lost pin reds the gate instead of silently relaxing a rule.

# The programme ticket whose children are the game-mod slices. `cargo xtask mod wave` filters the
# shared wave lock to this id's dotted children, so a lock wave holding none of them belongs to
# another programme.
game_mod_programme_ticket = "T-181"

# Ids no ticket may carry: documents written before the registry existed cite these numbers as
# something other than a ticket, so a ticket row claiming one is a collision, not a ticket.
never_minted = [
  "T-007", "T-014", "T-015", "T-016", "T-017", "T-026",
  "T-027", "T-028", "T-041", "T-042", "T-044", "T-051",
]

