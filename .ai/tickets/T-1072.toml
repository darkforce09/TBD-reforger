id = "T-1072"
kind = "work"
title = "Fix map-water-everon CI task building tbd-sat v2 against v1 manifest"
summary = "task_definitions.rs:199-201 runs map build-unified without --container-version, so it writes tbd-sat v2 (satellite_archive_container.rs:33); everon/manifest.json:55 stays tbd-sat-v1 and nothing patches it, so the task's own verify-unified (:208) fails (map_assets_root.rs:84-89)."
class = "bug"
status = "idea"
created_at = "2026-09-25T03:39:37Z"
notes = "tools_v2/xtask/src/commands/ci/task_definitions.rs:185 (task map-water-everon), :199-201 (map build-unified --input ... --out assets_v2/terrains/everon/satellite/everon-sat.tbd-sat --terrain everon, no --container-version), :203 (patch-unified-bytes, which rewrites only unified.bytes: tools_v2/developer-tools/src/map_raster_pipeline/cartographic_rendering/build_tile_pyramid.rs:110-122), :208 (verify-unified). tools_v2/developer-tools/src/map_raster_pipeline/cli.rs:151-154 defaults --container-version to DEFAULT_CONTAINER_VERSION = 2 (tools_v2/developer-tools/src/map_raster_pipeline/satellite_archive_container.rs:33); satellite_archive/build_unified_satellite.rs:164 only prints the tbd-sat-v2 manifest block, it never writes it, and :176-177 says the committed bundle stays v1. assets_v2/terrains/everon/manifest.json:55 declares encoding tbd-sat-v1; tools_v2/developer-tools/src/map_raster_pipeline/satellite_archive/map_assets_root.rs:84-89 fails when the manifest encoding differs from the bundle on disk. Either pass --container-version 1 in the task or make the task write the encoding the build produced. Source: README writer R11.3. Rechecked at HEAD by README writer R17.1 (TF11 batch): the build-unified step (tools_v2/xtask/src/commands/ci/task_definitions.rs:199-201) still passes no --container-version; verify-unified now sits at :209. The new tools_v2/xtask/src/commands/ci/README.md:69 describes map-water-everon as rebuilding the satellite container and tile pyramid, which stays true once the version is pinned."

[scope]
