id = "T-1074"
kind = "work"
title = "Fix world build-objects panicking on a manifest without objects"
summary = """build_world_objects_opt.rs:308-310 calls expect("manifest.objects") under --patch-manifest, which map export-terrain always passes (terrain_export.rs:97). objects is optional in terrain-manifest.schema.json and Arland's manifest has none, so exporting Arland panics (T-294)."""
class = "bug"
status = "idea"
notes = """tools/map_assets/world_export_pipeline/src/chunk_partitioner/build_world_objects_opt.rs:305-310 (if patch_manifest { ... manifest["objects"].as_object_mut().expect("manifest.objects") }); the flag comes from tools/map_assets/world_export_pipeline/src/command_line.rs:96 and tools/map_assets/world_export_pipeline/src/export_terrain_driver.rs:89-99 always passes --patch-manifest. contracts/definitions/terrain-manifest.schema.json requires only terrainId, schemaVersion, worldBounds, metersPerPixel, dem and precision, so objects is optional; assets/terrains/arland/manifest.json has no objects block (everon's is at assets/terrains/everon/manifest.json:69). Create the block when absent or refuse with a message instead of panicking. Related: T-294 (the Arland export, status ready) would hit this panic. Source: README writer R11.3 (R11.3r)."""
created_at = "2026-09-25T03:40:36Z"

