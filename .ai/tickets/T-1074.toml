id = "T-1074"
kind = "work"
title = "Fix world build-objects panicking on a manifest without objects"
summary = """build_world_objects_opt.rs:308-310 calls expect("manifest.objects") under --patch-manifest, which map export-terrain always passes (terrain_export.rs:97). objects is optional in terrain-manifest.schema.json and Arland's manifest has none, so exporting Arland panics (T-294)."""
class = "bug"
status = "idea"
created_at = "2026-09-25T03:40:36Z"
notes = "tools_v2/developer-tools/src/world_export_pipeline/chunk_partitioner/build_world_objects_opt.rs:305-310 (if patch_manifest { ... manifest[\"objects\"].as_object_mut().expect(\"manifest.objects\") }); the flag comes from tools_v2/developer-tools/src/world_export_pipeline/cli.rs:96 and tools_v2/xtask/src/commands/map/terrain_export.rs:89-99 always passes --patch-manifest. contracts_v2/definitions/terrain-manifest.schema.json requires only terrainId, schemaVersion, worldBounds, metersPerPixel, dem and precision, so objects is optional; assets_v2/terrains/arland/manifest.json has no objects block (everon's is at assets_v2/terrains/everon/manifest.json:69). Create the block when absent or refuse with a message instead of panicking. Related: T-294 (the Arland export, status ready) would hit this panic. Source: README writer R11.3 (R11.3r)."

[scope]
domain = "repo"
layer = "tools"
