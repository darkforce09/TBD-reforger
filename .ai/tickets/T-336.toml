    "RECOMMENDED by T-326, correctly declined as out of scope. `recompute_user_stats` (handlers/telemetry.rs:530) is the sole writer of `users.total_deployments` and `attendance_rate`, and T-326 needed it from `handlers/me.rs` at identity-link time. The minimal unblock was widening it to `pub(super)`, which is what shipped.",
