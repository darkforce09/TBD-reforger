notes = 'crates/mission/mission_compiler/src/game_document/tests/cases_3.rs:427-438 (#[ignore = manual golden regeneration] fn regen_compiler_shaped_fixture): concat!(env!(CARGO_MANIFEST_DIR), "/../../contracts/fixtures/missions/valid/compiler-shaped-two-faction.json") with CARGO_MANIFEST_DIR = legacy/map_engine resolves to apps/contracts/..., a folder that does not exist, so std::fs::write fails (or, once the folder exists, writes a stray copy) and the committed golden is never regenerated. The golden reader crates/mission/mission_compiler/src/game_document/tests/mod.rs:359 uses /../../../contracts, the correct depth. Consumers of the golden: contracts/fixtures/missions/valid/compiler-shaped-two-faction.json, cases_3.rs:456,467 (drift message), apps/mod/tbd-framework/Scripts/Game/TBD/Systems/Mission/Loaders/TBD_MissionValidator.c:1155. Source: README writer R11.2.'
