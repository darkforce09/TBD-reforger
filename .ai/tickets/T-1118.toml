notes = "Paths under tools_v2/xtask/src/commands. Retired-tool narration: build/recipes.rs:1-38 ('the Makefile's build/test lane, in Rust', 'provably identical', make's rc 2 and 'make[1]: Entering directory' echo rules), :56, :108 and :141 ('Every Makefile target this module answers to, in make help order'); ci/task_runner.rs:1-80 ('the Makefile's CI / composite / map lane', Makefile:7, Makefile:205, Makefile:286 line citations, GNU make exit flattening), :125, :136 and :169-182; fetch/cli.rs:6 ('matching the former bash script'). Describe what the code does now. Wrong facts: build/recipes.rs:3 says 'Sixteen build targets' and lists 16, but TARGETS (:142-160) has 17 (gate-doctor is missing from the list); ci/task_runner.rs:33-36 says 'the task tests parse the recipe text and assert every row's steps reproduce that target's recipe verbatim, borrowed rows included', but ci/tests/task_runner.rs has no such test, so the Lane::Borrowed rows (for example rust-test-it, ci/task_definitions.rs:462-490) and the mk recipes (build/recipes/shell_word.rs:287-316) can drift; build/recipes/shell_word.rs:152 names a test mk_build_tests that does not exist (git grep finds only this line); ci/task_definitions.rs:381 (rust-ci help) lists 'fmt + clippy + build + test-it' while its steps (:384-386) also run wasm-ci. Either add the parity test the comments promise or say the rows are duplicated by hand. The ci help strings that cite documentation_v2/standards/engine_boundary_rules.md (:44, :293) wait for that doc, which the documentation program creates. Source: README writer R17.1. Same narration in core (README writer R18.2): core/cargo_target_directory.rs:1 ('the two make targets that police it'), :8-10 (quotes Makefile:15-17 as the pin's derivation) and :31, :55, :73, :83, :108 (Makefile and $(MAKE) behaviour); no Makefile is tracked."
