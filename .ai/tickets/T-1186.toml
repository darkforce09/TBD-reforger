notes = "Paths under tools/xtask/src unless stated. (1) Relaunch: tools/checks/mod_script_checks/src/spawn_determinism_live.rs:68-80 (restart_wb_once) kills WorkbenchSteamDiag and relaunches with 'steam -applaunch 1874910' and no -gproj, then opens the world through the MCP bridge (:99-104); the default world is worlds/TBD_Dev_POC.ent (tools/commands/mod_operations/src/mod_dispatch.rs:32, cli.rs:50), a tbd-framework world, while dev-bootstrap opens -gproj tbd-export (tools/commands/mod_operations/src/development_bootstrap.rs:132-137), which does not depend on the framework (mod/tbd-export/addon.gproj). The relaunched Workbench therefore opens whichever project it last had, or none. Pass the framework gproj on relaunch (T-1091 decides which gproj dev-bootstrap opens). (2) The gate's mcp helper (spawn_determinism_live.rs:17-33) spawns 'cargo run -q -p xtask -- mcp call' per call; call the mcp module in process, as mod wave prep does for slice-worktree. (3) tools/commands/mod_operations/src/mod_command.rs:39 says the gate runs 'over a recorded server log'; it drives live Workbench Play runs. (4) No five-run pass of the current possess-route deploy is recorded: .ai/artifacts/spawn_determinism_verify_log.md holds a 5-of-5 pass for the older spawn pipeline and a run stopped after 2 of 5 for the possess deploy (documentation/runbooks/spawn_determinism.md, Recorded results). After the fix, run the gate to 5/5 and record the digest. Source: doc writer F14b."
