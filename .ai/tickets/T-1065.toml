title = "Lint map engine render code in the wasm32 clippy step"
summary = "tools_v2/xtask/src/commands/ci/task_definitions.rs:435-437 runs wasm-ci's wasm32 clippy with default features (scenario only, map-engine Cargo.toml:19), so the wasm32+render code in frame/, diagnostics/, doll/renderer/ and streaming/ is never linted; ci.yml:117 says the same."
class = "chore"
status = "idea"
created_at = "2026-09-24T19:11:37Z"
notes = "tools_v2/xtask/src/commands/ci/task_definitions.rs:421-441 (wasm-ci): :432-434 clippy --all-targets --all-features runs natively, :435-437 clippy --target wasm32-unknown-unknown passes no features, so only the default scenario tier (apps/website/map-engine/Cargo.toml:19) compiles for wasm32; frame, diagnostics, doll, streaming, spatial, overlay and world are feature-gated in apps/website/map-engine/src/lib.rs and their cfg(target_arch = wasm32) render code is never clippied. The frontend's wasm32 clippy (task_definitions.rs:449) builds the map engine with render and streaming (apps/website/frontend/Cargo.toml:125) but lints only website-frontend. .github/workflows/ci.yml:115-117 documents the default-feature pass. Add --features render (or --all-features if it builds for wasm32) and clear what it finds; see T-987 for the frontend's own wasm clippy backlog."

