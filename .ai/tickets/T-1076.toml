title = "Derive terrain checks and create dialog from the terrain registry"
summary = "CI checks only Everon's manifest (validate_all.rs:171-176; task_definitions.rs:339-372, whose help promises Arland); terrain_manifest.rs:229-246 hard-codes each terrain's size and heights; create_dialog/dialog.rs:160 offers Arland, which has no data; registry status gates nothing (artifact_integrity.rs:36-49)."
class = "feature"
status = "idea"
notes = """CI coverage: tools_v2/xtask/src/verifications/schemas/checks/contract_validation/validate_all.rs:171-176 validates only everon/manifest.json against terrain-manifest.schema.json; tools_v2/xtask/src/commands/ci/task_definitions.rs:339-356 (verify-terrain, help 'stub mode OK for Arland-only') and :357-372 (verify-terrain-strict) run schema terrain-manifest and terrain-alignment with --terrain everon only, so assets_v2/terrains/arland/manifest.json is never checked. Hard-coded contract: tools_v2/developer-tools/src/map_verification/terrain_manifest.rs:229-246 matches everon (12,800 m, -204.78..375.53) and arland (4,096 m, -163.0..148.38) and refuses any other terrain id, while assets_v2/terrains/terrain-registry.json already carries worldBoundsM per terrain. Create dialog: apps/website/frontend/src/v2/pages/mission_hub/create_dialog/dialog.rs:160 hard-codes ["everon", "arland"]; Arland is status queued in terrain-registry.json with importPhaseShipped [] and its folder holds only manifest.json and README.md. Status: the registry status field gates nothing; tools_v2/developer-tools/src/world_export_pipeline/export_preparation/export_validation/artifact_integrity.rs:36-49 skips a terrain on a missing manifest or a missing objects.prefabsPath and only prints the status. Read the terrain list, sizes and availability from terrain-registry.json in the gates, the verifier and the dialog. Related: T-294 (Arland export), T-1062 (map-engine terrain size). Source: README writer R11.3 (R11.3r)."""
