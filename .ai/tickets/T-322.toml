main_goal = "Isolate `make api` from the shared CARGO_TARGET_DIR so dev :8080 serves merged main code, not unmerged slice builds from wave gates."
context = [
    "PREMISE CORRECTED 2026-07-26 by the slice agent, which DISPROVED the diagnosis this ticket was filed on. Recorded in full because the wrong version was stated confidently to the operator and",
    "must not become received wisdom.",
]
requirement = [
    "WHAT THIS TICKET ACTUALLY FIXES, and it is real and measured: which commands emit target/debug/api — `cargo check` does NOT; `cargo test -p website-api` DOES; `cargo build --bin api` DOES.",
    "The wave gate runs `cargo test -p website-api` after every land, all night, so the shared target/debug/api belongs to whichever tree built last and a dev server on it serves",
    "UNMERGED SLICE CODE. That is T-300, and isolating `make api` closes it. It also drops `make api` out of the shared build-lock queue behind seven agents.",
]
current_state = [
    "WHAT I CLAIMED: the operator's dev API on :8080 died at 08:28:10 because a slice rebuilt website-api into the shared CARGO_TARGET_DIR, overwriting the running binary's ELF in place. The binary's",
    "mtime matched the death exactly.",
    "WHY THAT IS WRONG, measured two ways by the agent and then re-confirmed independently:",
    "1. Rebuilding into the directory a process runs from does NOT kill it. Cargo unlinks and re-hardlinks; the live process keeps its old inode. Demonstrated: API on :18322, `cargo build",
    "--bin api` into the same dir, inode 52999571 -> 53011660, /proc/PID/exe became `(deleted)`, /healthz stayed 200 throughout.",
    "  2. The kernel forbids the in-place write anyway — `cp` and `dd conv=notrunc` over a running, still-linked ELF both fail ETXTBSY (Text file busy).",
    "3. Re-confirmed from the command center at 09:06: PID 52467 started 08:52:33 from target/debug/api, that path was rewritten by the gate at 08:54:46, and it is STILL SERVING from `(deleted)`.",
    "The mtime match was correlation.",
    "THE REAL CAUSE OF THE 08:28:10 DEATH IS UNDETERMINED. No OOM, segfault, or API entry in journalctl 08:25-08:32; tbd_reforger_db has been up 42h healthy, so not a DB restart. The",
    "remaining candidate the agent could not rule out: `make api` runs a FOREGROUND `cargo run`, which dies on SIGHUP when its terminal or session ends. Note the hand-placed band-aid used",
    "`setsid nohup ... & disown`, which is exactly the SIGHUP remedy — so the band-aid may have been fixing the right problem for the wrong stated reason. IF THE BAND-AID",
    "IS RETIRED, KEEP RUNNING `make api` DETACHED.",
]
approach = [
    "Cost measured: cold build 25s / 322 crates, warm rebuild 0.98s, 2.1 GB disk. .gitignore needed no entry — `target-*/` at :46 already covers it. wave.sh deliberately NOT changed: the",
    "gate does write that path but cannot kill anything, and isolating the single consumer beats policing an unbounded set of producers.",
]
