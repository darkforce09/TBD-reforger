notes = """
--- HEAD migration_legacy (verbatim) ---

Two residual items disclosed by T-421, which closed the mtime-freshness BLOCKER. Neither is a regression; both are the edges its fix does not reach.

1. NON-.rs COMPILED INPUTS ARE NOT INVALIDATED. `touch_workspace` touches workspace `.rs` files (measured: 289 across 7 members, 0 of 696 dependency units). It does not touch the non-Rust files that are nonetheless compiled INTO the binaries via `include_str!` — notably `packages/tbd-schema/*.json`. An mtime-preserved edit to one of those could still hand a check step a verdict about content it never read, by exactly the mechanism T-421 closed for `.rs`.
   Same shape as the parent, narrower blast radius. Cure is to extend the invalidation set to every path reachable by `include_str!`/`include_bytes!`, or to stop relying on mtime for those inputs.
   NOTE the interaction that makes this less urgent than it looks: since wave 5 the schema files are ALSO validated directly by `gate_schema`, so a corrupted schema is caught by its own step even if a stale check step misses it.

2. `cmd_reclaim` CANNOT RECLAIM ANY GATE TARGET DIR. It sweeps only `/var/tmp/*target*`, `/var/tmp/v2-*`, `/var/tmp/t[0-9]*-probe` and `/var/tmp/t[0-9]*-dist`. The private gate dirs all live at the repo root and are invisible to it:
     target-gate-api       8.3 GB
     target-gate-frontend  1.8 GB
     target-gate-schema    1.8 GB   (new, T-420)
     target-gate-check     3.0 GB   (new, T-421, after --all-targets clippy)
   Disk is at 91% (93 GB free) and the private-dir pattern is now the established answer to artifact isolation, so this set will keep growing. `reclaim` reporting '0 MB reclaimed' while 15 GB of gate caches sit at the repo root is itself a mild instance of the house defect -- a tool reporting completeness over a set it never looked at.
   Deliberate design tension to resolve rather than paper over: these dirs are EXPENSIVE TO REBUILD and being warm is the entire reason they are affordable (T-421 measured cold 23.4s vs warm 9.3s for the slice gate). So the answer is probably an explicit `reclaim --gate-dirs` opt-in, or an age-based sweep, NOT adding them to the default sweep."""
