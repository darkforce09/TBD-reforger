id = "T-1225"
kind = "work"
title = "Spectator host reconcile keeps issuing hosts after stand-down"
summary = "Session/Spectator/Host/TBD_SpectatorHostLifecycle.c:35-60 Reconcile loops on after EnsureHost's refusal path calls TBD_SpectatorHost.StandDown (:242), spawning and refusing a host for each further dead player in the same pass."
class = "bug"
status = "idea"
notes = "Paths under mod/tbd-framework/Scripts/Game/TBD/Session/Spectator/Host. TBD_SpectatorHostLifecycle.Reconcile (:35-60) walks every connected player and calls EnsureHost (:144) for each dead one without a host. When the built-in host fails IsAcceptableHost, RecoverFromUnacceptableHost (:233-243) calls TBD_SpectatorHost.StandDown (TBD_SpectatorHost.c:91-97: removes the tick, releases all, s_bRunning = false), but Reconcile never re-checks TBD_SpectatorHost.IsRunning, so the same pass spawns, refuses, deletes and stands down again for every remaining dead player, logging the ERROR each time. The loop should stop once the host is stood down. Reported by an earlier T-1092 slice, confirmed and filed by T-1092 slice P3-C2; not booted here."
created_at = "2026-09-26T15:54:18Z"

