notes = "Lobby wire: bijective marker + BOOT-armed self-check + two real bug fixes + the gate flake. SAID PLAINLY THAT THE RENAME ALONE WOULD HAVE BEEN COSMETIC: no committed golden contains a '~', and it independently re-measured split-empties=kept, so the lobby's empty-field handling was already correct and the '~' loss is a latent authoring hazard only. What earns the slice is the other four. FOUND A BUG REACHABLE FROM AUTHORED JSON THE SCHEMA PERMITS: TBD_SpawnManager.BuildSlotRoster formatted slot.Key()/faction/groupCallsign/role into a TSV with NO sanitisation, and mission.schema.json has minLength:1 but NO pattern on any of them — a callsign authored 'AL<TAB>PHA' produced a seven-field row that sailed past the consumer's '<6' guard and shifted every column, so role rendered as 'PHA', the real role was read as the STATE (seat matches neither OPEN nor DEAD, therefore unselectable) and holderId came from 'OPEN'.ToInt() = 0. It hardened the lobby parser to exact arity and reported upstream rather than editing another lane; the command center then fixed it at the source in BuildSlotRoster. Also fixed the same rejected-record cursor bug T-181.26 found in the briefing, gated by a control. FIXED THE world-boot FLAKE, and put the guard in Raise() NOT Start() with a reason: Start() is a one-shot at +2000 ms so gating it on a controller that may not be up yet would mean the picker silently never appears, whereas Tick polls every 500 ms so gating the raise is self-healing. 3/3 FAIL at SETTLE=12 before, 3/3 PASS after. THREE CONTROLS ALL FAILED AS REQUIRED, including one that isolates the cursor fix alone (phase 1 clean, orphanShape lost). OPS CAVEAT WORTH KEEPING: its first control run reported the UNPATCHED verdict — the patch was not live at boot despite a clean compile — so it re-ran verifying the patch present immediately before AND after the boot. A stale-patch run looks exactly like a vacuous check."
