id = "T-1149"
kind = "work"
title = "Tidy tbd-export: hard-coded arsenal, no-op props, road component, unused code"
summary = "TBD_MapExportArsenal.c:201-252 is a fixed weapon list; TBD_MapExportProps.c writes nothing; TBD_RoadExportComponent.c:114-115,194 hard-codes everon, 12800 m and an empty material and shares Workbench road file names; BuildPath, TBD_ExportPaths, DeriveMapName and two plugin fields are unused."
class = "chore"
status = "idea"
notes = "Paths under apps/mod/tbd-export/Scripts unless stated. Limitations: WorkbenchGame/MapExport/Registry/TBD_MapExportArsenal.c:202-252 PopulateStandardArsenal inserts a fixed weapon and magazine list while its header (:4-5) calls it an extractor; WorkbenchGame/MapExport/Objects/Props/TBD_MapExportProps.c:17-29 only prints a line and returns true; the master plugin header (WorkbenchGame/MapExport/Plugins/TBD_MapExportPlugin.c:6-9) lists Buildings and Props, but ExecuteExport runs neither, nor the full-world export. Runtime road export: Game/TBD/Export/TBD_RoadExportComponent.c:114-115 hard-codes mapName everon and worldSize 12800, its own DeriveMapName (:62) is never called, :194 passes an empty material so the classifier's material rules never fire, and :296-300 write highways.json, roads_paved.json, roads_dirt.json, tracks.json and paths.json, names the Workbench road exporters also write (WorkbenchGame/MapExport/Terrain/Roads/Highways/TBD_MapExportHighways.c:322, Paved/TBD_MapExportPavedRoads.c:297), so the two exports overwrite each other in one output tree; cargo xtask mod compile does not compile these five Game scripts (tools_v2/xtask/src/commands/mod_ops/compile/execution.rs:188-195). Unused: WorkbenchGame/MapExport/Core/TBD_MapExportPaths.c:99 BuildPath and :165 the TBD_ExportPaths alias (the TBD_ExportJson alias at :166 is used by WorkbenchGame/TBD_RegistryItemsExportPlugin.c:134-135), WorkbenchGame/MapExport/Plugins/TBD_MapExportPlugin.c:25 m_VegetationExporter and :28 m_RoadsExporter. Inconsistent: Core/TBD_MapExportPaths.c:85-86 names an empty map default while the runtime component falls back to everon; Objects/TBD_MapExportObjects.c:155-156 writes buildings/ while Objects/Buildings/TBD_MapExportBuildings.c:110-111 writes objects/buildings/. apps/mod/tbd-export/Missions/TBD_Export_Everon.conf has no committed .conf.meta (tbd-framework commits Missions/TBD_Dev_POC.conf.meta), so the mission header has no stable resource GUID. File length is T-1092's; stale headers are T-1102's. Source: README writer R15a."
created_at = "2026-09-25T10:40:35Z"

