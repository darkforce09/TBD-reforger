migration_legacy = ["""The U7 item from framework_synthesis.md C.2, ranked 7 of 16, and the row that FEEDS T-655's panel. fnf_v4.md:713-715 (13.1) rates "the export hook that makes Eden a compiler" as the single thing FNF v4 does better than anyone else: `init3DEN.sqf` turns Export-to-Multiplayer into a build step that derives group names, rewrites sync links, toggles markers, strips inventories, restores every mutation, wraps the lot in `collect3DENHistory` as ONE undo step, and self-heals on next open if a previous export left scaffolding behind — "No other Arma framework I've seen treats the editor as a compilation front-end this deliberately." TBD ALREADY HAS THE BUILD STEP AND NONE OF THE BUILD SYSTEM: `apps/website/frontend/src/mission_commands.rs`:23 `compiled_export_text`, :186 `compiled_document_json`, :237 the download error path, over `crates/map-engine-core/src/mission/compile.rs`. Everything the compile learns today is thrown away or flattened into a pass/fail. Scope: give the compile a structured result — a list of findings with severity, a stable rule id, the owning entity id and a message — returned alongside the bytes rather than instead of them, and rendered in T-655's panel. THE FIRST CONTENT IS ALREADY WRITTEN DOWN AND CURRENTLY SILENT: `crates/map-engine-core/src/mission/flatten.rs`:2584-2649 is the T-216 drop ledger — six author-facing values the compile silently discards (a squad's leaderSlotId, a slot's tag / callsign / rank / stance, and the entire vehicle roster) — and it records that `make verify-t180` stayed green throughout BECAUSE NOT ONE OF ITS 22 TESTS CHECKED. Each of those six is a diagnostic this ticket can emit on day one, and each stays emitted until T-674/T-675 land the schema half. TWO RULES CARRIED FROM THE CORPUS: diagnostics are NEVER debug-gated (fnf_v4.md 14.9 — v4's shipped state is the un-diagnosable one; T-635 gates telemetry, not correctness), and no severity may fire on correct input (fnf_tooling.md 1.3 — the Analyzer's role accordion can never go green). Depends on T-655 for the surface; owns only the compiler and the command layer so the panel stays a single claimant."""]
