title = "Rewrite mod declarations when a relocation path row moves files"
summary = "A relocation path row moves a Rust file and rewrites references to it, but never the mod declaration that names it (repository_relocation reads declarations in src/rust_paths/module_tree.rs:58-67 and writes none), so every stage edited mod lines by hand."
