notes = "cargo xtask refactor relocate (tools/commands/repository_relocation) moves a file with git mv and rewrites every path and rust_path reference, but never the mod declaration or #[path] attribute that loads a moved .rs file: src/rust_paths/module_tree.rs:58-67 reads ModuleDeclaration (name, #[path] value, enclosing inline modules) only to resolve module paths, and no pass writes one. Every restructure stage edited the mod lines of its moves by hand (the stage brief's rule 'a path row never rewrites mod declarations'). A path row whose from and to name .rs files in one crate could rename the declaration (and its #[path] value) in the parent module, with a relocation test per layout (mod.rs, <module>.rs, #[path]). Source: restructure finding F-015 (program progress record)."
