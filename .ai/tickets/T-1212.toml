notes = "GAP_ANALYSIS in tools_v2/ticket-engine/src/repository.rs:175-176 says ticket sync keeps the ticket column of documentation_v2/website/frontend/apps/editor/eden_editor_reference/eden_gap_analysis.md in step with the registry, but parse_gap_analysis (sync/gap_analysis.rs:52) only collects tables whose header holds both | eden_id | and priority |; the document's tables read | eden_id | tbd_id | parity | ticket | gap_notes |, so sync_gap_analysis_ticket_column matches no table and writes the file back unchanged, and ticket gap-round-trip passes vacuously. The READMEs (tools_v2/ticket-engine/src/sync/README.md, the Eden editor reference README) already say the sync leaves the file unchanged. The sync runner's docstring makes the same claim: tools_v2/ticket-engine/src/sync/runner.rs:14-16 (cmd_sync) lists the gap-analysis ticket column among the three outputs it regenerates, and :19-21 says that column refuses a table it cannot round-trip. At HEAD the header match is gap_analysis.rs:53 and the GAP_ANALYSIS comment is repository.rs:176-177. Either teach the parser the current header or correct both comments. Source: Phase 5 doc writer P5f, verified by P5g; runner.rs from Phase 6 ticket batch TF16."
