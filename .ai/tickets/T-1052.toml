id = "T-1052"
kind = "work"
title = "Decide whether placement scatter must stay stable across Rust releases"
summary = "seed_from_ids (map-engine crates/mission/formation_geometry/src/geometry.rs:101-110) seeds from std DefaultHasher, whose output Rust does not promise across releases, while the SplitMix64 doc (:112) promises the same scatter on every machine. Use a fixed hash, or narrow the promise."
class = "audit"
status = "idea"
notes = "crates/mission/formation_geometry/src/geometry.rs:101-110 seed_from_ids XORs std::collections::hash_map::DefaultHasher digests of the ids; geometry.rs:112 SplitMix64 doc promises 'a given selection scatters the same way on every machine'. DefaultHasher is deterministic within one build but its algorithm is not guaranteed across Rust releases. Reading 1: reproducibility across builds matters (goldens, collaborators on different builds); switch to a fixed hash such as FNV or SipHash with fixed keys. Reading 2: per-build stability suffices; narrow the doc. 2026-10-04 (restructure S12): seed_from_ids is crates/mission/formation_geometry/src/geometry.rs:101-112; its doc (:102-103) now says DefaultHasher is stable within one build of the toolchain, while the SplitMix64 stream it seeds promises the same stream for a seed on every machine and target (crates/foundation/deterministic_random/src/lib.rs:13), so a selection's scatter is stable per build only. The linear congruential generators the same restructure finding named are now defined once, in crates/foundation/deterministic_random/src/linear_congruential.rs; the DefaultHasher seed is this ticket's open question. Restructure finding F-S5-12."
created_at = "2026-09-24T15:18:18Z"

