id = "T-637"
kind = "work"
title = "Dock density and the 240px equalisation"
summary = """RESCOPED by editor_chrome_direction.md and it ABSORBS T-632 (cancelled in favour of this row). Two halves that turned out to be one job. (1) EQUALISATION: Eden is 240/240 in every one of the 75 screenshots; we are 256 left and ~310 right, and the right dock's fifth tab (MANAGE) runs off the viewport at x~1908 — that clipping is a SYMPTOM of the width, which is why T-632 folds in here rather than standing as its own ticket. Eden fits six cells in 240 px by using F-key labels only, no words. (2) DENSITY: the left dock is EDITOR LAYERS plus one row, then ~900 px of void, with five unlabelled icon buttons marooned at the bottom edge; the right dock is a 2-node tree then void. Eden fills its 240 px with a tab strip, a category strip, a filter-chip row, a search row and a dense 15.8 px-pitch tree. This is a layout question, not a spacing tweak. FINDING THAT SHOULD BE IN THE FIX: the five marooned buttons are the `strip_btn(...)` calls at eden_chrome.rs:2857-2861 inside a `class="mt-auto ..."` row :2856 — `mt-auto` IS the marooning — and their tooltips read "Hierarchy (visual only)", "Layers (visual only)", "Assets (visual only)", "History (visual only)", "Settings (visual only)", with only the first passing active=true. THEY ARE DECORATION, NOT CONTROLS. The tree renderer to densify is ROW_H = 24.0 :1525 / `virtual_tree` :1711 (post-split eden_tree.rs). WHY THIS TICKET RUNS ALONE IN ITS OWN WAVE: equalising the dock widths pulls in DOCK_LEFT_PX and DOCK_RIGHT_PX, and those constants are read by three files — select_tool.rs unprojects the pointer with them and mission_editor.rs sizes the wgpu canvas with them (mount points confirmed at mission_editor.rs:2052 DockLeft, :2059 DockRight, :2070 BottomToolbelt). That turns a single-module cosmetic ticket into a six-file geometry-and-input ticket, and mission_editor.rs has no spare capacity left in any earlier wave."""
