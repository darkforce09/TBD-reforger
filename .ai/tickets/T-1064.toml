notes = "TBDD: crates/world_formats/world_file_formats/src/density/tbdd.rs:138-170 (decode_tbdd checks magic and length only; the header's version field, :34 and :73, is copied out at :164 and never compared) while the writer pins TBDD_VERSION = 1 in tools/map_assets/world_export_pipeline/src/vegetation_density.rs:35 and only the export's own check compares it (export_preparation/export_validation/artifact_integrity.rs:209); world_file_formats has no TBDD_VERSION constant. Doll regions: crates/paper_doll/paper_doll_scene/src/soldier_parts.rs:19-23 (REGION_COUNT 14, REGION_KEYS, RAIL order) against crates/frontend/workspaces/mission_creator_state/src/arsenal_rules/paper_doll_and_weight.rs:16 (RAIL_REGIONS), indexed by position at crates/frontend/workspaces/mission_creator_arsenal/src/doll.rs:167, :241, :366-367 and :421; crates/paper_doll/paper_doll_scene/src/tests/soldier_model_tests.rs:23-29 checks only the length and uniqueness. Doll layout: crates/paper_doll/paper_doll_renderer/src/instance_packing.rs:19 (INSTANCE_STRIDE = 80), crates/paper_doll/paper_doll_renderer/src/pipeline.rs:19 (UNIFORM_SIZE = 80), :22 (INSTANCE_STRIDE_BYTES) and :119 (vertex array_stride 24) against crates/paper_doll/paper_doll_renderer/src/shaders/doll.wgsl:8-24 (DollUniforms mat4 + vec4 at :8-12; VsIn pos, normal, m0-m3, color at :16-24); no native test parses doll.wgsl (included only by pipeline.rs:42). Hostile input: crates/terrain/satellite_imagery/src/validation.rs:25 and :119 compute t.offset + t.length unchecked on u64, which wraps in a release build and lets an out-of-range tile pass; use checked_add."
