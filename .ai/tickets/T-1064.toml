summary = "crates/world_formats/world_file_formats/src/density/tbdd.rs:138 decode_tbdd never checks the version; nothing ties doll REGION_KEYS (crates/paper_doll/paper_doll_scene/src/soldier_parts.rs:23) to the frontend RAIL_REGIONS, or INSTANCE_STRIDE/UNIFORM_SIZE (crates/paper_doll/paper_doll_renderer/src/instance_packing.rs:19, pipeline.rs:19) to crates/paper_doll/paper_doll_renderer/src/shaders/doll.wgsl; crates/terrain/satellite_imagery/src/validation.rs:25,119 offset+length can overflow."
