notes = "Paths under apps/api/src. Inputs: missions/handlers/mission_lifecycle.rs:35 CreateMissionInput and :149 PatchMissionInput; operations/handlers/event_create_update.rs:92 CreateEventInput and :186 PatchEventInput; event_mission_attachment.rs:185 AddMissionInput; leave_requests.rs:131 ReviewLeaveInput; server_infrastructure/handlers/server_registry.rs:45 ServerInput; server_infrastructure/models/machine_credential.rs:65 MachineCredentialIssue. The six reservation-route bodies come from the operations reservations route specs; inputs without deny_unknown_fields there include slot_registration.rs:37, slot_assignment.rs:38 and :181, fire_missions.rs:57 and :154, leave_requests.rs:34. Rejecting unknown fields changes behaviour for existing clients. Source: milestone V findings V-F69, V-F74, V-F80, V-F86 (route acceptance)."
