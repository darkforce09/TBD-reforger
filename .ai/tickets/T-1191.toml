id = "T-1191"
kind = "work"
title = "Fix website deploy deleting old-layout uploads before moving them"
summary = "deploy website's --delete rsync removes crates/api/api_server/uploads on the server before the later step that moves those uploads into the unit's state directory, so an old-layout host loses its CMS uploads."
class = "bug"
status = "idea"
notes = "Paths under tools/xtask. The website rsync is '-avz --delete' over the whole checkout with no exclude for crates/api/api_server/uploads (tools/commands/deployment/src/website/rsync_argv.rs:12-49; the file's own header says an exclusion is also the delete guard), and it runs (tools/commands/deployment/src/website.rs:166-185) before the remote plan's last step, runtime_state_move (tools/commands/deployment/src/website/remote_steps.rs:63-70, planned at website.rs:273-276), which moves an old-layout crates/api/api_server/uploads into the unit's state directory. So on a host that still keeps uploads inside the checkout, rsync deletes them first (the path is neither tracked nor ignored locally), and the move finds nothing; deploy/systemd/tbd-website-api.service:29-31 promises the move. Exclude crates/api/api_server/uploads/ from the rsync, or move the uploads before rsync runs. Source: doc writer F13b."
created_at = "2026-09-25T23:39:46Z"

[scope]
domain = "repo"
layer = "xtask"
component = "deploy"
