id = "T-181.26"
notes = "Briefing wire sentinel. CONFIRMED THE v4 PREMISE FIRST, as asked: TBD_MissionLoader.LoadFromProfileFile opens $profile:missions/<id>.json and runs only TBD_MissionValidator — no JSON-schema validation on that path — and BeginLoad takes it directly whenever backendUrl/serverToken are empty, which is exactly what world-boot.sh writes. T-181.31 really did close /compiled. BUT IT ALSO MEASURED THE THING THE TICKET CALLED UNPROVABLE: string.Split KEEPS empty tokens on engine 1.7.0.54, so the pre-existing wire was ACCIDENTALLY correct and the defect was LATENT, not live — and it said so in the header and commit rather than overclaiming the fix. Adopted TBD_AdminData's BIJECTIVE FIELD_MARK over TBD_LobbyData's lossy '~': Unmark(Field(x))==x for every x, whereas '~' is a plausibility argument that loses a field authored as literally '~' — and the briefing carries the most free authored text of the three payloads. Checked before concluding that T-181.27's parallel-array pattern could NOT be generalised here: the record set needs ~8 variable-length arrays, Rpc caps at 8 params, orders already spend 3. FOUND TWO REAL BUGS INDEPENDENT OF THE SENTINEL, both of which bit under either split behaviour: m_sFactionKey was the one authored string reaching the wire UNSANITISED (a tab in a hand-staged slot.faction pushes the M record to six tokens, sails past the >=5 guard and renders the wrong two fields); and a rejected G record left `current` pointing at the PREVIOUS group, folding orphan R roles into another squad — misattribution being worse than omission on a briefing. SelfCheckWire round-trips a payload empty in every legal position, proven on a live boot with TWO NEGATIVE CONTROLS that both behaved (broken Unmark -> FAIL and world-boot escalated it; probe sample changed -> verdict read the real token count, not a constant). CORRECTED THE COMMAND CENTER'S VERIFICATION BAR: --mission= boots have zero players, so the briefing path never executes and 'use empty-warning-fields to exercise it' was false."
