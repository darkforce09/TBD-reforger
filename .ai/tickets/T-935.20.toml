205-225,395,419,456,648 (verify-phase G6 chunk partition); reclassify.rs:250-253,475; aux.rs:634-636;
catalog_emit.rs:511,516 (WRITES the chunksPath manifest keys); smokes.rs:3777;
schema_gates.rs:1247-1262,1578-1584 (manifest-binary gate demanding {cx}/{cy} in the template);
golden_gate.rs:70-200,294,653-699; map_world_los.rs:74-75,420-421;
map_blueprint/library.rs:103-106; pages/debug/world_los.rs:377; world/store.rs:27,104,405,419.

WATCH schema_gates.rs:4044 — it goes SILENTLY VACUOUS under an `if catalog.exists()` guard. A gate that passes
because its input disappeared is this repo's signature defect; fix it, do not let it pass quietly.
