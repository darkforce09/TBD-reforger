title = "Fix map basemap switch back never restoring the satellite imagery"
summary = "Needs a browser check. load_map_basemap (crates/streaming/map_asset_loading/src/terrain/satellite_quadtree/basemap.rs:29-96) overwrites the role-0 satellite texture; show_satellite_basemap (:22-26) only resets opacity, and swap_basemap (crates/streaming/map_streaming_host/src/view_preferences.rs:9-24) calls nothing else, so the satellite returns only after a reload."
