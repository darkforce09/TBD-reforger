status = "idea"
notes = "crates/streaming/map_asset_loading/src/terrain/satellite_quadtree/basemap.rs:22-26 (show_satellite_basemap sets ROLE_BASEMAP opacity only), :29-96 (load_map_basemap tex_layer_begin/commit on ROLE_BASEMAP, role 0 per quadtree/selection.rs:13); the satellite fills the same role in quadtree/bootstrap.rs:150-181 and quadtree/upload.rs:44-63; crates/streaming/map_streaming_host/src/view_preferences.rs:9-24 (swap_basemap), callers crates/streaming/map_streaming_host/src/map_host.rs:75 and preferences.rs:70."
