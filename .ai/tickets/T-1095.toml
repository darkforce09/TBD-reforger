notes = "Tracked configs: mod/.mcp.json:4-5 ('command': 'npx', 'args': ['-y', 'enfusion-mcp']) resolves whatever version npm serves, while tools/enfusion_mcp_node_package/package.json pins enfusion-mcp 0.6.1 so callers start the same version from disk, and mod/tbd-emcp/README.md:22 says the committed EMCP_WB_* handlers come from enfusion-mcp@0.6.1. mod/.mcp.json:7-9 set ENFUSION_GAME_PATH, ENFUSION_WORKBENCH_PATH and ENFUSION_PROJECT_PATH to one workstation's home paths; the root .cursor/mcp.json:6 points node at an absolute checkout path of tools/enfusion_mcp_node_package/node_modules/enfusion-mcp/dist/index.js and :9-11 repeat the three home paths. That file is tracked at the repository root as .cursor/mcp.json; the repository holds no other .cursor folder. cargo xtask mod dev-bootstrap installs the pinned package (tools/commands/mod_operations/src/development_bootstrap.rs:98) and setup mcp-game-root prepares the game root, so the configs can point at repository-relative paths or an xtask-generated file. Orchestrator decision 2026-09-25 (R14.1 questions). Source: README writer R14.1. Paths with no successor (checked 2026-10-04, restructure S12): mod/.mcp.json: removed in commit 9574714ee, no successor."
