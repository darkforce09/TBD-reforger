title = "Lobby seat switch raises the catalog change event twice"
summary = "Session/Lobby/Catalog/TBD_LobbyCatalog.c:165-183 Claim calls Release (:186-201), which notifies, then notifies again, so every listener (faction panel, roster) rebuilds twice per seat switch."
class = "bug"
status = "idea"
notes = "Paths under mod/tbd-framework/Scripts/Game/TBD/Session/Lobby/Catalog. TBD_LobbyCatalog.Claim (:165-183) calls Release() first when the viewer already holds a seat; Release ends in NotifyChanged (:200), and Claim calls NotifyChanged again (:181). Subscribers (TBD_LobbyFactionPanel.OnCatalogChanged, the roster panel) rebuild once against an intermediate state with no seat held, then again. Release should notify only when called from outside (a quiet internal release for Claim). Reported by an earlier T-1092 slice, confirmed and filed by T-1092 slice P3-C2; not booted here."
