id = "T-1262"
kind = "work"
title = "Decide whether hold objectives announce on their 60 s default"
summary = "The hold objective sets m_fAnnounceEverySeconds to 60 s (Objectives/Types/HoldUntil/TBD_ObjectiveHoldUntilBehaviour.c:59), but only capture progress logging reads the cadence (Objectives/Types/Capture/TBD_ObjectiveCaptureProgress.c:184-188), so the hold default is never read."
class = "audit"
status = "idea"
notes = "apps/mod/tbd-framework/Scripts/Game/TBD/Gamemode/Objectives/Types/HoldUntil/TBD_ObjectiveHoldUntilBehaviour.c:59 sets objective.m_fAnnounceEverySeconds = DEFAULT_ANNOUNCE_SECONDS (60 s); apps/mod/tbd-framework/Scripts/Game/TBD/Gamemode/Objectives/Engine/Model/TBD_Objective.c:39 documents the field as 15 s for capture or 60 s for hold; the only reader is apps/mod/tbd-framework/Scripts/Game/TBD/Gamemode/Objectives/Types/Capture/TBD_ObjectiveCaptureProgress.c:184-188 (capture progress log). rules.announceEverySeconds is still parsed for every kind (apps/mod/tbd-framework/Scripts/Game/TBD/Gamemode/Objectives/Engine/Registry/TBD_ObjectiveRuleResolver.c:75-84). Product decision: give hold objectives an announcement that reads the cadence, or drop the hold default and the per-kind wording. Behaviour was kept byte-identical through the objectives engine split. Source: restructure finding F-M3-01 (M3 stage log)."
