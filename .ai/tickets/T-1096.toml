title = "Decide the dedicated server Steam app id xtask relies on"
summary = "debug/direct_join.rs:98 reads the server build from appmanifest_1874900.acf, while compile/execution.rs:94,132, world_boot/execution.rs:87, playtest_server/usage_fail.rs:222 and setup/staging_server.rs:127 tell the operator to install app 1890870."
