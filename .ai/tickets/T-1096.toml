notes = "Paths under tools_v2/xtask/src/commands. 1874900: debug/direct_join.rs:97-98 compares the client build (appmanifest_1874880.acf) with the server build read from appmanifest_1874900.acf (test debug/tests/direct_join/tests.rs:79). 1890870: mod_ops/compile/execution.rs:94 (runner not provisioned: 'Install appid 1890870') and :132 ('steam steam://install/1890870'), mod_ops/world_boot/execution.rs:87, mod_ops/playtest_server/usage_fail.rs:222, setup/staging_server.rs:127 ('steamcmd +app_update 1890870 on server'). Every gate resolves the binary at ~/.local/share/Steam/steamapps/common/Arma Reforger Server (mod_ops/compile/execution.rs:88,124), whichever app installed it. Docs disagree the same way: documentation_v2/runbooks/game_server_staging/README.md:260,307,633 use 1874900 ('stable'), apps/mod/tbd-framework/README.md:76 uses 1890870. 1874910 (Workbench) and 1874880 (client) are consistent. Decide which server app (stable or experimental) the workstation, CI runner and staging host run, then align the install hints, the direct-join build check and the docs. Source: README writer R14.1."

