id = "T-1096"
kind = "work"
title = "Decide the dedicated server Steam app id xtask relies on"
summary = "debug/direct_join.rs:98 reads the server build from appmanifest_1874900.acf, while compile/execution.rs:94,132, world_boot/execution.rs:87, playtest_server/usage_fail.rs:222 and setup/staging_server.rs:127 tell the operator to install app 1890870."
class = "audit"
status = "idea"
notes = """Paths under tools_v2/xtask/src/commands. 1874900: debug/direct_join.rs:97-98 compares the client build (appmanifest_1874880.acf) with the server build read from appmanifest_1874900.acf (test debug/tests/direct_join/tests.rs:79). 1890870: mod_ops/compile/execution.rs:94 (runner not provisioned: 'Install appid 1890870') and :132 ('steam steam://install/1890870'), mod_ops/world_boot/execution.rs:87, mod_ops/playtest_server/usage_fail.rs:222, setup/staging_server.rs:127 ('steamcmd +app_update 1890870 on server'). Every gate resolves the binary at ~/.local/share/Steam/steamapps/common/Arma Reforger Server (mod_ops/compile/execution.rs:88,124), whichever app installed it. Docs disagree the same way: documentation_v2/runbooks/game_server_staging/README.md:260,307,633 use 1874900 ('stable'), apps/mod/tbd-framework/README.md:76 uses 1890870. 1874910 (Workbench) and 1874880 (client) are consistent. Decide which server app (stable or experimental) the workstation, CI runner and staging host run, then align the install hints, the direct-join build check and the docs. Source: README writer R14.1. Rechecked at HEAD by README writers R16 and R17.2 (TF11 batch): the split is unchanged (debug/direct_join.rs:98 reads appmanifest_1874900.acf; mod_ops/compile/execution.rs:94 and :132, mod_ops/world_boot/execution.rs:87, mod_ops/playtest_server/usage_fail.rs:222 and setup/staging_server.rs:127 say 1890870). The new tools_v2/xtask/src/commands/debug/README.md:29 documents 1874900 as the server manifest, as the code reads it; revisit that line with the decision. Also (TF15, doc writer F14a): 'cargo xtask debug direct-join' reads the server build from the local Steam library (debug/direct_join.rs:97-98, steam_build_id(home, "1874900")), not from the staging host it probes over ssh (:99), so it reports this machine's server install, or none, as the server build. Read the build id on the host (the same ssh probe) when checking a remote server."""
created_at = "2026-09-25T04:29:25Z"

