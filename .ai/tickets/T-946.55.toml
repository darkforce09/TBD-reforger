    "ENFUSION: both twins must change together. apps/mod/tbd-framework and apps/mod/tbd-export copies of TBD_ObjectivesComponent.c, ASCII-only in the export tree, held in lockstep by mirror_lockstep.",
]
current_state = [
    "ReplicateHud runs every tick regardless of whether any objective changed, so an idle round with no capture activity still pays full wire cost per player per second.",
]
requirement = [
    "A dirty check gates ReplicateHud: the RPC goes out only when the objective board differs from what that owner was last sent.",
