context = [
    "Filed by the wave 253 verifier against T-941.4, which replaced a per-tick chat pump with a real HUD. The HUD is the right answer; the unconditional replication is not.",
    "Anchor 2026-09-07: TBD_ObjectivesComponent.c:692 calls ReplicateHud(players, connected, objectives) every Deliver tick; the method is at :747.",
    "Each call sends a Reliable Owner RPC of three string arrays per player at 1 Hz, so cost scales with players x objectives and never falls to zero when idle.",
