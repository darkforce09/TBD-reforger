--- HEAD migration_legacy (verbatim) ---

MAJOR from the wave-119 adversarial verifier, and it is the same shape as the defect T-703 was written to cure. T-703 replaced a census that read 2 of 11 window-level keydown listeners with one that reads 11 — and the true editor surface is THIRTEEN. Missing: `apps/website/frontend/src/faction_manager.rs:70` and `apps/website/frontend/src/orbat_manager.rs:249`, each installing a window-level keydown. Both are live whenever the Mission Creator is up: mission_editor.rs:4399 mounts FactionManagerDialog and :4402 mounts OrbatManagerDialog (the latter through a bare re-export at eden_chrome.rs:39, which is why a symbol search for the component did not find the file). Neither is in `editor_surface()` (eden_help.rs:556) and neither is covered by the scope note, which excuses only ui's Dialog/Sheet and layout's nav. Consequence: the header's derived 'eleven listeners in six modules' is derived from an incomplete input, so the numbers are true of what the census SCANS and false of what the editor RUNS. NOT EXPLOITABLE TODAY — the verifier read both missed bodies and each binds Escape ONLY, gated on `open.get_untracked()`, and Escape is the declared shared channel; a by-hand collision sweep across all 13 confirms none exists. THE FORWARD RISK IS THE POINT: both files sit outside the growth tripwire (`every_editor_surface_listener_is_censused`), outside `every_shared_channel_claimant_reads_live_state`, and outside the T-692 coverage pins — so a key added to either dialog would ship undocumented and collision-unchecked with every pin green, which is exactly the 2-of-11 defect reproduced at 11-of-13. FIX: one line per file in `editor_surface()` with the per-file listener count set to 1 each (total 13); both then fall under the claimant pin for free, and the derived header numbers correct themselves. Also worth doing in the same pass, from the same report: eden_help.rs:376's 'Escape is claimed by nine listeners' is UNPINNED PROSE (the derived-numbers pin covers only the //! header), so it rots silently the moment this is fixed. ALSO RECORDED: the T-703 slice report claimed '39 bindings'; the verifier's independent parser counts 32 and the figure 39 appears nowhere in code, commit or artifacts — treat the slice's count as unsubstantiated. Diagnosis: editor_verify/wave119.md MAJOR-1 + MINOR-1.

--- HEAD migration_legacy line (verbatim) ---

