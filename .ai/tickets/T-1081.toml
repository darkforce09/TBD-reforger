id = "T-1081"
kind = "work"
title = "Decide whether Workbench registry and map export plugins stay unregistered"
summary = "TBD_RegistryItemsExportPlugin.c:26 has its WorkbenchPluginAttribute commented out (commit 4f311079f, with the MapExport plugins), so the menu run its header documents (:16-20) cannot happen and contracts_v2/catalogs cannot be refreshed."
class = "audit"
status = "idea"
notes = """apps/mod/tbd-export/Scripts/WorkbenchGame/TBD_RegistryItemsExportPlugin.c:26 reads '// [WorkbenchPluginAttribute(name: "Export TBD Registry Items", ...)]'; its header :16-20 still says to run Workbench > Plugins > TBD > Export TBD Registry Items (or NetAPI wb_execute_action menuPath Plugins,TBD,Export TBD Registry Items) and copy the output to contracts_v2/catalogs/registry-items.workbench.json and registry-compat.workbench.json, which contracts_v2/catalogs/README.md:28,56-58 and apps/mod/tbd-export/README.md:19 name as the catalog producer. Commit 4f311079f (decouple the export addon from the framework) commented it out together with the MapExport plugin attributes; at HEAD 32 files under apps/mod/tbd-export/Scripts/WorkbenchGame/MapExport/ carry a commented attribute and none a live one, including MapExport/Objects/TBD_WorldFullExportPlugin.c:19 ('Export TBD World Objects (full)'), the step tools_v2/xtask/src/commands/map/terrain_export.rs:70,72 tells the operator to run. The 19 EquipmentExport, EquipmentVehicleExport and VehicleExport plugins stay registered. apps/mod/tbd-export/README.md:14 says the MapExport plugins are reachable under Plugins,TBD. Decide whether the registration stays off (then fix the headers, READMEs and the export-terrain runbook, or remove the plugins) or comes back. Source: README writer R11.2 (R11.2r). Added by the TF11 batch (README writer R15.4): no MapExport/Terrain exporter (DEM, roads, water, satellite, vegetation) has a live [WorkbenchPluginAttribute] either, so T-1100, T-1101 and T-1102 only bite once registration returns, and 31 files under MapExport/ still tell the operator to use a 'Plugins > TBD' menu entry. Two developer-tools messages name a plugin that does not exist: tools_v2/developer-tools/src/world_export_pipeline/export_preparation/export_profile.rs:49 ('Run the TBD_TerrainWorldExportPlugin in Workbench first') and tools_v2/developer-tools/src/map_raster_pipeline/map_labels/importance_by_name.rs:280 ('Run TBD_TerrainWorldExportPlugin (full)'); the full export is MapExport/Objects/TBD_WorldFullExportPlugin.c, which writes $profile:TBD_WorldExport_full.jsonl and _full_meta.json (:29-30), and no plugin writes TBD_WorldExport_subregion.jsonl, the file copy-export-profile reads without --full (export_profile.rs:25-28). Whatever the registration decision, name the real plugin and drop or re-home the subregion path. TF13 batch (README writer R15a): at HEAD the only live MapExport entry point is the NetAPI handler MapExport/Objects/Buildings/EMCP_WB_TbdBlueprint.c (class EMCP_WB_TbdBlueprint, :73), reached with cargo xtask mcp wbcall EMCP_WB_TbdBlueprint (tools_v2/xtask/src/commands/mcp/cli.rs:33-42). The master TBD_MapExportPlugin never runs Props, Buildings or the full-world export (MapExport/Plugins/TBD_MapExportPlugin.c:62-190), so registering it alone would not restore the step terrain_export.rs:70-72 asks for."""
created_at = "2026-09-25T03:45:29Z"

