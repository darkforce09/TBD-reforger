migration_legacy = ["OPERATOR-REQUESTED 2026-08-08, off the T-781 slice's own found_not_fixed. T-781 (wave 144) made comments composable and T-748 (wave 141) gave them a map glyph — but NOTHING PUTS A COMMENT ID INTO THE SELECTION BY CLICKING. Verified by the orchestrator on both surfaces: (1) the outliner's comment row is `ROW_STATIC` (apps/website/frontend/src/eden_tree.rs ~:792) — it supports drag-into-folder and dblclick-to-edit, but no click path reaches `ctx.selection`, unlike a slot row which uses the interactive class and calls `editor_ops::select_slot`; (2) the map glyph has NO pick path — a grep for comment hit-testing in mission_editor.rs returns nothing. CONSEQUENCE — CORRECTED BY THE WAVE-144 VERIFIER, WHICH FOUND THE GAP IS TOTAL, NOT PARTIAL: there is currently NO UI lane at all that puts a comment into a selection. This ticket first said the T-697 selection-filter apply was a lane; it is not — its sole caller only NARROWS an existing selection, so it cannot introduce a comment that was never selected. The search router additionally has no comment arm, so comment hits render inert. Capture and place are correct and tested (T-781); they are simply unreachable by a user. The operator asked for this fixed rather than filed. FIX, two halves. OUTLINER: make the comment row selectable the way a slot row is; the affordance and the click must be the SAME decision (wave 129's invariant — a row is clickable IFF clicking it does something). MAP: hit-test the glyph. T-780 (wave 142) is the precedent to copy, not re-derive — it added `pick_connection` (nearest point-to-segment within a tolerance) fed from the SAME function that feeds the render lane, so what is drawn and what a click can find are one set by construction. Do the same for the glyph: one document read feeding both. ⚠️ SELECTION RECONCILE IS THE TRAP HERE, AND IT HAS BITTEN TWICE. Wave 129 found dead clicks from an affordance that did not ask the router; wave 142's F-1 found an edge selection and an entity selection coexisting, so Delete removed the wrong thing. `editor_ops::mirror_selection` is now the ONE writer every entity-selection write funnels through, and it reconciles the map's edge selection. A comment selection must join that reconcile — decide and pin whether a comment selection is exclusive with an entity selection or composes with it, and make it true by CONSTRUCTION rather than by convention. Delete with a comment selected must remove the comment and nothing else. ACCEPTANCE: click a comment in the outliner and on the map — it selects, and it is the thing Delete removes; select a comment together with entities and compose them (the T-781 lane, now reachable without the search filter); the affordance matches the click for every row kind, with a non-vacuity assert that the test saw both selectable and inert rows."]
