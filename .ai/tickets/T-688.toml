notes = "editor-UI program wave 15 (wave_plan.tsv row 115); filed 2026-08-01 by the framework_synthesis coverage audit (parity/coverage_audit.md) — SHIPPED wave 115 (editor factory), 54d5abd6; verifier wave115.md. Read-only aggregation over the document with a diff-from-default filter, defaults SCHEMA-SOURCED (the sole value-carrying constructor reads a schema node; a pin bans FLOW_DEFAULT_* by name). Found that the ticket's 'cheap by construction' premise is much weaker than stated: ZERO of the 7 mission-level keys declare a schema default and 12 of 23 zoneRules properties do not either — those render honestly as 'no default declared' rather than inventing one. ⚠️ The click-through-to-owner constraint is effectively UNDELIVERED — see T-754. The slice also surfaced T-753, a live cross-crate drift beneath its own subject."
