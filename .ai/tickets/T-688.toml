summary = """The U4 item from framework_synthesis.md C.2, ranked 4 of 16, and the only ticket in the program that exists to PREVENT a regression rather than fix one. FNF v4 named this defect about itself at fnf_v4.md:906: "One `config.sqf` became 22 modules whose attributes are only visible when the right module is selected. There is no 'show me every setting in this mission' view. Some settings (Fortify Points) are on Init, some (Death Mode) on Misc Options, some (Time until Zone is Deleted) on each Safe Zone — and safe-start duration is IMPLICITLY the maximum across all of them." That is the exact bill for the move to typed-attributes-on-placed-objects, which the corpus otherwise says wins outright (2 of 4 crossed that line, 1 stayed and ranks the text-config friction #1). TBD IS AT THE START OF THE SAME CURVE: `MissionSettingsDialog` (eden_chrome.rs:3788, post-split eden_settings.rs) holds terrain / time / weather / the three flow durations / JIP, while `zone.rules` ALREADY lives on placed entities (mission.schema.json `$defs/zoneRules`), and every ticket in this program that puts a setting on an entity widens the scatter. Scope: a READ-ONLY aggregation over the document listing every authored setting regardless of which entity owns it, each row showing key, owning entity, authored value and the schema default, with a diff-from-default filter. Cheap by construction — the schema declares `default` on every key that has one, so the comparison needs no second source of truth. TWO CONSTRAINTS: it must not become a second editing surface (that would duplicate every attribute control in the program), and rows must click through to the owning entity — wog.md:14.6's lesson that a findings list which only prints is worse than one that selects applies here as much as to T-655's panel. Depends on T-668 so it is built in the finished state vocabulary rather than retrofitted."""
