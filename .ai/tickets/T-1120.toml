notes = "Paths under tools_v2/xtask/src unless stated. (1) db selftest (commands/db/operations/selftest.rs): arm 2 (:150-193) reads the root Makefile and returns Held with 'arm 2 SKIPPED' when it is missing (:153-161); arm 6 (:357-400) prints 'arm 6 SKIPPED — no Makefile in the tree' (:360-361); no Makefile is tracked, so both arms and their make plumbing in commands/db/operations/ab.rs (run_make :58, make_error_rc :86, the make normaliser rules :10-12) never run. Arm 5 (:308-354) runs a frozen copy of the retired bash reap pipeline and asserts that it exits 0; only its port half tests current code. Arm 1 keeps a frozen make -n literal (:55-57) as the recipe pin; decide whether that stays as a plain golden. Remove arms 2 and 6 with their helpers, reduce arm 5 to the port's fail-closed check, and update the table at :10-18. (2) commands/debug/direct_join.rs:46-53: Paths carries mod_root, schema and web under #[allow(dead_code)]; only mono_root and deploy_env are read. (3) cargo xtask gen font-table dispatches (commands/generate/dispatch.rs:8) to gen_font_table in verifications/language_bans/node_and_file_limits/repository_access.rs:116-190, the file-length verification's module; move it under commands/generate/. It emits the banner '//! GENERATED by cargo xtask gen font-table — DO NOT EDIT BY HAND.' (:185), but apps/website/graphics-engine/src/text/font.rs:1-4 carries a generic four-line header instead, so either the file was edited by hand or the generator's output changed; regenerate and diff. (4) commands/platform/slice_worktree/git_plain.rs:425 writes every tooling merge commit as 'merge <branch>' with a fixed 'Co-Authored-By: Claude' trailer, whoever runs the merge; decide whether the trailer comes from the caller or goes. Source: README writers R16, R17.2."

