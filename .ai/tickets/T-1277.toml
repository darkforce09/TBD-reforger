title = "Sweep target/slice-<id>-api folders in platform wave reclaim"
summary = "platform wave reclaim sweeps only root-level target-<ticket> folders (platform_execution wave_execution/reclaim/reclaim_command.rs:268), while slice agents build their own API into target/slice-<ticket>-api (documentation/runbooks/factory_waves/known_traps.md:86-91), so a parked slice leaves that folder behind."
class = "chore"
status = "idea"
notes = "tools/commands/platform_execution/src/wave_execution/reclaim/reclaim_command.rs:268 sweeps only root-level target-<ticket> folders of the main checkout (positive identification, :243-254), while documentation/runbooks/factory_waves/known_traps.md:86-91 tells a slice agent to build its own API into target/slice-<ticket id>-api, a subfolder of target/, and to delete it when the slice ends. A parked or killed slice leaves that folder behind and reclaim never reports it. Extend the sweep to target/slice-<ticket>-api folders of finished slices with the same identification rule, and drop the manual step from known_traps.md. Source: S12 closing fixes (agent G4)."
