notes = """NOT AUTHORING — A COMPILER BUG. The operator asked to drop faction_eliminated from their mission and it turned out not to be theirs to drop: winConditions is SYNTHESIZED in flatten.rs, which documents at :430 that the editor never authors it, and end_on was the hardcoded literal ['time_limit','faction_eliminated'] for EVERY mission. So every single-faction mission was unloadable — TBD_MissionValidator rejects the document, the server parks in LOADING, and the author has no field to edit. Fixed by declaring faction_eliminated only when at least two factions actually HOLD SLOTS, counted over the flattened slots rather than factions[] because a faction can be declared with zero seats, which is exactly the shape that surfaced it. Regression test proven to FAIL without the change ('one-sided mission must not declare faction_eliminated: [time_limit, faction_eliminated]') and pass with it; 38/38 lib tests green. THE NEGATIVE CONTROL EARNED ITS KEEP TWICE: (1) `cargo build -p map-engine-core` compiles NOTHING in src/mission/** because the module is behind #[cfg(feature = "mission")] which is off by default — a deliberate syntax error built clean in 0.07s and exit 0, so the first version of this fix was entirely unverified and would have shipped that way. The real build is `--features mission`, or just build website-api. (2) With the feature on, the build immediately caught a borrow error the eye had missed: `slots: doc_slots` moves the vec before win_conditions could read it, so the count had to move above the struct literal. RELATED, STILL OPEN: `flow` is hardcoded in the same place (briefingSeconds 600, safeStartSeconds 300, timeLimitSeconds 5400, jip until_safestart_end) — which is why every golden carries those exact numbers, and why T-181.38 parses values no author can currently set."""
