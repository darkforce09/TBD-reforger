summary = """The U2 item from framework_synthesis.md C.2, ranked 6 of 16 ("Medium-high value, Small effort"). WOG is the ONLY framework in the corpus with a loadout ROUND-TRIP — GUI arsenal -> `WOG: EXPORT` -> clipboard -> `tpl/<faction>/<role>.sqf`, and `WOG: IMPORT` reads it back — and wog.md:814 states the gap it closes: "Most frameworks give you export only." TBD is currently in the export-only class: `apps/website/frontend/src/arsenal.rs`:1058-1066 gates through `try_export` (the T-240 refusal gate — a refusal produces no bytes) and hands the result to `download_json("loadout-export.json", ...)`; THERE IS NO INGEST PATH ANYWHERE (no file input in arsenal.rs). NO NEW FORMAT IS NEEDED: the document written is `packages/tbd-schema/schema/loadout-export.schema.json` v2, which already carries 7 closed objects, and `arsenal.rs`:489-596 already holds the file-vs-doc-field distinction that T-199 established. Scope: a file picker, a parse against the shipped schema, and one apply path onto the current Arsenal picks — plus the refusal behaviour that mirrors the export gate (a document that does not validate applies nothing and says why, rather than half-applying). REQUIRED, from the same corpus: re-use `rules::validate_loadout` / `cargo_capacity_errors` (arsenal_rules.rs:350-368) on the imported picks before commit — OFCRA's ~11 silent loadout data bugs are all schema errors a typed importer makes unrepresentable (ofcra_omtk.md 5.9, 14.1), and importing without validating would re-import them. Import must be one undo step."""
