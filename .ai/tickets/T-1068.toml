(streaming its own axis) against src/lib.rs:61 (streaming gated on io); apps/website/frontend/Cargo.toml:31-32 (streaming deliberately absent) against :33 enabling editing, which implies streaming (map-engine Cargo.toml:43). Outside the crate: tools_v2/developer-tools/src/blueprint/bvh/construction.rs:3,412 (website_map_engine::bvh), blueprint/ingest.rs:5 (website_map_engine::building_blueprint), map_verification/labels.rs:4 (website_map_engine::dem), world_export_pipeline/vegetation_density.rs:2 (geometry::tbdd), :21 (geometry::forest_mass::CANOPY_MASS_ISO); blueprint/archive_emission/archive_writer.rs:151 says the dropped fields are documented on from_archived, but world/architecture/blueprint/archive.rs:19-21 lists none. History, ticket and spec-id comments are on T-1004; mission data comments are on T-1056."

