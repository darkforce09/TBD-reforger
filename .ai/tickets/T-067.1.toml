notes = "2026-09-05: body rewritten for the Rust port (slotsById / Y.Doc / spatialChunks.ts were the React era). world_host.rs is shared with T-935.13 → depends_on it; world/mod.rs is shared with T-131 → different waves. residency.rs is an allowlisted SIZE-3 file: call sites only."
context = [
    "Anchor 2026-09-05: world/residency.rs:16 LRU cap = max(LRU_MIN_CHUNKS 64, 3 × pinned), pinned never evicted; eviction_log :1670; frames_over_budget (:185) is a time budget, not bytes.",
