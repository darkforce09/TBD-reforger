notes = "Briefing ORDERS — situation/mission/execution per faction, the Arma-3 prose T-181.23 parsed and nothing read. Server BuildOrders splits each field into display paragraphs under a shared 6,000-byte budget, 16 paragraphs/field, WarnOnce so truncation is never silent nor spammy. Wire is THREE PARALLEL array<string> RPC params, deliberately NOT the existing tab/newline wire (T-181.19's precedent) — so an empty field cannot be confused with a missing one. Side discipline enforced at the wire: TBD_RpcAsk_Briefing() still takes NO ARGUMENTS so a client cannot phrase a cross-side request; faction comes from the server's own GetAssignedSlot; no slot returns before BuildOrders is reached, so the other side's prose is never in the client process at all. RUNTIME-VERIFIED via a /tmp harness executing the real functions against real parsed documents: 9/9 cross-side assertions on bridgehead (blufor and opfor author different orders at the same bridge), all three legal empty states on empty-warning-fields render ZERO paragraphs, hostile prose (leading/double/trailing newlines, tabs) handled, whitespace-only renders as absent, caps fire exactly, null RPC array does not crash. FOUND THREE THINGS THAT CORRECT THE DOCS: (1) string.Length() counts BYTES and Substring is byte-indexed — 'café latte'.Substring(0,4) returns broken UTF-8; hardened its own truncation to back off to a space and flagged the same exposure in TBD_MarkerService.CapLabel. (2) string.Trim() is NOT in the mutate-in-place family. (3) THE PROGRAM'S OWN PROBE ADVICE WAS WRONG — 'int n = s.Foo()' proves nothing because string->int coerces implicitly; the discriminating direction is 'string x = s.Foo()'. Both SLICE_WORKFLOW and the landmines are corrected. NOT VERIFIED: the rendering itself (TBD_UIBriefing cannot open until the Workbench rdb pass) and ORDERS_WRAP_WIDTH=64 is an estimate needing an operator retune. JIP explicitly left to T-181.28 with the reason: no new hole added, and the gap lives in another slice's file."
