--- HEAD migration_legacy (verbatim) ---

The finale. Rewrite shell_free.rs from an allowlist ratchet into one TrackedLanguageBan table and DELETE scripts/shell-inventory.txt and scripts/python-inventory.txt entirely. Keep the good parts: the parsed-shebang detector (which correctly ignores Rust `#![allow(...)]`) and the fail-closed handling of an unreadable tracked path. Ban `*.sh|bash|zsh|ksh|fish|bat|ps1|py|mjs|cjs`, plus `Makefile`/`GNUmakefile`/`*.mk` so the deleted Makefile cannot return. ONE gate, so a future escape does not need a new gate written for it. Keep the apps/mod/** Enfusion exemption explicit and narrow. Also fold LANG-2 in: zero tracked .py AND zero python3 in command position. Prove it bites four ways: plant a .sh, plant an extensionless file with a bash shebang, plant a Makefile, and confirm a Rust file opening with `#![allow(...)]` does NOT trip it. Then rewrite CODING_STANDARDS §1.1 LANG-1/2/3 — they are ratchets today and become bans. ACCEPTANCE: prove the change BITES — perturb the new subject and watch it go red — not merely that it passes. A green run alone is not evidence (T-556). Finish with a full `cargo xtask platform wave gate` PASS: it is the only check that sees cross-crate breakage, and it has caught defects a green `cargo test -p xtask` could not. Spec: docs/platform/t853_shell_to_xtask_waves.md

