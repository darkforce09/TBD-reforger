migration_legacy = ["MINOR from the wave-116 verifier, and a real user-visible bug rather than a latent one. validation_panel.rs:524: the `COMPILE_FINDINGS` thread_local is written only by `publish_compile_findings`, whose sole production caller is `export_compiled_now`. NOTHING resets it on editor mount or hydrate. `/missions/:id/edit` is a client-side leptos_router route (app_routes.rs:90), so navigating between missions does NOT reload the wasm instance. REPRO: open mission A, Export Compiled, navigate to mission B — B's validation panel shows A's build report, and its findings carry subject_ids that resolve to nothing in B, so clicking them selects nothing. This is a lifecycle bug, not a green-ness bug: the verifier separately confirmed that a clean compile correctly CLEARS the list (whole-list replace, pinned), so the mechanism is right and only the mount/hydrate reset is missing. FIX: one clear on editor hydrate, plus a pin that fails if a second mission's panel can inherit a previous mission's compile findings. Diagnosis: editor_verify/wave116.md finding 3."]
