notes = "Per-trigger reachability checks in the validator. CORRECTED THE COMMAND CENTER'S BRIEF TWICE. (1) empty-warning-fields does NOT have 'no zones at all' — it has three including a real objective_capture, so its all_objectives_captured is SATISFIED; what it actually fails is time_limit with 'flow': {} . The brief had that mission's two triggers exactly backwards, and that inversion is the entire baseline movement. (2) THE LOAD-BEARING FINDING: every runtime warning the brief credited is INVISIBLE TO EVERY GATE. ArmRoundClock's two warnings hang off OnEnterLive, and world-boot never leaves LOADING with zero players; ReportTriggerCoverage counts objectives usable at BUILD, measured on a live montfort boot as 'built objectives=2 usable=2 capture=0 destroy=1 hold=1' — so it emits NO objective_destroyed warning, because the INERT verdict comes from ArmDestroyTargets at first LIVE evaluation, which never runs. Montfort's known-dead destroy trigger has never been observed by any gate. 'Already warns' was true of the code and false of the gate — which is what made a validator-side check worth building rather than redundant. ERROR-vs-WARNING rule, now in the class header: ERROR when the mission cannot be PLAYED, WARNING when it can be played but not ENDED — because an ERROR parks the server in LOADING, a worse outage than a round that runs long and gets ended by an admin. All five reachability findings are WARNINGs; the pre-existing faction_eliminated ERROR was KEPT because fewer than two sides with slots is not a round that ends late, it is not a PvP event. AVOIDED THE SECOND COPY by deleting three constants outright and reading TBD_ObjectiveRegistry.TRIGGER_*/TYPE_*/KindOf() and TBD_MissionFlow.ResolveSeconds() instead. Deliberately did NOT restate montfort's destroy-target gap in the validator, because hardcoding 'this build does not place entities[]' would bake a fact that becomes false the day an entity-placement slice lands — the exact drift this slice exists to catch. Proved with six fixtures in one batch including control D (everything satisfied, warnings=0) — D not firing is what makes the other five mean anything. Baseline msn_0e77ab 2 -> 3, with a header note to tighten back when the fixture is fixed."
