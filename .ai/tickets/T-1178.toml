id = "T-1178"
kind = "work"
title = "Keep the admin membership panel off every page and editor"
summary = "navigation/layout.rs:157 mounts MembershipStatus beside every frame, and membership_status.rs:95-96 shows its fixed bottom-left panel whenever can_manage_membership_override is true, so every eligible admin sees the 'Extend cached access' box on all pages, the Mission Creator included."
class = "bug"
status = "idea"
notes = "Needs a browser check. Paths under apps/website/frontend/src/v2/pages/navigation. layout.rs:153-159 renders MembershipStatus as a sibling of the frame, so it mounts in the chromeless frames too (the Mission Creator and the other chromeless routes). membership_status.rs:95 shows the aside when membership_stale OR can_manage_membership_override; :96 positions it fixed bottom-3 left-3 z-50, where it overlaps the editor's left dock and status bar. For an admin allowed to manage overrides the panel never goes away, even when nothing is stale. Show it only when stale (and put the admin extension form on an administration page), or keep it out of chromeless frames. Also: membership_status.rs:1-3 lacks the four-point module header (Role, Position, Signals and state, Invariants). Possible defect. Source: Phase 5 doc writer F04b."
created_at = "2026-09-25T23:35:43Z"

