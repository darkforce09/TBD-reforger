id = "T-1228"
kind = "work"
title = "Dropdown leaves the overlay host shown when the menu fails"
summary = "UI/Common/Dropdown/TBD_DropdownComponent.c:220-224 Open shows the overlay host before TBD_DropdownMenu.Build; a failed build returns with the host visible and nothing in it."
class = "bug"
status = "idea"
notes = "Paths under apps/mod/tbd-framework/Scripts/Game/TBD/UI/Common/Dropdown. TBD_DropdownComponent.Open (:208-243) calls TBD_UITheme.Show(host, true) at :220 and only then builds the menu (:222-224); when Build fails it returns without hiding the host. Close (:247-273) is the only path that hides an emptied overlay dock ('so it never eats a click'), and it does nothing while m_Menu is null, so a failed open leaves a visible, empty overlay host over the screen that swallows clicks. Show the host after a successful Build, or hide it on the failure path. Reported by an earlier T-1092 slice, confirmed and filed by T-1092 slice P3-C2; not booted here."
created_at = "2026-09-26T15:55:07Z"

