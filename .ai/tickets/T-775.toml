summary = 'MAJOR from the wave-119 verifier — PRE-EXISTING, reported by the T-700 slice while working beside it, and confirmed to reproduce by code-path analysis at every layer. attributes.rs `number_field`: :506 builds the display string as `format!("{}", value.round())`; :535 `on:focus` seeds the draft from that ROUNDED string; :539 `on:blur` calls `commit()` UNCONDITIONALLY; :516-523 `commit` parses the draft and calls `on_commit(n)` with no changed-check. Downstream `editor_ops::attrs_update_position` (:1293-1321) has NO equality skip — it calls `core.update_slot_position(...)` and then `after_local_edit()`. So the write is real and it mints an undo step. REPRO: place an entity by map drag so x = 412.37, click into the X field, click away WITHOUT TYPING -> the document holds 412. Tabbing through the Transform tab degrades every coordinate to an integer, dirties the mission and mints unmeant undo steps. THIS IS SILENT CORRUPTION OF AUTHORED PRECISION TRIGGERED BY AN IDLE CLICK. T-700 WIDENS THE BLAST RADIUS rather than causing it: the new PageUp/PageDown nudge seeds from the same rounded string, so nudging 412.37 commits 413, not 413.37 — the nudge inherits the rounding through `seed()`. All cited lines are unchanged context in the T-700 diff, so this is genuinely pre-existing; T-700 correctly declined to fix it because doing so changes commit behaviour well beyond its ticket. FIX, one line plus a pin: skip `on_commit` when the parsed draft equals the last settled value. That kills the no-op write, the rounding overwrite AND the extra undo step after a nudge in one change. Consider separately whether the DISPLAY should round at all, or should show the real value and only round for presentation — a field that displays a lie and then commits the lie is the deeper defect. Diagnosis: editor_verify/wave119.md MAJOR-2.'
