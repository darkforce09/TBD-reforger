notes = "Paths under apps/mod/tbd-framework/Scripts/Game/TBD. Systems/Mission/Loaders/Validation/TBD_MissionStructureChecks.c: ZONE_SPAWN (:19) and the spawn-zone check (:203-239) warn that a spawn zone with no positive-radius circle cannot be placed from by TBD_MissionLoader.GetSpawnZoneForFaction. Systems/Mission/Loaders/Mission/TBD_MissionLoader.c:202 defines GetSpawnZoneForFaction and no script calls it (bodies spawn at their authored slot transforms in TBD_SlotBodyMaterializer). Either give the spawn zone a consumer or drop the warning and the unused query. Source: T-1092 closing run P3-C."
