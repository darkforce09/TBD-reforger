summary = "TBD_MissionStructureChecks.c:239 warns a spawn zone without a usable circle means TBD_MissionLoader.GetSpawnZoneForFaction (TBD_MissionLoader.c:202) cannot place from it, but nothing calls GetSpawnZoneForFaction, so the WARNING names a consequence that never happens."
