title = "Remove unused mod UI icons, tab strip mode, stale comments"
summary = "Seven shipped icons no script names (TBD_UIIcons.c:124-127), TBD_TabStripComponent's unused vertical mode (:158-159,204), TBD_UILayouts.c history header (:1-31) and orphan comment (:170,176), and the unmounted VoiceDock (TBD_LobbyFactionList.layout:45)."
