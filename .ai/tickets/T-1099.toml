notes = "Paths under apps/mod/tbd-framework. Icons: Scripts/Game/TBD/UI/Core/TBD_UIIcons.c:120-133 ships 38 keys, but no script under Scripts/ passes the literal keys check, close, download, expand_more, lock, my_location or play_arrow (git grep of each quoted key outside TBD_UIIcons.c; dynamic keys come from data fields such as m_sIcon), so their UI/Textures/TBD/Icons/TBD_Icon_<key>_UI.{png,edds,edds.meta} files are unused unless a data source names them; confirm, then drop them from the list and the folder. Tab strip: Scripts/Game/TBD/UI/Common/TBD_TabStripComponent.c:158-159 (m_bVertical attribute), :192-193 and :204 (SetVertical) implement a vertical mode that no layout or script turns on (git grep m_bVertical / SetVertical finds only this file); the header :3-5 and :11-12 still says the briefing's primary navigation and topic tree use it, but those are TBD_BriefingPrimaryNav.c and TBD_BriefingTopicNav.c; the header :1 carries a dated history line. Layout index: Scripts/Game/TBD/UI/Core/TBD_UILayouts.c:1-31 header carries a ticket id (:1), dated history (:8 'UI reorg 2026-09-12') and 'ex KitCell' (:23); :170 is an orphan doc comment ('One labelled cell of a kit grid') with no constant under it; :176 is a dated history comment ('Briefing rebuild (2026-09-14)'). Lobby: UI/layouts/Session/Lobby/TBD_LobbyFactionList.layout:45 declares VoiceDock, which no script mounts; Scripts/Game/TBD/Session/Lobby/UI/TBD_LobbyFactionPanel.c:9 and TBD_LobbyScreen.c:5 describe it as a later voice panel. Decide whether to remove it or ticket the voice panel. TBD_UITheme.c (622 lines) is already on T-1092; the ticket and date comments across mod scripts are on T-1004. Source: README writer R14.3."

