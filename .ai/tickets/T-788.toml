UX-REVIEW BATCH (source: .ai/artifacts/editor_hostile_ux_review.md, commit 5d30c651; operator pass 2026-08-09). F-26/F-27/F-29 — three verified defects on T-649's multi-edit. (1) F-26 UNDO COST: apply-to-all writes ONE UNDO STEP PER SLOT — after the 9-slot fan-out, one Ctrl+Z took the validator from 9 errors to 8 (editor_ops.rs ~:1617 attrs_update_position_multi, ~:2466 attrs_update_slot_multi loop per-slot txns). Batch each apply-to-all into one transaction: 9-slot apply undone by ONE Ctrl+Z. (2) F-27 REACHABILITY: multi-edit opens ONLY via RMB>Attributes…; both natural gestures destroy the selection first — map dblclick and outliner dblclick collapse SEL9->SEL1 because the first click re-selects before activate fires; open_attrs_modal ~:1235-1258 keeps the selection only when sel.len()>1 && sel.contains(id). Fix the dblclick arms (mission_editor.rs) so a click INSIDE the current selection does not replace it — then dblclick opens multi-edit naturally. (3) F-29 STALENESS: with the panel open on one slot, Ctrl+A took SEL to 9 while the panel kept showing 'Rifleman · n2' (attrs_open ~:64/:295/:310 has no selection-change effect) — re-render against the live selection or close on selection change. ⚠️ TRAPS: T-785 (input pattern) lands FIRST — build on the fixed text_field; keep 'Multiple values' locked-until-ticked semantics and the per-field checkboxes exactly (the panel design is praised in the review — do not redesign it); single-click-outside-selection must still replace (Eden semantics). ACCEPTANCE: scripted — select 9, apply-to-all a field, ONE Ctrl+Z reverts all 9 (validator count returns); Ctrl+A then map-dblclick on a selected unit opens header 'N slots selected · multi-edit' with SEL unchanged; panel open + Ctrl+A -> header switches to multi within one frame budget.

