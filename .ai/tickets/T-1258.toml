    "cargo xtask verify link-check --with-untracked --path apps/mod/tbd-framework --path documentation_v2/mod",
    "cargo xtask verify markdown-placement --with-untracked --path apps/mod/tbd-framework --path documentation_v2/mod",
    "Deploy the build to staging and restart the dedicated server five times, reading each boot's console.log and error.log.",
]
acceptance = [
    "Five consecutive staging server starts reach LOBBY with the deployed mission, and none logs 'Application hangs (force crash)'.",
    "No boot logs 'Trying to register a signal ... outside of the main thread' for mission entities, slot bodies or deployed players.",
    "Deployment decisions, fleet broadcast, kick and load_mission, and the relay and link chat replies behave as before, run from the main thread.",
    "The Enfusion compile, the comment card, the file-length ceiling and the three documentation gates pass.",
]
