id = "T-1258"
kind = "work"
title = "Fix boot hang: run REST answers on the main thread"
summary = "RestCallback handlers run off the main thread; TBD_GameRuntimeHttp ran every OnAnswered there, so answers spawned, deployed, kicked, broadcast, restarted and chatted there, and a spawn during world creation hung the staging server into a 300 s force crash."
class = "bug"
status = "shipped"
order = 9827
notes = "Paths under apps/mod/tbd-framework/Scripts/Game/TBD. Evidence from the staging server profile: logs_2026-09-28_15-14-04 and logs_2026-09-28_15-25-37 (console.log, error.log: the M151A2 signal lines, then the 300 s force crash), logs_2026-09-28_15-31-04 (the start that survived) and CrashReports.log (1.7.0.49). Delivered in API/Http (TBD_GameRuntimeRestCallback.c new, TBD_GameRuntimeHttp.c, TBD_GameRuntimeAnswer.c), Systems/Mission/Loaders/Mission (TBD_MissionLoader.c, TBD_MissionWorldApplier.c) and Gamemode/Orchestrator/Stage/TBD_LoadingGate.c, with the READMEs and documentation_v2/mod/tbd-framework/mod_design.md section 5. The five-restart live proof runs after deployment."
main_goal = "Every game-runtime HTTP answer is handled on the main thread, and the loaded mission reaches the world only from the main-thread load stage, so a dedicated server boots every time."
context = [
    "Reforger 1.7 runs RestCallback success and error handlers on a thread other than the main thread; neither the API docs nor vanilla scripts say so, the server logs prove it.",
    "Staging boots 15:14 and 15:25 on 2026-09-28: TBD_Framework 1.0.2 (bb4f0f45a) spawned the mission's M151A2 from the mission fetch callback while the world was still in CreateEntities.",
    "Both boots then logged 'Application hangs (force crash) 300 s' and crashed (CrashReports.log, 1.7.0.49), two starts in three after every host boot.",
    "Each entity spawned there logs 'Trying to register a signal ... outside of the main thread. Request ignored.'; the 15:31 boot survived and still lost all 70 M151A2 signals.",
    "The repo already defers the boot load through CallLater(SettleVerification), but TBD_GameRuntimeHttp.Answer still ran every TBD_GameRuntimeCall.OnAnswered on the callback thread.",
    "Answers deploy players (TBD_DeploymentRequestQueue to TBD_DeployWaves.DeployPlayerInternal), run fleet effects (broadcast, kick, load_mission restart) and chat (TBD_MissionDeploymentRelay, TBD_IdentityLinkConfirm).",
    "TBD_MissionLoader.ParseMissionJson also spawned entities and applied settings, environment and the gadget hook as side effects of the parse.",
]
requirement = [
    "The engine's REST handlers only record the answer in plain fields of their own callback; no other code runs on the REST callback thread.",
    "Every TBD_GameRuntimeCall.OnAnswered runs on the main thread, exactly once per sent call, and never inside Post or Get.",
    "A call the engine never reports is still answered once, and nothing stays armed or referenced without bound after it or across a world teardown.",
    "The mission parse spawns nothing and applies no world setting; those effects run from the main-thread load stage, in their current order, before the slot bodies.",
]
current_state = [
    "TBD_GameRuntimeRestCallback.CaptureSuccess and CaptureError copy status, transport result and body into the callback's own fields, m_bReported last, and touch nothing else.",
    "TBD_GameRuntimeHttp.DeliverReportedAnswers, armed by Track on the main thread, runs each frame while calls are in flight, answers reported calls oldest first, and disarms when idle.",
    "OnCallWatchdog answers a reported call with its answer, else TRANSIENT and retires the callback (at most 16); retired callbacks are released once the engine reports them.",
    "ParseMissionJson parses, filters, validates, resolves parameters and arms the reports; TBD_LoadingGate.TickLoading calls TBD_MissionWorldApplier.Apply first: entities, settings, environment, gadget hook.",
]
approach = [
    "Research: vanilla scripts never use RestApi, the BIKI REST API page and API docs name no thread, and ScriptCallQueue ticks from the game update on the main thread.",
    "Use a per-request mailbox, a RestCallback subclass, instead of a shared pending list, so the callback thread mutates no container the main thread iterates.",
    "Deliver from a repeating main-thread pass on the game call queue beside the existing watchdog, which prefers a reported answer over TRANSIENT.",
    "Move SpawnMissionEntities, ApplyMissionSettings, TBD_EnvironmentReader.Apply and TBD_GadgetFlags.Bind into TBD_MissionWorldApplier.Apply, called by TBD_LoadingGate before the flow and the slot bodies.",
]
