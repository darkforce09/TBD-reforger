main_goal = "Crossing a line on the old chunk grid costs nothing, because the loader no longer knows the grid exists."
notes = '''
Step 2 of the T-935.15 program, filed 2026-09-08. Sequenced strictly after T-935.18 — the container has
to exist first. T-935.16 owns build.rs and world_host.rs too and cannot share a wave with this row.
Partial access is an HTTP property, not a filesystem layout: range requests give residency without
splitting the world into files.
'''
