title = "Rewrite xtask help, error and doc texts contradicting the code"
summary = "platform wave help omits run (tools/commands/platform_execution/src/platform_command.rs:25-27); wave --close allowlist omits --tickets (land.rs:13); restore refusals cite a moved allow-list line (database_operations/execution.rs:381); verify_dump.rs:151 asks for a third argument, not --expect-db; four more."
class = "docs"
status = "idea"
notes = "Paths under tools/xtask/src/commands unless stated. (1) tools/commands/platform_execution/src/platform_command.rs:25-27, the clap doc for 'cargo xtask platform wave', lists status, prep, gate, test, wave, verified, reclaim, land, revert and push, but the dispatcher also accepts run (tools/commands/platform_execution/src/wave_execution/flush.rs:357). (2) tools/commands/platform_execution/src/wave_execution/land.rs:13 says the 'wave --close' allowlist is --summary and --dry-run 'nothing else', but parse_close_args (land/wave_close.rs:194-215) also takes --tickets, which the CloseArgs tuple at land.rs:15-16 carries. (3) tools/commands/mod_operations/src/wave_execution.rs:54 (help text) says land merges, reaps trees, then runs the gate; tools/commands/mod_operations/src/wave_execution/land.rs:57-71 gates before it reaps and keeps the worktrees when the gate fails. (4) tools/commands/database_operations/src/container_database/execution.rs:381-382 (the restore refusal) and (5) tools/commands/database_operations/src/local_database.rs:88-89 (module doc) cite the integration harness's allow-list at crates/api/api_server/tests/common/mod.rs:87; that file has 54 lines and the allow-list is is_safe_test_database_name in crates/api/api_server/tests/common/database.rs:47. (6) tools/commands/database_operations/src/container_database/verify_dump.rs:151 tells the operator to 'Pass a third argument' to check the database identity; the option is --expect-db (tools/commands/database_operations/src/container_database.rs:75, tools/commands/database_operations/src/restore.rs:43). (7) tools/commands/remote_debugging/src/debug/debug_command.rs:45 says direct-join 'runs every probe below', but it is the last variant and the probes (a2s-probe, ndjson-append, direct-join-log) are above it. Done 2026-09-28: the doc reads 'runs the probes above'. (8) crates/api/api_http_layer/src/middleware/durable_ratelimit.rs:14 calls the deployment's one datastore 'deploy/systemd/tbd-reforger.service plus the compose Postgres'; that unit is the game server, the API unit is tbd-website-api.service. Fixed 2026-09-29 (milestone S): the module doc names deploy/systemd/tbd-website-api.service and the compose Postgres on 5434. The dev-bootstrap and milestone container texts are T-1104; the compile and mission-test wording is T-1091. Source: README writers R16, R17.2. More texts (README writers R18.2, R20.2; paths under tools/xtask/src unless stated). (9) tools/checks/repository_checks/src/architecture/editor_orbat_coherency/source_audit.rs:84-89 (tool_status) reports '<msg> — grep exited <status> (tool absent or bad pattern)', but the audit runs no grep; its callers (:36, :44, :81) pass 2 for a missing file or a check that did not run. (10) tools/commands/schema_tooling/src/schema_checks/contract_citations.rs:188 prints 'GO-7 retired: there are no Go handlers' and tools/commands/schema_tooling/src/schema_checks.rs:9-10 lists GO-7 as a retired slot, while cargo xtask verify route-tags enforces GO-7 (commands/verify/cli.rs:67, tools/checks/repository_checks/src/architecture/route_tags.rs:1) and tools/commands/ci_task_catalog/src/task_definitions.rs:109 cites it. (11) commands/schema/cli.rs:62 and tools/commands/schema_tooling/src/schema_checks.rs:72 say type-inventory checks I1-I7; tools/commands/schema_tooling/src/schema_checks/object_type_inventory.rs implements I1-I5 and I7, no I6. (12) object_type_inventory.rs:88-91 says nothing runs xtask's tests; the platform wave gate runs 'test xtask+developer_tools' (tools/commands/platform_execution/src/wave_execution/gate/gate_dispatch.rs:269). (13) tools/checks/repository_checks/src/registry/object_registry_aliases.rs:8 says the alias is derived by asset_catalog.rs::derive_object_alias; the pin reads crates/mission/mission_operations/src/assets.rs (FE_REL, :64). (14) tools/commands/schema_tooling/src/schema_checks/contract_validation/validate_file.rs:4 calls validate-file 'the deploy-staging V1 gate'; only cargo xtask schema validate-file calls it (commands/schema/dispatch.rs:14), nothing under tools/commands/deployment/src. (15) commands/map/cli.rs:111-113, the world-los help, omits --assets and --dem, which tools/map_assets/map_asset_verification/src/world_line_of_sight/occluder_loading_and_replay.rs:227 and :263 accept. (16) The cargo xtask ticket run hint (tools/tickets/ticket_registry/src/verbs/batch.rs:155-156) names an agent product ('Composer 2.5') and a placeholder id T-0xx. More texts (TF15; doc writers F13b, F17a; paths under tools/xtask/src/commands). (17) tools/commands/ci_task_catalog/src/task_definitions.rs:377, the rust-ci help, says it 'mirrors the ci.yml rust-backend job'; .github/workflows/ci.yml has no such job (the Rust steps run in api, :34-112). (18) tools/commands/ci_task_catalog/src/task_definitions.rs:109, the verify-coding-standards help, lists file length, doc layout and GO-7 but omits no-select-star, which the task runs (:115-119), and cites 'coding_standards/README.md §11', which the rewritten README maps under 'Section numbers cited by code' to ci_gates.md."
