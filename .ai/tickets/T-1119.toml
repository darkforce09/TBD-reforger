id = "T-1119"
kind = "work"
title = "Rewrite xtask help, error and doc texts contradicting the code"
summary = "platform wave help omits run (platform/cli.rs:25-27); wave --close allowlist omits --tickets (land.rs:13); restore refusals cite a moved allow-list line (database_operations/execution.rs:381); verify_dump.rs:151 asks for a third argument, not --expect-db; four more."
class = "docs"
status = "idea"
notes = "Paths under tools_v2/xtask/src/commands unless stated. (1) platform/cli.rs:25-27, the clap doc for 'cargo xtask platform wave', lists status, prep, gate, test, wave, verified, reclaim, land, revert and push, but the dispatcher also accepts run (platform/wave_execution/flush.rs:357). (2) platform/wave_execution/land.rs:13 says the 'wave --close' allowlist is --summary and --dry-run 'nothing else', but parse_close_args (land/wave_close.rs:194-215) also takes --tickets, which the CloseArgs tuple at land.rs:15-16 carries. (3) mod_ops/wave_execution.rs:54 (help text) says land merges, reaps trees, then runs the gate; mod_ops/wave_execution/land.rs:57-71 gates before it reaps and keeps the worktrees when the gate fails. (4) deploy/database_operations/execution.rs:381-382 (the restore refusal) and (5) db/operations.rs:88-89 (module doc) cite the integration harness's allow-list at apps/website/api_v2/tests/common/mod.rs:87; that file has 54 lines and the allow-list is is_safe_test_database_name in apps/website/api_v2/tests/common/database.rs:47. (6) deploy/database_operations/verify_dump.rs:151 tells the operator to 'Pass a third argument' to check the database identity; the option is --expect-db (deploy/database_operations.rs:75, deploy/database_restore.rs:43). (7) debug/cli.rs:45 says direct-join 'runs every probe below', but it is the last variant and the probes (a2s-probe, ndjson-append, direct-join-log) are above it. (8) apps/website/api_v2/src/core/middleware/durable_ratelimit.rs:14 calls the deployment's one datastore 'tools_v2/xtask/deploy/systemd/tbd-reforger.service plus the compose Postgres'; that unit is the game server, the API unit is tbd-website-api.service. The dev-bootstrap and milestone container texts are T-1104; the compile and mission-test wording is T-1091. Source: README writers R16, R17.2. More texts (README writers R18.2, R20.2; paths under tools_v2/xtask/src unless stated). (9) verifications/architecture/editor_orbat_coherency/source_audit.rs:84-89 (tool_status) reports '<msg> — grep exited <status> (tool absent or bad pattern)', but the audit runs no grep; its callers (:36, :44, :81) pass 2 for a missing file or a check that did not run. (10) verifications/schemas/checks/contract_citations.rs:188 prints 'GO-7 retired: there are no Go handlers' and verifications/schemas/checks.rs:9-10 lists GO-7 as a retired slot, while cargo xtask verify route-tags enforces GO-7 (commands/verify/cli.rs:67, verifications/architecture/route_tags.rs:1) and commands/ci/task_definitions.rs:109 cites it. (11) commands/schema/cli.rs:62 and verifications/schemas/checks.rs:72 say type-inventory checks I1-I7; verifications/schemas/checks/object_type_inventory.rs implements I1-I5 and I7, no I6. (12) object_type_inventory.rs:88-91 says nothing runs xtask's tests; the platform wave gate runs 'test xtask+developer-tools' (commands/platform/wave_execution/gate/gate_dispatch.rs:269). (13) verifications/registry/object_registry_aliases.rs:8 says the alias is derived by asset_catalog.rs::derive_object_alias; the pin reads apps/website/map-engine/src/data/store/operations/assets.rs (FE_REL, :64). (14) verifications/schemas/checks/contract_validation/validate_file.rs:4 calls validate-file 'the deploy-staging V1 gate'; only cargo xtask schema validate-file calls it (commands/schema/dispatch.rs:14), nothing under commands/deploy. (15) commands/map/cli.rs:111-113, the world-los help, omits --assets and --dem, which tools_v2/developer-tools/src/map_verification/world_line_of_sight/gunzip_json.rs:227 and :263 accept. (16) The cargo xtask ticket run hint (tools_v2/ticket-engine/src/cli/batch.rs:155-156) names an agent product ('Composer 2.5') and a placeholder id T-0xx. More texts (TF15; doc writers F13b, F17a; paths under tools_v2/xtask/src/commands). (17) ci/task_definitions.rs:377, the rust-ci help, says it 'mirrors the ci.yml rust-backend job'; .github/workflows/ci.yml has no such job (the Rust steps run in website-api, :34-112). (18) ci/task_definitions.rs:109, the verify-coding-standards help, lists file length, doc layout and GO-7 but omits no-select-star, which the task runs (:115-119), and cites 'coding_standards/README.md §11', which the rewritten README maps under 'Section numbers cited by code' to ci_gates.md."
