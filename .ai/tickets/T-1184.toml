title = "Decide whether SKIP_MIGRATE and RUST_LOG join the readiness digest"
summary = "The api-readiness configuration digest (tools_v2/xtask/src/verifications/api_readiness/fingerprint.rs:45-98) hashes about fifty environment variables but not SKIP_MIGRATE or RUST_LOG, which the API binary reads at boot (api_v2 src/bin/api.rs:18 and :23-25). May be intended."
class = "audit"
status = "idea"
notes = "tools_v2/xtask/src/verifications/api_readiness/fingerprint.rs:45-98 CONFIGURATION_ENVIRONMENT lists the variables whose values enter the configuration digest (APP_ENV through TZ). apps/website/api_v2/src/bin/api.rs:18 builds the log filter from RUST_LOG (EnvFilter::try_from_default_env) and :23-25 skips database::migrate when SKIP_MIGRATE is set; neither is listed, so readiness evidence recorded with migrations skipped matches evidence recorded with them applied. RUST_LOG changes only logging and may be left out on purpose; SKIP_MIGRATE changes the schema the run saw. Decide, and either add them or state the exclusion in the module doc. The .env.example gap for both is T-1025. Source: Phase 5 doc writer F09a."
