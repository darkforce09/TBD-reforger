title = "Check whether the ticketboard should watch the gap analysis"
summary = "The ticketboard git chip reports the gap analysis (repository_status/models/git_status.rs:13), but the file watch reloads only on .ai/tickets, CLAUDE.md and the roadmap (services/file_watch.rs:121-132), so a change to the gap analysis alone leaves the chip stale."
class = "audit"
status = "idea"
notes = "Paths under apps/ticketboard/src. repository_status/models/git_status.rs:6-15 GIT_ARGS runs git status over .ai/tickets, the roadmap, the gap analysis (ticket_engine::repository::documentation::GAP_ANALYSIS) and CLAUDE.md. The chip refreshes only after a board reload, a finished check or a finished ticket command (application/background_events.rs:107, :168; application/command_execution.rs:100), and a reload follows only file-watch events that repository_status/services/file_watch.rs:121-132 relevant() accepts: anything under .ai/tickets, the root CLAUDE.md and the roadmap. A ticket sync that also rewrites .ai/tickets/queue.json still triggers a reload; an edit, checkout or commit that touches only the gap analysis does not, and the chip keeps the old state. Decide whether to watch the gap analysis (its directory non-recursively, as roadmap_dir does at file_watch.rs:109-115) or drop it from GIT_ARGS. Orchestrator decision 2026-09-25 (R21.2/R21.3/R15a questions): a code decision for a ticket. Source: README writer R21.2."
