id = "T-1207"
kind = "work"
title = "Decide one colour source for mod theme, markers and sides"
summary = "TBD_UITheme.c claims a 1:1 port of aegis.css but its container and tertiary colours differ; the Mission Creator tints markers by side while the game uses color; the mod has no INDFOR tint."
class = "audit"
status = "idea"
notes = "Three colour disagreements between the web and the mod. (1) Theme drift: apps/mod/tbd-framework/Scripts/Game/TBD/UI/Core/Theme/TBD_UITheme.c:4-6 says its tokens are ported 1:1 from crates/frontend/shell/frontend_application/style/aegis.css 'so the mod and the site cannot drift', but PRIMARY_CONTAINER is 0xFF4D8EFF (:55) against aegis.css:19 #adc6ff, TERTIARY_CONTAINER is #df7412 (:62) against aegis.css:37 #7bd0ff, and TERTIARY_WARM and CARD_BORDER (:61, :63) cite --color-tertiary-warm and --color-card-border, which aegis.css does not define. (2) Marker colour: the Mission Creator tints each marker by its side and ignores the authored color (crates/mission_editing/mission_editing_session/src/lanes/markers.rs:14, :46-47, side_rgba from crates/map_overlay/unit_symbology/src/classification.rs:7-20), while the game draws the authored color or REFORGER_ORANGE and ignores the side (TBD_MarkerClient.c:402, :498-502; Systems/Markers/TBD_MarkerData.c:442-444). (3) Side tints: the map uses BLUFOR #adc6ff, OPFOR #f87171 and INDFOR #22c55e (classify.rs:7-13), while the mod's ChipFill and FactionRowFill (TBD_UITheme.c:460-475, :531) paint BLUFOR and OPFOR from Tailwind blue-500 and red-500 and have no INDFOR tint. Decide one source per colour (which surface is authoritative, whether markers follow side or color), then align the mod theme and its 1:1 claim. documentation/design_system/map_symbology.md (Known discrepancies) and design_tokens.md record the gaps. Source: doc writer F17b. Paths with no successor (checked 2026-10-04, restructure S12): Systems/Markers/TBD_MarkerData.c: removed in commit 03d9d83be, no successor."
created_at = "2026-09-25T23:46:21Z"

