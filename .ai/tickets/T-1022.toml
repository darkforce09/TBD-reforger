summary = "api_v2 serves POST /api/v1/servers plus PATCH and deactivate on /api/v1/servers/:id (server_registry.rs:174,241,359) and accepts server_id on event create and update (event_create_update.rs:103,191), but no page calls those routes or sends server_id; server_control/page.rs:40 only lists /servers."
class = "feature"
status = "shipped"
order = 9829
notes = "Delivered in apps/website/frontend/src/v2: pages/administration/server_control/server_registry/ (new: mod.rs, registration_sheet.rs, registration_wording.rs, tests/), page.rs, server_cards.rs, server_card_telemetry.rs, the name signal in fleet_commands/command_requests.rs and machine_credentials/; pages/administration/event_manager/server_choice.rs (new), state.rs, schedule_dialog.rs, edit_dialog.rs, event_table.rs; core/api/endpoints/server_registry.rs (new); core/api/dto/servers.rs (ServerRegistration, ServerChange) with absent_null_or_value moved to dto/common.rs. Goldens POST__servers and PATCH__servers__00000000-0000-4000-d000-000000000002 (with request bodies and _index.tsv rows) and the POST /api/v1/servers /id row of apps/website/api_v2/tests/contract_parity_support/normalised_fields.rs. No API change: the routes existed. The [scope] still reads repo/docs, as ticket add minted it (T-1009); the delivery is the website frontend, a correction for the operator."
main_goal = "An administrator registers, edits, deactivates and reactivates game servers from Server Control, and binds each operation to its game server from the event manager, with no API call by hand."
context = [
    "api_v2 serves POST /api/v1/servers, PATCH /api/v1/servers/{id} and DELETE /api/v1/servers/{id} (a soft deactivation) in server_infrastructure/handlers/server_registry.rs, checked by the route acceptance specs.",
    "The events API accepts server_id on create and update (operations/handlers/event_create_update.rs) and refuses an unknown server.",
    "Server Control listed GET /api/v1/servers only: a fresh install showed 'No servers configured.' with no way to register a server, so no machine credential could be issued to it.",
    "The event manager's forms never sent server_id, so the deployment form offered no event mission and a server's game runtime could not read an operation's roster.",
]
requirement = [
    "Server Control registers a server (name, literal IP address, game port, optional required modpack from GET /api/v1/modpacks), and the new server's card, with its credentials, shows at once.",
    "The card's Edit changes a registration, sending only the changed fields; the sheet deactivates a server after a confirmation that states the consequences, and reactivates it.",
    "The form checks the API's rules before sending: a required name, a literal IPv4 or IPv6 address (no hostname, no /mask), a game port of 1 to 65535.",
    "An API refusal shows its sentence in the sheet and keeps the form.",
    "The event manager's schedule and edit forms choose the operation's game server; an edit sends server_id only when it changes, and null to clear it.",
    "Frontend DTOs mirror the ServerRegistration and ServerChange contracts, held to captured goldens the seeded API reproduces.",
]
current_state = [
    "ServerRegistry (server_control/server_registry/mod.rs) reads the list once and applies each accepted write to its one row: a registration is appended and selected, a change or reactivation replaced, a deactivation marked inactive.",
    "The registration sheet opens from 'Add server' at the picker's foot or in the empty detail pane, and from the card's 'Edit'.",
    "The card is keyed on the selected id, reads its row from the registry and shows the server id.",
    "server_choice.rs gives both event forms a 'Game server' select fed by GET /api/v1/servers while either form is open.",
    "core/api/endpoints/server_registry.rs holds the four calls and the modpack choice read; dto/servers.rs holds ServerRegistration and ServerChange.",
]
approach = [
    "Keep the list in a registry handle, not a one-shot resource, and key the card on the selection alone.",
    "A write then updates the card in place and keeps its command console, deployments and credential sheet.",
    "Use each write's answered ServerRowDto, the shape GET /servers lists, and mark a 204 deactivation locally, since it changes is_active only.",
    "Mirror the API checks in pure functions tested against the captured bodies; add POST and PATCH goldens at the end of the index so no earlier golden moves.",
]
