id = "T-1177"
kind = "work"
title = "Check event existence and access for fire mission save, list"
summary = "POST /fire-missions stores any well-formed event_id without checking the event exists (no foreign key either: migration 0019:109-110), and GET /events/{id}/fire-missions returns an event's rows to any signed-in user without viewer_event_access (operations/handlers/fire_missions.rs:191-265, :274-291)."
class = "bug"
status = "idea"
notes = "Paths under apps/website/api_v2. src/operations/handlers/fire_missions.rs:221-238 parses event_id and inserts it with no SELECT on events; migrations/0019_ingest_pointer_foreign_keys.sql:109-110 leaves fire_missions.event_id unconstrained because save_fire has no foreign_key_error arm, so a fire mission can point at a missing or deleted event and is then unreachable. :274-291 list_event_fire_missions takes AuthUser (_u unused) and returns every row for the event id, while other event reads apply operations/services/event_access/visibility.rs viewer_event_access (operations/handlers/event_listing.rs:87). Check existence and visibility on save and list (and add the FK with an error arm). Source: Phase 5 doc writer F03. 2026-09-28 (milestone V): the existence half is fixed; list and save for a missing event answer 404 through require_event (src/operations/handlers/fire_missions.rs:237,292). Still open: the list takes AuthUser without viewer_event_access (:286), and fire_missions.event_id has no foreign key, which needs a migration and a dangling-row policy (operator decision). 2026-09-28 (milestone B): the remainder is delivered. src/operations/handlers/fire_missions/mod.rs:37 applies viewer_event_access to list and save; migrations/0060_game_ballistics_catalogs_and_fire_mission_inputs.sql:59-86 detaches dangling rows into detached_event_id and adds fire_missions_event_id_fkey. Evidence: tests/game_ballistics_fire_missions.rs:660 game_ballistics_fire_mission_event_foreign_keys_answer_404, :737 game_ballistics_fire_mission_list_and_save_follow_viewer_event_access; tests/game_ballistics_migration.rs:339 game_ballistics_migration_detaches_fire_missions_naming_a_missing_event. Ships after the B commit is stamped."
created_at = "2026-09-25T23:35:04Z"

