notes = "Paths under tools_v2/developer-tools/src unless stated; browser_testing/cli.rs lines are at HEAD (the file carries another session's uncommitted edit). Help and usage: (1) browser_testing/cli.rs:46-47, the gate smoke doc, lists 18 names; browser_testing/editor_smoke_tests/run_smoke.rs:14-37 also dispatches outliner-drag, save-dialog-rect, entrance-motion-rect, virtual-outliner, perf and perf-strict. (2) browser_testing/editor_smoke_tests.rs:9 promises exit 2 for a usage or scenario error, but an unknown smoke is an Err (run_smoke.rs:38) that cli.rs:217 maps to exit 3. (3) blueprint/archive_emission/archive_command.rs:163, the --all-prefabs unknown-argument usage, omits --all-layers, which :145 accepts. Comments: (4) browser_testing/cdp.rs:3-5 and cdp/sleep_ms.rs:138 say the launch passes lavapipe WebGPU flags; sleep_ms.rs:175-184 passes the backend's flags (SwiftShader or ANGLE/Vulkan) and --enable-unsafe-webgpu, no lavapipe flag. (5) browser_testing/diagnostics/ensure_gate_font_cache.rs:96-100 calls the per-child XDG_CACHE_HOME an eventual fix that would let the unsafe set_var (:90) go; cdp/sleep_ms.rs:187 already sets it per child, so either remove the set_var as the comment says or rewrite the comment. (6) ensure_gate_font_cache.rs:313 says check_toolchain checks wasm-bindgen; :316 checks rustc and trunk only. (7) blueprint/mesh_decoding/mesh_format/u16le.rs:259-260 says parse_xob defaults to the numerically lowest tier; :281-283 picks the tier with the most triangles. (8) browser_testing/route_drift.rs:7 says the gate set- and column-diffs the route table; :63 compares the two CSV strings byte for byte. (9) world_export_pipeline/mod.rs:29-31 says xtask may not read INSTANCE_KINDS; tools_v2/xtask/src/verifications/schemas/checks/object_type_inventory.rs:66 reads it. (10) .github/workflows/ci.yml:91-92 says the mod gate scopes itself to --lib enfusion_tooling::; the gate runs enf:: (the filter itself is T-1106). (11) browser_testing/editor_smoke_tests.rs:36 says SEED_N must match mission_doc.rs; the constant is apps/website/frontend/src/v2/apps/editor/bridge/document_host/doc_host.rs:14. (12) browser_testing/editor_smoke_tests/run_smoke.rs:5 ('the Node defaults') and :42-43 ('glob order', 'the Makefile set -e semantics'); the suite runs EDITOR_SUITE order (editor_smoke_tests.rs:40). (13) blueprint/archive_emission/archive_writer.rs:7 and :9 link world::binary::archives::BuildingBlueprintArchive and world::occluder::descriptor; the types are website_map_engine::io::archives::blueprints (io/archives/blueprints.rs:257) and spatial::los::world::descriptor (archive.rs:43); its :151 is on T-1068. (14) Messages name a subcommand copy-world-export-profile (world_export_pipeline/chunk_partitioner/object_partitioning.rs:76, export_preparation/object_census.rs:76, export_preparation/export_profile.rs:45, :55, :75, :87, :112, :118, :125, :133, export_preparation.rs:38); the CLI subcommand is world copy-export-profile (world_export_pipeline/cli.rs:61). History, ticket and Node-harness wording in the same files is on T-1004. Source: README writers R19 (R19r), R20.1 (R20.1r) and R20.2."
