notes = '''
WAVE 256 PRE-DISPATCH, 2026-09-08 — command-centre corrections, all measured against main at f71d2d0b2.

owns WIDENED +1: crates/map-engine-core/src/doc/store.rs. move_slot_to_squad (store.rs:1138) is the only
public path that moves a slot between squads, and it calls garbage_collect_squad_in_txn at :1187-1196,
which deletes the squad row (:5398), prunes it out of faction.squadIds (:5390-5397) and DELETES EVERY
ATTACHED VEHICLE (:5384-5389); ensure_leader_invariant_in_txn (:5402-5412) does the same on the dest side.
The full public squad surface is store.rs:1101, :1107, :1116, :1138, :1209, :1335, :1380 — there is no
non-GC path. Requirement 3 ("an emptied squad stays") was therefore unsatisfiable from the original three
files. Add an ADDITIVE keep-source entry point; do not change the existing default. The in-owns workaround
(re-add_squad from reassign.rs) was rejected: it still loses the attached vehicles, loses leaderSlotId, and
re-appends to the tail of faction.squadIds rather than restoring position.

T-932 also owns store.rs and was set queued for wave 256 so the two cannot share a wave; it packs into 257.

REQUIREMENT 1 CORRECTED: side keys are DERIVED, not stored. resolve_slot_side_key (store.rs:6941-6966)
walks slot.squadId -> squad.factionId -> faction.key, defaulting BLUFOR at every missing hop; the result is
materialised into SlotSoa.side_keys (store.rs:965-976) and memoised per-squad by SideKeyMemo (store.rs:360,
:439, :923). Nothing writes a side key, so "updating side keys" had nothing to update and the original
perturbation step ("skip the side-key update") had nothing to skip. The perturbation target is now the
keep-source path.

ANCHORS RE-VERIFIED EXACT: attributes_modal.rs:1864-1872 (squad rendered read-only, inert div at
:1924-1929); no faction control exists — every faction hit at :1546-1607 and :1749-1842 belongs to
type_picker (:1583), which edits assetId. with_batch is batch.rs:11, re-exported at operations.rs:46 and
reachable from both owned frontend files. The multi-selection is already materialised as targets at
attributes_modal.rs:408-412 via attrs_multi_ids (attrs.rs:488-513). Faction and squad lists come from
orbat_manager_snapshot (entity.rs:1995); FactionRow (panels/outliner.rs:343-350) carries key and ordered
squad_ids, which is what the picker and the cross-faction refusal need.
'''

