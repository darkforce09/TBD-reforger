notes = "apps/ticketboard/src/ticket_actions/services/commands/transitions.rs:195-208 descendants() collects every corpus id that starts with '<id>.', and its doc says this is the closure remove --force cascade-deletes, shown as the Remove dialog's red warning list. tools_v2/ticket-engine/src/ops/ordering.rs:5-12 remove() with force cascade-deletes the closure over children[] edges and work parent back-edges. Live case: program T-111 lists children = [T-067.1] and T-067.1 has parent = T-111, so the dialog for T-111 lists nothing while remove T-111 --force deletes T-067.1. Build the list from children[] and parent links, or ask the engine for its closure. Source: README writer R21.3."
