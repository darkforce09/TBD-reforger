notes = "Paths under apps/mod/tbd-framework/Scripts/Game/TBD unless given. Nonexistent files: world-boot.sh (no tracked file; the gate is cargo xtask mod world-boot) in 45 comment lines across API/TBD_IdentityLink.c, Gamemode/Objectives/TBD_ObjectivesComponent.c:47, Gamemode/Orchestrator/TBD_FrameworkManager.c:357, Session/Briefing/TBD_BriefingController.c, Session/Briefing/TBD_BriefingService.c, Session/Lobby/TBD_LobbyComponent.c, TBD_LobbyService.c, TBD_LobbyStage.c, TBD_PreSlotComponent.c, Session/MissionSelector/TBD_MissionBrowser.c, Systems/Loadouts/TBD_LoadoutEquipHelper.c, Systems/Markers/TBD_MarkerClient.c, TBD_MarkerComponent.c, TBD_MarkerData.c, TBD_MarkerIcons.c, Systems/Mission/Loaders/TBD_MissionValidator.c, Systems/Radio/TBD_RadioComponent.c, TBD_RadioController.c, TBD_RadioService.c, Systems/Spawning/TBD_SpawnManager.c (git grep -c 'world-boot\\.sh'). Backend/ paths (the loader is Systems/Mission/Loaders/TBD_MissionLoader.c): Gamemode/Stages/TBD_WinConditionEvaluator.c:45,51; Gamemode/Objectives/TBD_ObjectiveRules.c:16,20; Systems/AI/TBD_GroupState.c:10; Systems/AI/TBD_WaypointRuntime.c:10,16; Systems/Mission/Data/TBD_VehicleState.c:12; Systems/Mission/Loaders/TBD_MissionValidator.c:1193,1513; Systems/Radio/TBD_RadioPlan.c:4; Systems/Zones/TBD_TriggerRuntime.c:29; API/TBD_ResultsReporter.c:50 (also 'TBD_LobbyStage in TBD_LobbyController.c'; it is Session/Lobby/TBD_LobbyStage.c). chimeraMenus: UI/Core/TBD_MenuStack.c:23 and UI/Core/TBD_ShellScreen.c:24 cite Configs/Systems/Menus/chimeraMenus.conf (real apps/mod/tbd-framework/Configs/System/chimeraMenus.conf); TBD_ShellScreen.c:23 gives 'class TBD_LobbyScreen : TBD_ShellScreen' as the example, but Session/Lobby/UI/TBD_LobbyScreen.c:19 derives from TBD_DockScreen. api_v2 paths (real handlers live under apps/website/api_v2/src/<domain>/handlers/): API/TBD_PlayerIdentity.c:7,12 (handlers/me.rs, handlers/telemetry.rs), API/TBD_IdentityLink.c:6,8,9 (handlers/telemetry.rs, handlers/me.rs, app.rs), API/TBD_ResultsReporter.c:28 (handlers/telemetry.rs). Fixture: UI/Mock/TBD_LobbyMock.c:10 'golden-missions/slot-loadout-coverage.json' (real contracts_v2/fixtures/missions/valid/slot-loadout-coverage.json). Radio: Systems/Radio/TBD_RadioClient.c:7-9 says all five TBD menu presets fail to resolve because the rdb is stale (fixed by the addon.gproj MenuConfigs, T-181.25), :17-18 names GetNets() (the accessor is GetNetLines :157) and UI/TBD_BriefingData.c (real Session/Briefing/TBD_BriefingData.c); Systems/Radio/TBD_RadioBridgeStub.c:21,89 and Systems/Radio/TBD_RadioService.c:146 cite TBD_FrameworkManager.c:250 for the OnStageChanged call (it is at :1200). Spectator: Session/Spectator/TBD_SpectatorHost.c:18 says the camera reports 'four times a second' and :112 'corrected 250 ms later', but Session/Spectator/TBD_SpectatorController.c:72 POLL_MS = 250 and :84-89 HOST_REPORT_EVERY_TICKS = 2 send twice a second. Objectives: Gamemode/Objectives/TBD_ObjectiveRegistry.c:1677-1679 says the consumer is the chat feed and a HUD cannot be the consumer yet; the HUD ships (Gamemode/Objectives/TBD_ObjectivesComponent.c:971, UI/Hud/TBD_ObjectiveHud.c). Mission params: Systems/Mission/Data/TBD_MissionParams.c:10 'There is no lobby on this build'. Vendored handler: apps/mod/tbd-emcp/Scripts/WorkbenchGame/EnfusionMCP/EMCP_WB_Layers.c:4 lists a setVisible action the handler never dispatches (:100-142 handle list, getActive, getEntityLayer); the file is vendored from enfusion-mcp@0.6.1, so decide whether to diverge. Dropped: TBD_MarkerService mentions are valid (class at Systems/Markers/TBD_MarkerData.c:51). Source: README writers R12, R13, R14.1 and R14.2."

