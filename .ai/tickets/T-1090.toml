ts/TBD_ResultsReporter.c:50 (also 'TBD_LobbyStage in TBD_LobbyController.c'; it is Session/Lobby/TBD_LobbyStage.c). chimeraMenus: apps/mod/tbd-framework/Scripts/Game/TBD/UI/Core/Screens/TBD_MenuStack.c:23 and apps/mod/tbd-framework/Scripts/Game/TBD/UI/Core/Screens/TBD_ShellScreen.c:24 cite Configs/Systems/Menus/chimeraMenus.conf (real apps/mod/tbd-framework/Configs/System/chimeraMenus.conf); TBD_ShellScreen.c:23 gives 'class TBD_LobbyScreen : TBD_ShellScreen' as the example, but Session/Lobby/UI/TBD_LobbyScreen.c:19 derives from TBD_DockScreen. api_v2 paths (real handlers live under crates/api/api_server/src/<domain>/handlers/): apps/mod/tbd-framework/Scripts/Game/TBD/API/Identity/TBD_PlayerIdentity.c:7,12 (handlers/me.rs, handlers/telemetry.rs), apps/mod/tbd-framework/Scripts/Game/TBD/API/Identity/TBD_IdentityLink.c:6,8,9 (handlers/telemetry.rs, handlers/me.rs, app.rs), apps/mod/tbd-framework/Scripts/Game/TBD/API/Results/TBD_ResultsReporter.c:28 (handlers/telemetry.rs). Fixture: UI/Mock/TBD_LobbyMock.c:10 'golden-missions/slot-loadout-coverage.json' (real contracts/fixtures/missions/valid/slot-loadout-coverage.json). Radio: Systems/Radio/TBD_RadioClient.c:7-9 says all five TBD menu presets fail to resolve because the rdb is stale (fixed by the addon.gproj MenuConfigs, T-181.25), :17-18 names GetNets() (the accessor is GetNetLines :157) and UI/TBD_BriefingData.c (real Session/Briefing/TBD_BriefingData.c); Systems/Radio/TBD_RadioBridgeStub.c:21,89 and Systems/Radio/TBD_RadioService.c:146 cite TBD_FrameworkManager.c:250 for the OnStageChanged call (it is at :1200). Spectator: apps/mod/tbd-framework/Scripts/Game/TBD/Session/Spectator/Host/TBD_SpectatorHost.c:18 says the camera reports 'four times a second' and :112 'corrected 250 ms later', but apps/mod/tbd-framework/Scripts/Game/TBD/Session/Spectator/Controller/TBD_SpectatorController.c:72 POLL_MS = 250 and :84-89 HOST_REPORT_EVERY_TICKS = 2 send twice a second. Objectives: apps/mod/tbd-framework/Scripts/Game/TBD/Gamemode/Objectives/Engine/Registry/TBD_ObjectiveRegistry.c:1677-1679 says the consumer is the chat feed and a HUD cannot be the consumer yet; the HUD ships (apps/mod/tbd-framework/Scripts/Game/TBD/Gamemode/Objectives/Engine/Runtime/TBD_ObjectivesComponent.c:971, UI/Hud/TBD_ObjectiveHud.c). Mission params: Systems/Mission/Data/TBD_MissionParams.c:10 'There is no lobby on this build'. Vendored handler: apps/mod/tbd-emcp/Scripts/WorkbenchGame/EnfusionMCP/EMCP_WB_Layers.c:4 lists a setVisible action the handler never dispatches (:100-142 handle list, getActive, getEntityLayer); the file is vendored from enfusion-mcp@0.6.1, so decide whether to diverge. Dropped: TBD_MarkerService mentions are valid (class at Systems/Markers/TBD_MarkerData.c:51). Source: README writers R12, R13, R14.1 and R14.2. More stale comments (TF15; doc writers F10b, F15a; paths under apps/mod/tbd-framework/Scripts/Game/TBD). Gamemode/Orchestrator/TBD_FrameworkManager.c:319 documents m_sDebriefBoard as 'kills\tfaction\trole\tname' per line, but Session/PostGame/UI/TBD_DebriefScreen.c PackRows (:71-87) writes five fields (kills, deaths, faction, role, name). Session/Lobby/TBD_LobbyClient.c:45-46 and Session/Lobby/TBD_LobbyData.c:135 say m_bAutoDeploy is 'still 1' and deploys everyone into LOBBY, but Prefabs/Systems/TBD_GameMode.et:7 sets it to 0 and apps/mod/tbd-framework/Scripts/Game/TBD/Systems/Spawning/Manager/TBD_SpawnManager.c's own T-941.2 note says the wave no longer fires in LOBBY; the same flag's comment at TBD_SpawnManager.c:103-106 still says the slot picker 'will default this off' and calls the pull path the production entry. Session/Briefing/TBD_BriefingController.c:298-301 says the briefing screen always fails to open because TBD_UIBriefing is not in resourceDatabase.rdb, the same stale claim as Systems/Radio/TBD_RadioClient.c:7-9 (the preset is registered in Configs/System/chimeraMenus.conf). Systems/Markers/TBD_MarkerIcons.c:51-53 says the schema has no marker colour field, but marker.color exists and Systems/Markers/TBD_MarkerData.c:171, :292 and :442-444 carry and parse it. Paths with no successor (checked 2026-10-04, restructure S12): Gamemode/Objectives/TBD_ObjectiveRules.c: removed in commit 6270ea673, no successor; Session/Briefing/TBD_BriefingController.c: removed in commit c7afddd02, no successor; Session/Briefing/TBD_BriefingData.c: removed in commit c7afddd02, no successor; Session/Lobby/TBD_LobbyData.c: removed in commit e198b3e64, no successor; Session/MissionSelector/TBD_MissionBrowser.c: removed in commit 8210e3784, no successor; Systems/Loadouts/TBD_LoadoutEquipHelper.c: removed in commit f8f8701c4, no successor; Systems/Markers/TBD_MarkerData.c: removed in commit 03d9d83be, no successor; UI/TBD_BriefingData.c: removed in commit c7afddd02, no successor.'''
