id = "T-1157"
kind = "work"
title = "Fix Mission Creator Space, Ctrl+X, drag-select and Arrange menu gaps"
summary = "Space centring skips the camera-settle refresh and ignores vehicles; Ctrl+X copies only slots yet deletes selected comments; dragging an unselected entity skips refresh_selection; the Arrange menu enables at one selection while ARRANGE_MIN_SELECTION is two."
class = "bug"
status = "idea"
notes = "Paths under apps/website/frontend/src/v2/apps/editor unless stated. Space: input/window_keydown.rs:178 calls bridge/host_state/entity_selection.rs:160-188 center_on_selection, which calls set_view and on_camera_changed but not streaming::host::schedule_camera_settle (pan, zoom and wheel call it: input/pointer_gestures/pointer_move.rs:82, pointer_up.rs:133, wheel_zoom.rs:39), and whose centroid (map-engine data/store/operations/entity/selection.rs:92-108) averages slot rows only, so a selection of vehicles does not centre. Ctrl+X: window_keydown.rs:138-140 runs copy_selection (map-engine data/store/operations/entity/clipboard.rs:161-184 copies slots only) then delete_selection, which also removes selected comments (clipboard.rs:18-25) and every connection touching a selected id (:27-29), so cut and paste loses them. Drag start: input/pointer_gestures/pointer_move.rs:250-264 replaces the selection when the press lands on an unselected entity but does not call refresh_selection, so the inspector and outliner mirrors show the old selection during the drag. Arrange: ui/docks/top_strip/view/menu_row.rs:96-106 enables Pattern, Align, Space and Orient at one selected entity; ui/docks/top_strip/arrange.rs:131 ARRANGE_MIN_SELECTION is 2 and the placement operations no-op below two points (map-engine data/store/operations/placement/alignment.rs:37). Source: Phase 5 doc writers F05, F06 and F07a."
created_at = "2026-09-25T23:24:32Z"

