summary = "api_v2 missions/handlers/mission_export.rs:18 serves the strict export envelope to mission makers, but no frontend, mod or tools_v2 code calls it; the Mission Creator builds the same envelope client-side (shell/document_commands/imp/exports.rs:93 export_now)."
