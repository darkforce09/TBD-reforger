notes = "All paths under legacy/map_engine/src unless stated. No production caller: crates/line_of_sight/world_line_of_sight/src/raycast.rs:196 blocked_fn (tests/occluder.rs:856 only); crates/streaming/map_asset_loading/src/mesh_composition.rs:143 compose_forest_mesh and its FOREST_FILL_RGB :80; crates/world_objects/vegetation/src/mass.rs:199 forest_mass_from_corners (mass_tests.rs only) and mass.rs:13 FOREST_FILL_RGB (a duplicate of mesh.rs:80, read by a test only); crates/map_rendering/world_layers_gpu/src/building_layer.rs:147 clear_world_buildings; crates/line_of_sight/world_line_of_sight/src/occluder_library/building_archive.rs:92-132 ArchiveBoot::blas_by_pid (built, read only by tools/map_assets/blueprint_compiler/src/archive_emission/tests/archive_writer_tests.rs:220; crates/streaming/map_asset_loading/src/occluder_loader.rs never reads it, though its doc says a loader queues sidecars with it); crates/streaming/chunk_scheduler/src/budget.rs:21 ingest_budget_exhausted_at (tests only); crates/streaming/chunk_scheduler/src/viewport.rs:233 release_inflight and :240 invalidate_chunk; crates/streaming/map_streaming_host/src/lib.rs:35-36 memory_hud_suffix re-export; crates/terrain/terrain_relief/src/contours.rs:351 contour_segments (tests only); crates/terrain/road_network/src/airfield.rs:28 RUNWAY_POLISH_WIDTH_M (duplicate of roads/styling.rs:309, the one in use), :31 APRON_AREA_MIN_M2, :74 polygon_area_m2, :206 apron_qualifying_area_m2; crates/terrain/terrain_elevation/src/grid.rs:38 APRON_DEM_DOWNSAMPLE_FACTOR; crates/map_rendering/map_renderer/src/cull.rs:25-95 compute_cull_enabled, set_compute_cull_debug_hud, compute_cull_cpu_count, compute_cull_gpu_count, compute_cull_gpu_sampled, compute_cull_cpu_count_for_frustum; crates/map_rendering/map_renderer/src/lifecycle.rs:45-51 submitted_last_frame getter; crates/map_rendering/map_render_diagnostics/src/readback road_centerline.rs:19, marquee.rs:20, compute_cull.rs:15, sea_band.rs:19, text.rs:20, world_building.rs:1