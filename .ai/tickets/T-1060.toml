id = "T-1060"
kind = "work"
title = "Check map streaming stubs re-fetched and satellite budget never released"
summary = "crates/streaming/chunk_scheduler/src/viewport.rs:172-183 note_undelivered never adds known_empty, so evict (:224) drops the stub and a later pin fetches it again; crates/streaming/map_asset_loading/src/live_memory_budget/accounting.rs:49-53 reserves satellite bytes that nothing releases, so a second load sees less budget."
class = "audit"
status = "idea"
notes = "Stub: crates/streaming/chunk_scheduler/src/viewport.rs:172-183 (note_undelivered inserts an empty WorldChunk; its doc says the stub is never re-requested) is reached from the fetch-failure cap at :160-168; only crates/streaming/chunk_scheduler/src/chunk_ingest.rs:120-132 (apply_parsed_chunk) inserts into known_empty, and evict at crates/streaming/chunk_scheduler/src/viewport.rs:215-250 skips only pinned and known_empty ids, so an undelivered stub is evictable and its later pin fetches the missing file again. Satellite: crates/streaming/map_asset_loading/src/live_memory_budget/accounting.rs:49-59 (claim_satellite_floor reserves walk.bytes on Asset::Satellite through Ledger::reserve, crates/streaming/map_streaming_model/src/memory_budget/ledger.rs:74-83); nothing releases or set_helds the satellite row (the only release calls are crates/streaming/map_streaming_host/src/terrain_load.rs:229 and :256, hillshade and DEM), and the ledger is one thread-local per page (crates/streaming/map_asset_loading/src/live_memory_budget/mod.rs:12), so a second load_satellite (crates/streaming/map_asset_loading/src/terrain/satellite_quadtree/bootstrap.rs:68 via basemap.rs:119) walks its floor under the first load's bytes. Related test gap: crates/streaming/chunk_draw_buffers/src/tests/residency_lifecycle/cases_1.rs:213-226 (eviction_order_is_ascending_last_used) checks only that evicted ids are gone, never the order."
created_at = "2026-09-24T19:08:26Z"

