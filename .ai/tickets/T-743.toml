OPERATOR DECISION 2026-08-08 — option (c), fix it properly in Rust. The byte-parity with the JS oracle was ONLY a migration safety measure so the rewrite could not silently lose behaviour; it is not a contract worth keeping. Operator: paste landing 20 m from its source is clearly wrong. ACTION-PASTE-ORIG-001 must land EXACTLY at the source position and the golden-test churn is accepted. LOCATION re-derived by the orchestrator (the cites above have drifted): the offset is the `_ => (PASTE_NUDGE, PASTE_NUDGE)` arm of paste_slots' anchor match in crates/map-engine-core/src/doc/store.rs (~:2972), PASTE_NUDGE = 20.0 (~:5117). Plain Ctrl+V is mission_editor.rs:3195 paste_at_cursor(cx, cy) — ANCHORED, correct, leave it. Paste-at-original is mission_editor.rs:3217 paste_at_cursor(None, None). WARNING — THE ARM IS SHARED AND MUST BE SPLIT: that same no-anchor branch is also the fallback when a PLAIN paste happens with the cursor off-map (PASTE_NUDGE's own doc says so). Zeroing the constant would silently turn every off-map plain paste into a paste-at-original. Give paste-at-original its own zero-offset path and state deliberately what the off-map fallback should do. Also correct the three artifacts that assert the opposite, and the help-row copy at eden_help.rs.

--- HEAD migration_legacy (verbatim) ---

MAJOR from the wave-113 adversarial verifier, independently confirming the T-669 slice agent's contradiction of its own ticket. FACT: MissionDocCore::paste_slots' no-anchor arm is UNCONDITIONAL — `_ => (PASTE_NUDGE, PASTE_NUDGE)` at store.rs:2175-2178 with PASTE_NUDGE = 20.0 (store.rs:4225). Ctrl/Cmd+Shift+V calls paste_at_cursor(None, None), hits that arm, and every slot lands at (x+20, y+20) clamped. So the shipped behaviour is 'paste NEAR original, +20m on both axes', not 'paste at original'. THREE ARTIFACTS ARE WRONG ON THIS POINT OF FACT and must be corrected regardless of what is decided: the T-669 registry summary ('paste_at_cursor(None, None) is LITERALLY paste-at-original'), gap_analysis.md:265, and interactions_sweep.md:233. NOT the slice's fault and not silently fixable: the 20m nudge is deliberate byte-parity with the JS oracle ydoc.pasteSlots, so removing it is a semantics change with a golden-test blast radius, not a slice-sized edit. The slice shipped the arm as specified and made its own in-code comment honest, but the help row copy (eden_help.rs:108, 'Paste at the source position') repeats the overstatement. OPERATOR DECISION NEEDED — three options: (a) re-scope the row to 'paste without moving to the cursor (oracle 20m nudge)' and soften the help copy, (b) add an exact-coordinate paste variant as new work, (c) change PASTE_NUDGE semantics and accept the golden-test churn. ALSO folded in from the same report: the T-669 summary's claim that this ticket 'touches exactly one file' is stale — it also touched eden_help.rs, forced by T-692's coverage pins. Diagnosis: editor_verify/wave113.md F-1, F-4.

