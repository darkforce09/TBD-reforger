notes = "OPERATOR DECISION 2026-08-08 — option (c), fix it properly in Rust. The byte-parity with the JS oracle was ONLY a migration safety measure so the rewrite could not silently lose behaviour; it is not a contract worth keeping. Operator: paste landing 20 m from its source is clearly wrong. ACTION-PASTE-ORIG-001 must land EXACTLY at the source position and the golden-test churn is accepted. LOCATION re-derived by the orchestrator (the cites above have drifted): the offset is the `_ => (PASTE_NUDGE, PASTE_NUDGE)` arm of paste_slots' anchor match in crates/map-engine-core/src/doc/store.rs (~:2972), PASTE_NUDGE = 20.0 (~:5117). Plain Ctrl+V is mission_editor.rs:3195 paste_at_cursor(cx, cy) — ANCHORED, correct, leave it. Paste-at-original is mission_editor.rs:3217 paste_at_cursor(None, None). WARNING — THE ARM IS SHARED AND MUST BE SPLIT: that same no-anchor branch is also the fallback when a PLAIN paste happens with the cursor off-map (PASTE_NUDGE's own doc says so). Zeroing the constant would silently turn every off-map plain paste into a paste-at-original. Give paste-at-original its own zero-offset path and state deliberately what the off-map fallback should do. Also correct the three artifacts that assert the opposite, and the help-row copy at eden_help.rs."
