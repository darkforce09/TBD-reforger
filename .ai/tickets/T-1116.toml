title = "Decide one precedence between deploy.env and environment variables"
summary = "debug remote-logs lets an exported variable beat deploy.env (debug/remote_logs/execution.rs:307-318), while deploy staging lets deploy.env beat the environment (deploy/staging/config.rs:179-184), so the same exported TBD_SSH_HOST reaches different hosts."
class = "audit"
status = "shipped"
order = 9826
notes = "Paths under tools_v2/xtask/src/commands. Three rules for the same keys (TBD_SSH_HOST, TBD_PROFILE_DIR, TBD_SSH_PASS, TBD_SSH_IDENTITY_FILE): (1) environment first, deploy.env fills gaps: debug/remote_logs/execution.rs:304-318 (cmd_remote); (2) deploy.env first, environment fills gaps: deploy/staging/config.rs:179-186 ('Snapshot the process environment, then let the file win') and debug/direct_join.rs:125-139 (load_ssh_vars); (3) deploy.env only, with DEPLOY_ENV choosing the file: deploy/website.rs:58-73 and :81-88 (require_var reads only the parsed map). So an operator who exports TBD_SSH_HOST to probe another machine gets that machine from 'debug remote-logs' but the deploy.env host from 'debug direct-join' and 'deploy staging'. Each command also carries its own deploy.env parser (debug/remote_logs/shell_quote.rs:26, debug/direct_join.rs:141, deploy/staging/config.rs:110, deploy/website.rs:456). Either may be intended (the R17.2 writer marked it 'may be intended'); decide one rule, put it in one shared loader, and state it in the deploy README. Source: README writer R17.2. 2026-09-28: decided and delivered. One rule for every command, in tools_v2/xtask/src/core/deploy_environment.rs: deploy.env decides every key it assigns (an empty assignment counts as unset), the process environment fills only keys the file never assigns, an explicit flag such as debug a2s-probe --host beats both, and DEPLOY_ENV selects the file for every command (deploy staging hands the resolved absolute path to the mod remote-logs child). The five private parsers are gone; the rule is stated in tools_v2/xtask/deploy/README.md. Evidence: core/tests/deploy_environment/tests.rs an_empty_assignment_in_the_file_beats_the_process_environment and the_process_environment_fills_only_keys_the_file_never_assigns."
main_goal = "Every command reads deploy.env under one precedence rule through one loader."
context = ["Commands disagreed: debug remote-logs let an exported variable beat deploy.env, other readers let the file win, deploy website read the file alone, and five commands parsed it separately."]
requirement = ["One loader, one rule: the file decides every key it assigns, empty meaning unset; the environment fills the rest; an explicit flag beats both; DEPLOY_ENV selects the file."]
current_state = ["DeployEnvironment (tools_v2/xtask/src/core/deploy_environment.rs) is the only reader; deploy staging sets DEPLOY_ENV to the absolute file path on its mod remote-logs child."]
approach = ["Replace the five private parsers with the shared loader and its grammar module, and state the rule in the deploy README and the example's header."]
verify = [
    "cargo test -p xtask an_empty_assignment_in_the_file_beats_the_process_environment",
    "cargo test -p xtask the_process_environment_fills_only_keys_the_file_never_assigns",
    "cargo test -p xtask deploy_env_file_beats_the_process_environment",
]
acceptance = ["A stale exported TBD_SSH_HOST never changes the host any command reaches when deploy.env assigns it, and every command honours DEPLOY_ENV."]
