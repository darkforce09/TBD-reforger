class = "bug"
status = "idea"
executor = "claude-code"
main_goal = "Shared CARGO_TARGET_DIR lets a main-checkout `make api` serve unmerged slice code built in another worktree."
context = [
    "Found by T-192's agent during wave 1.",
    "scripts/platform/wave.sh points every worktree at the main checkout's target/ — necessary, because a per-worktree target is ~44GB and eight of them exhaust 129GB free by the third slice.",
]
requirement = ["Options: give run-only binaries a separate target dir, use sccache instead of a shared dir, or make the preflight assert the running API's build hash matches main."]
