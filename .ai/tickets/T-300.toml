    "The sharp edge: cargo considered a binary built inside a worktree fresh for a build launched from the main checkout,",
    "so `make api` came up on :8080 serving UNMERGED slice code.",
    "The agent caught it, ran `cargo clean -p website-api`, and verified :8080 served main again.",
    "Risk during an 8-wide wave: any gate or smoke that RUNS a binary (rather than check/test/clippy, which recompile per fingerprint)",
    "can execute another slice's unmerged work and report a result about code that is not on main.",
]
approach = ["Do not simply revert to per-worktree targets — that trades a subtle bug for a certain disk exhaustion."]
