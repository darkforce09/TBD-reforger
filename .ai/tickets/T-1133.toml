notes = "Paths under tools/developer_tools/src. (1) Two js_num: tools/map_assets/world_export_pipeline/src/forest_contours.rs:24 returns Null for a non-finite value, tools/map_assets/world_export_pipeline/src/json_number_formatting.rs:8 panics ('finite'); keep one. (2) Two REQUIRED_EVERON_TOWNS [&str; 7]: tools/map_assets/map_raster_pipeline/src/map_labels.rs:26 (private) and tools/map_assets/map_asset_verification/src/labels.rs:26 (pub), same seven names; the pipeline should use the verifier's constant or a shared one. (3) repo_root lives in tools/browser_testing/browser_gate_suites/src/server.rs:434 while repository_layout.rs holds every other checkout path; world_export_pipeline (chunk_partitioner.rs:22, chunk_partitioner/object_partitioning.rs:12, classify.rs:14, export_preparation.rs:18, mathematical_verification.rs:19, reclassify.rs:48, roads_emit.rs:48 and tests), map_raster_pipeline (aerial_orthophoto.rs:18, cartographic_rendering.rs:13), tools/enfusion/enfusion_mcp_broker/src/broker.rs:185 and tools/browser_testing/browser_gate_suites/src/dom_oracle/fixture_router.rs:17 import it from there; move it to repository_layout. (4) Fixture paths spelled outside repository_layout: tools/browser_testing/browser_gate_suites/src/dom_oracle/routes.rs:108 (fixtures/dom_oracle/oracle-freeze), tools/browser_testing/browser_gate_suites/src/route_drift.rs:19 (fixtures/dom_oracle/manifests/routes.csv) and :17 (crates/frontend/foundation/frontend_route_table/src/routes.rs), tools/browser_testing/browser_gate_suites/src/dom_oracle/fixture_router.rs:17 (contracts/fixtures/api_goldens), and the blueprint tests' test_fixtures/blueprint paths (tools/map_assets/blueprint_compiler/src/tests/blueprint_from_voxels_tests.rs:6, tests/rotation_pin/tests.rs:27, tests/verify/tests.rs:201). (5) world census (tools/map_assets/world_export_pipeline/src/export_preparation/object_census.rs:209) and world validate-exports (export_preparation/export_validation/artifact_integrity.rs:276) spawn 'cargo run -q -p xtask -- schema type-inventory', and map verify-cartographic spawns cargo xtask steps (tools/map_assets/map_raster_pipeline/src/cartographic_rendering/build_tile_pyramid.rs:216-222): a nested cargo build inside a running tool, on whatever toolchain and target directory the shell has. xtask depends on developer_tools, so decide between moving the shared check into developer_tools and leaving the orchestration to xtask. Source: README writers R20.1 (R20.1r) and R20.2."
