# Eden Editor wiki scrape manifest: every Bohemia wiki page the Eden catalogs cite, by category.
# Each scraped page is cached as Markdown in documentation/crates/frontend/workspaces/mission_creator_workspace/eden_editor_reference/eden_wiki_scrape/, named after its slug with
# ":" written "__". No tool reads this file; a page is scraped and its entry updated by hand.
# status: pending | scraped | reviewed | failed
# ticket: the slug of the ticket in the ticket manager (ttm) whose topic the page informs

