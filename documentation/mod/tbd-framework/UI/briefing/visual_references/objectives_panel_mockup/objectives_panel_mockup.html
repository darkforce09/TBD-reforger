<!DOCTYPE html><html lang="en" class="h-full" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBD Reforger - Objectives Panel (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: {
              DEFAULT: '#0b1120',
              dim: '#080e1d',
              card: '#0f172a',
              container: '#151b2b',
              border: '#1e293b',
              borderHover: '#334155'
            },
            accent: {
              blue: '#3b82f6',
              blueGlow: 'rgba(59, 130, 246, 0.15)',
              cyan: '#38bdf8',
              amber: '#f59e0b',
              red: '#ef4444',
              green: '#10b981'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
  </style>
</head>
<body class="h-full bg-[#070b14] text-slate-100 flex items-center justify-center p-6 antialiased font-sans select-none">

  <!-- Standalone Objectives Card -->
  <div class="w-full max-w-[440px] bg-[#0d1322]/95 backdrop-blur-xl border border-slate-800/80 rounded-xl shadow-2xl p-5 flex flex-col gap-4">

    <!-- Header Section -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
          <span class="material-symbols-outlined text-[18px]">target</span>
        </div>
        <div>
          <h2 class="text-xs font-bold tracking-widest text-slate-200 uppercase font-mono">Mission Objectives</h2>
        </div>
      </div>
      
    </div>

    <!-- Directives Summary Box -->
    <div class="px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-800/60 flex items-center justify-between text-xs">
      <div class="flex items-center gap-2 text-slate-300">
        <span class="material-symbols-outlined text-[16px] text-amber-400">timer</span>
        <span class="text-slate-400">Time Limit:</span>
        <span class="font-mono font-semibold text-slate-200">60 Minutes</span>
      </div>
      <span class="text-[11px] font-mono text-slate-400">Capture 2 of 2</span>
    </div>

    <!-- Objective Items List -->
    <div class="flex flex-col gap-3"><div class="group relative rounded-lg bg-[#131b2e]/90 hover:bg-[#162038] border border-slate-800/80 hover:border-blue-500/40 transition-all duration-200 p-3.5 flex flex-col gap-3 shadow-sm">
  <div class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-2.5">
      <span class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 flex items-center justify-center text-[10px] font-mono font-bold">1</span>
      <span class="text-sm font-semibold text-white tracking-wide">Southern Zone</span>
    </div>
    <div class="flex items-center font-mono text-[10px] uppercase font-semibold tracking-wider px-2 py-0.5 rounded-full bg-slate-800/80 border border-slate-700 text-slate-300">Defend</div>
  </div>

  <div class="grid grid-cols-2 gap-2 text-[11px] font-mono p-2 rounded bg-slate-900/60 border border-slate-800/60">
    <div class="flex flex-col gap-0.5">
      <span class="text-[10px] text-slate-400 uppercase tracking-wider">Type</span>
      <span class="text-slate-200 font-medium">Sector</span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span class="text-[10px] text-slate-400 uppercase tracking-wider">Capture Time</span>
      <span class="text-slate-200 font-medium">60s</span>
    </div>
    <div class="flex flex-col gap-0.5 col-span-2">
      <span class="text-[10px] text-slate-400 uppercase tracking-wider">Retake</span>
      <span class="text-emerald-400/90 font-medium">Permanent (Locked)</span>
    </div>
  </div>

  <div class="flex items-center justify-end text-[11px] text-slate-400 pt-1 border-t border-slate-800/50">
    <button class="inline-flex items-center gap-1 text-blue-400 hover:text-blue-300 font-mono text-[11px] font-medium transition-colors">
      <span class="">Locate</span>
      <span class="material-symbols-outlined text-[13px]">my_location</span>
    </button>
  </div>
</div>

<div class="group relative rounded-lg bg-[#131b2e]/90 hover:bg-[#162038] border border-slate-800/80 hover:border-blue-500/40 transition-all duration-200 p-3.5 flex flex-col gap-3 shadow-sm">
  <div class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-2.5">
      <span class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 flex items-center justify-center text-[10px] font-mono font-bold">2</span>
      <span class="text-sm font-semibold text-white tracking-wide">Northern Zone</span>
    </div>
    <div class="flex items-center font-mono text-[10px] uppercase font-semibold tracking-wider px-2 py-0.5 rounded-full bg-slate-800/80 border border-slate-700 text-slate-300">Defend</div>
  </div>

  <div class="grid grid-cols-2 gap-2 text-[11px] font-mono p-2 rounded bg-slate-900/60 border border-slate-800/60">
    <div class="flex flex-col gap-0.5">
      <span class="text-[10px] text-slate-400 uppercase tracking-wider">Type</span>
      <span class="text-slate-200 font-medium">Sector</span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span class="text-[10px] text-slate-400 uppercase tracking-wider">Capture Time</span>
      <span class="text-slate-200 font-medium">90s</span>
    </div>
    <div class="flex flex-col gap-0.5 col-span-2">
      <span class="text-[10px] text-slate-400 uppercase tracking-wider">Retake</span>
      <span class="text-emerald-400/90 font-medium">Permanent (Locked)</span>
    </div>
  </div>

  <div class="flex items-center justify-end text-[11px] text-slate-400 pt-1 border-t border-slate-800/50">
    <button class="inline-flex items-center gap-1 text-blue-400 hover:text-blue-300 font-mono text-[11px] font-medium transition-colors">
      <span class="">Locate</span>
      <span class="material-symbols-outlined text-[13px]">my_location</span>
    </button>
  </div>
</div></div>

  </div>







</body></html>
