<!DOCTYPE html><html lang="en" class="h-full"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBD Reforger - Parameters Panel (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            surface: '#0b1120',
            'surface-dim': '#0d1322',
            'surface-bright': '#33394a',
            'surface-container-lowest': '#080e1d',
            'surface-container-low': '#151b2b',
            'surface-container': '#1c2233',
            'surface-container-high': '#23293b',
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
  </style>
</head>
<body class="h-full bg-surface text-slate-100 font-sans antialiased p-8 flex items-start justify-start select-none">

  <!-- Standalone Parameters Panel -->
  <div class="w-[440px] bg-surface-dim/95 border border-slate-800/80 rounded-xl shadow-2xl backdrop-blur-md overflow-hidden flex flex-col">
    
    <!-- Header -->
    <div class="px-5 py-3.5 border-b border-slate-800/80 flex items-center gap-2.5 bg-surface-container-lowest/50">
      <span class="material-symbols-outlined text-slate-400 text-[18px]">tune</span>
      <h2 class="text-xs font-mono font-semibold tracking-wider text-slate-200 uppercase">Parameters</h2>
    </div>

    <!-- Content / Parameters List -->
    <div class="p-4 space-y-2.5">

      <!-- View Distance -->
      <div class="p-3 bg-surface-container-lowest/80 border border-slate-800/70 rounded-lg flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded bg-slate-800/60 border border-slate-700/50 flex items-center justify-center text-slate-400">
            <span class="material-symbols-outlined text-[18px]">visibility</span>
          </div>
          <div>
            <div class="text-xs font-medium text-slate-200">View Distance</div>
            
          </div>
        </div>
        <div class="text-right">
          <div class="text-xs font-mono font-semibold text-slate-100">2,500 m</div>
          
        </div>
      </div>

      <!-- Safe Start Duration -->
      <div class="p-3 bg-surface-container-lowest/80 border border-slate-800/70 rounded-lg flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded bg-slate-800/60 border border-slate-700/50 flex items-center justify-center text-slate-400">
            <span class="material-symbols-outlined text-[18px]">shield</span>
          </div>
          <div>
            <div class="text-xs font-medium text-slate-200">Safe Start Duration</div>
            
          </div>
        </div>
        <div class="text-right">
          <div class="text-xs font-mono font-semibold text-amber-400">3 min</div>
          
        </div>
      </div>

      <!-- Mission Start Time (In-Game Time) -->
      <div class="p-3 bg-surface-container-lowest/80 border border-slate-800/70 rounded-lg flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded bg-slate-800/60 border border-slate-700/50 flex items-center justify-center text-slate-400">
            <span class="material-symbols-outlined text-[18px]">schedule</span>
          </div>
          <div>
            <div class="text-xs font-medium text-slate-200">Mission Start Time</div>
            
          </div>
        </div>
        <div class="text-right">
          <div class="text-xs font-mono font-semibold text-slate-100">07:00</div>
          
        </div>
      </div>

      <!-- Mission Duration -->
      <div class="p-3 bg-surface-container-lowest/80 border border-slate-800/70 rounded-lg flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded bg-slate-800/60 border border-slate-700/50 flex items-center justify-center text-slate-400">
            <span class="material-symbols-outlined text-[18px]">hourglass_bottom</span>
          </div>
          <div>
            <div class="text-xs font-medium text-slate-200">Mission Duration</div>
            
          </div>
        </div>
        <div class="text-right">
          <div class="text-xs font-mono font-semibold text-slate-100">60 min</div>
          
        </div>
      </div>

      <!-- Thermals (TI) -->
      <div class="p-3 bg-surface-container-lowest/80 border border-slate-800/70 rounded-lg flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded bg-slate-800/60 border border-slate-700/50 flex items-center justify-center text-slate-400">
            <span class="material-symbols-outlined text-[18px]">thermostat</span>
          </div>
          <div>
            <div class="text-xs font-medium text-slate-200">Thermals (TI)</div>
            
          </div>
        </div>
        <div class="text-right">
          <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-mono font-medium bg-red-500/10 text-red-400 border border-red-500/20">Disabled</span>
        </div>
      </div>

    </div>

  </div>




</body></html>
