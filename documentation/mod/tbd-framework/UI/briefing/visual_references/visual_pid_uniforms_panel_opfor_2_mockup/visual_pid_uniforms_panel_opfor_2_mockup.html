<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBD Reforger - Visual PID &amp; Uniforms (OPFOR Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            surface: {
              DEFAULT: '#0b1120',
              dim: '#080e1d',
              card: '#0d1527',
              container: '#151f32',
              elevated: '#1a263e',
            },
            opfor: {
              DEFAULT: '#ef4444',
              dim: 'rgba(239, 68, 68, 0.15)',
              glow: 'rgba(239, 68, 68, 0.3)',
              border: '#7f1d1d'
            },
            tactical: {
              gold: '#f59e0b',
              blue: '#3b82f6',
              cyan: '#38bdf8',
              muted: '#94a3b8',
              border: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <style>
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(11, 17, 32, 0.5);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #25334d;
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }
  </style>
</head>
<body class="bg-[#050811] text-slate-100 font-sans min-h-screen flex items-center justify-center p-6 antialiased selection:bg-red-500/30">

  <!-- Standalone Panel Container -->
  <div class="w-full max-w-3xl bg-surface-card/95 border border-slate-800/80 rounded-xl shadow-2xl backdrop-blur-xl overflow-hidden flex flex-col">
    
    <!-- Panel Header (Clean, minimal, no extra browser/status bars) -->
    <div class="px-6 py-4 border-b border-slate-800/80 flex items-center justify-between bg-surface-dim/60">
      <div class="flex items-center gap-3">
        
        <div class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 4l4 4-2 3-3-2v11H9V9L6 11 4 8l4-4a4 4 0 018 0z"></path></svg><h2 class="text-xs font-semibold tracking-wider uppercase text-slate-200 font-mono"><span class="text-red-400 font-bold">ENEMY UNIFORMS</span></h2><span class="text-xs font-mono font-bold px-2 py-0.5 rounded border border-red-500/40 bg-red-950/40 text-red-400">ATTACKERS</span></div>
      </div>
      <div class="flex items-center gap-2">
        
      </div>
    </div>

    <!-- Main Content Area: Uniform Profiles Side-by-Side -->
    <div class="p-6 space-y-6">
      
      <!-- Key Caution Banner -->
      

      <!-- Uniform Cards Grid (Two OPFOR Faction Components: VDV Regulars & ChDKZ Irregulars) -->
      <div class="grid grid-cols-1 gap-5">
        
        <!-- Card 1: Russian VDV Regulars -->
        <div class="bg-surface-container/70 border border-slate-800 rounded-lg p-4 flex flex-col hover:border-slate-700 transition">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
            <div>
              
              <h3 class="text-sm font-bold text-slate-100">Russian VDV (Airborne)</h3>
            </div>
            
          </div>

          <!-- Soldier Silhouette & Visual Anatomy Preview -->
          <div class="relative bg-surface-dim/90 border border-slate-800/60 rounded-md p-4 mb-4 flex items-center justify-center min-h-[220px] overflow-hidden group">
            <!-- Camouflage Background Grid & Accent -->
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#ef4444_1px,transparent_1px)] [background-size:16px_16px]"></div>
            
            <!-- Graphic Silhouette Representation -->
            <div class="relative z-10 flex flex-col items-center">
              <!-- Beret / Helmet Graphic -->
              <div class="w-10 h-6 bg-sky-600 rounded-t-full border border-sky-400/60 flex items-center justify-center relative shadow-sm">
                <div class="w-2 h-2 rounded-full bg-amber-400 border border-amber-200"></div>
                <div class="absolute -bottom-1 w-8 h-1 bg-slate-700 rounded-full"></div>
              </div>
              <!-- Head / Visage -->
              <div class="w-7 h-7 bg-amber-200/40 rounded-b-md border border-slate-600 mb-1"></div>
              <!-- Body Torso / 6B5 Vest in Flora Camo -->
              <div class="w-20 h-24 bg-emerald-900/90 border-2 border-emerald-700/80 rounded-md relative flex flex-col items-center justify-center shadow-inner overflow-hidden">
                <!-- Telnyashka blue-white striped collar strip -->
                <div class="absolute top-0 w-8 h-2 bg-slate-200 border-b border-sky-600 flex justify-between px-0.5">
                  <div class="w-1 h-full bg-sky-600"></div>
                  <div class="w-1 h-full bg-sky-600"></div>
                  <div class="w-1 h-full bg-sky-600"></div>
                </div>
                <!-- Pouches & Harness -->
                <div class="grid grid-cols-2 gap-1.5 mt-3">
                  <div class="w-6 h-7 bg-emerald-950 border border-emerald-600/60 rounded-xs flex items-center justify-center">
                    <span class="text-[8px] font-mono text-emerald-400">MAG</span>
                  </div>
                  <div class="w-6 h-7 bg-emerald-950 border border-emerald-600/60 rounded-xs flex items-center justify-center">
                    <span class="text-[8px] font-mono text-emerald-400">MAG</span>
                  </div>
                </div>
                <div class="w-14 h-3 bg-stone-900 mt-1 border border-stone-700 rounded-xs"></div>
              </div>
              <!-- Legs & Combat Boots -->
              <div class="flex gap-1.5 mt-0.5">
                <div class="w-6 h-14 bg-emerald-900/80 border border-emerald-700/60 rounded-b-sm flex flex-col justify-end">
                  <div class="w-full h-4 bg-zinc-950 rounded-b-sm border border-zinc-800"></div>
                </div>
                <div class="w-6 h-14 bg-emerald-900/80 border border-emerald-700/60 rounded-b-sm flex flex-col justify-end">
                  <div class="w-full h-4 bg-zinc-950 rounded-b-sm border border-zinc-800"></div>
                </div>
              </div>
            </div>

            <!-- Camo Swatch Badge -->
            <div class="absolute bottom-2 left-2 flex items-center gap-1.5 bg-slate-900/90 border border-slate-700/80 px-2 py-1 rounded text-[10px] font-mono text-slate-300">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-800 border border-emerald-500 inline-block"></span>
              VSR-93 / Flora
            </div>
            
            <!-- Quick Headgear Tag -->
            
          </div>

          <!-- Feature Breakdown Specs -->
          
        </div>

        <!-- Card 2: ChDKZ Insurgent / Irregular Forces -->
        <div class="bg-surface-container/70 border border-slate-800 rounded-lg p-4 flex flex-col hover:border-slate-700 transition">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
            <div>
              
              <h3 class="text-sm font-bold text-slate-100">ChDKZ (Separatist Militia)</h3>
            </div>
            
          </div>

          <!-- Soldier Silhouette & Visual Anatomy Preview -->
          <div class="relative bg-surface-dim/90 border border-slate-800/60 rounded-md p-4 mb-4 flex items-center justify-center min-h-[220px] overflow-hidden group">
            <!-- Camouflage Background Grid & Accent -->
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#ef4444_1px,transparent_1px)] [background-size:16px_16px]"></div>
            
            <!-- Graphic Silhouette Representation -->
            <div class="relative z-10 flex flex-col items-center">
              <!-- Beanie / Ushanka / Hood Graphic -->
              <div class="w-9 h-6 bg-stone-800 rounded-t-lg border border-stone-600 flex items-center justify-center relative shadow-sm">
                <div class="w-8 h-2 bg-stone-900 rounded-xs -bottom-1 absolute border border-stone-700"></div>
              </div>
              <!-- Head / Visage -->
              <div class="w-7 h-7 bg-amber-200/40 rounded-b-md border border-slate-600 mb-1"></div>
              <!-- Body Torso / Gorka-3 Suit with Partizan Accents -->
              <div class="w-20 h-24 bg-[#54503c] border-2 border-[#6c674e] rounded-md relative flex flex-col items-center justify-center shadow-inner overflow-hidden">
                <!-- Reinforced Shoulder Patches -->
                <div class="absolute top-0 inset-x-0 h-4 bg-[#393729] opacity-75"></div>
                <!-- Red Armband Identifier -->
                <div class="absolute top-4 -left-1 w-3 h-5 bg-red-600 border border-red-400 shadow-sm"></div>
                <!-- Webbing / Smersh Harness -->
                <div class="grid grid-cols-2 gap-1 mt-2 z-10">
                  <div class="w-6 h-8 bg-stone-900 border border-stone-700 rounded-xs flex items-center justify-center">
                    <span class="text-[7px] font-mono text-stone-400">AK</span>
                  </div>
                  <div class="w-6 h-8 bg-stone-900 border border-stone-700 rounded-xs flex items-center justify-center">
                    <span class="text-[7px] font-mono text-stone-400">AK</span>
                  </div>
                </div>
                <div class="w-14 h-3 bg-stone-950 mt-1 border border-stone-800 rounded-xs z-10"></div>
              </div>
              <!-- Legs & Combat Boots -->
              <div class="flex gap-1.5 mt-0.5">
                <div class="w-6 h-14 bg-[#54503c] border border-[#6c674e] rounded-b-sm flex flex-col justify-end">
                  <div class="w-full h-4 bg-stone-950 rounded-b-sm border border-stone-800"></div>
                </div>
                <div class="w-6 h-14 bg-[#54503c] border border-[#6c674e] rounded-b-sm flex flex-col justify-end">
                  <div class="w-full h-4 bg-stone-950 rounded-b-sm border border-stone-800"></div>
                </div>
              </div>
            </div>

            <!-- Camo Swatch Badge -->
            <div class="absolute bottom-2 left-2 flex items-center gap-1.5 bg-slate-900/90 border border-slate-700/80 px-2 py-1 rounded text-[10px] font-mono text-slate-300">
              <span class="w-2.5 h-2.5 rounded-full bg-[#54503c] border border-[#8a8360] inline-block"></span>
              Gorka-3 / Khaki
            </div>
            
            <!-- Quick Headgear Tag -->
            
          </div>

          <!-- Feature Breakdown Specs -->
          
        </div>

      </div>

      <!-- Tactical PID Key Rules / Discrimination Notes -->
      

    </div>

  </div>










</body></html>
