<!DOCTYPE html><html lang="en" class="h-full"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBD Reforger - Admin Panel Sidebar (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            tactical: {
              bg: '#080e1d',
              surface: '#0d1322',
              surfaceAlt: '#151b2b',
              border: '#232b3e',
              borderLight: '#333e56',
              primary: '#3b82f6',
              primaryHover: '#2563eb',
              textPrimary: '#f1f5f9',
              textSecondary: '#94a3b8',
              textMuted: '#64748b',
              accentOrange: '#f59e0b',
              accentRed: '#ef4444',
              accentGreen: '#22c55e'
            }
          }
        }
      }
    }
  </script>
  <style>
    .glass-panel {
      background: rgba(13, 19, 34, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(35, 43, 62, 0.9);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 22;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 22;
    }
  </style>
</head>
<body class="bg-tactical-bg min-h-screen text-tactical-textPrimary font-sans antialiased flex items-center justify-center p-6 selection:bg-blue-600/30 selection:text-blue-200">

  <!-- Main Standalone Admin Sidebar Container -->
  <aside class="w-[280px] glass-panel rounded-xl overflow-hidden flex flex-col transition-all duration-200 shadow-2xl">
    
    <!-- Header -->
    <div class="px-5 py-4 border-b border-tactical-border/80 flex items-center justify-between bg-tactical-surfaceAlt/40">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-400">
          <span class="material-symbols-outlined text-[19px]">shield_person</span>
        </div>
        <div class="flex flex-col">
          <span class="text-[14px] font-semibold tracking-wide text-slate-100">Admin Panel</span>
        </div>
      </div>
      <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30 tracking-wider">
        AUTH
      </span>
    </div>

    <!-- Navigation Items -->
    <nav class="p-3 space-y-1.5 flex-1 pb-4" id="nav-list">
      <!-- 1. Home (Active by default) -->
      <button class="nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 bg-blue-600 text-white shadow-sm shadow-blue-600/30" data-nav="home">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-[19px] text-white">home</span>
          <span class="tracking-wide">Home</span>
        </div>
        <span class="material-symbols-outlined text-[16px] text-blue-200 opacity-90 transition-transform group-hover:translate-x-0.5">chevron_right</span>
      </button>

      <!-- 2. Radio -->
      <button class="nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 text-slate-300 hover:text-white hover:bg-tactical-surfaceAlt/80 border border-transparent hover:border-tactical-border" data-nav="radio">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-[19px] text-slate-400 group-hover:text-blue-400 transition-colors">radio</span>
          <span class="tracking-wide">Radio</span>
        </div>
        <span class="material-symbols-outlined text-[16px] text-slate-500 opacity-0 group-hover:opacity-100 transition-all group-hover:translate-x-0.5">chevron_right</span>
      </button>

      <!-- 3. Teleport -->
      <button class="nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 text-slate-300 hover:text-white hover:bg-tactical-surfaceAlt/80 border border-transparent hover:border-tactical-border" data-nav="teleport">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-[19px] text-slate-400 group-hover:text-blue-400 transition-colors">near_me</span>
          <span class="tracking-wide">Teleport</span>
        </div>
        <span class="material-symbols-outlined text-[16px] text-slate-500 opacity-0 group-hover:opacity-100 transition-all group-hover:translate-x-0.5">chevron_right</span>
      </button>

      <!-- 4. Chat -->
      <button class="nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 text-slate-300 hover:text-white hover:bg-tactical-surfaceAlt/80 border border-transparent hover:border-tactical-border" data-nav="chat">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-[19px] text-slate-400 group-hover:text-blue-400 transition-colors">chat_bubble</span>
          <span class="tracking-wide">Chat</span>
        </div>
        <span class="material-symbols-outlined text-[16px] text-slate-500 opacity-0 group-hover:opacity-100 transition-all group-hover:translate-x-0.5">chevron_right</span>
      </button><button class="nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 text-slate-300 hover:text-white hover:bg-tactical-surfaceAlt/80 border border-transparent hover:border-tactical-border" data-nav="tickets">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-[19px] text-slate-400 group-hover:text-blue-400 transition-colors">confirmation_number</span>
          <span class="tracking-wide">Tickets</span>
        </div>
        <span class="material-symbols-outlined text-[16px] text-slate-500 opacity-0 group-hover:opacity-100 transition-all group-hover:translate-x-0.5">chevron_right</span>
      </button>

      <!-- 5. Spawn -->
      <button class="nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 text-slate-300 hover:text-white hover:bg-tactical-surfaceAlt/80 border border-transparent hover:border-tactical-border" data-nav="spawn">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-[19px] text-slate-400 group-hover:text-blue-400 transition-colors">inventory_2</span>
          <span class="tracking-wide">Spawn</span>
        </div>
        <span class="material-symbols-outlined text-[16px] text-slate-500 opacity-0 group-hover:opacity-100 transition-all group-hover:translate-x-0.5">chevron_right</span>
      </button>

      <!-- 6. Heal and Repair -->
      <button class="nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 text-slate-300 hover:text-white hover:bg-tactical-surfaceAlt/80 border border-transparent hover:border-tactical-border" data-nav="heal_repair">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-[19px] text-slate-400 group-hover:text-blue-400 transition-colors">healing</span>
          <span class="tracking-wide">Heal and Repair</span>
        </div>
        <span class="material-symbols-outlined text-[16px] text-slate-500 opacity-0 group-hover:opacity-100 transition-all group-hover:translate-x-0.5">chevron_right</span>
      </button>

      <!-- 7. Kick and Ban -->
      <button class="nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 text-slate-300 hover:text-white hover:bg-tactical-surfaceAlt/80 border border-transparent hover:border-tactical-border" data-nav="kick_ban">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-[19px] text-slate-400 group-hover:text-blue-400 transition-colors">gavel</span>
          <span class="tracking-wide">Kick and Ban</span>
        </div>
        <span class="material-symbols-outlined text-[16px] text-slate-500 opacity-0 group-hover:opacity-100 transition-all group-hover:translate-x-0.5">chevron_right</span>
      </button>

      <!-- 8. Server -->
      <button class="nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 text-slate-300 hover:text-white hover:bg-tactical-surfaceAlt/80 border border-transparent hover:border-tactical-border" data-nav="server">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-[19px] text-slate-400 group-hover:text-blue-400 transition-colors">dns</span>
          <span class="tracking-wide">Server</span>
        </div>
        <span class="material-symbols-outlined text-[16px] text-slate-500 opacity-0 group-hover:opacity-100 transition-all group-hover:translate-x-0.5">chevron_right</span>
      </button>

      <!-- 9. Weather -->
      <button class="nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 text-slate-300 hover:text-white hover:bg-tactical-surfaceAlt/80 border border-transparent hover:border-tactical-border" data-nav="environment">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-[19px] text-slate-400 group-hover:text-blue-400 transition-colors">partly_cloudy_day</span>
          <span class="tracking-wide">Environment</span>
        </div>
        <span class="material-symbols-outlined text-[16px] text-slate-500 opacity-0 group-hover:opacity-100 transition-all group-hover:translate-x-0.5">chevron_right</span>
      </button>
    </nav>

    <!-- Footer / Close Command -->
    

  </aside>

  <script>
    const navButtons = document.querySelectorAll('.nav-item');
    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        navButtons.forEach(b => {
          b.className = 'nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 text-slate-300 hover:text-white hover:bg-tactical-surfaceAlt/80 border border-transparent hover:border-tactical-border';
          const icon = b.querySelector('.material-symbols-outlined:first-child');
          const chevron = b.querySelector('.material-symbols-outlined:last-child');
          if (icon) {
            icon.className = 'material-symbols-outlined text-[19px] text-slate-400 group-hover:text-blue-400 transition-colors';
          }
          if (chevron) {
            chevron.className = 'material-symbols-outlined text-[16px] text-slate-500 opacity-0 group-hover:opacity-100 transition-all group-hover:translate-x-0.5';
          }
        });

        // Set active style
        btn.className = 'nav-item group w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left text-[13px] font-medium transition-all duration-150 bg-blue-600 text-white shadow-sm shadow-blue-600/30';
        const activeIcon = btn.querySelector('.material-symbols-outlined:first-child');
        const activeChevron = btn.querySelector('.material-symbols-outlined:last-child');
        if (activeIcon) {
          activeIcon.className = 'material-symbols-outlined text-[19px] text-white';
        }
        if (activeChevron) {
          activeChevron.className = 'material-symbols-outlined text-[16px] text-blue-200 opacity-90 transition-transform group-hover:translate-x-0.5';
        }
      });
    });
  </script>









</body></html>
