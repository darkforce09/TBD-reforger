<!DOCTYPE html><html lang="en" class="h-full" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBD Reforger - Player Options (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            surface: {
              DEFAULT: '#0b1120',
              dim: '#0d1322',
              bright: '#33394a',
              container: {
                lowest: '#080e1d',
                low: '#151b2b',
                DEFAULT: '#1c2234',
                high: '#272d3f',
                highest: '#32384a'
              }
            }
          }
        }
      }
    };
  </script>
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(13, 19, 34, 0.5);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.4);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 0.7);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-6 font-sans antialiased select-none">

  <!-- Standalone Player Options Card -->
  <div class="w-full max-w-[760px] bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-xl shadow-2xl overflow-hidden flex flex-col transition-all duration-300">

    <!-- Header Bar -->
    <div class="px-6 py-4 border-b border-slate-800/80 flex items-center justify-between bg-slate-950/40">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
          <span class="material-symbols-outlined text-[19px]">tune</span>
        </div>
        <div>
          <h1 class="text-base font-semibold text-slate-100 tracking-tight leading-tight">Player Options</h1>
          
        </div>
      </div>
      <div class="flex items-center gap-2.5">
        
        <button class="w-7 h-7 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800/80 flex items-center justify-center transition-colors">
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
      </div>
    </div>

    <!-- Body Scroll Area -->
    <div class="p-6 space-y-6 overflow-y-auto max-h-[calc(100vh-140px)] custom-scrollbar">

      <!-- View Distance & Engine LOD -->
      <section class="space-y-3">
        <div class="flex items-center justify-between pb-1 border-b border-slate-800/60">
          <div class="flex items-center gap-2 text-xs font-semibold text-slate-300 uppercase tracking-wider">
            <span class="material-symbols-outlined text-[16px] text-blue-400">visibility</span>
            <span class="">View Distance</span>
          </div>
          
        </div>

        <div class="bg-slate-950/50 border border-slate-800/70 rounded-lg p-4 space-y-4">
          <!-- Active Slider Display -->
          <div class="space-y-2">
            <div class="flex justify-between items-center text-xs">
              <div>
                <span class="font-medium text-slate-200">Terrain Render Distance</span>
                
              </div>
              <div class="text-right">
                <span id="distance-display" class="font-mono font-semibold text-blue-400 text-sm">3 500 m</span>
              </div>
            </div>

            <!-- Custom Slider Track -->
            <div class="flex items-center gap-3">
              <button onclick="const s = document.getElementById('distance-slider'); s.value = Math.max(500, Math.min(10000, Number(s.value) - 100)); document.getElementById('distance-display').innerText = Number(s.value).toLocaleString().replace(/,/g, ' ') + ' m';" class="w-7 h-7 rounded bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-colors">
                <span class="material-symbols-outlined text-[16px]">remove</span>
              </button>
              <div class="relative flex-1 flex items-center">
                <input id="distance-slider" type="range" min="500" max="10000" step="100" value="2500" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500" oninput="document.getElementById('distance-display').innerText = Number(this.value).toLocaleString().replace(/,/g, ' ') + ' m'">
              </div>
              <button onclick="const s = document.getElementById('distance-slider'); s.value = Math.max(500, Math.min(10000, Number(s.value) + 100)); document.getElementById('distance-display').innerText = Number(s.value).toLocaleString().replace(/,/g, ' ') + ' m';" class="w-7 h-7 rounded bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-colors">
                <span class="material-symbols-outlined text-[16px]">add</span>
              </button>
            </div>
          </div>

          <!-- Presets Grid -->
          <div class="pt-3 border-t border-slate-800/70 space-y-3"><div class="flex items-center justify-between"><div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[15px] text-blue-400">view_in_ar</span><span class="text-xs font-semibold text-slate-200 tracking-wide">Object View Distance</span></div><span class="text-[10px] font-mono text-slate-500 uppercase tracking-wider">Preset Sliders</span></div><div class="space-y-3 bg-slate-900/60 rounded-lg p-3 border border-slate-800/60 divide-y divide-slate-800/40"><div class="space-y-1.5 pb-2.5"><div class="flex justify-between items-center text-xs"><span class="font-medium text-slate-300 text-[11px] uppercase font-mono tracking-wider">Preset 1</span><span id="obj-infantry-val" class="font-mono font-semibold text-blue-400 text-xs">1 200 m</span></div><div class="flex items-center gap-2"><button onclick="const s = document.getElementById('obj-infantry'); s.value = Math.max(500, +s.value - 100); document.getElementById('obj-infantry-val').innerText = Number(s.value).toLocaleString().replace(/,/g, ' ') + ' m';" class="w-6 h-6 rounded bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-colors"><span class="material-symbols-outlined text-[14px]">remove</span></button><div class="relative flex-1 flex items-center"><input id="obj-infantry" type="range" min="500" max="5000" step="100" value="1200" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500" oninput="document.getElementById('obj-infantry-val').innerText = Number(this.value).toLocaleString().replace(/,/g, ' ') + ' m'"></div><button onclick="const s = document.getElementById('obj-infantry'); s.value = Math.min(5000, +s.value + 100); document.getElementById('obj-infantry-val').innerText = Number(s.value).toLocaleString().replace(/,/g, ' ') + ' m';" class="w-6 h-6 rounded bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-colors"><span class="material-symbols-outlined text-[14px]">add</span></button></div></div><div class="space-y-1.5 py-2.5"><div class="flex justify-between items-center text-xs"><span class="font-medium text-slate-300 text-[11px] uppercase font-mono tracking-wider">Preset 2</span><span id="obj-vehicle-val" class="font-mono font-semibold text-blue-400 text-xs">2 000 m</span></div><div class="flex items-center gap-2"><button onclick="const s = document.getElementById('obj-vehicle'); s.value = Math.max(500, +s.value - 100); document.getElementById('obj-vehicle-val').innerText = Number(s.value).toLocaleString().replace(/,/g, ' ') + ' m';" class="w-6 h-6 rounded bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-colors"><span class="material-symbols-outlined text-[14px]">remove</span></button><div class="relative flex-1 flex items-center"><input id="obj-vehicle" type="range" min="500" max="6000" step="100" value="2000" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500" oninput="document.getElementById('obj-vehicle-val').innerText = Number(this.value).toLocaleString().replace(/,/g, ' ') + ' m'"></div><button onclick="const s = document.getElementById('obj-vehicle'); s.value = Math.min(6000, +s.value + 100); document.getElementById('obj-vehicle-val').innerText = Number(s.value).toLocaleString().replace(/,/g, ' ') + ' m';" class="w-6 h-6 rounded bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-colors"><span class="material-symbols-outlined text-[14px]">add</span></button></div></div><div class="space-y-1.5 pt-2.5"><div class="flex justify-between items-center text-xs"><span class="font-medium text-slate-300 text-[11px] uppercase font-mono tracking-wider">Preset 3</span><span id="obj-aircraft-val" class="font-mono font-semibold text-blue-400 text-xs">3 500 m</span></div><div class="flex items-center gap-2"><button onclick="const s = document.getElementById('obj-aircraft'); s.value = Math.max(500, +s.value - 100); document.getElementById('obj-aircraft-val').innerText = Number(s.value).toLocaleString().replace(/,/g, ' ') + ' m';" class="w-6 h-6 rounded bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-colors"><span class="material-symbols-outlined text-[14px]">remove</span></button><div class="relative flex-1 flex items-center"><input id="obj-aircraft" type="range" min="500" max="8000" step="100" value="3500" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500" oninput="document.getElementById('obj-aircraft-val').innerText = Number(this.value).toLocaleString().replace(/,/g, ' ') + ' m'"></div><button onclick="const s = document.getElementById('obj-aircraft'); s.value = Math.min(8000, +s.value + 100); document.getElementById('obj-aircraft-val').innerText = Number(s.value).toLocaleString().replace(/,/g, ' ') + ' m';" class="w-6 h-6 rounded bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-colors"><span class="material-symbols-outlined text-[14px]">add</span></button></div></div></div></div>
        </div>
      </section>

      <!-- Audio & Tactical Earplugs -->
      <section class="space-y-3">
        <div class="flex items-center justify-between pb-1 border-b border-slate-800/60">
          <div class="flex items-center gap-2 text-xs font-semibold text-slate-300 uppercase tracking-wider">
            <span class="material-symbols-outlined text-[16px] text-blue-400">volume_up</span>
            <span class="">Audio</span>
          </div>
          <span class="text-[11px] font-mono text-slate-500">KEY: [SHIFT+N]</span>
        </div>

        <div class="bg-slate-950/50 border border-slate-800/70 rounded-lg p-4 space-y-3">
          <div class="space-y-2">
  <div class="flex justify-between items-center text-xs">
    <span class="font-medium text-slate-200">Muting</span>
    <div class="flex items-center gap-3">
      <span id="muting-display" class="font-mono text-xs font-semibold text-slate-300 bg-slate-900 px-2.5 py-1 rounded border border-slate-800">0.01 (-99 dB)</span>
      <button id="earplugs-toggle" onclick="toggleEarplugs()" class="px-2.5 py-1 rounded bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-medium flex items-center gap-1.5 transition-colors">
        <span class="material-symbols-outlined text-[14px]">check</span>
        <span class="">Active</span>
      </button>
    </div>
  </div>
  <div class="flex items-center gap-3 pt-1">
    <button onclick="const s = document.getElementById('muting-slider'); s.value = Math.max(1, Math.min(100, Number(s.value) - 5)); updateMutingDisplay(s.value);" class="w-7 h-7 rounded bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-colors">
      <span class="material-symbols-outlined text-[16px]">remove</span>
    </button>
    <div class="relative flex-1 flex items-center">
      <input id="muting-slider" type="range" min="1" max="100" step="1" value="1" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500" oninput="updateMutingDisplay(this.value)">
    </div>
    <button onclick="const s = document.getElementById('muting-slider'); s.value = Math.max(1, Math.min(100, Number(s.value) + 5)); updateMutingDisplay(s.value);" class="w-7 h-7 rounded bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-colors">
      <span class="material-symbols-outlined text-[16px]">add</span>
    </button>
  </div>
</div>
        </div>
      </section>

      <!-- Client HUD Preferences -->
      <section class="space-y-3">
        <div class="flex items-center justify-between pb-1 border-b border-slate-800/60">
          <div class="flex items-center gap-2 text-xs font-semibold text-slate-300 uppercase tracking-wider">
            <span class="material-symbols-outlined text-[16px] text-blue-400">display_settings</span>
            <span class="">Client HUD Preferences</span>
          </div>
        </div>

        <div class="bg-slate-950/50 border border-slate-800/70 rounded-lg divide-y divide-slate-800/60">
          <!-- Preference 1 -->
          <label class="flex items-center justify-between p-3.5 cursor-pointer hover:bg-slate-900/40 transition-colors">
            <div class="pr-4">
              <span class="text-xs font-medium text-slate-200 block">Save terrain settings to profile</span>
              
            </div>
            <input type="checkbox" checked="" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-blue-500 focus:ring-0 focus:ring-offset-0 cursor-pointer accent-blue-600">
          </label>

          <!-- Preference 2 -->
          <label class="flex items-center justify-between p-3.5 cursor-pointer hover:bg-slate-900/40 transition-colors">
            <div class="pr-4">
              <span class="text-xs font-medium text-slate-200 block">Highlight nickname on HUD</span>
              
            </div>
            <input type="checkbox" checked="" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-blue-500 focus:ring-0 focus:ring-offset-0 cursor-pointer accent-blue-600">
          </label>

          <!-- Preference 3 -->
          <label class="flex items-center justify-between p-3.5 cursor-pointer hover:bg-slate-900/40 transition-colors">
            <div class="pr-4">
              <span class="text-xs font-medium text-slate-200 block">Beep chime after freeze time expires</span>
              
            </div>
            <input type="checkbox" checked="" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-blue-500 focus:ring-0 focus:ring-offset-0 cursor-pointer accent-blue-600">
          </label>
        </div>
      </section>

    </div>

    <!-- Footer Bar -->
    <div class="px-6 py-4 border-t border-slate-800/80 bg-slate-950/60 flex items-center justify-end">
      
      <div class="flex items-center gap-3">
        <button class="px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/80 transition-colors">
          Reset Defaults
        </button>
        <button class="px-4 py-1.5 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/20 flex items-center gap-1.5 transition-all">
          
          <span class="">Apply</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    function updateDistance(val) {
      const formatted = Number(val).toLocaleString() + ' m';
      document.getElementById('distance-display').innerText = formatted;
    }

    function adjustDistance(delta) {
      const slider = document.getElementById('distance-slider');
      let val = Math.max(500, Math.min(5000, Number(slider.value) + delta));
      slider.value = val;
      updateDistance(val);
    }

    function setPreset(val) {
      const slider = document.getElementById('distance-slider');
      slider.value = val;
      updateDistance(val);
    }

    let earplugsActive = true;
    function toggleEarplugs() {
      earplugsActive = !earplugsActive;
      const btn = document.getElementById('earplugs-toggle');
      if (earplugsActive) {
        btn.className = 'px-2.5 py-1 rounded bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-medium flex items-center gap-1.5 transition-colors';
        btn.innerHTML = '<span class="material-symbols-outlined text-[14px]">check</span><span>Active</span>';
      } else {
        btn.className = 'px-2.5 py-1 rounded bg-slate-800/60 border border-slate-700/50 text-slate-400 text-xs font-medium flex items-center gap-1.5 transition-colors';
        btn.innerHTML = '<span class="material-symbols-outlined text-[14px]">volume_off</span><span>Disabled</span>';
      }
    }
  </script>




</body></html>
