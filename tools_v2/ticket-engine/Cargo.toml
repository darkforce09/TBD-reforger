[package]
name = "ticket-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false
description = "Ticket storage, validation, operations, generated views, scheduling, and metrics"

[dependencies]
anyhow = "1"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"
jsonschema = { version = "0.46.10", default-features = false }
serde = { version = "1", features = ["derive"] }
# Timestamp parse/format: `time` is already in the workspace lockfile as a
# transitive dependency (0.3.53), so this adds zero new supply chain; its well-known
# Rfc3339 parser is strict and exposes the offset for the UTC-only rule.
time = { version = "0.3", features = ["parsing", "formatting"] }
toml = { version = "0.8", features = ["preserve_order"] }

[dev-dependencies]
proptest = "1"
trybuild = "1"
