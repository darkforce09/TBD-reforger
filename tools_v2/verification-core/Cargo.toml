# Dependency-light ON PURPOSE. Every gate in `xtask` and the heavy tooling in `developer-tools`
# link this crate, so anything added here is paid for by both. `regex` puts the matcher inside the
# gate binary, which retires the absent-search-tool class outright, and `libc` carries the two
# primitives the crate cannot do without: killing a timed-out process GROUP rather than only its
# leader, and `flock` on the shared verification lock.
[package]
name = "verification-core"
description = "Fail-closed verdicts, pattern scans, process isolation and the repository verification lock"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[dependencies]
regex = "1"
libc = "0.2"
