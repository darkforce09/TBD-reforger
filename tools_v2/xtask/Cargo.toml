[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false
description = "Repository command router, verifications and platform execution (cargo xtask)"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
flate2 = "1"
png = "0.17"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
serde_norway = "0.9"
walkdir = "2"
jsonschema = { version = "0.46.10", default-features = false }
developer-tools = { path = "../developer-tools" }
verification-core = { path = "../verification-core" }
ticket-engine = { path = "../ticket-engine" }
libc = "0.2"
typify = "0.7"
schemars = "0.8"
prettyplease = "0.2"
syn = { version = "2", features = ["full", "visit"] }
heck = "0.5"
sha2 = "0.10"
