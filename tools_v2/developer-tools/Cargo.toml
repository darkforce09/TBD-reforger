[package]
name = "developer-tools"
description = "Browser automation, Enfusion assets, blueprint compilation, and map verification"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8.9"
base64 = "0.22"
bcdec_rs = "0.2"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
jsonschema = { version = "0.46.10", default-features = false }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "tga"] }
image-webp = "0.2"
png = "0.17"
resvg = { version = "0.45", default-features = false }
webp = "0.3"
website-map-engine = { path = "../../apps/website/map-engine", default-features = false, features = [
    "world",
    "streaming",
    "io",
    "bvh",
] }
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = "0.30"

[[bin]]
name = "enf"
path = "src/bin/enf.rs"

[[bin]]
name = "gate"
path = "src/bin/gate.rs"

[[bin]]
name = "mcpd"
path = "src/bin/mcpd.rs"

[[bin]]
name = "world"
path = "src/bin/world.rs"

[[bin]]
name = "map"
path = "src/bin/map.rs"

[[bin]]
name = "capture"
path = "src/bin/capture.rs"

[lib]
name = "developer_tools"
path = "src/lib.rs"
