<!DOCTYPE html><html class="h-full" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>TBD Reforger - Broadcast Esports / Caster HUD (Variant 1)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            pod: {
              glass: 'rgba(11, 19, 41, 0.82)',
              glassHighlight: 'rgba(56, 189, 248, 0.15)',
              blufor: '#38bdf8',
              bluforGlow: 'rgba(56, 189, 248, 0.35)',
              opfor: '#f43f5e',
              opforGlow: 'rgba(244, 63, 94, 0.35)',
              timer: '#fbbf24',
              goldGlow: 'rgba(251, 191, 36, 0.25)',
            }
          },
          boxShadow: {
            'pod-glow': '0 0 25px -5px rgba(56, 189, 248, 0.15), 0 20px 30px -10px rgba(0, 0, 0, 0.8)',
            'timer-glow': '0 0 16px -2px rgba(251, 191, 36, 0.35)',
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #060a12;
      background-image: 
        radial-gradient(circle at 50% 12%, rgba(26, 44, 82, 0.45) 0%, transparent 65%),
        linear-gradient(rgba(30, 41, 59, 0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 41, 59, 0.3) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      font-family: 'Inter', sans-serif;
    }
    .hud-clip-blu {
      clip-path: polygon(0 0, 100% 0, 92% 100%, 0% 100%);
    }
    .hud-clip-opf {
      clip-path: polygon(8% 0, 100% 0, 100% 100%, 0% 100%);
    }
  </style>
</head>
<body class="h-full flex flex-col items-center justify-start pt-6 p-4 text-slate-100 antialiased select-none">
<!-- Caster HUD Pod Root Container -->
<div class="flex flex-col items-center max-w-5xl w-full relative">
<!-- Ambient Floating Aura -->

<!-- MAIN FLOATING AERO-GLASS POD -->
<div class="w-full bg-[#0b1329]/85 backdrop-blur-2xl border border-sky-500/25 rounded-2xl relative overflow-hidden transition-all duration-300">
<!-- Top Subtle Cybernetic Rim Highlight -->
<div class="absolute inset-x-0 top-0 h-[1px] bg-gradient-to-r from-transparent via-sky-400/60 to-transparent"></div>
<div class="absolute inset-x-12 top-[1px] h-[1px] bg-gradient-to-r from-transparent via-slate-600/40 to-transparent"></div>
<!-- Pod Interior Grid Layout -->
<div class="px-6 py-3.5 flex items-center justify-between gap-6 relative z-10"><!-- LEFT: BLUFOR MODULAR POD CLUSTER -->
<div class="flex items-center justify-start flex-1 min-w-0">
  <div class="inline-flex items-center gap-4 bg-slate-900/90 border border-sky-500/40 rounded-xl px-4 py-2 shadow-sm">
    <!-- BLUFOR Badge -->
    <div class="flex items-center gap-2 px-3 py-1 rounded-lg bg-sky-950/60 border border-sky-500/40">
      
      <span class="font-mono text-xs font-black tracking-widest text-sky-300 uppercase">BLUFOR</span>
    </div>
    <!-- Divider Accent -->
    <div class="h-5 w-[1px] bg-slate-800"></div>
    <!-- Kills Stat Display -->
    <div class="flex items-baseline gap-2">
      <span class="font-mono text-3xl font-extrabold text-white tracking-tight">11</span>
      <div class="flex flex-col -mb-0.5">
        <span class="text-[9px] font-bold text-sky-200/70 tracking-wider uppercase font-mono leading-none">Kills To</span>
        <span class="text-[10px] font-extrabold text-sky-400 tracking-wider uppercase font-mono leading-none">Win</span>
      </div>
    </div>
  </div>
</div>

<!-- CENTER: MATCH TIMER & ROUND PROGRESS MODULE -->
<div class="flex flex-col items-center justify-center flex-shrink-0 relative">
  <div class="flex flex-col items-center bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-1.5 min-w-[210px]">
    <div class="flex items-center justify-center font-mono text-2xl font-black tracking-wider leading-none py-0.5 text-slate-100">22:15</div>
    <div class="w-full mt-1.5 flex items-center gap-2">
      <span class="font-mono text-[9px] font-bold text-slate-500">00:00</span>
      <div class="flex-1 h-1.5 bg-slate-950 rounded-full border border-slate-800 p-[1px] relative overflow-hidden flex items-center">
        <div class="h-full bg-slate-300 rounded-full" style="width: 58%;"></div>
        <div class="absolute right-[42%] top-0 bottom-0 w-[2px] bg-white"></div>
      </div>
      <span class="font-mono text-[9px] font-bold text-slate-500">45:00</span>
    </div>
  </div>
</div>

<!-- RIGHT: OPFOR MODULAR POD CLUSTER -->
<div class="flex items-center justify-end flex-1 min-w-0">
  <div class="inline-flex items-center gap-4 bg-slate-900/90 border border-rose-500/40 rounded-xl px-4 py-2 shadow-sm">
    <!-- Kills Stat Display -->
    <div class="flex items-baseline gap-2 text-right">
      <div class="flex flex-col items-end -mb-0.5">
        <span class="text-[9px] font-bold text-rose-200/70 tracking-wider uppercase font-mono leading-none">Kills To</span>
        <span class="text-[10px] font-extrabold text-rose-400 tracking-wider uppercase font-mono leading-none">Win</span>
      </div>
      <span class="font-mono text-3xl font-extrabold text-white tracking-tight">26</span>
    </div>
    <!-- Divider Accent -->
    <div class="h-5 w-[1px] bg-slate-800"></div>
    <!-- OPFOR Badge -->
    <div class="flex items-center gap-2 px-3 py-1 rounded-lg bg-rose-950/60 border border-rose-500/40">
      <span class="font-mono text-xs font-black tracking-widest text-rose-300 uppercase">OPFOR</span>
      
    </div>
  </div>
</div></div>
<!-- Bottom Cyber Accent Line -->
<div class="h-[1px] w-full bg-gradient-to-r from-sky-500/20 via-slate-600/40 to-rose-500/20"></div>
</div>
<!-- ================= INTEGRATED LOWER GLASS TRAY (OBJECTIVES WING) ================= -->
<!-- Attached aerodynamic floating wings containing flags with circular capture dials -->
<div class="relative -mt-1 flex items-center justify-center z-20">
<div class="bg-[#0a1124]/90 backdrop-blur-xl border-x border-b border-sky-500/20 rounded-b-2xl px-6 py-2 shadow-2xl flex items-center gap-5 relative">
<!-- Subtle Top Joint Glow -->
<div class="absolute inset-x-8 -top-[1px] h-[1px] bg-gradient-to-r from-transparent via-sky-400/40 to-transparent"></div>
<!-- Objective Flags Header Pill -->

<!-- FLAG A: 100% OPF (OPFOR Captured) -->
<div class="flex items-center gap-2.5 px-3 py-1 rounded-xl bg-rose-950/30 border border-rose-500/35 hover:border-rose-400/60 transition-colors shadow-sm group">
<!-- Radial Progress Ring: 100% (Full red circle) -->
<div class="relative w-5 h-5 flex items-center justify-center">
<svg class="w-5 h-5 -rotate-90 transform" viewBox="0 0 36 36">
<path class="text-rose-950/60" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="4"></path>
<path class="text-rose-500 shadow-sm" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="100, 100" stroke-linecap="round" stroke-width="4"></path>
</svg>
<span class="absolute text-[8px] font-mono font-extrabold text-white">A</span>
</div>
<!-- Label Info -->
<div class="flex items-center gap-1.5 font-mono text-xs">
<span class="font-bold text-white tracking-wide">A:</span>
<span class="font-bold text-rose-400 tracking-tight flex items-center gap-1">
<span class="">100% OPF</span>

</span>
</div>
</div>
<!-- FLAG B: ◄ BLU 40% (Contested / Capping towards BLUFOR) -->
<div class="flex items-center gap-2.5 px-3 py-1 rounded-xl bg-sky-950/40 border border-sky-400/50 group">
<!-- Radial Progress Ring: 40% (Animated capture arc) -->
<div class="relative w-5 h-5 flex items-center justify-center">
<svg class="w-5 h-5 -rotate-90 transform" viewBox="0 0 36 36">
<path class="text-slate-800" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="4"></path>
<path class="text-sky-400" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="40, 100" stroke-linecap="round" stroke-width="4"></path>
</svg>
<span class="absolute text-[8px] font-mono font-extrabold text-white">B</span>
</div>
<!-- Label & Direction Indicator -->
<div class="flex items-center gap-1.5 font-mono text-xs">
<span class="font-bold text-white tracking-wide">B:</span>
<div class="flex items-center gap-1 text-sky-300 font-bold">
<span class="text-[10px] text-sky-400 font-black">◄</span>
<span class="text-sky-400 font-extrabold">BLU 40%</span>
</div>
</div>
<!-- Micro Pulse Meter -->
<div class="w-8 h-1.5 bg-slate-900 rounded-full overflow-hidden border border-sky-500/40 hidden md:block">
<div class="h-full bg-sky-400 rounded-full" style="width: 40%;"></div>
</div>
</div>
<!-- FLAG C: NEU (Neutral / Uncontested) -->
<div class="flex items-center gap-2.5 px-3 py-1 rounded-xl bg-slate-900/60 border border-slate-700/60 hover:border-slate-600 transition-colors shadow-sm group">
<!-- Radial Progress Ring: Neutral empty disc -->
<div class="relative w-5 h-5 flex items-center justify-center">
<svg class="w-5 h-5 -rotate-90 transform" viewBox="0 0 36 36">
<path class="text-slate-700" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="4, 4" stroke-width="3"></path>
</svg>
<span class="absolute text-[8px] font-mono font-semibold text-slate-400">C</span>
</div>
<!-- Label Info -->
<div class="flex items-center gap-1.5 font-mono text-xs">
<span class="font-bold text-slate-300">C:</span>
<span class="text-slate-400 font-medium tracking-wide">NEU</span>
</div>
</div>
</div>
</div>
<!-- Spectator Status Bar Sub-footer -->
<div class="mt-3 flex items-center justify-between w-full px-4 text-[10px] font-mono text-slate-500">
<div class="flex items-center gap-2">


</div>
<div class="flex items-center gap-3">



</div>
</div>
</div>








</body></html>
