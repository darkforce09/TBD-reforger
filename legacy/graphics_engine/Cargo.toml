[package]
name = "graphics_engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure GPU renderer: device, pipelines, shaders, draw and text batching. Knows no map nouns."

[lib]
crate-type = ["rlib"]

# No features. `wgpu` is already a `cfg(target_arch = "wasm32")` dependency, so the browser
# half is gated by the target, not by a flag. A crate that is only a renderer has no use for
# a `render` feature — the map engine keeps one to decide whether to depend on this crate at all.

[dependencies]
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }
earcutr = "0.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "HtmlCanvasElement", "Window", "Performance", "console",
] }
