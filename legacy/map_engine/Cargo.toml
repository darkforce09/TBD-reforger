[package]
name = "map_engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Map graphics, spatial computation, terrain formats, and asset streaming."

[lib]
crate-type = ["rlib"]

# Feature tiers, lowest first. `world` is the static world's meshes, the overlay and the frame
# vocabulary, `streaming` adds the served-data loaders, scheduler and buffers with the on-disk
# formats they read, `render` the GPU frame builder, and `editing` the Mission Creator's editing
# layer over the mission crates. No tier is on by default: every consumer names the tiers it
# links, and the mission domain itself is the crates of `crates/mission/`, which a consumer links
# directly.
[features]
default = []
# `dep:graphics_engine` and `dep:render_primitives` sit on `world`, the lowest tier, because every
# module the crate gates speaks the renderer's vocabulary: `world::mesh` composes meshes with
# `render_primitives::draw::{compose, triangulate}`, and the frame and overlay modules name the
# renderer's lanes.
world = ["dep:graphics_engine", "dep:render_primitives", "dep:terrain_elevation", "dep:terrain_relief", "dep:map_draw_lanes", "dep:label_layout", "dep:unit_symbology", "dep:overlay_instances", "dep:road_network", "dep:vegetation", "dep:place_names", "dep:spatial_indexes", "dep:terrain_line_of_sight"]
streaming = ["world", "dep:serde", "dep:serde_json", "serde_json/float_roundtrip", "dep:rkyv", "dep:world_file_formats", "dep:flate2", "dep:prefab_catalog", "dep:world_chunks", "dep:satellite_imagery", "dep:water_bodies", "dep:world_store", "dep:interior_line_of_sight", "dep:world_line_of_sight"]
render = ["streaming", "dep:graphics_engine", "dep:browser_platform"]
# The editing tier drives the STREAMED world, not just the static one: the line-of-sight tool's
# object layer washes a viewshed by testing cells against the world occluder, whose frame convention
# and traversal live in `world_line_of_sight` — which is `streaming`'s. So the honest edge for
# authored-document editing is "the document plus everything the operator can see": the mission
# crates the editing layer hosts and drives, and `streaming` for the second half.
editing = ["world", "streaming", "dep:serde_json", "dep:mission_payload", "dep:mission_validation", "dep:formation_geometry", "dep:mission_crdt", "dep:mission_document", "dep:mission_operations"]

[dependencies]
# The pure renderer. The arrow points one way: the map engine speaks the renderer's frame
# vocabulary; the renderer never learns a map noun.
graphics_engine = { path = "../graphics_engine", optional = true }
# The renderer's GPU-free half: instance layouts, line geometry, mesh composition, glyph text,
# frame ids, the camera uniform and damage tracking, behind `world`.
render_primitives = { workspace = true, optional = true }
# The map coordinates and the cameras, which every tier links (`camera` is ungated).
map_coordinates = { workspace = true }
camera_math = { workspace = true }
# The payload compiler the local-versus-server draft comparison compiles each side through,
# behind `editing`.
mission_payload = { workspace = true, optional = true }
# The validator whose findings the editing commands format, behind `editing`.
mission_validation = { workspace = true, optional = true }
# The arrange vocabulary (patterns, aligns, spacing, orient) the hosted selection transforms take,
# behind `editing`.
formation_geometry = { workspace = true, optional = true }
# The mission document and the slot columns it materialises, which the editing layer hosts,
# behind `editing`.
mission_crdt = { workspace = true, optional = true }
mission_document = { workspace = true, optional = true }
# The authoring commands the hosted commands drive against the document, behind `editing`.
mission_operations = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }
# The served-data descriptors the streaming tier reads, and the editing layer's JSON views.
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true, features = ["preserve_order"] }
flate2 = { workspace = true, optional = true }
# Validation and endian settings are part of the shared on-disk format.
rkyv = { workspace = true, optional = true, features = ["std", "bytecheck", "little_endian"] }
# The on-disk formats behind `streaming`.
world_file_formats = { workspace = true, optional = true }
# The triangle BVH, the point grid and the clusters behind `world`.
spatial_indexes = { workspace = true, optional = true }
# The prefab catalogue with the world payload decoding, and the world chunks with the terrain
# manifest, behind `streaming`.
prefab_catalog = { workspace = true, optional = true }
world_chunks = { workspace = true, optional = true }
# The map overlay crates behind `world`: the named draw lanes and zoom gates, the label layout,
# the unit symbology and the overlay instance packers.
map_draw_lanes = { workspace = true, optional = true }
label_layout = { workspace = true, optional = true }
unit_symbology = { workspace = true, optional = true }
overlay_instances = { workspace = true, optional = true }
# The terrain crates: the elevation model and the relief behind `world` (the elevation model
# reads the `TBDE` header, so `world` links `world_file_formats` through it), the satellite
# container reader and the water data behind `streaming`.
terrain_elevation = { workspace = true, optional = true }
terrain_relief = { workspace = true, optional = true }
satellite_imagery = { workspace = true, optional = true }
water_bodies = { workspace = true, optional = true }
# The road network and the vegetation data behind `world` (the road styling and the forest mass
# are `world` modules; both crates link the prefab catalogue, so `world` links flate2 through
# them).
road_network = { workspace = true, optional = true }
vegetation = { workspace = true, optional = true }
# The spot heights, town and road names and their glyph packing behind `world` (the label
# loader stays here), and the headless world store behind `streaming`.
place_names = { workspace = true, optional = true }
world_store = { workspace = true, optional = true }
# The line of sight over the elevation model behind `world`, and inside one building and through
# the streamed world behind `streaming` (the viewshed lane upload stays here).
terrain_line_of_sight = { workspace = true, optional = true }
interior_line_of_sight = { workspace = true, optional = true }
world_line_of_sight = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "HtmlCanvasElement", "Window", "ImageBitmap", "Performance", "console",
    "ImageBitmapOptions", "ColorSpaceConversion", "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d", "ImageData", "Blob", "BlobPropertyBag",
    "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader",
    "Location", "UrlSearchParams",
] }
console_error_panic_hook = { workspace = true }
futures = { workspace = true }
# The browser console macros and fetch helpers the `render` tier logs and loads through.
browser_platform = { workspace = true, optional = true }

[dev-dependencies]
# The BVH cuboid scenes, the Everon prefab catalogue forms and the TBDC chunk encoding the
# building, line-of-sight and chunk scheduler tests share with the crates that own them.
spatial_indexes = { workspace = true, features = ["test_fixtures"] }
prefab_catalog = { workspace = true, features = ["test_fixtures"] }
world_chunks = { workspace = true, features = ["test_fixtures"] }
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
# The editing layer hands a host-supplied async read to `editing::persist::merge_policy`, so a
# native test of that ordering needs an executor to drive the future to completion.
futures = { workspace = true }
